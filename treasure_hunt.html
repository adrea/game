<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="yes" name="mobile-web-app-capable">
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
<meta content="#5ec2f2" name="theme-color">
<title>小火车寻宝记</title>
<style>
  :root {
    --cream: #fffdf6;
    --cream-warm: #fff5de;
    --ink: #33415c;
    --ink-soft: #637391;
    --wood: #d98c3f;
    --wood-dark: #9c5b1c;
    --gold: #ffd43b;
    --gold-dark: #d99b00;
    --sky: #4dabf7;
    --sky-dark: #1c7ed6;
    --mint: #38d97c;
    --mint-dark: #169c4c;
    --orange: #ff922b;
    --orange-dark: #c95200;
    --coral: #ff6b6b;
    --coral-dark: #c92a2a;
    --purple: #9775fa;
    --purple-dark: #6741d9;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#5ec2f2; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, sans-serif;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    overscroll-behavior:none;
    color: var(--ink);
  }
  #game { position:fixed; inset:0; }
  canvas#cv { display:block; width:100%; height:100%; }

  /* ============ 顶部「车站木牌 & 玩具按钮」HUD ============ */
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:9px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    pointer-events:none;
    z-index:20;
  }
  .chip {
    background: linear-gradient(180deg, #fffef9, #fff2d6);
    border: 2.5px solid #f0c259;
    box-shadow: 0 4px 0 #c9922a, 0 8px 18px rgba(40,60,90,.22);
    border-radius: 999px;
    padding: 6px 14px;
    display:flex; align-items:center; gap:6px;
    font-size:14px; font-weight:800; color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .chip b { font-size:16px; font-weight:900; color:#d95d16; }

  /* 站点木牌样式 */
  #uiArea {
    background: linear-gradient(180deg, #ffe9ba, #f7cf86);
    border-color: #c97d2e;
    box-shadow: 0 4px 0 #8f5014, 0 8px 16px rgba(40,60,90,.2);
    color: #5c340b;
    letter-spacing:.5px;
  }

  /* 彩蛋收集进度条 */
  .chip.egg-chip {
    cursor:pointer; pointer-events:auto;
    background: linear-gradient(180deg, #ffffff, #fff6d9);
    border-color: #ffba38;
    transition: transform .14s, box-shadow .14s;
  }
  .chip.egg-chip:hover { transform: translateY(-1px); }
  .chip.egg-chip:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9922a; }
  .chip.egg-chip b { color:#e06810; }
  .egg-bar {
    width:56px; height:9px; border-radius:99px;
    background:#efe1be; border:1.5px solid #dec795;
    overflow:hidden; margin-left:2px;
  }
  .egg-bar i {
    display:block; height:100%; border-radius:99px;
    background: linear-gradient(90deg, #4dabf7, #9775fa, #ff922b, #ffd43b);
    transition: width .45s cubic-bezier(.34,1.56,.64,1);
  }

  #spacer { flex:1; }

  /* 3D 玩具立体图标按钮 */
  .btn-ico {
    pointer-events:auto; cursor:pointer;
    width:42px; height:42px; border-radius:15px;
    background: linear-gradient(180deg, #ffffff, #eef5ff);
    border: 2.5px solid #a8c7f0;
    box-shadow: 0 4px 0 #6f95c9, 0 7px 14px rgba(30,50,90,.22);
    color: var(--ink); font-size:18px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s, box-shadow .12s, background .15s;
    flex-shrink:0;
  }
  .btn-ico:hover { transform: translateY(-1px); }
  .btn-ico:active { transform: translateY(3px); box-shadow: 0 1px 0 #6f95c9; }
  #btnBoost { background: linear-gradient(180deg, #fff8d6, #ffe066); border-color:#f0a800; box-shadow:0 4px 0 #bf7c00, 0 7px 14px rgba(30,50,90,.2); }
  #btnBoost.active { background: linear-gradient(180deg, #ffd43b, #ff922b); border-color:#d95d00; box-shadow:0 2px 0 #a64100; transform:translateY(2px); }
  #btnMap { background: linear-gradient(180deg, #e7f5ff, #b3dcff); border-color:#4dabf7; box-shadow:0 4px 0 #1c7ed6, 0 7px 14px rgba(30,50,90,.2); }
  #btnMap.active { background: linear-gradient(180deg, #74c0fc, #339af0); border-color:#1864ab; color:#fff; box-shadow:0 4px 0 #1864ab; }
  #btnSound { background: linear-gradient(180deg, #e6fcf0, #b2f2cf); border-color:#38d97c; box-shadow:0 4px 0 #169c4c, 0 7px 14px rgba(30,50,90,.2); }
  #btnRestart { background: linear-gradient(180deg, #fff0f0, #ffc9c9); border-color:#ff7a7a; box-shadow:0 4px 0 #c92a2a, 0 7px 14px rgba(30,50,90,.2); color:#b52020; }

  /* ============ 藏宝图卷轴式迷雾小地图 ============ */
  #minimapWrap {
    position:absolute;
    top: calc(64px + env(safe-area-inset-top));
    right: 14px;
    z-index:22;
    background: linear-gradient(180deg, #fffaf0, #f7e9c8);
    border: 3px solid #d49448;
    box-shadow: 0 5px 0 #9c6222, 0 12px 28px rgba(30,45,70,.28);
    border-radius: 20px;
    padding: 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition: opacity .22s, transform .22s;
  }
  #minimapWrap.collapsed {
    opacity:0; pointer-events:none; transform:translateY(-10px) scale(.92);
  }
  #minimap {
    display:block;
    border-radius:12px;
    background:#f4e8ca;
    border:2px solid #dec694;
  }
  .mm-bar {
    width:100%; display:flex; align-items:center; justify-content:space-between;
    font-size:11px; font-weight:800; color:#7a4e1e; padding:0 2px; gap:6px;
  }
  .mm-legend {
    display:flex; align-items:center; gap:6px; font-size:10px; font-weight:700; color:#8a6234;
  }
  .mm-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:2px; vertical-align:middle; border:1px solid rgba(0,0,0,.18); }
  #radarTip {
    width:100%; text-align:center;
    font-size:11.5px; color:#8c4600; font-weight:800;
    background: linear-gradient(180deg, #fff3bf, #ffe066);
    border: 1.5px solid #e6a200;
    border-radius:10px; padding:4px 7px;
    display:none;
  }
  #radarTip.show { display:block; }

  /* ============ 底部「小火车玩具驾驶台」面板 ============ */
  #panel {
    position:absolute; left:0; right:0; bottom:0;
    padding: 0 14px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition: opacity .22s;
    z-index:18;
    pointer-events:none;
  }
  #hint {
    color: var(--ink);
    font-size:15px; font-weight:800; letter-spacing:.4px;
    background: linear-gradient(180deg, #ffffff, #fff6e0);
    border: 2.5px solid #f0c259;
    box-shadow: 0 4px 0 #c9922a, 0 8px 20px rgba(30,50,80,.22);
    padding: 7px 18px; border-radius:999px;
    text-align:center;
    display:flex; align-items:center; gap:8px;
  }
  #hint .radar-inline { color:#d95d16; font-weight:900; font-size:13.5px; }

  #choices {
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
    pointer-events:auto;
  }

  /* 3D 积木玩具大方向键 */
  .dir {
    cursor:pointer; position:relative; overflow:visible;
    min-width:110px; padding:14px 18px 12px;
    border-radius:22px;
    border: 3px solid rgba(255,255,255,.78);
    color:#fff; font-size:16.5px; font-weight:900;
    text-shadow: 0 2px 0 rgba(0,0,0,.22);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition: transform .14s cubic-bezier(.34,1.56,.64,1), box-shadow .14s;
  }
  .dir::before {
    content:''; position:absolute; top:4px; left:10px; right:10px; height:38%;
    border-radius:16px 16px 50% 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0));
    pointer-events:none;
  }
  .dir .kbd-badge {
    position:absolute; top:-7px; left:-7px;
    width:24px; height:24px;
    border-radius:50%;
    background:#fffdf6;
    border:2.5px solid #f0b429;
    box-shadow:0 2px 0 #b87d00;
    font-size:12px; font-weight:900; color:#5c3a00;
    text-shadow:none;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .dir .arw { font-size:28px; line-height:1; }
  .dir .sub {
    font-size:11.5px; font-weight:800; letter-spacing:.2px; white-space:nowrap;
    padding:2px 8px; border-radius:99px;
    background: rgba(0,0,0,.2);
    text-shadow:none; margin-top:2px;
  }
  .dir .sub.new { background:#fff; color:#128040; }
  .dir .sub.seen { background:rgba(0,0,0,.22); color:#eef4ff; }
  .dir .sub.crate { background:#fff3bf; color:#b84700; }
  .dir .sub.chest { background:#ffe066; color:#7a3e00; }

  .dir.left {
    background: linear-gradient(180deg, #4ae088, #1fb85a);
    box-shadow: 0 6px 0 #12803c, 0 12px 24px rgba(18,128,60,.34);
  }
  .dir.left:hover { transform:translateY(-3px); box-shadow: 0 9px 0 #12803c, 0 16px 28px rgba(18,128,60,.38); }
  .dir.left:active { transform:translateY(4px); box-shadow: 0 2px 0 #12803c; }

  .dir.straight {
    background: linear-gradient(180deg, #5cc0ff, #228be6);
    box-shadow: 0 6px 0 #145fa8, 0 12px 24px rgba(20,95,168,.34);
  }
  .dir.straight:hover { transform:translateY(-3px); box-shadow: 0 9px 0 #145fa8, 0 16px 28px rgba(20,95,168,.38); }
  .dir.straight:active { transform:translateY(4px); box-shadow: 0 2px 0 #145fa8; }

  .dir.right {
    background: linear-gradient(180deg, #ffb347, #f76707);
    box-shadow: 0 6px 0 #bd4900, 0 12px 24px rgba(189,73,0,.34);
  }
  .dir.right:hover { transform:translateY(-3px); box-shadow: 0 9px 0 #bd4900, 0 16px 28px rgba(189,73,0,.38); }
  .dir.right:active { transform:translateY(4px); box-shadow: 0 2px 0 #bd4900; }

  .dir.back {
    background: linear-gradient(180deg, #98a8c7, #6c7c9e);
    box-shadow: 0 6px 0 #485673, 0 10px 20px rgba(40,52,75,.28);
    min-width:88px;
  }
  .dir.back:hover { transform:translateY(-2px); }
  .dir.back:active { transform:translateY(4px); box-shadow: 0 2px 0 #485673; }

  /* 路障/隐藏事件呼吸提示环 */
  .dir.has-crate { border-color:#ffe066; animation: crateGlow 1.3s ease-in-out infinite; }
  @keyframes crateGlow {
    0%,100% { filter: drop-shadow(0 0 0 rgba(255,212,59,0)); }
    50%     { filter: drop-shadow(0 0 12px rgba(255,212,59,.95)); }
  }
  .dir.has-egg { border-color:#e5dbff; animation: eggGlow 1.5s ease-in-out infinite; }
  @keyframes eggGlow {
    0%,100% { filter: drop-shadow(0 0 0 rgba(177,151,252,0)); }
    50%     { filter: drop-shadow(0 0 14px rgba(177,151,252,.98)); }
  }
  .dir .glow {
    position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%;
    background: radial-gradient(circle, #fff 20%, #b197fc 70%);
    border:2px solid #fff;
    box-shadow:0 0 10px #9775fa;
    animation: eggDot 1.1s ease-in-out infinite;
  }
  @keyframes eggDot { 0%,100% { transform:scale(.82); } 50% { transform:scale(1.22); } }

  /* 行驶中主动掉头胶囊 */
  #driveTools { display:none; gap:8px; pointer-events:auto; }
  #driveTools.show { display:flex; }
  .mini-pill {
    cursor:pointer;
    padding:7px 16px; border-radius:999px;
    background: linear-gradient(180deg, #ffffff, #edf4ff);
    border: 2px solid #96b8e8;
    box-shadow: 0 3px 0 #5f83b8, 0 6px 14px rgba(30,50,80,.2);
    color: var(--ink); font-size:13px; font-weight:800;
    display:flex; align-items:center; gap:5px;
    transition: transform .12s, box-shadow .12s;
  }
  .mini-pill:active { transform:translateY(2px); box-shadow:0 1px 0 #5f83b8; }
  .mini-pill.on {
    background: linear-gradient(180deg, #fff3bf, #ffd43b);
    border-color:#d99200; color:#733f00; box-shadow:0 3px 0 #a86b00;
  }

  /* ============ 童话气泡 Toast ============ */
  #toast {
    position:absolute; left:50%; top:33%; transform:translate(-50%,-50%) scale(.82);
    padding:16px 28px; border-radius:24px;
    background: linear-gradient(180deg, #fffef9, #fff4d6);
    border: 3px solid #f0b429;
    box-shadow: 0 6px 0 #c98a18, 0 18px 40px rgba(30,45,70,.32);
    color: var(--ink); font-size:20px; font-weight:900; letter-spacing:.8px;
    text-align:center; opacity:0; pointer-events:none;
    transition: opacity .24s, transform .26s cubic-bezier(.34,1.56,.64,1);
    max-width:84vw; z-index:40;
  }
  #toast .sub { display:block; font-size:13.5px; font-weight:700; color: var(--ink-soft); margin-top:4px; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.warn { border-color:#ff6b6b; box-shadow:0 6px 0 #c92a2a, 0 18px 40px rgba(150,30,30,.28); background:linear-gradient(180deg,#fff5f5,#ffe3e3); color:#b02020; }
  #toast.warn .sub { color:#c94545; }
  #toast.good { border-color:#f59f00; box-shadow:0 6px 0 #c47a00, 0 18px 40px rgba(180,120,0,.3); background:linear-gradient(180deg,#fffdf2,#fff0b8); color:#8c4b00; }

  /* ============ 绘本封面 & 结算遮罩 ============ */
  #overlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, rgba(110,196,255,.88), rgba(40,118,204,.94));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index:50; padding:18px; overflow-y:auto;
  }
  #overlay.hide { display:none; }
  .card {
    width:min(500px, 92vw);
    background: linear-gradient(180deg, #fffef9, #fff5dc);
    border: 4px solid #ffd43b;
    border-radius: 32px; padding: 26px 24px 24px;
    box-shadow: 0 10px 0 #d99b18, 0 26px 60px rgba(20,55,110,.38);
    text-align:center; color: var(--ink);
  }
  .card h1 {
    font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom:4px;
    color:#e03e2d; text-shadow: 0 3px 0 #ffe0c2;
  }
  .card .tag { font-size:11.5px; color:#8d9ab5; letter-spacing:3px; margin-bottom:14px; font-weight:800; }
  .card p { font-size:14.5px; line-height:1.75; color:#4f5f7d; text-align:center; font-weight:600; }
  .card p b { color:#d95d16; }

  /* 三张趣味图标玩法卡（让 5 岁小朋友一眼看懂） */
  .rule-strip {
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;
    margin:14px 0 14px;
  }
  .rule-pill {
    background:#fff; border:2px solid #f0e1bc; border-radius:18px;
    padding:10px 6px; box-shadow:0 3px 0 #e6d2a4;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .rule-pill .ico { font-size:26px; line-height:1; }
  .rule-pill .t { font-size:12.5px; font-weight:800; color: var(--ink); }
  .rule-pill .d { font-size:11px; font-weight:600; color: var(--ink-soft); }

  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 16px; }
  .stat {
    background:#fff; border:2px solid #f0e1bc;
    border-radius:18px; padding:10px 8px; box-shadow:0 3px 0 #e6d2a4;
  }
  .stat .v { font-size:20px; font-weight:900; color:#e6761b; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:11.5px; color: var(--ink-soft); margin-top:2px; font-weight:700; }

  .lv-row { display:flex; gap:9px; margin-bottom:16px; }
  .lv {
    flex:1; cursor:pointer; padding:11px 6px; border-radius:18px;
    background:#fff; border:2.5px solid #e6d7b5; box-shadow:0 4px 0 #d9c598;
    color: var(--ink-soft); font-size:12px; font-weight:700; transition:transform .12s, box-shadow .12s;
  }
  .lv .n { display:block; font-size:16px; font-weight:900; color: var(--ink); margin-bottom:2px; }
  .lv:hover { transform:translateY(-2px); border-color:#f0b429; }
  .lv.on {
    background: linear-gradient(180deg, #5cc0ff, #228be6);
    border-color:#1864ab; color:#e7f5ff;
    box-shadow:0 4px 0 #145391;
  }
  .lv.on .n { color:#fff; }

  .start-btn {
    cursor:pointer; width:100%; margin-top:4px;
    padding:15px; border-radius:20px; border:3px solid #fff3bf;
    background: linear-gradient(180deg, #ff8c38, #e84c24);
    box-shadow: 0 7px 0 #ad2e10, 0 14px 26px rgba(232,76,36,.36);
    color:#fff; font-size:19px; font-weight:900; letter-spacing:3px;
    text-shadow:0 2px 0 rgba(0,0,0,.22);
    transition: transform .13s, box-shadow .13s;
  }
  .start-btn:hover { transform:translateY(-2px); box-shadow: 0 9px 0 #ad2e10, 0 16px 30px rgba(232,76,36,.44); }
  .start-btn:active { transform:translateY(4px); box-shadow: 0 3px 0 #ad2e10; }

  /* ============ 绘本风重开确认卡片 ============ */
  #confirmModal {
    position:absolute; inset:0; z-index:95;
    display:flex; align-items:center; justify-content:center;
    background: rgba(30,65,115,.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity:0; pointer-events:none; transition: opacity .22s;
    padding:16px;
  }
  #confirmModal.show { opacity:1; pointer-events:auto; }
  .confirm-box {
    width:min(340px, 88vw);
    background: linear-gradient(180deg, #fffef9, #fff5dc);
    border: 4px solid #ffba38;
    border-radius: 28px; padding: 24px 20px 20px;
    box-shadow: 0 8px 0 #c98a18, 0 24px 54px rgba(20,40,80,.35);
    text-align:center; color: var(--ink);
  }
  .confirm-box h3 { font-size:20px; font-weight:900; margin-bottom:8px; color:#d9480f; }
  .confirm-box p { font-size:14px; font-weight:600; color: var(--ink-soft); line-height:1.65; margin-bottom:18px; }
  .confirm-btns { display:flex; gap:10px; }
  .cbtn {
    flex:1; cursor:pointer; padding:12px; border-radius:16px; border:none;
    font-size:15px; font-weight:900; transition: transform .12s, box-shadow .12s;
  }
  .cbtn.cancel { background:#edf2ff; color: var(--ink); border:2px solid #bac8ff; box-shadow:0 4px 0 #91a7ff; }
  .cbtn.cancel:active { transform:translateY(3px); box-shadow:0 1px 0 #91a7ff; }
  .cbtn.danger { background:linear-gradient(180deg,#ff6b6b,#e03131); color:#fff; border:2px solid #ffc9c9; box-shadow:0 4px 0 #a61e1e; }
  .cbtn.danger:active { transform:translateY(3px); box-shadow:0 1px 0 #a61e1e; }

  /* ============ 惊喜宝藏贴纸卡（明亮绘本卡片） ============ */
  #eggCard {
    position:absolute; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    background: rgba(25,58,108,.56);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity:0; pointer-events:none; transition: opacity .24s;
    padding:16px;
  }
  #eggCard.show { opacity:1; pointer-events:auto; }
  .egg-inner {
    position:relative; width:min(350px, 88vw);
    background: linear-gradient(180deg, #fffef9, #fff6e0);
    border: 4px solid var(--rc, #ffd43b);
    border-radius: 30px; padding: 24px 22px 20px;
    box-shadow: 0 9px 0 color-mix(in srgb, var(--rc, #ffd43b) 70%, #5c3a00), 0 24px 60px rgba(20,40,80,.38), 0 0 42px var(--rg, transparent);
    text-align:center;
    transform: scale(.82) translateY(14px); opacity:0;
    transition: transform .36s cubic-bezier(.34,1.56,.64,1), opacity .24s;
  }
  #eggCard.show .egg-inner { transform:scale(1) translateY(0); opacity:1; }
  .egg-rar {
    display:inline-block; font-size:12px; letter-spacing:3px; font-weight:900;
    padding:4px 14px; border-radius:99px; margin-bottom:12px;
    color:#fff; background: var(--rc);
    box-shadow:0 3px 0 color-mix(in srgb, var(--rc) 70%, #000);
  }
  .egg-art {
    width:122px; height:122px; margin:0 auto 14px;
    border-radius:26px; padding:10px;

const PREF_KEY = 'train_treasure_hunt_prefs_v2';
function loadPrefs(){
  try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}') || {}; }
  catch { return {}; }
}
function savePrefs(patch){
  try {
    const cur = Object.assign(loadPrefs(), patch);
    localStorage.setItem(PREF_KEY, JSON.stringify(cur));
  } catch {}
}

const SFX = (() => {
  let ac = null;
  let muted = !!loadPrefs().muted;
  function ensure(){
    if (muted) return null;
    if (!ac) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      ac = new Ctx();
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function tone(freq, dur, type, vol, delay, endFreq){
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol){
    const c = ensure(); if (!c) return;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = 'bandpass'; filt.frequency.value = 620;
    const g = c.createGain();
    g.gain.setValueAtTime(vol || 0.16, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    src.connect(filt); filt.connect(g); g.connect(c.destination);
    src.start();
  }
  return {
    isMuted: () => muted,
    toggle(){

    win(){

/* ==================================================================
   2. 迷宫生成 + 路障 + 宝箱
   ================================================================== */
const DIRS = ['N','E','S','W'];
const DX = { N:0, E:1, S:0, W:-1 };
const DY = { N:-1, E:0, S:1, W:0 };

let OVERFLOW_EGGS = [];

function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function edgeKey(ax, ay, bx, by){
  if (ax > bx || (ax === bx && ay > by)) { const t = ax; ax = bx; bx = t; const u = ay; ay = by; by = u; }
  return ax + ',' + ay + '|' + bx + ',' + by;
}

function genMaze(cw, ch) {
  const W = cw + 2, H = ch + 2;
  const wall = [];
  for (let y = 0; y < H; y++) wall.push(new Uint8Array(W).fill(1));

  const stack = [[1, 1]];
  wall[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const nb = [];
    for (const d of DIRS) {
      const nx = x + DX[d] * 2, ny = y + DY[d] * 2;
      if (nx > 0 && nx < W - 1 && ny > 0 && ny < H - 1 && wall[ny][nx] === 1) nb.push([d, nx, ny]);
    }
    if (!nb.length) { stack.pop(); continue; }
    const [d, nx, ny] = nb[(Math.random() * nb.length) | 0];
    wall[y + DY[d]][x + DX[d]] = 0;
    wall[ny][nx] = 0;
    stack.push([nx, ny]);
  }

  const extra = Math.floor(cw * ch * 0.10);
  for (let i = 0; i < extra; i++) {
    const x = 1 + ((Math.random() * (cw - 1)) | 0);
    const y = 1 + ((Math.random() * (ch - 1)) | 0);
    if (wall[y][x] !== 1) continue;
    const horiz = wall[y][x - 1] === 0 && wall[y][x + 1] === 0 && wall[y-1][x] === 1 && wall[y+1][x] === 1;
    const vert  = wall[y - 1][x] === 0 && wall[y + 1][x] === 0 && wall[y][x-1] === 1 && wall[y][x+1] === 1;
    if (horiz || vert) wall[y][x] = 0;
  }

  const open = (x, y) => x >= 0 && y >= 0 && x < W && y < H && wall[y][x] === 0;
  const exitsOf = (x, y) => DIRS.filter(d => open(x + DX[d], y + DY[d]));
  const deadEnds = [];
  for (let y = 1; y < H - 1; y++)
    for (let x = 1; x < W - 1; x++)
      if (wall[y][x] === 0 && exitsOf(x, y).length === 1) deadEnds.push([x, y]);

  const maze = { W, H, wall, open, exitsOf, deadEnds, cw, ch, start: [1, 1] };
  const crateEggNeed = EGGS.filter(e => e.from === 'crate').length;
  maze.barriers = genBarriers(maze, crateEggNeed);
  const reach = reachableCells(maze);
  maze.reachSet = reach;
  assignCrateDrops(maze, reach);
  maze.chests = genChests(maze, OVERFLOW_EGGS, reach);
  maze.overflowEggs = OVERFLOW_EGGS.slice();
  return maze;
}

function reachableCells(maze){
  const { W, open, start } = maze;
  const guardSet = new Set();
  for (const b of maze.barriers.values())
    if (b.type === 'guard') guardSet.add(edgeKey(b.ax, b.ay, b.bx, b.by));

  const seen = new Uint8Array(W * maze.H);
  const q = [[start[0], start[1]]];
  seen[start[1] * W + start[0]] = 1;
  const out = new Set([start[0] + ',' + start[1]]);
  let head = 0;
  while (head < q.length){
    const [x, y] = q[head++];
    for (const d of DIRS){
      const nx = x + DX[d], ny = y + DY[d];
      if (!open(nx, ny) || seen[ny * W + nx]) continue;
      if (guardSet.has(edgeKey(x, y, nx, ny))) continue;
      seen[ny * W + nx] = 1;
      out.add(nx + ',' + ny);
      q.push([nx, ny]);
    }
  }
  return out;
}

function genChests(maze, overflow, reach){
  const { cw, ch, open, start, exitsOf, deadEnds } = maze;
  const chests = [];
  const boxEggs = shuffleArr(EGGS.filter(e => e.from === 'box').map(e => e.id));
  const extraEggs = shuffleArr((overflow || []).slice());
  const isReach = (x, y) => !reach || reach.has(x + ',' + y);

  const cand = [];
  for (const [x, y] of deadEnds){
    if (x === start[0] && y === start[1]) continue;
    if (!isReach(x, y)) continue;
    if (exitsOf(x, y).length === 1) cand.push([x, y, 2]);
  }
  for (let y = 1; y <= ch; y++)
    for (let x = 1; x <= cw; x++){
      if (!open(x, y) || (x === start[0] && y === start[1]) || !isReach(x, y)) continue;
      if (cand.some(c => c[0] === x && c[1] === y)) continue;
      cand.push([x, y, 1]);
    }

  const ordered = shuffleArr(cand.filter(c => c[2] === 2)).concat(shuffleArr(cand.filter(c => c[2] === 1)));
  const wanted = boxEggs.concat(extraEggs);
  const usedCells = new Set();

  const unplaced = [];
  for (const eggId of wanted){
    let placed = false;
    for (const [x, y] of ordered){
      const ck = x + ',' + y;
      if (usedCells.has(ck)) continue;
      if (Math.abs(x - start[0]) + Math.abs(y - start[1]) <= 1) continue;
      chests.push({ x, y, eggId, opened:false });
      usedCells.add(ck);
      placed = true;
      break;
    }
    if (!placed) unplaced.push(eggId);
  }
  const still = [];
  for (const eggId of unplaced){
    let placed = false;
    for (const [x, y] of ordered){
      const ck = x + ',' + y;
      if (usedCells.has(ck) || (x === start[0] && y === start[1])) continue;
      chests.push({ x, y, eggId, opened:false });
      usedCells.add(ck);
      placed = true;
      break;
    }
    if (!placed) still.push(eggId);
  }
  for (let i = 0; i < still.length && chests.length; i++){
    const host = chests[i % chests.length];
    if (!host.extra) host.extra = [];
    host.extra.push(still[i]);
  }
  return chests;
}

function assignCrateDrops(maze, reach){
  OVERFLOW_EGGS = [];
  if (!maze.barriers) return;
  const crateEggs = shuffleArr(EGGS.filter(e => e.from === 'crate').map(e => e.id));
  const all = [...maze.barriers.values()].filter(b => b.type === 'crate');
  const usable = reach ? all.filter(b => reach.has(b.ax + ',' + b.ay) || reach.has(b.bx + ',' + b.by)) : all;
  const crates = shuffleArr(usable.length ? usable : all);

  if (crates.length === 0){
    OVERFLOW_EGGS = crateEggs.slice();
    return;
  }
  const cap = Math.min(crates.length, crateEggs.length);
  for (let i = 0; i < cap; i++){ crates[i].drop = crateEggs[i]; crates[i].dropNew = true; }
  for (let i = cap; i < crates.length; i++) crates[i].drop = crateEggs[i % crateEggs.length];
  for (const b of all) if (!b.drop) b.drop = crateEggs[(Math.random() * crateEggs.length) | 0];
  if (crateEggs.length > cap) OVERFLOW_EGGS = crateEggs.slice(cap);
}

function genBarriers(maze, crateWanted){
  const { cw, ch, open, start } = maze;
  const barriers = new Map();
  const edges = [];
  for (let y = 1; y <= ch; y++){
    for (let x = 1; x <= cw; x++){
      if (!open(x, y)) continue;
      if (open(x + 1, y)) edges.push([x, y, x + 1, y]);
      if (open(x, y + 1)) edges.push([x, y, x, y + 1]);
    }
  }
  if (!edges.length) return barriers;
  shuffleArr(edges);

  const total = edges.length;
  const guardTarget = Math.max(2, Math.round(total * 0.16));
  const crateMin = crateWanted || 2;
  const crateTarget = Math.max(crateMin, Math.max(2, Math.round(total * 0.12)));

  const nearStart = (ax, ay, bx, by) =>
    (Math.abs(ax - start[0]) + Math.abs(ay - start[1]) <= 1) ||
    (Math.abs(bx - start[0]) + Math.abs(by - start[1]) <= 1);

  let guards = 0, crates = 0;
  for (const [ax, ay, bx, by] of edges){
    if (crates >= crateTarget) break;
    if (nearStart(ax, ay, bx, by)) continue;
    let cnt = 0;
    for (const b of barriers.values())
      if ((b.ax===ax&&b.ay===ay)||(b.bx===ax&&b.by===ay)||(b.ax===bx&&b.ay===by)||(b.bx===bx&&b.by===by)) cnt++;
    if (cnt >= 2) continue;
    barriers.set(edgeKey(ax, ay, bx, by), { type:'crate', ax, ay, bx, by });
    crates++;
  }
  for (const [ax, ay, bx, by] of edges){
    if (guards >= guardTarget) break;
    if (nearStart(ax, ay, bx, by)) continue;
    const k = edgeKey(ax, ay, bx, by);
    if (barriers.has(k)) continue;
    let cnt = 0;
    for (const b of barriers.values())
      if ((b.ax===ax&&b.ay===ay)||(b.bx===ax&&b.by===ay)||(b.ax===bx&&b.ay===by)||(b.bx===bx&&b.by===by)) cnt++;
    if (cnt >= 2) continue;
    barriers.set(k, { type:'guard', ax, ay, bx, by });
    guards++;
  }

  const goal = farPointFrom(maze, start[0], start[1]);
  ensureSolvable(maze, barriers, goal);
  maze.goal = goal;

  let cratesNow = [...barriers.values()].filter(b => b.type === 'crate').length;
  if (cratesNow < crateMin){
    for (const [ax, ay, bx, by] of edges){
      if (cratesNow >= crateMin) break;
      const k = edgeKey(ax, ay, bx, by);
      if (barriers.has(k) || nearStart(ax, ay, bx, by)) continue;
      barriers.set(k, { type:'crate', ax, ay, bx, by });
      cratesNow++;
    }
  }
  return barriers;
}

function ensureSolvable(maze, barriers, goal){
  const { W, open, start } = maze;
  const canReach = (guardKeys) => {
    const blocked = new Set(guardKeys);
    const seen = new Uint8Array(W * maze.H);
    const q = [[start[0], start[1]]];
    seen[start[1] * W + start[0]] = 1;
    let head = 0;
    while (head < q.length){
      const [x, y] = q[head++];
      if (x === goal[0] && y === goal[1]) return true;
      for (const d of DIRS){
        const nx = x + DX[d], ny = y + DY[d];
        if (!open(nx, ny) || seen[ny * W + nx]) continue;
        if (blocked.has(edgeKey(x, y, nx, ny))) continue;
        seen[ny * W + nx] = 1;
        q.push([nx, ny]);
      }
    }
    return false;
  };
  const allGuards = [...barriers.entries()].filter(([, b]) => b.type === 'guard').map(([k]) => k);
  if (!allGuards.length) return;
  const order = shuffleArr(allGuards.slice());
  const kept = new Set();
  for (const k of order){
    if (canReach([...kept, k])) kept.add(k);
  }
  for (const k of allGuards) if (!kept.has(k)) barriers.delete(k);
}

function barrierAt(maze, ax, ay, bx, by){
  if (!maze.barriers) return null;
  return maze.barriers.get(edgeKey(ax, ay, bx, by)) || null;
}

function farPointFrom(maze, sx, sy) {
  const { W, H, wall } = maze;
  const dist = new Int32Array(W * H).fill(-1);
  const q = [[sx, sy]];
  dist[sy * W + sx] = 0;
  let best = [sx, sy], head = 0;
  while (head < q.length) {
    const [x, y] = q[head++];
    const d0 = dist[y * W + x];
    if (d0 > dist[best[1] * W + best[0]]) best = [x, y];
    for (const d of DIRS) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || wall[ny][nx] !== 0 || dist[ny * W + nx] !== -1) continue;
      dist[ny * W + nx] = d0 + 1;
      q.push([nx, ny]);
    }
  }
  return best;
}

  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  return '#' + pa.map((v,i) => Math.round(v + (pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function lerpTheme(tA, tB, t) {
  if (t <= 0) return tA;
  if (t >= 1) return tB;
  return {
    name: t < .5 ? tA.name : tB.name,
    sky: [
      [lerpHex(tA.sky[0][0], tB.sky[0][0], t), lerpHex(tA.sky[0][1], tB.sky[0][1], t)],
      [lerpHex(tA.sky[1][0], tB.sky[1][0], t), lerpHex(tA.sky[1][1], tB.sky[1][1], t)]
    ],
    hills: [lerpHex(tA.hills[0], tB.hills[0], t), lerpHex(tA.hills[1], tB.hills[1], t)],
    ground: lerpHex(tA.ground, tB.ground, t),

    fog: lerpHex(tA.fog, tB.fog, t),
    accent: lerpHex(tA.accent, tB.accent, t),
    isNight: t < .5 ? tA.isNight : tB.isNight
  };
}

/* ==================================================================
   4. 游戏状态与相对方向映射
   ================================================================== */
const LEVELS = {
  简单: { cw:5,  ch:5,  speed:1.45 },
  普通: { cw:8,  ch:8,  speed:1.65 },
  困难: { cw:12, ch:12, speed:1.85 }
};

// 世界绝对方向索引：0=北, 1=东, 2=南, 3=西
const WORLD_DIRS = [
  { idx:0, key:'N', dv:[0,-1] },
  { idx:1, key:'E', dv:[1,0]  },
  { idx:2, key:'S', dv:[0,1]  },
  { idx:3, key:'W', dv:[-1,0] }
];

// 根据当前车头朝向 S.heading 计算相对方向
function toRelativeChoice(worldDir, heading){
  const rel = (worldDir.idx - heading + 4) % 4;
  if (rel === 3) return { ...worldDir, rel:'left',     label:'左转', arrow:'←', css:'left',     order:0 };
  if (rel === 0) return { ...worldDir, rel:'straight', label:'直行', arrow:'↑', css:'straight', order:1 };
  if (rel === 1) return { ...worldDir, rel:'right',    label:'右转', arrow:'→', css:'right',    order:2 };
  return           { ...worldDir, rel:'back',     label:'掉头', arrow:'↓', css:'back',     order:3 };
}

const S = {
  maze:null, level: loadPrefs().level || '普通',
  pos:[-1,-1], heading:1,
  visits:null,
  trial:0, junctions:0, wrong:0,
  running:false, pending:false, finished:false,
  choices:[],
  cam:null, goal:[-1,-1],
  zoneCount:6,
  deadEndSet:null,
  anim:null, totalTime:0,
  cratesBroken:0, fx:[],
  collected:null, collectedSrc:{},
  chestsOpened:0, eventsSeen:0,
  cardOpen:false, cardPreview:false,
  galleryOpen:false, confirmOpen:false,
  eventFx:null, hintEggs:null, landEggs:null,
  totalEggs:EGGS.length,
  // 巡航与操作优化状态
  wasMoving:false,
  cameFrom:null,       // 刚刚离开的格子，用于判断“来路”（不能靠 route 推断）
  boostToggle:false,
  boostHold:false,
  queuedRel:null,      // 预读相对方向 'left'|'straight'|'right'|'back'
  queuedAt:0,
  flowQueue:[],        // 串行事件队列，杜绝并发覆盖
  flowBusy:false,
  mapOpen: loadPrefs().mapOpen !== undefined ? !!loadPrefs().mapOpen : (window.innerWidth >= 520),
  radarInfo:null
};

if (!LEVELS[S.level]) S.level = '普通';

function idx(x,y){ return y * S.maze.W + x; }
function cellHas(x,y){ return S.maze.open(x,y); }
function eggById(id){ return EGGS.find(e => e.id === id); }
function allCollected(){ return S.collected && S.collected.size >= S.totalEggs; }
function speedMult(){ return (S.boostToggle || S.boostHold) ? 1.85 : 1; }

function escapeHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function exits(x, y){
  const out = [];
  for (let k = 0; k < 4; k++){
    const c = WORLD_DIRS[k];
    const nx = x + c.dv[0], ny = y + c.dv[1];
    if (!cellHas(nx, ny)) continue;
    const b = barrierAt(S.maze, x, y, nx, ny);
    if (b && b.type === 'guard') continue;
    out.push(c);
  }
  return out;
}

function barrierTo(x, y, dv){
  return barrierAt(S.maze, x, y, x + dv[0], y + dv[1]);
}

function dirAngle(heading){ return [ -Math.PI/2, 0, Math.PI/2, Math.PI ][heading]; }
function headingOf(dx, dy){
  if (dx === 1) return 1;
  if (dx === -1) return 3;
  if (dy === 1) return 2;
  return 0;
}

/* ==================================================================
   5. 串行流程队列（彻底解决路障/事件/宝箱并发冲突）
   ================================================================== */
function clearFlow(){
  S.flowQueue = [];
  S.flowBusy = false;
}

function enqueueFlow(task){
  S.flowQueue.push(task);
  if (!S.flowBusy) runFlowQueue();
}

function runFlowQueue(){
  if (!S.running || S.finished) { S.flowBusy = false; return; }
  if (S.cardOpen && !S.cardPreview) return; // 等玩家收下彩蛋卡片
  if (!S.flowQueue.length) { S.flowBusy = false; return; }
  S.flowBusy = true;
  const task = S.flowQueue.shift();

  if (task.type === 'eggCard'){
    showEggCard(task.egg, task.src, false);
    return; // closeEggCard 负责继续 runFlowQueue()
  }
  if (task.type === 'event'){
    const egg = task.egg;
    if (!egg || S.collected.has(egg.id)){ runFlowQueue(); return; }
    S.eventsSeen++;
    S.wasMoving = false;
    S.eventFx = { kind: egg.id, t:0, dur:1.85 };
    showToast('✨ 好像有什么东西……', '', 'good');
    setTimeout(() => {
      if (!S.running) return;
      S.eventFx = null;
      const openedCard = collectEggInternal(egg, '隐藏事件');
      if (!openedCard) runFlowQueue();
    }, 1450);
    return;
  }
  if (task.type === 'chest'){
    const ch = S.maze.chests && S.maze.chests.find(c => !c.opened && c.x === task.x && c.y === task.y);
    if (!ch){ runFlowQueue(); return; }
    ch.opened = true;
    S.chestsOpened++;
    S.wasMoving = false;
    const pool = [ch.eggId].concat(ch.extra || []);
    const pick = pool.find(id => !S.collected.has(id)) || pool[0];
    const rest = pool.filter(id => id !== pick);
    if (rest.length) S.maze.chests.push({ x:task.x, y:task.y, eggId:rest[0], extra:rest.slice(1), opened:false });
    const egg = eggById(pick);
    spawnEggBurst(task.x + 0.5, task.y + 0.5, '#ffd15c');
    const openedCard = collectEggInternal(egg, '发现宝箱');
    if (!openedCard) runFlowQueue();
    return;
  }
  if (task.type === 'afterMove'){
    S.flowBusy = false;
    if (allCollected()) { finishGame(); return; }
    afterMove();
  }
}

/* 收集彩蛋：返回 true 表示弹出了新彩蛋卡片（需要等关闭后继续队列） */
function collectEggInternal(egg, sourceLabel){
  if (!egg) return false;
  const isNew = !S.collected.has(egg.id);
  S.collected.add(egg.id);
  S.collectedSrc[egg.id] = sourceLabel;
  spawnEggBurst(S.cam.px, S.cam.py, RARITY[egg.rarity].col);
  SFX.egg(egg.rarity);
  updateRadar();
  refreshHUD();

  if (isNew){
    showEggCard(egg, sourceLabel, false);
    return true;
  } else {
    showToast(`${RARITY[egg.rarity].name} · ${egg.name}`, '（重复获得）', 'good');
    if (allCollected()){
      setTimeout(() => finishGame(), 900);
      return true;
    }
    return false;
  }
}

function spawnEggBurst(wx, wy, col){
  for (let i = 0; i < 24; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 0.5 + Math.random() * 1.3;
    S.fx.push({
      wx, wy, t:0, dur:0.7 + Math.random()*0.45,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      vz: 1.1 + Math.random()*1.8,
      kind:'bit', col: Math.random() < 0.45 ? col : '#fff6d8',
      size: 0.026 + Math.random()*0.048
    });
  }
  S.fx.push({ wx, wy, t:0, dur:0.85, kind:'ring' });
}

/* ==================================================================
   6. 开始 / 重置 / 寻宝布局

function startGame(levelName){
  S.level = levelName;
  savePrefs({ level: levelName });
  const cfg = LEVELS[levelName];
  S.maze = genMaze(cfg.cw, cfg.ch);
  S.speed = cfg.speed;
  S.pos = [S.maze.start[0], S.maze.start[1]];

  // 根据起点实际出口初始化朝向，开局不撞墙
  const startEx = exits(S.pos[0], S.pos[1]);
  S.heading = startEx.length ? startEx[0].idx : 1;

  S.trial = 0; S.junctions = 0; S.wrong = 0; S.totalTime = 0;
  S.visits = new Int32Array(S.maze.W * S.maze.H);
  S.visits[idx(S.pos[0], S.pos[1])] = 1;
  S.deadEndSet = new Set(S.maze.deadEnds.map(([x,y]) => x + ',' + y));
  S.goal = farPointFrom(S.maze, S.pos[0], S.pos[1]);

  S.cam = { px:S.pos[0]+0.5, py:S.pos[1]+0.5, ang:dirAngle(S.heading), roll:0, shake:0, curTheme:themeAt(0) };
  S.anim = { phase:'idle', t:0, dur:0, from:null, to:null, cb:null };
  S.currentZoneF = 0;
  S.running = true;
  S.pending = false;
  S.finished = false;
  S.wasMoving = false;
  S.queuedRel = null;
  S.cameFrom = null;
  S.route = [[S.pos[0], S.pos[1]]];
  S.deadDir = new Set();
  S.cratesBroken = 0;
  S.fx = [];
  clearFlow();

  S.collected = new Set();
  S.chestsOpened = 0;
  S.eventsSeen = 0;
  S.cardOpen = false;
  S.cardPreview = false;
  S.eventFx = null;
  S.collectedSrc = {};
  S.landEggs = new Map();
  S.radarInfo = null;

  document.getElementById('overlay').classList.add('hide');
  document.getElementById('eggCard').classList.remove('show');
  document.getElementById('gallery').classList.remove('show');
  S.galleryOpen = false;
  document.getElementById('panel').style.opacity = 1;
  hideToast();
  buildHintEggs();
  updateRadar();
  refreshHUD();
  syncMapVisibility();
  drawMinimap();

  setTimeout(() => { if (S.running) afterMove(); }, 300);
}

function buildHintEggs(){
  const evEggs = shuffleArr(EGGS.filter(e => e.from === 'event').map(e => e.id));
  const maze = S.maze;
  const reach = maze.reachSet || reachableCells(maze);
  const spots = [];
  // 同一条无向边只算一个位置：否则两个彩蛋会抢同一条边的正反 key，互相覆盖后其中一个彻底丢失
  const usedEdges = new Set();
  for (let y = 1; y <= maze.ch; y++)
    for (let x = 1; x <= maze.cw; x++){
      if (!maze.open(x, y) || !reach.has(x + ',' + y)) continue;
      const ex = exits(x, y);
      if (ex.length < 2) continue;
      for (const c of ex){
        const nx = x + c.dv[0], ny = y + c.dv[1];
        if (!reach.has(nx + ',' + ny)) continue;
        const ek = edgeKey(x, y, nx, ny);
        if (usedEdges.has(ek)) continue;
        usedEdges.add(ek);
        spots.push([x, y, c.dv[0], c.dv[1]]);
      }
    }
  shuffleArr(spots);
  const map = new Map();
  const leftover = [];
  evEggs.forEach((id, i) => {
    if (i < spots.length){
      const [x, y, dx, dy] = spots[i];
      // 同一条边双向登记：无论从哪一侧经过都能触发，
      // 否则玩家先从另一侧走过该格，这格就会被记成“死路”，彩蛋永远拿不到
      map.set(x + ',' + y + '|' + dx + ',' + dy, id);
      map.set((x + dx) + ',' + (y + dy) + '|' + (-dx) + ',' + (-dy), id);
    } else leftover.push(id);
  });

  S.landEggs = new Map();
  if (leftover.length){
    const cells = [];
    for (let y = 1; y <= maze.ch; y++)
      for (let x = 1; x <= maze.cw; x++){
        if (!maze.open(x, y) || !reach.has(x + ',' + y)) continue;
        if (x === maze.start[0] && y === maze.start[1]) continue;
        cells.push([x, y]);
      }
    shuffleArr(cells);
    leftover.forEach((id, i) => { if (i < cells.length) S.landEggs.set(cells[i][0] + ',' + cells[i][1], id); });
  }
  S.hintEggs = map;
}

function eventAt(x, y, dv){
  if (!S.hintEggs) return null;
  const id = S.hintEggs.get(x + ',' + y + '|' + dv[0] + ',' + dv[1]);
  return id ? eggById(id) : null;
}

/* ==================================================================
   7. 行驶、自动过弯、主动掉头、预读输入与倒车
   ================================================================== */
function getPrevCell(){
  return S.route.length >= 2 ? S.route[S.route.length - 2] : null;
}

/* 判断下一格 (nx, ny) 到达后是否需要停下（用于匀速巡航缓动决策） */
function willCellStop(nx, ny, fromX, fromY, hitCrate, evEgg){
  if (hitCrate) return true;
  if (evEgg && !S.collected.has(evEgg.id)) return true;
  if (S.maze.chests && S.maze.chests.some(c => !c.opened && c.x === nx && c.y === ny)) return true;
  if (S.landEggs && S.landEggs.has(nx + ',' + ny)) return true;
  const ex = exits(nx, ny);
  const forward = ex.filter(c => !(nx + c.dv[0] === fromX && ny + c.dv[1] === fromY));
  const freshForward = forward.filter(c => !S.deadDir.has((nx + c.dv[0]) + ',' + (ny + c.dv[1])));
  // 只有当恰好有 1 条未证伪的前进通路时才会不停顿直接过弯/直行
  return freshForward.length !== 1;
}

function afterMove(){
  if (!S.running || S.finished) return;
  const [x, y] = S.pos;
  // 用真实来路判断“背后”，不能用 route 推断：掉头导致 route 弹栈后，
  // route[len-2] 指向的是前方而不是来路，会把刚退出来的格子当成新路重新开回去。
  const prev = S.cameFrom || getPrevCell();
  const ex = exits(x, y);

  // 主动预约了“下一格掉头”
  if (S.queuedRel === 'back' && (performance.now() - S.queuedAt) < 1800 && prev){
    const backDir = ex.find(c => x + c.dv[0] === prev[0] && y + c.dv[1] === prev[1]);
    S.queuedRel = null;
    updateDriveTools();
    if (backDir){
      S.wasMoving = false;
      doMove(backDir.dv[0], backDir.dv[1]);
      return;
    }
  }

  if (ex.length === 0) { arriveDeadEnd(); return; }

  // 过滤掉来路 prev，让 90° 弯道自动顺滑通过
  const forward = prev ? ex.filter(c => !(x + c.dv[0] === prev[0] && y + c.dv[1] === prev[1])) : ex.slice();

  // 无前进方向：死路
  if (forward.length === 0){ arriveDeadEnd(); return; }

  const freshForward = forward.filter(c => !S.deadDir.has((x + c.dv[0]) + ',' + (y + c.dv[1])));

  // 所有前方支路都被证伪：可能是“死路记忆”把还没找到彩蛋的老区域封死了
  // 只要彩蛋没集齐，就清空死路记忆重新探索一遍（把来路临时标死，避免立刻原路返回）
  if (freshForward.length === 0 && S.collected.size < S.totalEggs && S.deadDir.size > 0){
    S.deadDir.clear();
    if (prev) S.deadDir.add(prev[0] + ',' + prev[1]);
    const retry = forward.filter(c => !S.deadDir.has((x + c.dv[0]) + ',' + (y + c.dv[1])));
    if (retry.length){
      S.pending = false;
      doMove(retry[0].dv[0], retry[0].dv[1]);
      return;
    }
  }

  // 所有前方支路都被证伪：死路
  if (freshForward.length === 0){ arriveDeadEnd(); return; }

  // 仅剩一条可走的前进方向（直道或 90° 弯道）：自动巡航，不停下打扰玩家
  if (freshForward.length === 1){
    S.pending = false;
    doMove(freshForward[0].dv[0], freshForward[0].dv[1]);
    return;
  }

  // 真正的岔路口（>= 2 条未证伪前进路）
  S.junctions++;
  S.wasMoving = false;

  // 把未证伪的前进方向转为相对方向，并附带可选的“掉头”返回选项
  const relChoices = freshForward.map(c => toRelativeChoice(c, S.heading));
  if (prev){
    const backDir = ex.find(c => x + c.dv[0] === prev[0] && y + c.dv[1] === prev[1]);
    if (backDir && !S.deadDir.has(prev[0] + ',' + prev[1])){
      relChoices.push(toRelativeChoice(backDir, S.heading));
    }
  }
  relChoices.sort((a, b) => a.order - b.order);

  // 检查输入预读（玩家快到岔口前提前按了左/直/右）
  if (S.queuedRel && (performance.now() - S.queuedAt) < 650){
    const qIdx = relChoices.findIndex(c => c.rel === S.queuedRel);
    S.queuedRel = null;
    if (qIdx >= 0){
      S.choices = relChoices;
      S.pending = true;
      chooseDir(qIdx);
      return;
    }
  }
  S.queuedRel = null;
  askDirection(relChoices);
}

function arriveDeadEnd(){
  S.wrong++;
  S.wasMoving = false;
  S.queuedRel = null;
  // 用当前位置标记死路（掉头后 route 末尾未必就是当前格）
  S.deadDir.add(S.pos[0] + ',' + S.pos[1]);
  SFX.deadEnd();
  refreshHUD();
  drawMinimap();
  showToast('🚧 前面是死路！', '正在原路倒回最近岔口…', 'warn');
  document.getElementById('choices').innerHTML = '';
  document.getElementById('hint').textContent = '倒车中…';
  updateDriveTools();
  S.pending = false;
  S.anim = { phase:'shunt', t:0, dur:0.65 / speedMult(), cb:()=>{ rewindToJunction(); } };
}

function rewindToJunction(){
  S.route.pop();
  backtrackStep();
}

function backtrackStep(){
  if (!S.running || S.finished) return;
  if (S.route.length <= 1) {
    S.pos = [S.maze.start[0], S.maze.start[1]];
    S.route = [[S.pos[0], S.pos[1]]];
    // 回到起点相当于重新出发：清掉来路与“已证伪”记录，否则起点唯一的出口会被判成死路而原地打转
    S.cameFrom = null;
    S.deadDir = new Set();
    showToast('回到起点', '请重新选择方向', 'warn');
    setTimeout(() => { if (S.running) afterMove(); }, 450);
    return;
  }
  const cur = S.route[S.route.length - 1];
  const target = [cur[0], cur[1]];
  const dx = target[0] - S.pos[0], dy = target[1] - S.pos[1];

  S.anim = {
    phase:'shunt', t:0, dur:0.36 / speedMult(),
    from:[S.pos[0]+0.5, S.pos[1]+0.5],
    to:[target[0]+0.5, target[1]+0.5],
    cb:() => {
      S.pos = target;
      drawMinimap();
      const ex = exits(target[0], target[1]);
      const prev = S.route.length >= 2 ? S.route[S.route.length - 2] : null;
      const freshAll = ex.filter(c => !S.deadDir.has((target[0]+c.dv[0]) + ',' + (target[1]+c.dv[1])));
      const freshNoPrev = prev
        ? freshAll.filter(c => !(target[0]+c.dv[0] === prev[0] && target[1]+c.dv[1] === prev[1]))
        : freshAll;

      if (freshNoPrev.length >= 2) {
        S.junctions++;
        const relChoices = freshNoPrev.map(c => toRelativeChoice(c, S.heading));
        if (prev && freshAll.length > freshNoPrev.length){
          const b = freshAll.find(c => target[0]+c.dv[0] === prev[0] && target[1]+c.dv[1] === prev[1]);
          if (b) relChoices.push(toRelativeChoice(b, S.heading));
        }
        relChoices.sort((a, b) => a.order - b.order);
        askDirection(relChoices);
        return;
      }
      if (freshNoPrev.length === 1) {
        doMove(freshNoPrev[0].dv[0], freshNoPrev[0].dv[1]);
        return;
      }
      // 该岔路所有前进支路都试完，继续退
      S.deadDir.add(target[0] + ',' + target[1]);
      S.route.pop();
      backtrackStep();
    }
  };
  S.heading = headingOf(dx === 0 ? 0 : Math.sign(dx), dy === 0 ? 0 : Math.sign(dy));
  S.cam.ang = dirAngle(S.heading);
}

/* 弹出相对方向选择面板 */
function askDirection(relChoices){
  S.pending = true;
  S.choices = relChoices;
  updateDriveTools();
  const panel = document.getElementById('choices');
  panel.innerHTML = '';

  relChoices.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'dir ' + c.css;
    const tx = S.pos[0] + c.dv[0], ty = S.pos[1] + c.dv[1];
    const v = S.visits[idx(tx, ty)] || 0;
    const bar = barrierTo(S.pos[0], S.pos[1], c.dv);
    const hasChest = S.maze.chests && S.maze.chests.some(ch => !ch.opened && ch.x === tx && ch.y === ty);

    let sub;
    if (c.rel === 'back'){
      sub = '<span class="sub seen">原路返回</span>';
    } else if (hasChest){
      sub = '<span class="sub chest">📦 前方有宝箱</span>';
    } else if (bar && bar.type === 'crate'){
      el.classList.add('has-crate');
      sub = '<span class="sub crate">⚠ 路障 · 可撞开</span>';
    } else if (v === 0){
      sub = '<span class="sub new">✨ 新路</span>';
    } else {
      sub = `<span class="sub seen">走过 ${v} 次</span>`;
    }

    el.innerHTML = `<span class="kbd-badge">${i+1}</span><span class="arw">${c.arrow}</span><span>${escapeHtml(c.label)}</span>${sub}`;
    if (eventAt(S.pos[0], S.pos[1], c.dv)){
      el.classList.add('has-egg');
      el.innerHTML += '<span class="glow"></span>';
    }
    bindTap(el, () => chooseDir(i));
    panel.appendChild(el);
  });

  updateHintText();
  document.getElementById('panel').style.opacity = 1;
}

function updateHintText(){
  const hint = document.getElementById('hint');
  if (S.pending){
    const r = S.radarInfo;
    hint.innerHTML = r
      ? `前方岔路口 <span class="radar-inline">· 🧭 ${escapeHtml(r.text)}</span>`
      : '前方岔路口 —— 选一个方向';
  } else if (S.anim && S.anim.phase === 'move'){
    hint.textContent = S.queuedRel === 'back' ? '已预约：下一格掉头' : '行驶中…';
  }
}

function updateDriveTools(){
  const dt = document.getElementById('driveTools');
  const btnU = document.getElementById('btnUturn');
  const moving = S.running && !S.pending && S.anim && S.anim.phase === 'move';
  dt.classList.toggle('show', !!moving);
  btnU.classList.toggle('on', S.queuedRel === 'back');
  btnU.textContent = S.queuedRel === 'back' ? '↩ 已预约掉头（点击取消）' : '↩ 下一格掉头 (↓/S)';
}

function chooseDir(i){
  if (!S.pending || !S.choices[i]) return;
  const c = S.choices[i];
  SFX.click();
  S.pending = false;
  document.getElementById('choices').innerHTML = '';
  doMove(c.dv[0], c.dv[1]);
}

function doMove(ddx, ddy){
  const fromX = S.pos[0], fromY = S.pos[1];
  const nx = fromX + ddx, ny = fromY + ddy;
  if (!S.maze.open(nx, ny)) return;

  // 记录真实来路：掉头（原路退回）时 route 会弹栈，靠 route 推断“上一格”会指错方向
  S.cameFrom = [fromX, fromY];

  const bar = barrierTo(fromX, fromY, [ddx, ddy]);
  let hitCrate = null, crateEgg = null;
  if (bar && bar.type === 'crate'){
    hitCrate = edgeKey(bar.ax, bar.ay, bar.bx, bar.by);
    crateEgg = bar.drop ? eggById(bar.drop) : null;
  }

  const evEgg = eventAt(fromX, fromY, [ddx, ddy]);
  const targetHeading = headingOf(ddx, ddy);

  // 巡航缓动类型：连贯直行/过弯不逐格停顿
  const startSmooth = S.wasMoving;
  const willStopNext = willCellStop(nx, ny, fromX, fromY, hitCrate, evEgg);
  const easeMode = startSmooth
    ? (willStopNext ? 'out' : 'linear')
    : (willStopNext ? 'inout' : 'in');

  const baseDur = (1 / (S.speed * speedMult())) * (hitCrate ? 1.25 : 1);

  S.anim = {
    phase:'move', t:0, dur:baseDur, easeMode,
    from:[fromX + 0.5, fromY + 0.5],
    to:[nx + 0.5, ny + 0.5],
    turnFrom:S.cam.ang, turnTo:dirAngle(targetHeading),
    hitCrate,
    cb:() => {
      S.wasMoving = !willStopNext;

      // 1. 撞碎路障
      if (hitCrate){
        S.maze.barriers.delete(hitCrate);
        S.cratesBroken++;
        SFX.crash();
        spawnCrashFx(nx + 0.5, ny + 0.5);
        refreshHUD();
        if (crateEgg){
          const isNew = !S.collected.has(crateEgg.id);
          if (isNew){
            S.collected.add(crateEgg.id);
            S.collectedSrc[crateEgg.id] = '撞碎路障';
            spawnEggBurst(nx + 0.5, ny + 0.5, RARITY[crateEgg.rarity].col);
            SFX.egg(crateEgg.rarity);
            refreshHUD();
            enqueueFlow({ type:'eggCard', egg:crateEgg, src:'撞碎路障' });
          } else {
            showToast(`${RARITY[crateEgg.rarity].name} · ${crateEgg.name}`, '（重复获得）', 'good');
          }
        }
      }

      // 2. 岔路隐藏事件（串行排队，不再与路障卡片冲突）
      if (evEgg && !S.collected.has(evEgg.id)){
        // 双向登记，两个方向的 key 一起清掉
        S.hintEggs.delete(fromX + ',' + fromY + '|' + ddx + ',' + ddy);
        S.hintEggs.delete(nx + ',' + ny + '|' + (-ddx) + ',' + (-ddy));
        enqueueFlow({ type:'event', egg:evEgg });
      }

      // 3. 格内宝箱
      if (S.maze.chests && S.maze.chests.some(c => !c.opened && c.x === nx && c.y === ny)){
        enqueueFlow({ type:'chest', x:nx, y:ny });
      }

      // 4. 小地图兜底事件
      if (S.landEggs && S.landEggs.has(nx + ',' + ny)){
        const lid = S.landEggs.get(nx + ',' + ny);
        S.landEggs.delete(nx + ',' + ny);
        const legg = eggById(lid);
        if (legg && !S.collected.has(legg.id)) enqueueFlow({ type:'event', egg:legg });
      }

      // 5. 推进下一步
      updateRadar();
      drawMinimap();
      enqueueFlow({ type:'afterMove' });
    }
  };

  S.heading = targetHeading;
  S.pos = [nx, ny];

  // 避免环路导致 route 栈无限膨胀：如果恰好退回上一个点则弹栈，否则压栈（限制最大深度）
  if (S.route.length >= 2 && S.route[S.route.length - 2][0] === nx && S.route[S.route.length - 2][1] === ny){
    S.route.pop();
  } else {
    S.route.push([nx, ny]);
    if (S.route.length > 260) S.route.shift();
  }

  S.trial++;
  S.visits[idx(nx, ny)] = (S.visits[idx(nx, ny)] || 0) + 1;
  refreshHUD();
  updateHintText();
  updateDriveTools();
  drawMinimap();
}

/* ==================================================================
   8. 后期寻宝罗盘（剩余 <= 5 个彩蛋时自动提示最近彩蛋方向）
   ================================================================== */
function updateRadar(){
  const tip = document.getElementById('radarTip');
  if (!S.maze || !S.collected){ S.radarInfo = null; tip.classList.remove('show'); return; }
  const left = S.totalEggs - S.collected.size;
  if (left <= 0 || left > 5){
    S.radarInfo = null;
    tip.classList.remove('show');
    return;
  }

  // 收集所有未收集彩蛋所在格子
  const targets = new Set();
  if (S.maze.chests){
    for (const c of S.maze.chests){
      if (c.opened) continue;
      const ids = [c.eggId].concat(c.extra || []);
      if (ids.some(id => !S.collected.has(id))) targets.add(c.x + ',' + c.y);
    }
  }
  if (S.maze.barriers){
    for (const b of S.maze.barriers.values()){
      if (b.type === 'crate' && b.drop && !S.collected.has(b.drop)){
        targets.add(b.ax + ',' + b.ay);
        targets.add(b.bx + ',' + b.by);
      }
    }
  }
  if (S.hintEggs){
    for (const [k, id] of S.hintEggs.entries()){
      if (!S.collected.has(id)) targets.add(k.split('|')[0]);
    }
  }
  if (S.landEggs){
    for (const [k, id] of S.landEggs.entries()){
      if (!S.collected.has(id)) targets.add(k);
    }
  }
  if (!targets.size){ S.radarInfo = null; tip.classList.remove('show'); return; }

  // BFS 找最近目标格及第一步方向
  const { W, H } = S.maze;
  const seen = new Uint8Array(W * H);
  const q = [[S.pos[0], S.pos[1], 0, null]];
  seen[idx(S.pos[0], S.pos[1])] = 1;
  let head = 0, found = null;
  while (head < q.length){
    const [cx, cy, dist, firstDir] = q[head++];
    if (dist > 0 && targets.has(cx + ',' + cy)){ found = { dist, firstDir }; break; }
    for (const d of exits(cx, cy)){
      const nx = cx + d.dv[0], ny = cy + d.dv[1];
      if (seen[idx(nx, ny)]) continue;
      seen[idx(nx, ny)] = 1;
      q.push([nx, ny, dist + 1, firstDir || d]);
    }
  }

  if (!found || !found.firstDir){
    S.radarInfo = null; tip.classList.remove('show'); return;
  }
  const rel = toRelativeChoice(found.firstDir, S.heading);
  const text = `最近彩蛋：${rel.label}${rel.arrow} 约 ${found.dist} 格`;
  S.radarInfo = { text, dist: found.dist, rel: rel.rel };
  tip.textContent = `🧭 ${text}`;
  tip.classList.add('show');
}

/* ==================================================================
   9. 迷雾小地图渲染
   ================================================================== */
const mmCv = document.getElementById('minimap');
const mmCtx = mmCv.getContext('2d');

function drawMinimap(){
  if (!S.maze || !S.mapOpen) return;
  const { cw, ch, W, H } = S.maze;
  const size = window.innerWidth < 460 ? 116 : 144;
  if (mmCv.width !== size || mmCv.height !== size){
    mmCv.width = size; mmCv.height = size;
  }
  const pad = 8;
  const cell = (size - pad * 2) / Math.max(cw, ch);
  const ox = (size - cell * cw) / 2;
  const oy = (size - cell * ch) / 2;

  mmCtx.clearRect(0, 0, size, size);
  mmCtx.fillStyle = '#f4e8ca';
  mmCtx.fillRect(0, 0, size, size);

  const visited = (x, y) => x >= 1 && y >= 1 && x <= cw && y <= ch && S.visits[idx(x, y)] > 0;
  const revealed = (x, y) => {
    if (!S.maze.open(x, y)) return false;
    if (visited(x, y)) return true;
    // 与已访问格相邻且中间无护栏的格子显示为迷雾边缘
    for (const d of WORLD_DIRS){
      const nx = x + d.dv[0], ny = y + d.dv[1];
      if (visited(nx, ny)){
        const b = barrierAt(S.maze, x, y, nx, ny);
        if (!b || b.type !== 'guard') return true;
      }
    }
    return false;
  };

  // 1. 轨道连接线
  mmCtx.lineCap = 'round';
  for (let y = 1; y <= ch; y++){
    for (let x = 1; x <= cw; x++){
      if (!revealed(x, y)) continue;
      const cx = ox + (x - 0.5) * cell;
      const cy = oy + (y - 0.5) * cell;
      for (const [dx, dy] of [[1,0],[0,1]]){
        const nx = x + dx, ny = y + dy;
        if (!revealed(nx, ny)) continue;
        const b = barrierAt(S.maze, x, y, nx, ny);
        if (b && b.type === 'guard') continue;
        const bothVisited = visited(x, y) && visited(nx, ny);
        mmCtx.strokeStyle = bothVisited ? '#a87c4f' : 'rgba(46,184,100,.45)';
        mmCtx.lineWidth = Math.max(2, cell * 0.28);
        mmCtx.beginPath();
        mmCtx.moveTo(cx, cy);
        mmCtx.lineTo(ox + (nx - 0.5) * cell, oy + (ny - 0.5) * cell);
        mmCtx.stroke();
      }
    }
  }

  // 2. 格子节点（已走 / 死路 / 未探索新路）
  for (let y = 1; y <= ch; y++){
    for (let x = 1; x <= cw; x++){
      if (!revealed(x, y)) continue;
      const cx = ox + (x - 0.5) * cell;
      const cy = oy + (y - 0.5) * cell;
      if (visited(x, y)){
        const isDead = S.deadDir && S.deadDir.has(x + ',' + y);
        mmCtx.fillStyle = isDead ? 'rgba(165,148,118,.48)' : '#c79658';
        mmCtx.beginPath();
        mmCtx.arc(cx, cy, Math.max(1.8, cell * 0.16), 0, Math.PI * 2);
        mmCtx.fill();
      } else {
        // 迷雾边缘：未探索的新路
        mmCtx.fillStyle = '#1fb85a';
        mmCtx.beginPath();
        mmCtx.arc(cx, cy, Math.max(2.3, cell * 0.21), 0, Math.PI * 2);
        mmCtx.fill();
      }
    }
  }

  // 3. 已知路障与护栏
  if (S.maze.barriers){
    for (const b of S.maze.barriers.values()){
      if (!visited(b.ax, b.ay) && !visited(b.bx, b.by)) continue;
      const mx = ox + ((b.ax + b.bx) / 2 - 0.5) * cell;
      const my = oy + ((b.ay + b.by) / 2 - 0.5) * cell;
      if (b.type === 'crate'){
        mmCtx.fillStyle = '#f08b3c';
        const s = Math.max(3.6, cell * 0.34);
        mmCtx.fillRect(mx - s/2, my - s/2, s, s);
      } else {
        mmCtx.fillStyle = '#e05248';
        mmCtx.beginPath();
        mmCtx.arc(mx, my, Math.max(2, cell * 0.17), 0, Math.PI * 2);
        mmCtx.fill();
      }
    }
  }

  // 4. 已知未开启宝箱
  if (S.maze.chests){
    for (const c of S.maze.chests){
      if (c.opened || !revealed(c.x, c.y)) continue;
      const cx = ox + (c.x - 0.5) * cell;
      const cy = oy + (c.y - 0.5) * cell;
      const r = Math.max(3, cell * 0.28);
      mmCtx.fillStyle = '#ffd15c';
      mmCtx.beginPath();
      mmCtx.moveTo(cx, cy - r);
      mmCtx.lineTo(cx + r, cy);
      mmCtx.lineTo(cx, cy + r);
      mmCtx.lineTo(cx - r, cy);
      mmCtx.closePath();
      mmCtx.fill();
    }
  }

  // 5. 火车当前位置与朝向箭头
  const tx = ox + (S.cam.px - 1) * cell;
  const ty = oy + (S.cam.py - 1) * cell;
  mmCtx.save();
  mmCtx.translate(tx, ty);
  mmCtx.rotate(S.cam.ang);
  const ar = Math.max(4.5, cell * 0.42);
  mmCtx.fillStyle = '#e03131';
  mmCtx.strokeStyle = '#ffffff';
  mmCtx.lineWidth = 1.4;
  mmCtx.beginPath();
  mmCtx.moveTo(ar, 0);
  mmCtx.lineTo(-ar * 0.72, -ar * 0.65);
  mmCtx.lineTo(-ar * 0.35, 0);
  mmCtx.lineTo(-ar * 0.72, ar * 0.65);
  mmCtx.closePath();
  mmCtx.fill();
  mmCtx.stroke();
  mmCtx.restore();
}

function syncMapVisibility(){
  const wrap = document.getElementById('minimapWrap');
  const btn = document.getElementById('btnMap');
  wrap.classList.toggle('collapsed', !S.mapOpen);
  btn.classList.toggle('active', S.mapOpen);
  if (S.mapOpen) drawMinimap();
}

/* ==================================================================
   10. 结算界面
   ================================================================== */
function finishGame(){
  if (!S.running && S.finished) return;
  S.finished = true;
  S.running = false;
  S.pending = false;
  S.cardOpen = false;
  clearFlow();
