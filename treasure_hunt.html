/* ==================================================================
   11. 伪 3D 渲染（已移除误导性的终点站光柱）
   ================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
const HORIZON_RATIO = 0.40;
const FOV = 1.35;
const VIEW_DEPTH = 7.5;
const CAM_H = 0.62;
let FOCAL = 400;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = cv.clientWidth || window.innerWidth;
  VH = cv.clientHeight || window.innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FOCAL = (VH * 0.5) / Math.tan(FOV / 2);
  if (S.maze) drawMinimap();
}
window.addEventListener('resize', resize);

function camZof(wx, wy, rel){
  return (wx - rel.px) * Math.cos(rel.ang) + (wy - rel.py) * Math.sin(rel.ang);
}
function project(wx, wy, rel){
  const dx = wx - rel.px, dy = wy - rel.py;
  const ca = Math.cos(rel.ang), sa = Math.sin(rel.ang);
  const camZ = dx * ca + dy * sa;
  const camX = -dx * sa + dy * ca;
  if (camZ <= 0.06) return null;
  const horizon = VH * HORIZON_RATIO;
  const s = FOCAL / camZ;
  return { x: VW / 2 + camX * s, y: horizon + CAM_H * s, z: camZ, s };
}
function projectSeg(p0, p1, rel){
  const ZMIN = 0.10;
  let A = p0, B = p1;
  let z0 = camZof(A[0], A[1], rel), z1 = camZof(B[0], B[1], rel);
  if (z0 < ZMIN && z1 < ZMIN) return null;
  if (z1 < z0){ [A,B] = [B,A]; [z0,z1] = [z1,z0]; }
  if (z0 < ZMIN){
    const t = (ZMIN - z0) / (z1 - z0);
    A = [A[0] + (B[0]-A[0])*t, A[1] + (B[1]-A[1])*t];
  }
  const a = project(A[0], A[1], rel), b = project(B[0], B[1], rel);
  return (a && b) ? { a, b } : null;
}
function hexA(hex, a){
  return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
}
function shade(hex, k){
  const f = v => Math.max(0, Math.min(255, Math.round(k >= 0 ? v + (255-v)*k : v * (1+k))));
  return `rgb(${f(parseInt(hex.slice(1,3),16))},${f(parseInt(hex.slice(3,5),16))},${f(parseInt(hex.slice(5,7),16))})`;
}
function hash2(x, y, s){
  let h = x * 374761393 + y * 668265263 + s * 1442695041;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

function drawCloud(cx, cy, r, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.arc(cx - r * 0.85, cy + r * 0.18, r * 0.72, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.88, cy + r * 0.16, r * 0.76, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.35, cy - r * 0.35, r * 0.65, 0, Math.PI * 2);
  ctx.fill();
  // 云底淡淡投影，让云朵圆润蓬松
  ctx.fillStyle = 'rgba(175,212,245,.32)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.52, r * 1.4, r * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGroundStrip(rel, theme){
  const horizon = VH * HORIZON_RATIO;
  const t = S.totalTime;

  // 1. 绘本明亮天空渐变
  const g = ctx.createLinearGradient(0, 0, 0, horizon + 12);
  g.addColorStop(0, theme.sky[0][0]);
  g.addColorStop(0.62, theme.sky[0][1]);
  g.addColorStop(1, theme.sky[1][0]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, horizon + 14);

  // 2. 太阳 / 弯月与星星
  const sunX = VW * 0.5 - Math.sin(rel.ang) * VW * 0.26;
  const sunY = horizon - VH * 0.22;
  if (theme.isNight){
    // 闪烁星星
    for (let i = 0; i < 26; i++){
      const sx = ((i * 197.3 - rel.ang * VW * 0.32) % VW + VW) % VW;
      const sy = VH * (0.04 + ((i * 53) % 100) / 100 * (HORIZON_RATIO - 0.10));
      const tw = 0.45 + 0.55 * Math.sin(t * 2.6 + i * 1.9);
      ctx.fillStyle = `rgba(255,246,196,${tw})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.4 + (i % 3) * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    // 弯弯大月亮
    const mr = VH * 0.055;
    const mg = ctx.createRadialGradient(sunX, sunY, mr * 0.2, sunX, sunY, mr * 3.4);
    mg.addColorStop(0, 'rgba(255,238,160,.65)');
    mg.addColorStop(1, 'rgba(255,238,160,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(sunX, sunY, mr * 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(sunX, sunY, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = theme.sky[0][1];
    ctx.beginPath(); ctx.arc(sunX + mr * 0.42, sunY - mr * 0.18, mr * 0.84, 0, Math.PI * 2); ctx.fill();
  } else {
    // 暖暖的卡通太阳 + 柔和光晕
    const sr = VH * 0.052;
    const sg = ctx.createRadialGradient(sunX, sunY, sr * 0.4, sunX, sunY, sr * 4.5);
    sg.addColorStop(0, 'rgba(255,250,200,.95)');
    sg.addColorStop(0.35, 'rgba(255,236,153,.45)');
    sg.addColorStop(1, 'rgba(255,236,153,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sunX, sunY, sr * 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe566';
    ctx.beginPath(); ctx.arc(sunX, sunY, sr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff9d6';
    ctx.beginPath(); ctx.arc(sunX - sr * 0.2, sunY - sr * 0.2, sr * 0.55, 0, Math.PI * 2); ctx.fill();
  }

  // 3. 蓬松飘动的卡通白云（随视角缓慢视差滚动）
  const cloudAlpha = theme.isNight ? 0.18 : 0.88;
  for (let i = 0; i < 6; i++){
    const raw = (i * 0.21 + t * 0.008 - rel.ang * 0.16) % 1.25;
    const cx = ((raw + 1.25) % 1.25 - 0.12) * VW;
    const cy = VH * (0.09 + (i % 3) * 0.065);
    const cr = VH * (0.028 + (i % 3) * 0.011);
    drawCloud(cx, cy, cr, cloudAlpha);
  }

  // 4. 远近两层圆润童话山丘（彻底告别硬邦邦的平直地平线）
  const pan = rel.ang * VW * 0.42;
  for (let layer = 0; layer < 2; layer++){
    const amp = VH * (layer === 0 ? 0.075 : 0.048);
    const base = horizon + (layer === 0 ? 2 : 6);
    const freq = layer === 0 ? 0.0042 : 0.0068;
    const phase = layer === 0 ? 0.5 : 2.4;
    ctx.fillStyle = theme.hills[layer];
    ctx.beginPath();
    ctx.moveTo(0, base + 20);
    for (let x = 0; x <= VW + 24; x += 24){
      const y = base - Math.abs(Math.sin((x + pan * (0.6 + layer * 0.35)) * freq + phase)) * amp
                     - Math.sin((x + pan * 0.4) * freq * 0.5) * amp * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VW + 24, base + 20);
    ctx.closePath();
    ctx.fill();
  }

  // 5. 明亮柔软的草地/大地渐变
  const gg = ctx.createLinearGradient(0, horizon, 0, VH);
  gg.addColorStop(0, theme.hills[1]);
  gg.addColorStop(0.18, theme.ground);
  gg.addColorStop(1, theme.ground2 || shade(theme.ground, -0.15));
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizon - 1, VW, VH - horizon + 2);
}

function drawScenery(rel, theme){
  const nearX = Math.floor(rel.px - 10), farX = Math.floor(rel.px + 10);
  const nearY = Math.floor(rel.py - 10), farY = Math.floor(rel.py + 10);
  const items = [];
  for (let gy = nearY; gy <= farY; gy++){
    for (let gx = nearX; gx <= farX; gx++){
      if (S.maze.open(gx, gy)) continue;
      const edge = !S.maze.open(gx-1,gy) || !S.maze.open(gx+1,gy) || !S.maze.open(gx,gy-1) || !S.maze.open(gx,gy+1);
      if (!edge) continue;
      for (let i = 0; i < 3; i++){
        const rx = gx + 0.12 + hash2(gx, gy, i*7+1) * 0.76;
        const ry = gy + 0.12 + hash2(gx, gy, i*7+2) * 0.76;
        if (Math.min(Math.abs(rx - rel.px), Math.abs(ry - rel.py)) < 0.52) continue;
        const p = project(rx, ry, rel);
        if (!p || p.z > VIEW_DEPTH) continue;
        items.push({
          p, i,
          size: 0.55 + hash2(gx, gy, i*7+3) * 0.65,
          variant: hash2(gx, gy, i*7+4),
          flowerCol: ['#ff7eb3','#ffe066','#ff8787','#ffffff','#74c0fc'][Math.floor(hash2(gx, gy, i*7+5) * 5)]
        });
      }
    }
  }
  items.sort((a,b) => b.p.z - a.p.z);
  for (const it of items){
    const h = (0.58 + it.size * 0.68) * it.p.s;
    const w = h * 0.72;
    const nearFade = Math.max(0, Math.min(1, it.p.z / 0.55));
    drawProp(it.p.x, it.p.y, w, h, theme, it, it.p.z, nearFade);
  }
}

/* 圆润绘本风路边景物（带柔和地面投影、高光与小装饰） */
function drawProp(cx, baseY, w, h, theme, it, z, extraFade){
  const t = theme.treeType;
  const fadeK = Math.max(0, Math.min(1, 1 - (z - 3.6) / 4.2));
  const alpha = (0.42 + 0.58 * fadeK) * (extraFade === undefined ? 1 : extraFade);
  ctx.globalAlpha = alpha;

  const [c1, c2] = theme.trees[it.i % 2];

  // 地面椭圆投影
  ctx.fillStyle = 'rgba(20,45,30,.22)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY + h * 0.02, w * 0.42, Math.max(2, h * 0.075), 0, 0, Math.PI * 2);
  ctx.fill();

  if (t === 'pine' || t === 'snow'){
    // 圆润蓬松的绘本松树（圆角多层树冠 + 树干 + 可爱点缀）
    ctx.fillStyle = '#8d5a34';
    rrect(cx - w * 0.11, baseY - h * 0.30, w * 0.22, h * 0.30, Math.max(2, w * 0.06));
    ctx.fill();

    const tiers = 3;
    for (let L = 0; L < tiers; L++){
      const rw = w * (0.50 - L * 0.11);
      const ry = baseY - h * (0.34 + L * 0.21);
      const rh = h * 0.26;
      ctx.fillStyle = L % 2 === 0 ? c2 : c1;
      ctx.beginPath();
      ctx.ellipse(cx, ry, rw, rh, 0, 0, Math.PI * 2);
      ctx.fill();
      // 柔和顶部亮面
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.beginPath();
      ctx.ellipse(cx - rw * 0.18, ry - rh * 0.22, rw * 0.55, rh * 0.42, -0.2, 0, Math.PI * 2);
      ctx.fill();
      if (t === 'snow'){
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.beginPath();
        ctx.ellipse(cx, ry - rh * 0.45, rw * 0.68, rh * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // 树脚小花或小红果
    if (it.variant > 0.52 && z < 4.5){
      ctx.fillStyle = t === 'snow' ? '#ff6b6b' : it.flowerCol;
      ctx.beginPath();
      ctx.arc(cx + w * 0.24, baseY - h * 0.06, Math.max(2, w * 0.08), 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (t === 'blossom' || t === 'maple'){
    // 蓬松云朵树冠（樱花树 / 圆润红枫树）
    ctx.fillStyle = '#7c4f2b';
    rrect(cx - w * 0.10, baseY - h * 0.42, w * 0.20, h * 0.42, Math.max(2, w * 0.05));
    ctx.fill();
    const topY = baseY - h * 0.66;
    ctx.fillStyle = c2;
    ctx.beginPath();
    ctx.arc(cx - w * 0.24, topY + h * 0.09, w * 0.28, 0, Math.PI * 2);
    ctx.arc(cx + w * 0.25, topY + h * 0.08, w * 0.27, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c1;
    ctx.beginPath();
    ctx.arc(cx, topY, w * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.26)';
    ctx.beginPath();
    ctx.arc(cx - w * 0.10, topY - h * 0.08, w * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // 枫叶树下偶尔放个圆滚滚小南瓜
    if (t === 'maple' && it.variant > 0.68 && z < 4.5){
      const pr = Math.max(3, w * 0.15);
      ctx.fillStyle = '#ff8c24';
      ctx.beginPath(); ctx.ellipse(cx + w * 0.24, baseY - pr * 0.75, pr * 1.1, pr * 0.82, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b8c3e';
      ctx.fillRect(cx + w * 0.24 - pr * 0.12, baseY - pr * 1.75, pr * 0.24, pr * 0.35);
    }
  } else if (t === 'wheat'){
    // 阳光向日葵！小朋友一眼就能认出
    ctx.strokeStyle = '#3d9940';
    ctx.lineWidth = Math.max(2, w * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - h * 0.72); ctx.stroke();
    // 叶子
    ctx.fillStyle = '#52b848';
    ctx.beginPath(); ctx.ellipse(cx - w * 0.16, baseY - h * 0.35, w * 0.16, h * 0.08, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + w * 0.16, baseY - h * 0.45, w * 0.16, h * 0.08, 0.5, 0, Math.PI * 2); ctx.fill();
    // 花瓣
    const fy = baseY - h * 0.76, fr = Math.max(4, w * 0.26);
    ctx.fillStyle = c1;
    for (let p = 0; p < 8; p++){
      const a = (p / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a) * fr * 0.78, fy + Math.sin(a) * fr * 0.78, fr * 0.42, fr * 0.24, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#6b3e1b';
    ctx.beginPath(); ctx.arc(cx, fy, fr * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9c6230';
    ctx.beginPath(); ctx.arc(cx - fr * 0.14, fy - fr * 0.14, fr * 0.22, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'rock'){
    // 恐龙红岩谷：圆润仙人掌或圆润红岩
    if (it.variant < 0.62){
      const cw = w * 0.24;
      ctx.fillStyle = c1;
      rrect(cx - cw/2, baseY - h * 0.78, cw, h * 0.78, cw * 0.48); ctx.fill();
      rrect(cx - cw * 1.45, baseY - h * 0.56, cw * 0.85, h * 0.16, cw * 0.35); ctx.fill();
      rrect(cx - cw * 1.45, baseY - h * 0.70, cw * 0.55, h * 0.24, cw * 0.3); ctx.fill();
      rrect(cx + cw * 0.5, baseY - h * 0.46, cw * 0.85, h * 0.16, cw * 0.35); ctx.fill();
      rrect(cx + cw * 0.85, baseY - h * 0.62, cw * 0.55, h * 0.26, cw * 0.3); ctx.fill();
      // 仙人掌顶上的粉色小花
      ctx.fillStyle = '#ff7eb3';
      ctx.beginPath(); ctx.arc(cx, baseY - h * 0.81, Math.max(2.2, cw * 0.36), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#d97a4a';
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.46, baseY);
      ctx.quadraticCurveTo(cx - w * 0.38, baseY - h * 0.72, cx, baseY - h * 0.74);
      ctx.quadraticCurveTo(cx + w * 0.42, baseY - h * 0.70, cx + w * 0.46, baseY);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f09c68';
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.08, baseY - h * 0.48, w * 0.22, h * 0.14, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (t === 'lamp'){
    // 童话夜灯镇：温暖发光的小路灯 + 偶尔出现的小木屋
    if (it.variant > 0.65){
      const bw = w * 0.74, bh = h * 0.48;
      ctx.fillStyle = '#4e5d8c';
      rrect(cx - bw/2, baseY - bh, bw, bh, Math.max(2, bw * 0.1)); ctx.fill();
      ctx.fillStyle = '#e06458';
      ctx.beginPath();
      ctx.moveTo(cx - bw * 0.62, baseY - bh + 2);
      ctx.lineTo(cx, baseY - bh * 1.65);
      ctx.lineTo(cx + bw * 0.62, baseY - bh + 2);
      ctx.closePath(); ctx.fill();
      // 温暖亮灯窗户
      ctx.fillStyle = '#ffe57f';
      rrect(cx - bw * 0.2, baseY - bh * 0.68, bw * 0.4, bh * 0.36, 3); ctx.fill();
    } else {
      ctx.strokeStyle = '#7c94c8'; ctx.lineWidth = Math.max(2, w * 0.10);
      ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - h * 0.84); ctx.stroke();
      const gg = ctx.createRadialGradient(cx, baseY - h * 0.88, 0, cx, baseY - h * 0.88, w * 1.1);
      gg.addColorStop(0, 'rgba(255,235,140,.95)');
      gg.addColorStop(0.35, 'rgba(255,220,110,.38)');
      gg.addColorStop(1, 'rgba(255,220,110,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(cx, baseY - h * 0.88, w * 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff5b8';
      ctx.beginPath(); ctx.arc(cx, baseY - h * 0.88, Math.max(2.5, w * 0.16), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawBarriers(rel){
  if (!S.maze.barriers || !S.maze.barriers.size) return;
  const items = [];
  for (const b of S.maze.barriers.values()){
    const mx = (b.ax + b.bx) / 2, my = (b.ay + b.by) / 2;
    const z = camZof(mx, my, rel);
    if (z <= 0.10 || z > VIEW_DEPTH) continue;
    items.push({ b, mx, my, z });
  }
  items.sort((A,B) => B.z - A.z);
  for (const it of items){
    const { b, mx, my, z } = it;
    const ax = b.bx - b.ax, ay = b.by - b.ay;
    const plen = Math.hypot(ax, ay) || 1;
    const nx = -ay / plen, ny = ax / plen;
    const HALF = 0.42;
    const e0 = project(mx + nx * HALF, my + ny * HALF, rel);
    const e1 = project(mx - nx * HALF, my - ny * HALF, rel);
    if (!e0 || !e1) continue;
    const wpx = Math.hypot(e0.x - e1.x, e0.y - e1.y);
    const hpx = 0.54 * FOCAL / z;
    const alpha = Math.max(0, Math.min(1, 1.25 - z / VIEW_DEPTH)) * Math.max(0, Math.min(1, z / 0.45));
    if (alpha < 0.04) continue;
    if (b.type === 'guard') drawGuard(e0, e1, wpx, hpx, alpha);
    else drawCrate(e0, e1, wpx, hpx, alpha);
  }
}

/* 卡通铁路道口护栏（带闪烁警示小黄灯） */
function drawGuard(e0, e1, w, h, alpha){
  ctx.save();
  ctx.translate(e0.x, e0.y);
  ctx.rotate(Math.atan2(e1.y - e0.y, e1.x - e0.x));
  const bh = h * 0.52, by = -bh - h * 0.12;
  const rad = Math.max(3, bh * 0.25);

  ctx.globalAlpha = alpha;
  // 圆润立柱
  ctx.fillStyle = '#4f5d75';
  rrect(w * 0.06, by - h * 0.12, Math.max(3, w * 0.08), bh + h * 0.24, 4); ctx.fill();
  rrect(w * 0.86, by - h * 0.12, Math.max(3, w * 0.08), bh + h * 0.24, 4); ctx.fill();

  // 顶部闪烁警示灯
  const blink = 0.55 + 0.45 * Math.sin(S.totalTime * 6.5);
  ctx.fillStyle = `rgba(255,212,59,${blink})`;
  ctx.beginPath();
  ctx.arc(w * 0.10, by - h * 0.16, Math.max(3, h * 0.10), 0, Math.PI * 2);
  ctx.arc(w * 0.90, by - h * 0.16, Math.max(3, h * 0.10), 0, Math.PI * 2);
  ctx.fill();

  // 圆角红白横杆
  ctx.save();
  rrect(0, by, w, bh, rad);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#ff5247';
  const stripes = 5, sw = w / stripes;
  for (let i = 0; i < stripes; i += 2){
    ctx.beginPath();
    ctx.moveTo(i * sw, by + bh); ctx.lineTo(i * sw + sw * 0.45, by);
    ctx.lineTo((i+1) * sw + sw * 0.45, by); ctx.lineTo((i+1) * sw, by + bh);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  rrect(0, by, w, bh, rad);
  ctx.strokeStyle = '#c92a2a';
  ctx.lineWidth = Math.max(1.4, h * 0.04);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 可爱圆润的橙色可撞玩具路障（带高光与小星星标志） */
function drawCrate(e0, e1, w, h, alpha){
  ctx.save();
  ctx.translate(e0.x, e0.y);
  ctx.rotate(Math.atan2(e1.y - e0.y, e1.x - e0.x));
  ctx.globalAlpha = alpha;
  const bw = w * 0.74, bh = h * 0.58, bx = (w - bw) / 2, by = -bh;
  const r = Math.max(4, bh * 0.26);

  // 柔和阴影
  ctx.fillStyle = 'rgba(40,30,10,.24)';
  ctx.beginPath();
  ctx.ellipse(w / 2, 2, bw * 0.55, Math.max(2, bh * 0.14), 0, 0, Math.PI * 2);
  ctx.fill();

  // 圆滚滚橙色主体
  const g = ctx.createLinearGradient(0, by, 0, 0);
  g.addColorStop(0, '#ffa94d');
  g.addColorStop(1, '#f76707');
  ctx.fillStyle = g;
  rrect(bx, by, bw, bh, r);
  ctx.fill();

  // 白色明亮反光条
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  rrect(bx + bw * 0.12, by + bh * 0.34, bw * 0.76, bh * 0.24, Math.max(2, bh * 0.1));
  ctx.fill();

  // 顶部圆提手
  ctx.fillStyle = '#ffe066';
  rrect(bx + bw * 0.34, by - bh * 0.14, bw * 0.32, bh * 0.18, Math.max(2, bh * 0.08));
  ctx.fill();

  // 清晰卡通描边
  rrect(bx, by, bw, bh, r);
  ctx.strokeStyle = '#b84700';
  ctx.lineWidth = Math.max(1.5, h * 0.04);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function spawnCrashFx(wx, wy){
  S.fx.push({ wx, wy, t:0, dur:0.75, kind:'ring' });
  const cols = ['#ff922b','#ffd43b','#ff6b6b','#ffffff','#63e6be'];
  for (let i = 0; i < 22; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 0.4 + Math.random() * 1.05;
    S.fx.push({
      wx, wy, t:0, dur: 0.55 + Math.random() * 0.45,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      vz: 1.0 + Math.random() * 1.7, kind:'bit',
      col: cols[i % cols.length],
      size: 0.034 + Math.random() * 0.048
    });
  }
}

function updateFx(dt){
  if (!S.fx || !S.fx.length) return;
  const alive = [];
  for (const f of S.fx){
    f.t += dt;
    if (f.t >= f.dur) continue;
    if (f.kind === 'bit'){
      f.wx += (f.vx || 0) * dt;
      f.wy += (f.vy || 0) * dt;
      f.vz = (f.vz || 0) - 5.2 * dt;
      f.offZ = (f.offZ || 0) + (f.vz || 0) * dt;
      if (f.offZ < 0){ f.offZ = 0; f.vz = -(f.vz || 0) * 0.38; }
    }
    alive.push(f);
  }
  S.fx = alive;
}

function drawFx(rel){
  if (!S.fx || !S.fx.length) return;
  for (const f of S.fx){
    const p = project(f.wx, f.wy, rel);
    if (!p) continue;
    const k = f.t / f.dur;
    const yOff = (f.offZ || 0) * p.s;
    if (f.kind === 'ring'){
      const r = (0.16 + k * 1.15) * p.s;
      ctx.strokeStyle = `rgba(255,230,120,${(1 - k) * 0.9})`;
      ctx.lineWidth = Math.max(1.5, (0.095 * (1 - k)) * p.s);
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.42, 0, 0, Math.PI*2); ctx.stroke();
    } else {
      const r = Math.max(1.2, (f.size || 0.042) * p.s);
      ctx.fillStyle = f.col;
      ctx.globalAlpha = Math.max(0, 1 - k * k);
      ctx.beginPath(); ctx.arc(p.x, p.y - yOff, r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

/* 圆润立体绘本风铁轨：暖砂道碴 + 巧克力木枕木 + 闪亮金属钢轨 */
function drawTrack(rel, theme){
  const nearX = Math.floor(rel.px - VIEW_DEPTH), farX = Math.ceil(rel.px + VIEW_DEPTH);
  const nearY = Math.floor(rel.py - VIEW_DEPTH), farY = Math.ceil(rel.py + VIEW_DEPTH);
  const segs = [];
  const seen = new Set();
  for (let gy = nearY; gy <= farY; gy++){
    for (let gx = nearX; gx <= farX; gx++){
      if (!S.maze.open(gx, gy)) continue;
      for (const [ox, oy] of [[1,0],[0,1]]){
        const nx2 = gx + ox, ny2 = gy + oy;
        if (!S.maze.open(nx2, ny2)) continue;
        const key = Math.min(gx,nx2)+','+Math.min(gy,ny2)+','+(ox?'h':'v');
        if (seen.has(key)) continue;
        seen.add(key);
        segs.push({ p0:[gx+0.5, gy+0.5], p1:[nx2+0.5, ny2+0.5], z: Math.max(0, camZof(gx + 0.5, gy + 0.5, rel)) });
      }
    }
  }
  segs.sort((A,B) => B.z - A.z);

  for (const sg of segs){
    const pr = projectSeg(sg.p0, sg.p1, rel);
    if (!pr) continue;
    const { a, b } = pr;
    const dist = Math.max(0.10, Math.min(a.z, b.z));
    const pxu = FOCAL / dist;
    const sdx = sg.p1[0]-sg.p0[0], sdy = sg.p1[1]-sg.p0[1];
    const sl = Math.hypot(sdx, sdy) || 1;
    const dot = Math.abs((sdx*Math.cos(rel.ang) + sdy*Math.sin(rel.ang)) / sl);
    const dim = (0.28 + 0.72 * dot * dot) * Math.max(0, Math.min(1, dist / 0.45));
    const dxs = b.x - a.x, dys = b.y - a.y;
    const dl = Math.hypot(dxs, dys) || 1;
    const nxu = -dys/dl, nyu = dxs/dl;

    // 暖砂石路基
    ctx.strokeStyle = hexA('#d8c39e', Math.min(.95, 1.7/(dist+0.55)) * dim);
    ctx.lineWidth = Math.max(2, 0.54 * pxu);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    // 暖棕色圆角枕木
    for (let d = 0; d <= 1.0; d += 0.25){
      const wx = sg.p0[0] + (sg.p1[0]-sg.p0[0]) * d;
      const wy = sg.p0[1] + (sg.p1[1]-sg.p0[1]) * d;
      const z = camZof(wx, wy, rel);
      if (z < 0.12) continue;
      const p = project(wx, wy, rel);
      if (!p || p.z > VIEW_DEPTH) continue;
      const pw = 0.46 * FOCAL / p.z;
      const tieAlpha = Math.min(.95, 1.7/(p.z+0.45)) * dim;
      if (tieAlpha < 0.04) continue;
      ctx.strokeStyle = hexA('#7c4d2b', tieAlpha);
      ctx.lineWidth = Math.max(1.5, 0.088 * FOCAL / p.z);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - nxu*pw/2, p.y - nyu*pw/2);
      ctx.lineTo(p.x + nxu*pw/2, p.y + nyu*pw/2);
      ctx.stroke();
    }

    // 两条闪亮银色钢轨（深蓝银底 + 白色高光）
    const halfGauge = 0.16 * pxu;
    const railAlpha = Math.min(.98, 1.8/(dist+0.45)) * dim;
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(74,104,142,${railAlpha})`;
    ctx.lineWidth = Math.max(2, 0.068 * pxu);
    ctx.beginPath(); ctx.moveTo(a.x + nxu*halfGauge, a.y + nyu*halfGauge); ctx.lineTo(b.x + nxu*halfGauge, b.y + nyu*halfGauge); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x - nxu*halfGauge, a.y - nyu*halfGauge); ctx.lineTo(b.x - nxu*halfGauge, b.y - nyu*halfGauge); ctx.stroke();

    ctx.strokeStyle = `rgba(240,248,255,${railAlpha * 0.9})`;
    ctx.lineWidth = Math.max(1, 0.026 * pxu);
    ctx.beginPath(); ctx.moveTo(a.x + nxu*halfGauge, a.y + nyu*halfGauge); ctx.lineTo(b.x + nxu*halfGauge, b.y + nyu*halfGauge); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x - nxu*halfGauge, a.y - nyu*halfGauge); ctx.lineTo(b.x - nxu*halfGauge, b.y - nyu*halfGauge); ctx.stroke();
  }
}

function rrect(x, y, w, h, r){
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

/* 可爱红蓝配色卡通蒸汽小火车头（带金铃铛、白蓬蓬蒸汽云、闪亮大车灯） */
function drawCab(theme, tsec){
  const cx = VW / 2, baseY = VH;
  const moving = S.anim && S.anim.phase === 'move';
  const chug = moving ? Math.sin(tsec * 18 * speedMult()) * 2.4 : Math.sin(tsec * 3) * 0.8;
  const cabH = VH * 0.145;
  const cabW = Math.min(VW * 0.34, VH * 0.56);

  ctx.save();
  ctx.translate(0, chug);

  // 1. 蓬松白胖的蒸汽云团（从烟囱欢快飘出）
  const chimneyTop = baseY - cabH * 1.48;
  for (let i = 0; i < 6; i++){
    const ph = (tsec * (0.48 * speedMult()) + i / 6) % 1;
    const pr = VH * (0.011 + ph * 0.042);
    const px = cx + Math.sin(ph * 5.2 + i * 1.7) * VH * 0.036 * ph;
    const py = chimneyTop - ph * VH * 0.18;
    const a = (1 - ph) * 0.62;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.arc(px - pr * 0.45, py + pr * 0.18, pr * 0.65, 0, Math.PI * 2);
    ctx.arc(px + pr * 0.48, py + pr * 0.15, pr * 0.62, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. 蓝金小烟囱（圆润漏斗顶）
  ctx.fillStyle = '#2b59c3';
  rrect(cx - cabW * 0.12, baseY - cabH * 1.42, cabW * 0.24, cabH * 0.46, 8);
  ctx.fill();
  ctx.fillStyle = '#ffd43b';
  rrect(cx - cabW * 0.16, baseY - cabH * 1.50, cabW * 0.32, cabH * 0.14, 7);
  ctx.fill();
  ctx.strokeStyle = '#1c3b85';
  ctx.lineWidth = 2;
  rrect(cx - cabW * 0.12, baseY - cabH * 1.42, cabW * 0.24, cabH * 0.46, 8);
  ctx.stroke();

  // 3. 亮红色圆润蒸汽锅炉车鼻 + 黄色金属箍
  const g = ctx.createLinearGradient(cx - cabW * 0.45, baseY - cabH, cx + cabW * 0.45, baseY);
  g.addColorStop(0, '#ff6b57');
  g.addColorStop(0.5, '#e6392e');
  g.addColorStop(1, '#c92a2a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx - cabW * 0.52, baseY + 8);
  ctx.lineTo(cx - cabW * 0.44, baseY - cabH * 0.78);
  ctx.quadraticCurveTo(cx, baseY - cabH * 1.18, cx + cabW * 0.44, baseY - cabH * 0.78);
  ctx.lineTo(cx + cabW * 0.52, baseY + 8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#9e1c1c';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 锅炉顶部明亮高光弧线
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = Math.max(3, cabW * 0.025);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - cabW * 0.26, baseY - cabH * 0.80);
  ctx.quadraticCurveTo(cx, baseY - cabH * 0.96, cx + cabW * 0.26, baseY - cabH * 0.80);
  ctx.stroke();

  // 金色装饰腰带
  ctx.strokeStyle = '#ffd43b';
  ctx.lineWidth = Math.max(4, cabH * 0.08);
  ctx.beginPath();
  ctx.moveTo(cx - cabW * 0.45, baseY - cabH * 0.48);
  ctx.quadraticCurveTo(cx, baseY - cabH * 0.64, cx + cabW * 0.45, baseY - cabH * 0.48);
  ctx.stroke();

  // 4. 左右圆滚滚大车灯（带金边和暖光）
  const lampY = baseY - cabH * 0.54;
  for (const sgn of [-1, 1]){
    const lx = cx + sgn * cabW * 0.27;
    const lg = ctx.createRadialGradient(lx, lampY, 0, lx, lampY, VH * 0.065);
    lg.addColorStop(0, 'rgba(255,250,210,.95)');
    lg.addColorStop(0.4, 'rgba(255,232,140,.35)');
    lg.addColorStop(1, 'rgba(255,232,140,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(lx, lampY, VH * 0.065, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd43b';
    ctx.beginPath(); ctx.arc(lx, lampY, VH * 0.020, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath(); ctx.arc(lx, lampY, VH * 0.014, 0, Math.PI * 2); ctx.fill();
  }

  // 5. 车头正中金色小铜铃
  const bellY = baseY - cabH * 0.88;
  ctx.fillStyle = '#ffd43b';
  ctx.beginPath();
  ctx.arc(cx, bellY, Math.max(5, cabW * 0.052), Math.PI, Math.PI * 2);
  ctx.lineTo(cx + cabW * 0.065, bellY + cabH * 0.09);
  ctx.lineTo(cx - cabW * 0.065, bellY + cabH * 0.09);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c48a00';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.restore();
}

function drawFog(theme){
  const horizon = VH * HORIZON_RATIO;
  const g = ctx.createLinearGradient(0, horizon - VH * 0.05, 0, horizon + VH * 0.16);
  g.addColorStop(0, hexA(theme.fog, 0));
  g.addColorStop(0.5, hexA(theme.fog, theme.isNight ? 0.28 : 0.22));
  g.addColorStop(1, hexA(theme.fog, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon - VH * 0.05, VW, VH * 0.22);
}

function drawVignette(){
  // 去掉压抑黑边，仅保留极轻柔和聚焦
  const g = ctx.createRadialGradient(VW/2, VH*0.5, VH*0.35, VW/2, VH*0.5, VH*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(20,40,80,.14)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

function drawChests(rel){
  const list = S.maze && S.maze.chests;
  if (!list || !list.length) return;
  const items = [];
  for (const c of list){
    const z = camZof(c.x + 0.5, c.y + 0.5, rel);
    if (z <= 0.10 || z > VIEW_DEPTH) continue;
    items.push({ c, z });
  }
  items.sort((A, B) => B.z - A.z);
  for (const it of items){
    const p = project(it.c.x + 0.5, it.c.y + 0.5, rel);
    if (!p) continue;
    const a = Math.max(0, Math.min(1, (1 - it.z / VIEW_DEPTH) * 1.35)) * Math.max(0, Math.min(1, it.z / 0.35));
    if (a < 0.04) continue;
    if (it.c.opened) drawChestOpen(p, a);
    else drawChestClosed(p, it.z, a);
  }
}

/* 圆润闪亮的童话海盗宝箱 */
function drawChestClosed(p, z, a){
  const h = 0.48 * p.s, w = h * 1.34, x = p.x, y = p.y;
  const t = S.totalTime, pulse = 0.75 + 0.25 * Math.sin(t * 3.0);
  const beamH = h * 3.8;
  const g = ctx.createLinearGradient(x, y, x, y - beamH);
  g.addColorStop(0, `rgba(255,224,102,${0.40 * a * pulse})`);
  g.addColorStop(1, 'rgba(255,224,102,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w*0.52, y); ctx.lineTo(x - w*0.16, y - beamH);
  ctx.lineTo(x + w*0.16, y - beamH); ctx.lineTo(x + w*0.52, y);
  ctx.closePath(); ctx.fill();

  const bx = x - w / 2, byTop = y - h, lidH = h * 0.44, bodyH = h - lidH;
  ctx.globalAlpha = a;
  // 地面投影
  ctx.fillStyle = 'rgba(40,30,10,.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, w * 0.56, Math.max(2, h * 0.14), 0, 0, Math.PI * 2); ctx.fill();

  // 圆角木箱体
  ctx.fillStyle = '#c47422';
  rrect(bx, y - bodyH, w, bodyH, Math.max(3, h * 0.12)); ctx.fill();
  // 弧顶盖子
  ctx.fillStyle = '#e08e32';
  ctx.beginPath();
  ctx.moveTo(bx, y - bodyH); ctx.lineTo(bx, y - bodyH - lidH * 0.45);
  ctx.quadraticCurveTo(x, byTop - lidH * 0.46, bx + w, y - bodyH - lidH * 0.45);
  ctx.lineTo(bx + w, y - bodyH); ctx.closePath(); ctx.fill();

  // 闪亮黄金包边与大锁扣
  ctx.fillStyle = '#ffd43b';
  ctx.fillRect(bx + w * 0.16, y - h * 0.96, w * 0.12, h * 0.96);
  ctx.fillRect(bx + w * 0.72, y - h * 0.96, w * 0.12, h * 0.96);
  ctx.fillRect(bx, y - bodyH - h * 0.06, w, h * 0.08);
  ctx.fillStyle = '#fff3bf';
  ctx.beginPath(); ctx.arc(x, y - bodyH + h * 0.04, Math.max(2, h * 0.11), 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#7c4308'; ctx.lineWidth = Math.max(1.4, h * 0.048);
  rrect(bx, y - bodyH, w, bodyH, Math.max(3, h * 0.12)); ctx.stroke();

  if (z < 3.8){
    const fy = y - h - h * 0.45 - Math.sin(t * 3.5) * h * 0.16;
    ctx.globalAlpha = a * (0.75 + 0.25 * Math.sin(t * 3.5));
    ctx.fillStyle = '#fff3bf';
    ctx.font = `800 ${Math.max(11, h * 0.56)}px system-ui,-apple-system,sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('★', x, fy); ctx.textAlign = 'left';
  }
  ctx.globalAlpha = 1;
}

function drawChestOpen(p, a){
  const h = 0.46 * p.s, w = h * 1.32, x = p.x, y = p.y;
  const bx = x - w / 2, lidH = h * 0.42, bodyH = h - lidH;
  ctx.globalAlpha = a * 0.76;
  ctx.fillStyle = '#8a5520';
  rrect(bx, y - bodyH, w, bodyH, Math.max(3, h * 0.1)); ctx.fill();
  ctx.fillStyle = 'rgba(40,22,8,.78)';
  ctx.fillRect(bx + w * 0.10, y - bodyH, w * 0.80, bodyH * 0.52);
  ctx.fillStyle = '#a86928';
  ctx.beginPath();
  ctx.moveTo(bx, y - bodyH); ctx.lineTo(bx - w * 0.06, y - h - lidH * 0.85);
  ctx.lineTo(bx + w * 0.94, y - h - lidH * 0.75); ctx.lineTo(bx + w, y - bodyH);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5c340b'; ctx.lineWidth = Math.max(1.2, h * 0.045);
  rrect(bx, y - bodyH, w, bodyH, Math.max(3, h * 0.1)); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawEventFx(){
  const fx = S.eventFx;
  if (!fx) return;
  const k = Math.min(1, fx.t / fx.dur);
  const fade = k < 0.15 ? k / 0.15 : (k > 0.78 ? (1 - k) / 0.22 : 1);
  const t = fx.t;
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, fade));
  ctx.globalCompositeOperation = 'lighter';
  switch (fx.kind){
    case 'rainbow':   evRainbow(k); break;
    case 'fireworks': evFireworks(t); break;
    case 'aurora':    evAurora(t); break;
    case 'koi':       evKoi(k); break;
    case 'snowman':   evSnowman(t); break;
    case 'ghost':     evGhost(k, t); break;
    case 'star':      evStar(k, t); break;
    case 'mailbox':   evMailbox(k, t); break;
    case 'dog':       evDog(k, t); break;
    default:          evSparkle(t); break;
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.restore();
}

function evRainbow(k){
  const cx = VW * 0.5, cy = VH * (HORIZON_RATIO + 0.10);
  const R = VW * 0.44 * Math.min(1, k / 0.45), band = VW * 0.026;
  ['#e05a4a','#e8a832','#5cd0a0','#5c9ce0','#b57ce0'].forEach((col, i) => {
    const rr = R - i * band;
    if (rr <= 0.5) return;
    ctx.beginPath(); ctx.strokeStyle = col; ctx.globalAlpha = 0.30 * (1 - i * 0.06);
    ctx.lineWidth = band; ctx.arc(cx, cy, rr, Math.PI, Math.PI * 2); ctx.stroke();
  });
}
function evFireworks(t){
  for (let b = 0; b < 3; b++){
    const bt = t - b * 0.52; if (bt < 0 || bt > 0.85) continue;
    const bk = bt / 0.85;
    const cx = VW * (0.28 + b * 0.22) + Math.sin(b * 4.1) * VW * 0.05;
    const cy = VH * (0.20 + 0.06 * Math.cos(b * 2.7));
    const R = VW * 0.17 * Math.pow(bk, 0.55);
    ctx.strokeStyle = ['#ffd15c','#5cd0a0','#e05a4a'][b % 3];
    ctx.globalAlpha = (1 - bk) * 0.85;
    ctx.lineWidth = Math.max(1.2, VW * 0.005);
    for (let s = 0; s < 12; s++){
      const a = (s / 12) * Math.PI * 2 + b * 0.3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 0.35, cy + Math.sin(a) * R * 0.35);
      ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
    }
  }
}
function evAurora(t){
  const colors = ['#5cf2a0','#7fe3c0','#5c9ce0','#b57ce0'];
  for (let i = 0; i < 4; i++){
    const y0 = VH * (0.10 + i * 0.075), amp = VH * (0.055 + i * 0.012);
    const g = ctx.createLinearGradient(0, y0 - amp, 0, y0 + amp * 1.6);
    g.addColorStop(0, colors[i]); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.30 + 0.12 * Math.sin(t * 2 + i);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-VW * 0.05, y0);
    for (let x = -VW * 0.05; x <= VW * 1.05; x += VW * 0.05)
      ctx.lineTo(x, y0 + Math.sin(x / VW * 6.2 + t * 1.9 + i * 1.3) * amp);
    for (let x = VW * 1.05; x >= -VW * 0.05; x -= VW * 0.05)
      ctx.lineTo(x, y0 + amp * 1.5 + Math.sin(x / VW * 6.2 + t * 1.9 + i * 1.3) * amp * 0.5);
    ctx.closePath(); ctx.fill();
  }
}
function evKoi(k){
  const cx = VW * 0.5, cy = VH * 0.60, prog = Math.min(1, k / 0.6);
  const jx = -VW * 0.22 + prog * VW * 0.44, jy = -Math.sin(prog * Math.PI) * VH * 0.22;
  ctx.strokeStyle = '#a8dcff'; ctx.globalAlpha = 0.45 * (1 - k); ctx.lineWidth = Math.max(1.2, VW * 0.004);
  for (let i = 0; i < 3; i++){
    const rr = VW * (0.06 + i * 0.055) * (0.6 + k * 0.9);
    ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 0.85; ctx.fillStyle = '#f08040';
  ctx.save(); ctx.translate(cx + jx, cy + jy); ctx.rotate(-prog * 1.5 + 0.6);
  ctx.beginPath(); ctx.ellipse(0, 0, VW * 0.055, VW * 0.024, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(VW * 0.045, 0); ctx.lineTo(VW * 0.085, -VW * 0.022); ctx.lineTo(VW * 0.085, VW * 0.022); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function evSnowman(t){
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 36; i++){
    const seed = i * 37.13;
    const sx = ((seed * 7.3 + t * (18 + (i % 5) * 11)) % (VW * 1.1)) - VW * 0.05;
    const sy = ((seed * 11.7 + t * (34 + (i % 7) * 15)) % (VH * 0.95));
    ctx.globalAlpha = 0.28 + (i % 4) * 0.13;
    ctx.beginPath(); ctx.arc(sx, sy, 1 + (i % 3) * 0.9, 0, Math.PI * 2); ctx.fill();
  }
  const cx = VW * 0.72, cy = VH * 0.62, u = VW * 0.055;
  ctx.globalAlpha = 0.85; ctx.fillStyle = '#f6fbff';
  ctx.beginPath(); ctx.ellipse(cx, cy + u * 0.95, u * 0.78, u * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy + u * 0.05, u * 0.52, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a3548';
  ctx.fillRect(cx - u * 0.42, cy - u * 0.62, u * 0.84, u * 0.24);
  ctx.fillRect(cx - u * 0.50, cy - u * 0.40, u * 1.00, u * 0.11);
  ctx.fillStyle = '#e8792c';
  ctx.beginPath(); ctx.moveTo(cx, cy + u * 0.02); ctx.lineTo(cx + u * 0.34, cy + u * 0.11); ctx.lineTo(cx, cy + u * 0.20); ctx.closePath(); ctx.fill();
}
function evGhost(k, t){
  const cx = VW * 0.5 + Math.sin(t * 1.3) * VW * 0.06, cy = VH * 0.48 - t * VH * 0.055, u = VW * 0.075;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.55 * (1 - k * 0.4); ctx.fillStyle = '#dff0ff';
  ctx.beginPath();
  ctx.moveTo(cx - u * 0.5, cy + u * 0.85); ctx.lineTo(cx - u * 0.5, cy);
  ctx.quadraticCurveTo(cx, cy - u * 0.95, cx + u * 0.5, cy);
  ctx.lineTo(cx + u * 0.5, cy + u * 0.85); ctx.lineTo(cx, cy + u * 0.70); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.75; ctx.fillStyle = '#2a3548';
  ctx.beginPath(); ctx.ellipse(cx - u * 0.17, cy + u * 0.05, u * 0.075, u * 0.10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + u * 0.17, cy + u * 0.05, u * 0.075, u * 0.10, 0, 0, Math.PI * 2); ctx.fill();
}
function evStar(k, t){
  const prog = Math.min(1, k / 0.55);
  const sx = -VW * 0.10 + prog * VW * 0.62, sy = VH * 0.08 + prog * VH * 0.16;
  const g = ctx.createLinearGradient(sx - VW * 0.22, sy - VH * 0.09, sx, sy);
  g.addColorStop(0, 'rgba(255,209,92,0)'); g.addColorStop(1, 'rgba(255,246,216,.95)');
  ctx.strokeStyle = g; ctx.lineWidth = VW * 0.008;
  ctx.beginPath(); ctx.moveTo(sx - VW * 0.22, sy - VH * 0.09); ctx.lineTo(sx, sy); ctx.stroke();
  ctx.globalAlpha = 0.95; ctx.fillStyle = '#fff8d0';
  ctx.beginPath(); ctx.arc(sx, sy, VW * (0.012 + 0.006 * Math.sin(t * 9)), 0, Math.PI * 2); ctx.fill();
}
function evMailbox(k, t){
  const prog = Math.min(1, k / 0.7);
  const cx = VW * 0.30 + prog * VW * 0.55, cy = VH * 0.62 - prog * VH * 0.34;
  ctx.globalAlpha = 0.9 * (1 - Math.max(0, (k - 0.75) / 0.25));
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(t * 4) * 0.22 - 0.14);
  const u = VW * 0.045;
  ctx.fillStyle = '#f0f4ff'; ctx.fillRect(-u, -u * 0.68, u * 2, u * 1.36);
  ctx.strokeStyle = '#8fa6d8'; ctx.lineWidth = Math.max(1, VW * 0.0022);
  ctx.strokeRect(-u, -u * 0.68, u * 2, u * 1.36);
  ctx.beginPath(); ctx.moveTo(-u, -u * 0.68); ctx.lineTo(0, u * 0.10); ctx.lineTo(u, -u * 0.68); ctx.stroke();
  ctx.restore();
}
function evDog(k, t){
  const prog = Math.min(1, k / 0.72), u = VW * 0.045;
  const cx = VW * 1.12 - prog * VW * 0.55, cy = VH * 0.66 - Math.abs(Math.sin(t * 13)) * u * 0.22;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.92;
  ctx.fillStyle = '#e8c48a';
  ctx.beginPath(); ctx.ellipse(cx, cy, u * 1.15, u * 0.68, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - u * 1.25, cy - u * 0.42, u * 0.58, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a2a12';
  ctx.beginPath(); ctx.arc(cx - u * 1.44, cy - u * 0.46, u * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - u * 1.72, cy - u * 0.34, u * 0.12, 0, Math.PI * 2); ctx.fill();
}
function evSparkle(t){
  for (let i = 0; i < 28; i++){
    const p = ((t * 0.62 + i * 0.083) % 1);
    ctx.globalAlpha = (1 - p) * 0.75;
    ctx.fillStyle = i % 3 === 0 ? '#ffd15c' : '#fff6d8';
    ctx.beginPath();
    ctx.arc(VW * ((i * 0.137) % 1) + Math.sin(i * 3.7) * VW * 0.03, VH * 0.92 - p * VH * 0.75, VW * 0.005, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ==================================================================
   12. 主循环（平滑匀速巡航）
   ================================================================== */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  S.totalTime += dt;
  if (S.maze) { update(dt); render(); }
  requestAnimationFrame(loop);
}

function easeByMode(f, mode){
  if (mode === 'linear') return f;
  if (mode === 'in')     return Math.pow(f, 1.32);
  if (mode === 'out')    return 1 - Math.pow(1 - f, 1.42);
  return f < 0.5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2) / 2;
}

function update(dt){
  const cam = S.cam, an = S.anim;
  if (an.phase === 'move' || an.phase === 'shunt'){
    an.t += dt;
    const f = Math.min(1, an.t / an.dur);
    const e = an.phase === 'move' ? easeByMode(f, an.easeMode || 'inout') : (f < 0.5 ? 2*f*f : 1 - Math.pow(-2*f+2, 2)/2);

    if (an.from && an.to){
      cam.px = an.from[0] + (an.to[0] - an.from[0]) * e;
      cam.py = an.from[1] + (an.to[1] - an.from[1]) * e;
    }

    if (an.phase === 'move'){
      let da = (an.turnTo ?? cam.ang) - (an.turnFrom ?? cam.ang);
      while (da >  Math.PI) da -= Math.PI*2;
      while (da < -Math.PI) da += Math.PI*2;
      const tf = Math.min(1, f / 0.42);
      const te = tf < 0.5 ? 2*tf*tf : 1 - Math.pow(-2*tf+2, 2)/2;
      cam.ang = (an.turnFrom ?? cam.ang) + da * te;
      cam.roll = Math.sin(f * Math.PI) * (Math.abs(da) > 0.1 ? 0.042 : 0.012);
    } else {
      cam.shake = Math.sin(an.t * 46) * (1 - f) * 4.2;
      cam.roll = Math.sin(an.t * 30) * (1 - f) * 0.018;
    }

    if (S.mapOpen) drawMinimap();

    if (f >= 1){
      an.phase = 'idle';
      cam.roll = 0; cam.shake = 0;
      an.from = null; an.to = null;
      const cb = an.cb; an.cb = null;
      if (cb) cb();
    }
  }

  const distFromStart = Math.abs(S.pos[0] - S.maze.start[0]) + Math.abs(S.pos[1] - S.maze.start[1]);
  const maxD = Math.max(4, S.maze.cw + S.maze.ch);
  const zoneF = Math.min(S.zoneCount - 0.001, (distFromStart / maxD) * S.zoneCount);
  const z0 = Math.floor(zoneF), z1 = Math.min(S.zoneCount, z0 + 1);
  S.currentZoneF = zoneF;
  S.cam.curTheme = lerpTheme(themeAt(z0), themeAt(z1), zoneF - z0);

  updateFx(dt);
  if (S.eventFx){
    S.eventFx.t += dt;
    if (S.eventFx.t > S.eventFx.dur + 0.4) S.eventFx = null;
  }
  if (an.hitCrate && an.t < 0.45){
    cam.shake = Math.max(cam.shake, Math.sin(an.t * 90) * (1 - an.t / 0.45) * 6.5);
  }
}

function render(){
  const theme = S.cam.curTheme;
  const rel = { ang:S.cam.ang, px:S.cam.px, py:S.cam.py };

  ctx.save();
  if (S.cam.shake) ctx.translate((Math.random()-0.5)*S.cam.shake, (Math.random()-0.5)*S.cam.shake);
  ctx.translate(VW/2, VH/2);
  ctx.rotate(S.cam.roll || 0);
  ctx.translate(-VW/2, -VH/2);

  drawGroundStrip(rel, theme);
  drawScenery(rel, theme);
  drawChests(rel);
  drawTrack(rel, theme);
  drawBarriers(rel);
  drawEventFx();
  drawFx(rel);
  drawFog(theme);
  drawCab(theme, S.totalTime);
  drawVignette();
  ctx.restore();

  const dv = document.getElementById('uiArea');
  const nm = '🏞 ' + THEMES[Math.floor(S.currentZoneF || 0) % THEMES.length].name;
  if (dv.textContent !== nm) dv.textContent = nm;

  const panel = document.getElementById('panel');
  panel.style.opacity = (S.anim.phase === 'move') ? '0.68' : '1';
}

/* 触屏防误触绑定：滑动 > 10px 取消触发，兼容触屏与键鼠混合设备 */
document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
let lastTouchEndAt = 0;

function bindTap(el, fn){
  if (!el) return;
  let sx = 0, sy = 0, moved = false, active = false;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (!t) return;
    sx = t.clientX; sy = t.clientY;
    moved = false; active = true;
  }, { passive:true });
  el.addEventListener('touchmove', e => {
    if (!active || moved) return;
    const t = e.touches[0];
    if (!t) return;
    if (Math.hypot(t.clientX - sx, t.clientY - sy) > 10) moved = true;
  }, { passive:true });
  el.addEventListener('touchend', e => {
    if (!active) return;
    active = false;
    lastTouchEndAt = performance.now();
    if (moved) return;
    e.preventDefault();
    fn();
  }, { passive:false });
  el.addEventListener('touchcancel', () => { active = false; moved = false; });
  el.addEventListener('click', () => {
    if (performance.now() - lastTouchEndAt < 450) return;
    fn();
  });
}

/* 键盘操控（完整覆盖弹窗、相对方向、预读输入、加速与地图） */
document.addEventListener('keydown', e => {
  const key = e.key;

  // 1. 重开确认弹窗
  if (S.confirmOpen){
    if (key === 'Enter'){ e.preventDefault(); closeRestartConfirm(); resetCard(); startGame(S.level); }
    else if (key === 'Escape'){ e.preventDefault(); closeRestartConfirm(); }
    return;
  }

  // 2. 彩蛋卡片弹窗
  if (S.cardOpen){
    if (key === ' ' || key === 'Enter' || key === 'Escape'){
      e.preventDefault(); closeEggCard();
    }
    return;
  }

  // 3. 图鉴面板
  if (S.galleryOpen){
    if (key === 'Escape'){ e.preventDefault(); closeGallery(); }
    return;
  }

  // 4. 启动 / 结算遮罩
  const overlayHidden = document.getElementById('overlay').classList.contains('hide');
  if (!overlayHidden){
    if (key === 'Enter' || key === ' '){
      e.preventDefault();
      if (S.finished){ resetCard(); startGame(S.level); }
      else startGame(selectedLevel);
    }
    return;
  }

  // 5. 全局功能键
  if (key === 'm' || key === 'M'){
    e.preventDefault();
    S.mapOpen = !S.mapOpen;
    savePrefs({ mapOpen: S.mapOpen });
    syncMapVisibility();
    return;
  }
  if (key === 'v' || key === 'V'){
    e.preventDefault();
    SFX.toggle();
    refreshHUD();
    return;
  }
  if (key === 'r' || key === 'R'){
    e.preventDefault();
    openRestartConfirm();
    return;
  }
  if (key === ' '){
    e.preventDefault();
    if (!S.boostHold){ S.boostHold = true; refreshHUD(); }
    return;
  }

  // 6. 相对方向按键（岔路口直接选，行驶中支持预读缓冲/预约掉头）
  let rel = null;
  if (key === 'ArrowLeft'  || key === 'a' || key === 'A') rel = 'left';
  else if (key === 'ArrowUp'    || key === 'w' || key === 'W') rel = 'straight';
  else if (key === 'ArrowRight' || key === 'd' || key === 'D') rel = 'right';
  else if (key === 'ArrowDown'  || key === 's' || key === 'S') rel = 'back';

  if (rel){
    e.preventDefault();
    if (S.pending){
      const i = S.choices.findIndex(c => c.rel === rel);
      if (i >= 0) chooseDir(i);
    } else if (S.running && S.anim && S.anim.phase === 'move'){
      S.queuedRel = (rel === 'back' && S.queuedRel === 'back') ? null : rel;
      S.queuedAt = performance.now();
      updateHintText();
      updateDriveTools();
    }
    return;
  }

  // 7. 数字键 1~4
  if (S.pending && /^[1-9]$/.test(key)){
    const idxChoice = parseInt(key, 10) - 1;
    if (idxChoice < S.choices.length){ e.preventDefault(); chooseDir(idxChoice); }
  }
});

document.addEventListener('keyup', e => {
  if (e.key === ' ' && S.boostHold){
    S.boostHold = false;
    refreshHUD();
  }
});

// HUD & 按钮事件绑定
bindTap(document.getElementById('btnRestart'), openRestartConfirm);
bindTap(document.getElementById('btnConfirmCancel'), closeRestartConfirm);
bindTap(document.getElementById('btnConfirmOk'), () => { closeRestartConfirm(); resetCard(); startGame(S.level); });
bindTap(document.getElementById('uiEggChip'), openGallery);
bindTap(document.getElementById('galClose'), closeGallery);
bindTap(document.getElementById('btnMap'), () => {
  S.mapOpen = !S.mapOpen;
  savePrefs({ mapOpen: S.mapOpen });
  syncMapVisibility();
});
bindTap(document.getElementById('btnSound'), () => { SFX.toggle(); refreshHUD(); });
bindTap(document.getElementById('btnBoost'), () => { S.boostToggle = !S.boostToggle; refreshHUD(); });
bindTap(document.getElementById('btnUturn'), () => {
  if (!S.running || S.pending) return;
  S.queuedRel = S.queuedRel === 'back' ? null : 'back';
  S.queuedAt = performance.now();
  updateHintText();
  updateDriveTools();
});

/* ==================================================================
   14. 启动卡片初始化
   ================================================================== */
const START_CARD_HTML = document.getElementById('card').innerHTML;
let selectedLevel = S.level;

function bindStartCard(){
  const row = document.getElementById('lvRow');
  if (!row) return;
  row.innerHTML = '';
  Object.keys(LEVELS).forEach(k => {
    const el = document.createElement('div');
    el.className = 'lv' + (k === selectedLevel ? ' on' : '');
    el.innerHTML = `<span class="n">${k}</span>${LEVELS[k].cw}×${LEVELS[k].ch} 格`;
    bindTap(el, () => {
      selectedLevel = k;
      [...row.children].forEach(c => c.classList.remove('on'));
      el.classList.add('on');
    });
    row.appendChild(el);
  });
  bindTap(document.getElementById('btnStart'), () => startGame(selectedLevel));
}

window.addEventListener('load', () => {
  bindStartCard();
  refreshHUD();
  syncMapVisibility();
  resize();
  lastT = performance.now();
  requestAnimationFrame(loop);
});
})();
</script>
