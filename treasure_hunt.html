/* ==================================================================
   5. 渲染：伪 3D 轨道透视
   ================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FOCAL = (VH * 0.5) / Math.tan(FOV / 2);
}
window.addEventListener('resize', resize);

const HORIZON_RATIO = 0.40;    // 地平线位置
const FOV = 1.35;              // 视野系数（越大越广角）
const VIEW_DEPTH = 7.5;        // 可见格数
const CAM_H = 0.62;            // 相机离地高度（世界格）
let FOCAL = 400;               // 焦距（像素），resize 时更新

/* 世界坐标点在相机坐标系的深度 */
function camZof(wx, wy, rel){
  const dx = wx - rel.px, dy = wy - rel.py;
  return dx * Math.cos(rel.ang) + dy * Math.sin(rel.ang);
}

function project(wx, wy, rel){
  // rel: {ang, px, py}  相机在 (px,py) 朝向 ang（屏幕坐标系，y 向下）
  const dx = wx - rel.px, dy = wy - rel.py;
  const ca = Math.cos(rel.ang), sa = Math.sin(rel.ang);
  const camZ = dx * ca + dy * sa;      // 深度 = 与前向向量点积
  const camX = -dx * sa + dy * ca;     // 水平偏移 = 与右向量点积
  if (camZ <= 0.06) return null;

  const horizon = VH * HORIZON_RATIO;
  const s = FOCAL / camZ;              // 每世界单位对应的像素数
  const sx = VW / 2 + camX * s;
  const sy = horizon + CAM_H * s;      // 地面点：地平线 + (相机高度×焦距)/深度
  return { x:sx, y:sy, z:camZ, s };
}

/* 世界空间线段裁剪后投影（处理近处被相机切掉的一端） */
function projectSeg(p0, p1, rel){
  const ZMIN = 0.10;
  let A = p0, B = p1;
  let z0 = camZof(A[0], A[1], rel), z1 = camZof(B[0], B[1], rel);
  if (z0 < ZMIN && z1 < ZMIN) return null;
  if (z1 < z0){ [A,B] = [B,A]; [z0,z1] = [z1,z0]; }   // 保证 A 近
  if (z0 < ZMIN){
    const t = (ZMIN - z0) / (z1 - z0);
    A = [A[0] + (B[0]-A[0])*t, A[1] + (B[1]-A[1])*t];
  }
  const a = project(A[0], A[1], rel), b = project(B[0], B[1], rel);
  if (!a || !b) return null;
  return { a, b };
}

/* 顶视网格 → 屏幕：把一条线段投影成多边形条带 */
function drawGroundStrip(rel, theme){
  const horizon = VH * HORIZON_RATIO;
  // 天空
  const g = ctx.createLinearGradient(0, 0, 0, horizon + 10);
  g.addColorStop(0, theme.sky[0][0]);
  g.addColorStop(0.55, theme.sky[0][1]);
  g.addColorStop(1, theme.sky[1][0]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, horizon + 12);

  // 太阳 / 月亮光晕
  const sunX = VW * 0.5 - Math.sin(rel.ang) * VW * 0.25;
  const sunY = horizon - VH * 0.20;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, VH * 0.34);
  sg.addColorStop(0, theme.sky[1][1]);
  sg.addColorStop(0.28, hexA(theme.sky[1][1], .55));
  sg.addColorStop(1, hexA(theme.sky[1][1], 0));
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sunX, sunY, VH * 0.34, 0, Math.PI*2); ctx.fill();

  // 地面
  const gg = ctx.createLinearGradient(0, horizon, 0, VH);
  gg.addColorStop(0, hexA(theme.fog, 1));
  gg.addColorStop(0.25, theme.ground);
  gg.addColorStop(1, shade(theme.ground, -0.35));
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizon - 1, VW, VH - horizon + 1);
}

function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g2 = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g2},${b},${a})`;
}
function shade(hex, k){
  let r = parseInt(hex.slice(1,3),16), g2 = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const f = v => Math.max(0, Math.min(255, Math.round(k >= 0 ? v + (255-v)*k : v * (1+k))));
  return `rgb(${f(r)},${f(g2)},${f(b)})`;
}

/* 确定性伪随机（同一世界坐标景物稳定） */
function hash2(x, y, s){
  let h = x * 374761393 + y * 668265263 + s * 1442695041;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

/* 绘制两侧景物 */
function drawScenery(rel, theme){
  const cos = Math.cos(-rel.ang), sin = Math.sin(-rel.ang);
  const nearX = Math.floor(rel.px - 16), farX = Math.floor(rel.px + 16);
  const nearY = Math.floor(rel.py - 16), farY = Math.floor(rel.py + 16);

  const items = [];
  for (let gy = nearY; gy <= farY; gy++){
    for (let gx = nearX; gx <= farX; gx++){
      if (S.maze.open(gx, gy)) continue;    // 墙里没有景物
      // 只在墙体边缘附近生成
      const edge = !S.maze.open(gx-1,gy) || !S.maze.open(gx+1,gy) ||
                   !S.maze.open(gx,gy-1) || !S.maze.open(gx,gy+1);
      if (!edge) continue;
      for (let i = 0; i < 3; i++){
        const rx = gx + hash2(gx, gy, i*7+1);
        const ry = gy + hash2(gx, gy, i*7+2);
        // 避开铁轨中心线
        const dd = Math.min(Math.abs(rx - rel.px), Math.abs(ry - rel.py));
        if (dd < 0.55) continue;
        const p = project(rx, ry, rel);
        if (!p || p.z > VIEW_DEPTH) continue;
        items.push({ p, gx, gy, i,
          size: 0.5 + hash2(gx,gy,i*7+3)*0.75,
          kind: hash2(gx,gy,i*7+4),
          rot: hash2(gx,gy,i*7+5) });
      }
    }
  }
  items.sort((a,b) => b.p.z - a.p.z);   // 远 → 近

  for (const it of items){
    // 树高 0.55~1.3 世界格，透视缩放；近处淡出
    const h = (0.55 + it.size * 0.75) * it.p.s;
    const w = h * 0.62;
    const nearFade = Math.max(0, Math.min(1, it.p.z / 0.65));
    ctx.globalAlpha = 1;
    drawProp(it.p.x, it.p.y, w, h, theme, it, it.p.z, nearFade);
  }
}

function drawProp(cx, baseY, w, h, theme, it, z, extraFade){
  const t = theme.treeType;
  const fadeK = Math.max(0, Math.min(1, 1 - (z - 3) / 5));
  ctx.globalAlpha = (0.35 + 0.65 * fadeK) * (extraFade === undefined ? 1 : extraFade);

  const [c1, c2] = theme.trees[it.i % 2];

  if (t === 'pine' || t === 'maple' || t === 'blossom' || t === 'snow'){
    // 树：三角形树冠 + 树干
    const layers = t === 'pine' ? 3 : 2;
    const top = baseY - h;
    // 树干
    ctx.fillStyle = hexA('#3a2a1a', 0.85);
    ctx.fillRect(cx - w*0.09, baseY - h*0.30, w*0.18, h*0.30);
    if (t === 'blossom'){
      // 樱花：圆形蓬松树冠
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.arc(cx, top + h*0.34, w*0.52, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = hexA(c2, .8);
      ctx.beginPath(); ctx.arc(cx - w*0.18, top + h*0.46, w*0.34, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + w*0.20, top + h*0.42, w*0.30, 0, Math.PI*2); ctx.fill();
    } else {
      for (let L = 0; L < layers; L++){
        const lw = w * (0.95 - L*0.22);
        const ly = baseY - h*0.24 - L * h*0.24;
        const lh = h * 0.42;
        ctx.fillStyle = L === 0 ? c2 : c1;
        ctx.beginPath();
        ctx.moveTo(cx, ly - lh);
        ctx.lineTo(cx - lw*0.5, ly);
        ctx.lineTo(cx + lw*0.5, ly);
        ctx.closePath(); ctx.fill();
        if (t === 'snow' && L === layers-1){
          ctx.fillStyle = 'rgba(255,255,255,.8)';
          ctx.beginPath();
          ctx.moveTo(cx, ly - lh);
          ctx.lineTo(cx - lw*0.22, ly - lh*0.5);
          ctx.lineTo(cx + lw*0.22, ly - lh*0.5);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  } else if (t === 'wheat'){
    // 麦田：细长茎秆
    ctx.strokeStyle = c1; ctx.lineWidth = Math.max(1, w*0.10);
    ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - h*0.9); ctx.stroke();
    ctx.fillStyle = c2;
    ctx.beginPath(); ctx.ellipse(cx, baseY - h*0.92, w*0.20, h*0.16, 0, 0, Math.PI*2); ctx.fill();
  } else if (t === 'rock'){
    ctx.fillStyle = c1;
    ctx.beginPath();
    ctx.moveTo(cx - w*0.5, baseY);
    ctx.lineTo(cx - w*0.22, baseY - h*0.62);
    ctx.lineTo(cx + w*0.10, baseY - h*0.80);
    ctx.lineTo(cx + w*0.45, baseY - h*0.28);
    ctx.lineTo(cx + w*0.52, baseY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hexA(c2, .7);
    ctx.beginPath();
    ctx.moveTo(cx + w*0.10, baseY - h*0.80);
    ctx.lineTo(cx + w*0.45, baseY - h*0.28);
    ctx.lineTo(cx + w*0.52, baseY);
    ctx.lineTo(cx + w*0.12, baseY);
    ctx.closePath(); ctx.fill();
  } else if (t === 'lamp'){
    ctx.strokeStyle = '#5a6a92'; ctx.lineWidth = Math.max(1, w*0.13);
    ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - h*0.85); ctx.stroke();
    const gg = ctx.createRadialGradient(cx, baseY-h*0.9, 0, cx, baseY-h*0.9, w*1.5);
    gg.addColorStop(0, hexA(theme.accent, .95));
    gg.addColorStop(0.35, hexA(theme.accent, .35));
    gg.addColorStop(1, hexA(theme.accent, 0));
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(cx, baseY-h*0.9, w*1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = theme.accent;
    ctx.beginPath(); ctx.arc(cx, baseY-h*0.9, w*0.20, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ==================================================================
   路障渲染 —— 世界空间立体物件
   护栏(guard)：红白斜纹铁马，永久阻挡
   水马/锥桶(crate)：橙白，可撞碎
   ================================================================== */
function drawBarriers(rel, theme){
  if (!S.maze.barriers || !S.maze.barriers.size) return;

  const items = [];
  for (const b of S.maze.barriers.values()){
    // 连接中点，垂直于连接方向摆放
    const mx = (b.ax + b.bx) / 2, my = (b.ay + b.by) / 2;
    const z = camZof(mx, my, rel);
    if (z <= 0.10 || z > VIEW_DEPTH) continue;
    items.push({ b, mx, my, z });
  }
  items.sort((A,B) => B.z - A.z);   // 远 → 近

  for (const it of items){
    const { b, mx, my, z } = it;
    const p = project(mx, my, rel);
    if (!p) continue;

    // 路障横跨方向：垂直于连接轴
    const ax = b.bx - b.ax, ay = b.by - b.ay;
    const plen = Math.hypot(ax, ay) || 1;
    const nx = -ay / plen, ny = ax / plen;      // 世界空间法线方向

    // 两端点投影
    const HALF = 0.42;                          // 半宽 0.42 世界格（略窄于格宽）
    const e0 = project(mx + nx * HALF, my + ny * HALF, rel);
    const e1 = project(mx - nx * HALF, my - ny * HALF, rel);
    if (!e0 || !e1) continue;

    const baseY = (e0.y + e1.y) / 2;
    const wpx = Math.hypot(e0.x - e1.x, e0.y - e1.y);   // 屏幕上宽度
    const hpx = 0.52 * FOCAL / z;                       // 高 0.52 世界格
    const dirFade = Math.max(0, Math.min(1, 1.25 - z / VIEW_DEPTH));
    const nearFade = Math.max(0, Math.min(1, z / 0.5));
    const alpha = dirFade * nearFade;
    if (alpha < 0.04) continue;

    if (b.type === 'guard') drawGuard(e0, e1, baseY, wpx, hpx, alpha);
    else drawCrate(e0, e1, baseY, wpx, hpx, alpha, z);
  }
}

/* 施工护栏：红白斜纹 + 支腿 */
function drawGuard(e0, e1, baseY, w, h, alpha){
  ctx.save();
  // 板面（用一个仿射变换把矩形贴合到 e0→e1）
  const ang = Math.atan2(e1.y - e0.y, e1.x - e0.x);
  ctx.translate(e0.x, e0.y);
  ctx.rotate(ang);

  const bh = h * 0.62;
  const by = -bh;

  // 支腿
  ctx.globalAlpha = alpha * 0.85;
  ctx.strokeStyle = '#3a3f4a';
  ctx.lineWidth = Math.max(1.2, h * 0.06);
  ctx.beginPath();
  ctx.moveTo(w * 0.06, 0); ctx.lineTo(w * 0.12, by + bh * 0.9);
  ctx.moveTo(w * 0.94, 0); ctx.lineTo(w * 0.88, by + bh * 0.9);
  ctx.stroke();

  // 板面底色
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#e8e8ea';
  ctx.fillRect(0, by, w, bh);

  // 红白斜纹
  const stripes = 5;
  const sw = w / stripes;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, by, w, bh); ctx.clip();
  ctx.fillStyle = '#d94a3d';
  for (let i = 0; i < stripes; i += 2){
    ctx.beginPath();
    ctx.moveTo(i * sw, by + bh);
    ctx.lineTo(i * sw + sw * 0.55, by);
    ctx.lineTo((i+1) * sw + sw * 0.55, by);
    ctx.lineTo((i+1) * sw, by + bh);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 上下描边
  ctx.globalAlpha = alpha * 0.75;
  ctx.strokeStyle = '#2e333c';
  ctx.lineWidth = Math.max(1, h * 0.035);
  ctx.strokeRect(0, by, w, bh);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 水马/锥桶：橙色，顶部有反光条 */
function drawCrate(e0, e1, baseY, w, h, alpha, z){
  ctx.save();
  const ang = Math.atan2(e1.y - e0.y, e1.x - e0.x);
  ctx.translate(e0.x, e0.y);
  ctx.rotate(ang);
  ctx.globalAlpha = alpha;

  const bw = w * 0.72;
  const bh = h * 0.55;
  const bx = (w - bw) / 2;
  const by = -bh;

  // 主体（梯形，上窄下宽）
  ctx.fillStyle = '#e8792c';
  ctx.beginPath();
  ctx.moveTo(bx + bw * 0.10, by);
  ctx.lineTo(bx + bw * 0.90, by);
  ctx.lineTo(bx + bw, 0);
  ctx.lineTo(bx, 0);
  ctx.closePath(); ctx.fill();

  // 反光条（白色）
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fillRect(bx + bw * 0.14, by + bh * 0.30, bw * 0.72, bh * 0.20);

  // 顶部提手
  ctx.fillStyle = '#c05f1a';
  ctx.fillRect(bx + bw * 0.38, by - bh * 0.16, bw * 0.24, bh * 0.18);

  // 描边
  ctx.strokeStyle = 'rgba(120,50,10,.75)';
  ctx.lineWidth = Math.max(1, h * 0.032);
  ctx.beginPath();
  ctx.moveTo(bx + bw * 0.10, by);
  ctx.lineTo(bx + bw * 0.90, by);
  ctx.lineTo(bx + bw, 0);
  ctx.lineTo(bx, 0);
  ctx.closePath(); ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 撞碎特效：粒子 + 冲击环 */
function spawnCrashFx(wx, wy){
  S.fx.push({ wx, wy, t:0, dur:0.75, kind:'ring' });
  for (let i = 0; i < 18; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 0.35 + Math.random() * 0.9;
    S.fx.push({
      wx, wy, t:0, dur: 0.5 + Math.random() * 0.45,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      vz: 0.9 + Math.random() * 1.5,
      kind:'bit',
      col: Math.random() < 0.5 ? '#e8792c' : '#fff2d8',
      size: 0.030 + Math.random() * 0.045
    });
  }
}

function updateFx(dt){
  if (!S.fx || !S.fx.length) return;
  const alive = [];
  for (const f of S.fx){
    f.t += dt;
    if (f.t >= f.dur) continue;
    if (f.kind === 'bit'){
      f.wx += (f.vx || 0) * dt;
      f.wy += (f.vy || 0) * dt;
      f.vz = (f.vz || 0) - 5.2 * dt;              // 重力
      f.offZ = (f.offZ || 0) + (f.vz || 0) * dt;
      if (f.offZ < 0){ f.offZ = 0; f.vz = -(f.vz || 0) * 0.32; }
    }
    alive.push(f);
  }
  S.fx = alive;
}

function drawFx(rel){
  if (!S.fx || !S.fx.length) return;
  for (const f of S.fx){
    const p = project(f.wx, f.wy, rel);
    if (!p) continue;
    const k = f.t / f.dur;
    const yOff = (f.offZ || 0) * p.s;

    if (f.kind === 'ring'){
      const r = (0.15 + k * 1.1) * p.s;
      ctx.strokeStyle = `rgba(255,220,150,${(1 - k) * 0.85})`;
      ctx.lineWidth = Math.max(1, (0.09 * (1 - k)) * p.s);
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.42, 0, 0, Math.PI*2); ctx.stroke();
    } else {
      const r = Math.max(0.8, (f.size || 0.04) * p.s);
      ctx.fillStyle = f.col;
      ctx.globalAlpha = Math.max(0, 1 - k * k);
      ctx.beginPath(); ctx.arc(p.x, p.y - yOff, r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

/* 铁轨 + 枕木（世界单位：轨距 0.32，枕木长 0.44，每格 4 根） */
function drawTrack(rel, theme){
  const nearX = Math.floor(rel.px - VIEW_DEPTH), farX = Math.ceil(rel.px + VIEW_DEPTH);
  const nearY = Math.floor(rel.py - VIEW_DEPTH), farY = Math.ceil(rel.py + VIEW_DEPTH);

  // 收集所有相邻通路格对（中心到中心的长段），远 → 近排序
  const segs = [];
  const seen = new Set();
  for (let gy = nearY; gy <= farY; gy++){
    for (let gx = nearX; gx <= farX; gx++){
      if (!S.maze.open(gx, gy)) continue;
      for (const [ox, oy] of [[1,0],[0,1]]){
        const nx2 = gx + ox, ny2 = gy + oy;
        if (!S.maze.open(nx2, ny2)) continue;
        const key = Math.min(gx,nx2)+','+Math.min(gy,ny2)+','+(ox?'h':'v');
        if (seen.has(key)) continue;
        seen.add(key);
        const z = camZof(gx + 0.5, gy + 0.5, rel);
        segs.push({ p0:[gx+0.5, gy+0.5], p1:[nx2+0.5, ny2+0.5], z: Math.max(0, z) });
      }
    }
  }
  segs.sort((A,B) => B.z - A.z);   // 远的先画

  for (const sg of segs){
    const pr = projectSeg(sg.p0, sg.p1, rel);
    if (!pr) continue;
    const { a, b } = pr;
    const dist = Math.max(0.10, Math.min(a.z, b.z));
    const pxu = FOCAL / dist;                 // 该段每世界单位的像素数

    // 方向衰减：与视线垂直（横向穿过）的轨道淡化为背景
    const sdx = sg.p1[0]-sg.p0[0], sdy = sg.p1[1]-sg.p0[1];
    const sl = Math.hypot(sdx, sdy) || 1;
    const dot = Math.abs((sdx*Math.cos(rel.ang) + sdy*Math.sin(rel.ang)) / sl);   // 0=横向 1=纵向
    const dirFade = 0.18 + 0.82 * dot * dot;

    // 近处淡出，避免脚下生硬大色块
    const nearFade = Math.max(0, Math.min(1, dist / 0.55));
    const dim = dirFade * nearFade;

    // 屏幕上的段方向法线
    const dxs = b.x - a.x, dys = b.y - a.y;
    const dl = Math.hypot(dxs, dys) || 1;
    const nxu = -dys/dl, nyu = dxs/dl;        // 单位法线（屏幕空间）

    // 路基（碎石）：宽 0.46 世界格
    ctx.strokeStyle = hexA('#6f6459', Math.min(.95, 1.6/(dist+0.55)) * dim);
    ctx.lineWidth = Math.max(1.2, 0.46 * pxu);
    ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    // 两条钢轨：间距 ±0.16 世界格
    const halfGauge = 0.16 * pxu;
    ctx.strokeStyle = hexA(theme.accent, Math.min(.95, 1.5/(dist+0.45)) * dim);
    ctx.lineWidth = Math.max(1, 0.055 * pxu);
    ctx.beginPath(); ctx.moveTo(a.x + nxu*halfGauge, a.y + nyu*halfGauge); ctx.lineTo(b.x + nxu*halfGauge, b.y + nyu*halfGauge); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(a.x - nxu*halfGauge, a.y - nyu*halfGauge); ctx.lineTo(b.x - nxu*halfGauge, b.y - nyu*halfGauge); ctx.stroke();

    // 枕木：沿段每 0.25 世界格一根，长 0.44
    const segLen = 1.0;
    const step = 0.25;
    for (let d = 0; d <= segLen; d += step){
      const wx = sg.p0[0] + (sg.p1[0]-sg.p0[0]) * d;
      const wy = sg.p0[1] + (sg.p1[1]-sg.p0[1]) * d;
      const z = camZof(wx, wy, rel);
      if (z < 0.12) continue;
      const p = project(wx, wy, rel);
      if (!p || p.z > VIEW_DEPTH) continue;
      const pw = 0.44 * FOCAL / p.z;
      const tieAlpha = Math.min(.9, 1.5/(p.z+0.45)) * dim;
      if (tieAlpha < 0.03) continue;
      ctx.strokeStyle = hexA('#4d3a27', tieAlpha);
      ctx.lineWidth = Math.max(1, 0.075 * FOCAL / p.z);
      ctx.beginPath();
      ctx.moveTo(p.x - nxu*pw/2, p.y - nyu*pw/2);
      ctx.lineTo(p.x + nxu*pw/2, p.y + nyu*pw/2);
      ctx.stroke();
    }
  }
}

/* 兼容旧浏览器的圆角矩形 */
function rrect(x, y, w, h, r){
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* 车头（第一人称视角：车鼻 + 烟囱） */
function drawCab(theme, tsec){
  const cx = VW/2;
  const baseY = VH;
  const cabH = VH * 0.13;
  const cabW = VW * 0.26;

  // 车鼻
  const g = ctx.createLinearGradient(0, baseY - cabH, 0, baseY);
  g.addColorStop(0, '#3b4a66');
  g.addColorStop(1, '#1c2436');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx - cabW*0.5, baseY);
  ctx.lineTo(cx - cabW*0.42, baseY - cabH*0.78);
  ctx.quadraticCurveTo(cx, baseY - cabH*1.08, cx + cabW*0.42, baseY - cabH*0.78);
  ctx.lineTo(cx + cabW*0.5, baseY);
  ctx.closePath(); ctx.fill();

  // 前灯
  const lampY = baseY - cabH*0.52;
  for (const sgn of [-1, 1]){
    const lx = cx + sgn * cabW * 0.27;
    const lg = ctx.createRadialGradient(lx, lampY, 0, lx, lampY, VH*0.07);
    lg.addColorStop(0, 'rgba(255,245,200,.95)');
    lg.addColorStop(0.35, 'rgba(255,230,150,.35)');
    lg.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(lx, lampY, VH*0.07, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(lx, lampY, VH*0.014, 0, Math.PI*2); ctx.fill();
  }

  // 顶盖 + 动态烟雾
  const chimneyY = baseY - cabH*1.02;
  ctx.fillStyle = '#2a3346';
  rrect(cx - cabW*0.16, chimneyY - cabH*0.42, cabW*0.32, cabH*0.44, 6);
  ctx.fill();

  const puffN = 6;
  for (let i = 0; i < puffN; i++){
    const ph = (tsec * 0.42 + i / puffN) % 1;
    const pr = VH * (0.007 + ph * 0.038);
    const px = cx + Math.sin(ph * 5 + i * 1.7) * VH * 0.030 * ph;
    const py = chimneyY - cabH*0.46 - ph * VH * 0.16;
    ctx.fillStyle = `rgba(210,220,235,${(1 - ph) * 0.32})`;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill();
  }
}

/* 速度线 / 风声 */
function drawSpeedLines(rel, dt){
  const sp = S.anim.phase === 'move' ? 1 : 0;
  if (sp <= 0) return;
  ctx.strokeStyle = 'rgba(255,255,255,.16)';
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 14; i++){
    const p = (rel._sl = (rel._sl || 0));
    const a = (i / 14) * Math.PI * 2 + rel.ang;
    const r0 = VH * (0.42 + ((i*37 % 100)/100) * 0.16);
    const r1 = r0 + VH * 0.10;
    const cx = VW/2, cy = VH * 0.60;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0*0.7);
    ctx.lineTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1*0.7);
    ctx.stroke();
  }
}

/* 迷雾 / 距离雾 */
function drawFog(theme){
  const horizon = VH * HORIZON_RATIO;
  const g = ctx.createLinearGradient(0, horizon - VH*0.08, 0, horizon + VH*0.30);
  g.addColorStop(0, hexA(theme.fog, 0));
  g.addColorStop(0.45, hexA(theme.fog, 0.42));
  g.addColorStop(1, hexA(theme.fog, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon - VH*0.08, VW, VH*0.38);
}

/* 暗角 */
function drawVignette(){
  const g = ctx.createRadialGradient(VW/2, VH*0.52, VH*0.25, VW/2, VH*0.52, VH*0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}

/* ==================================================================
   5b. 宝箱渲染（荒野里的可见宝箱）
   ------------------------------------------------------------------
   宝箱放在格子中心，金色箱体 + 呼吸光柱，远处也能一眼看到。
   已开启的宝箱变成"开盖空箱"，保留在场景里作为走过的痕迹。
   ================================================================== */
const CHEST_ART_SET = new Set((EGGS.filter(e => e.from === 'box') || []).map(e => e.id));

function drawChests(rel, theme){
  const list = S.maze && S.maze.chests;
  if (!list || !list.length) return;

  const items = [];
  for (const c of list){
    const z = camZof(c.x + 0.5, c.y + 0.5, rel);
    if (z <= 0.10 || z > VIEW_DEPTH) continue;
    items.push({ c, z });
  }
  items.sort((A, B) => B.z - A.z);      // 远 → 近

  for (const it of items){
    const { c, z } = it;
    const p = project(c.x + 0.5, c.y + 0.5, rel);
    if (!p) continue;

    const a = Math.max(0, Math.min(1, (1 - z / VIEW_DEPTH) * 1.35)) *
              Math.max(0, Math.min(1, z / 0.35));
    if (a < 0.04) continue;

    if (c.opened) drawChestOpen(p, z, a);
    else          drawChestClosed(p, z, a);
  }
}

/* 未开启：金色箱体 + 脉动光柱 + 漂浮高光 */
function drawChestClosed(p, z, a){
  const h = 0.44 * p.s;                 // 箱高 0.44 世界格
  const w = h * 1.30;
  const x = p.x, y = p.y;
  const t = S.totalTime;
  const pulse = 0.72 + 0.28 * Math.sin(t * 2.6);

  // 光柱
  const beamH = h * 4.2;
  const g = ctx.createLinearGradient(x, y, x, y - beamH);
  g.addColorStop(0, `rgba(255,214,110,${0.34 * a * pulse})`);
  g.addColorStop(1, 'rgba(255,214,110,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.52, y);
  ctx.lineTo(x - w * 0.16, y - beamH);
  ctx.lineTo(x + w * 0.16, y - beamH);
  ctx.lineTo(x + w * 0.52, y);
  ctx.closePath(); ctx.fill();

  // 地面光晕
  ctx.globalAlpha = a * 0.5 * pulse;
  const gg = ctx.createRadialGradient(x, y, 0, x, y, w * 1.15);
  gg.addColorStop(0, 'rgba(255,214,110,.75)');
  gg.addColorStop(1, 'rgba(255,214,110,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.ellipse(x, y, w * 1.15, w * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const bx = x - w / 2;
  const byTop = y - h;
  const lidH = h * 0.40;
  const bodyH = h - lidH;

  // 箱体
  ctx.globalAlpha = a;
  ctx.fillStyle = '#b8761f';
  ctx.fillRect(bx, y - bodyH, w, bodyH);
  // 箱体暗面
  ctx.fillStyle = 'rgba(90,44,6,.30)';
  ctx.fillRect(bx, y - bodyH * 0.42, w, bodyH * 0.42);

  // 箱盖（弧顶）
  ctx.fillStyle = '#d99a34';
  ctx.beginPath();
  ctx.moveTo(bx, y - bodyH);
  ctx.lineTo(bx, y - bodyH - lidH * 0.45);
  ctx.quadraticCurveTo(x, byTop - lidH * 0.42, bx + w, y - bodyH - lidH * 0.45);
  ctx.lineTo(bx + w, y - bodyH);
  ctx.closePath(); ctx.fill();

  // 金属包边
  ctx.fillStyle = '#f0d489';
  ctx.fillRect(bx + w * 0.42, y - h, w * 0.16, h);
  ctx.fillRect(bx, y - bodyH - h * 0.055, w, h * 0.055);

  // 锁扣
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath();
  ctx.arc(x, y - bodyH + h * 0.03, Math.max(1, h * 0.085), 0, Math.PI * 2);
  ctx.fill();

  // 描边
  ctx.strokeStyle = 'rgba(74,40,4,.72)';
  ctx.lineWidth = Math.max(1, h * 0.05);
  ctx.strokeRect(bx, y - bodyH, w, bodyH);

  // 漂浮的"!"提示（近处才显示）
  if (z < 3.4){
    const fy = y - h - h * 0.55 - Math.sin(t * 3.1) * h * 0.14;
    ctx.globalAlpha = a * (0.65 + 0.35 * Math.sin(t * 3.1));
    ctx.fillStyle = '#ffe9a8';
    ctx.font = `700 ${Math.max(9, h * 0.62)}px system-ui,-apple-system,sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('!', x, fy);
    ctx.textAlign = 'left';
  }

  // 高光星点
  ctx.globalAlpha = a * 0.85 * pulse;
  ctx.fillStyle = '#fff6d8';
  const sx = x - w * 0.34, sy = y - h * 0.72;
  ctx.beginPath();
  ctx.arc(sx, sy, Math.max(0.9, h * 0.07), 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* 已开启：开盖空箱（暗色，无光柱） */
function drawChestOpen(p, z, a){
  const h = 0.44 * p.s;
  const w = h * 1.30;
  const x = p.x, y = p.y;
  const bx = x - w / 2;
  const lidH = h * 0.40;
  const bodyH = h - lidH;

  ctx.globalAlpha = a * 0.72;
  // 箱体
  ctx.fillStyle = '#6f4a1c';
  ctx.fillRect(bx, y - bodyH, w, bodyH);
  // 箱内阴影
  ctx.fillStyle = 'rgba(20,12,4,.85)';
  ctx.fillRect(bx + w * 0.08, y - bodyH, w * 0.84, bodyH * 0.55);
  // 掀开的盖子（斜靠在后面）
  ctx.fillStyle = '#8a5c22';
  ctx.beginPath();
  ctx.moveTo(bx, y - bodyH);
  ctx.lineTo(bx - w * 0.06, y - h - lidH * 0.85);
  ctx.lineTo(bx + w * 0.94, y - h - lidH * 0.75);
  ctx.lineTo(bx + w, y - bodyH);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'rgba(40,24,4,.7)';
  ctx.lineWidth = Math.max(1, h * 0.045);
  ctx.strokeRect(bx, y - bodyH, w, bodyH);
  ctx.globalAlpha = 1;
}

/* ==================================================================
   5c. 岔路隐藏事件的演出特效
   ------------------------------------------------------------------
   每种事件彩蛋对应一段轻量的 Canvas 演出（2 秒左右）：
   彩虹拱 / 烟花爆炸 / 极光飘带 / 锦鲤跃水 / 雪人 / 幽灵 / 星星 / 信箱 / 小狗
   ================================================================== */
function drawEventFx(rel){
  const fx = S.eventFx;
  if (!fx) return;
  const k = Math.min(1, fx.t / fx.dur);          // 0 → 1 进度
  const fade = k < 0.15 ? k / 0.15 : (k > 0.78 ? (1 - k) / 0.22 : 1);
  const t = fx.t;

  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, fade));
  ctx.globalCompositeOperation = 'lighter';

  switch (fx.kind){
    case 'rainbow':   evRainbow(k, t);   break;
    case 'fireworks': evFireworks(k, t); break;
    case 'aurora':    evAurora(k, t);    break;
    case 'koi':       evKoi(k, t);       break;
    case 'snowman':   evSnowman(k, t);   break;
    case 'ghost':     evGhost(k, t);     break;
    case 'star':      evStar(k, t);      break;
    case 'mailbox':   evMailbox(k, t);   break;
    case 'dog':       evDog(k, t);       break;
    default:          evSparkle(k, t);   break;
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* 彩虹拱：从天际线缓缓升起一道弧 */
function evRainbow(k, t){
  const cx = VW * 0.5, cy = VH * (HORIZON_RATIO + 0.10);
  const grow = Math.min(1, k / 0.45);
  const R = VW * 0.44 * grow;
  const band = VW * 0.026;
  const bands = ['#e05a4a', '#e8a832', '#5cd0a0', '#5c9ce0', '#b57ce0'];
  for (let i = 0; i < bands.length; i++){
    const rr = R - i * band;
    if (rr <= 0.5) continue;                 // 半径必须为正
    ctx.beginPath();
    ctx.strokeStyle = bands[i];
    ctx.globalAlpha = 0.30 * (1 - i * 0.06);
    ctx.lineWidth = band;
    ctx.arc(cx, cy, rr, Math.PI, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* 烟花：多次爆开 */
function evFireworks(k, t){
  const bursts = 3;
  for (let b = 0; b < bursts; b++){
    const bt = t - b * 0.55;
    if (bt < 0 || bt > 0.85) continue;
    const bk = bt / 0.85;
    const cx = VW * (0.28 + b * 0.22) + Math.sin(b * 4.1) * VW * 0.05;
    const cy = VH * (0.20 + 0.06 * Math.cos(b * 2.7));
    const R = VW * 0.17 * Math.pow(bk, 0.55);
    const col = ['#ffd15c', '#5cd0a0', '#e05a4a', '#5c9ce0'][b % 4];
    ctx.strokeStyle = col;
    ctx.globalAlpha = (1 - bk) * 0.85;
    ctx.lineWidth = Math.max(1.2, VW * 0.005);
    for (let s = 0; s < 12; s++){
      const a = (s / 12) * Math.PI * 2 + b * 0.3;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R * 0.35, cy + Math.sin(a) * R * 0.35);
      ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.globalAlpha = (1 - bk) * 0.7;
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.5, VW * 0.008 * (1 - bk)), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 极光：几条飘带横扫天际 */
function evAurora(k, t){
  const colors = ['#5cf2a0', '#7fe3c0', '#5c9ce0', '#b57ce0'];
  for (let i = 0; i < 4; i++){
    const y0 = VH * (0.10 + i * 0.075);
    const amp = VH * (0.055 + i * 0.012);
    const g = ctx.createLinearGradient(0, y0 - amp, 0, y0 + amp * 1.6);
    g.addColorStop(0, colors[i]);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.30 + 0.12 * Math.sin(t * 2 + i);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-VW * 0.05, y0);
    for (let x = -VW * 0.05; x <= VW * 1.05; x += VW * 0.05){
      const yy = y0
        + Math.sin(x / VW * 6.2 + t * 1.9 + i * 1.3) * amp
        + Math.sin(x / VW * 13 + t * 0.7) * amp * 0.35;
      ctx.lineTo(x, yy);
    }
    for (let x = VW * 1.05; x >= -VW * 0.05; x -= VW * 0.05){
      const yy = y0 + amp * 1.5
        + Math.sin(x / VW * 6.2 + t * 1.9 + i * 1.3) * amp * 0.5;
      ctx.lineTo(x, yy);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 锦鲤跃水：一道水花 + 弧线跃起的鱼影 */
function evKoi(k, t){
  const cx = VW * 0.5, cy = VH * 0.60;
  const prog = Math.min(1, k / 0.6);
  const jx = -VW * 0.22 + prog * VW * 0.44;
  const jy = -Math.sin(prog * Math.PI) * VH * 0.22;
  // 水面涟漪
  ctx.strokeStyle = '#a8dcff';
  ctx.globalAlpha = 0.45 * (1 - k);
  ctx.lineWidth = Math.max(1.2, VW * 0.004);
  for (let i = 0; i < 3; i++){
    const rr = VW * (0.06 + i * 0.055) * (0.6 + k * 0.9);
    ctx.beginPath();
    ctx.ellipse(cx, cy, rr, rr * 0.22, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 鱼影
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#f08040';
  ctx.save();
  ctx.translate(cx + jx, cy + jy);
  ctx.rotate(-prog * 1.5 + 0.6);
  ctx.beginPath();
  ctx.ellipse(0, 0, VW * 0.055, VW * 0.024, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(VW * 0.045, 0);
  ctx.lineTo(VW * 0.085, -VW * 0.022);
  ctx.lineTo(VW * 0.085, VW * 0.022);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  // 水花
  ctx.globalAlpha = 0.7 * (1 - k);
  ctx.fillStyle = '#dff0ff';
  for (let i = 0; i < 12; i++){
    const a = (i / 12) * Math.PI - Math.PI;
    const d = VW * 0.04 + k * VW * 0.09;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.42, VW * 0.006, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 雪人：飘雪 + 站台边一个雪人剪影 */
function evSnowman(k, t){
  // 飘雪
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 42; i++){
    const seed = i * 37.13;
    const sx = ((seed * 7.3 + t * (18 + (i % 5) * 11)) % (VW * 1.1)) - VW * 0.05;
    const sy = ((seed * 11.7 + t * (34 + (i % 7) * 15)) % (VH * 0.95));
    const sz = 1 + (i % 3) * 0.9;
    ctx.globalAlpha = 0.28 + (i % 4) * 0.13;
    ctx.beginPath(); ctx.arc(sx, sy, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 雪人本体（屏幕右前方）
  const cx = VW * 0.72, cy = VH * 0.62;
  const u = VW * 0.055;
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#f6fbff';
  ctx.beginPath(); ctx.ellipse(cx, cy + u * 0.95, u * 0.78, u * 0.62, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy + u * 0.05, u * 0.52, 0, Math.PI * 2); ctx.fill();
  // 列车长帽
  ctx.fillStyle = '#2a3548';
  ctx.fillRect(cx - u * 0.42, cy - u * 0.62, u * 0.84, u * 0.24);
  ctx.fillRect(cx - u * 0.50, cy - u * 0.40, u * 1.00, u * 0.11);
  // 鼻子
  ctx.fillStyle = '#e8792c';
  ctx.beginPath();
  ctx.moveTo(cx, cy + u * 0.02);
  ctx.lineTo(cx + u * 0.34, cy + u * 0.11);
  ctx.lineTo(cx, cy + u * 0.20);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

/* 幽灵：半透明漂浮 + 上升的光点 */
function evGhost(k, t){
  const cx = VW * 0.5 + Math.sin(t * 1.3) * VW * 0.06;
  const cy = VH * 0.48 - t * VH * 0.055;
  const u = VW * 0.075;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.55 * (1 - k * 0.4);
  ctx.fillStyle = '#dff0ff';
  ctx.beginPath();
  ctx.moveTo(cx - u * 0.5, cy + u * 0.85);
  ctx.lineTo(cx - u * 0.5, cy);
  ctx.quadraticCurveTo(cx, cy - u * 0.95, cx + u * 0.5, cy);
  ctx.lineTo(cx + u * 0.5, cy + u * 0.85);
  ctx.lineTo(cx + u * 0.33, cy + u * 0.70);
  ctx.lineTo(cx + u * 0.16, cy + u * 0.85);
  ctx.lineTo(cx, cy + u * 0.70);
  ctx.lineTo(cx - u * 0.16, cy + u * 0.85);
  ctx.lineTo(cx - u * 0.33, cy + u * 0.70);
  ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#2a3548';
  ctx.beginPath(); ctx.ellipse(cx - u * 0.17, cy + u * 0.05, u * 0.075, u * 0.10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + u * 0.17, cy + u * 0.05, u * 0.075, u * 0.10, 0, 0, Math.PI * 2); ctx.fill();
  // 上升光点
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 16; i++){
    const p = ((t * 0.5 + i * 0.11) % 1);
    const yy = cy + u * 1.2 - p * VH * 0.35;
    ctx.globalAlpha = (1 - p) * 0.7;
    ctx.fillStyle = '#a8dcff';
    ctx.beginPath();
    ctx.arc(cx + Math.sin(i * 2.3) * u * 0.75, yy, VW * 0.005, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
}

/* 星星：一颗流星斜掠，然后定在天际闪 */
function evStar(k, t){
  const prog = Math.min(1, k / 0.55);
  const sx = -VW * 0.10 + prog * VW * 0.62;
  const sy = VH * 0.08 + prog * VH * 0.16;
  // 尾迹
  const g = ctx.createLinearGradient(sx - VW * 0.22, sy - VH * 0.09, sx, sy);
  g.addColorStop(0, 'rgba(255,209,92,0)');
  g.addColorStop(1, 'rgba(255,246,216,.95)');
  ctx.strokeStyle = g;
  ctx.lineWidth = VW * 0.008;
  ctx.beginPath();
  ctx.moveTo(sx - VW * 0.22, sy - VH * 0.09);
  ctx.lineTo(sx, sy);
  ctx.stroke();
  // 星体
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = '#fff8d0';
  const rr = VW * (0.012 + 0.006 * Math.sin(t * 9));
  ctx.beginPath(); ctx.arc(sx, sy, rr, 0, Math.PI * 2); ctx.fill();
  // 十字光芒
  ctx.strokeStyle = '#fff8d0';
  ctx.lineWidth = VW * 0.004;
  const L = VW * 0.05 + VW * 0.012 * Math.sin(t * 9);
  ctx.beginPath();
  ctx.moveTo(sx - L, sy); ctx.lineTo(sx + L, sy);
  ctx.moveTo(sx, sy - L); ctx.lineTo(sx, sy + L);
  ctx.stroke();
  // 扩散光环
  ctx.globalAlpha = 0.35 * (1 - k);
  ctx.strokeStyle = '#ffd15c';
  ctx.beginPath();
  ctx.arc(sx, sy, VW * 0.03 + k * VW * 0.18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* 信箱：屏幕前方飘出一封飞走的信 */
function evMailbox(k, t){
  const prog = Math.min(1, k / 0.7);
  const cx = VW * 0.30 + prog * VW * 0.55;
  const cy = VH * 0.62 - prog * VH * 0.34 + Math.sin(prog * Math.PI * 2) * VH * 0.03;
  ctx.globalAlpha = 0.9 * (1 - Math.max(0, (k - 0.75) / 0.25));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.sin(t * 4) * 0.22 - 0.14);
  const u = VW * 0.045;
  ctx.fillStyle = '#f0f4ff';
  ctx.fillRect(-u, -u * 0.68, u * 2, u * 1.36);
  ctx.strokeStyle = '#8fa6d8';
  ctx.lineWidth = Math.max(1, VW * 0.0022);
  ctx.strokeRect(-u, -u * 0.68, u * 2, u * 1.36);
  ctx.beginPath();
  ctx.moveTo(-u, -u * 0.68);
  ctx.lineTo(0, u * 0.10);
  ctx.lineTo(u, -u * 0.68);
  ctx.stroke();
  ctx.fillStyle = '#e05a4a';
  ctx.fillRect(u * 0.35, -u * 0.05, u * 0.5, u * 0.42);
  ctx.restore();
  // 光尘
  for (let i = 0; i < 10; i++){
    const p = ((t * 0.6 + i * 0.13) % 1);
    ctx.globalAlpha = (1 - p) * 0.55;
    ctx.fillStyle = '#a8dcff';
    ctx.beginPath();
    ctx.arc(cx + Math.sin(i * 5.1) * VW * 0.05, cy + p * VH * 0.16, VW * 0.0045, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 小狗：从右侧跑过画面 */
function evDog(k, t){
  const prog = Math.min(1, k / 0.72);
  const u = VW * 0.045;
  const cx = VW * 1.12 - prog * VW * 0.55;
  const bob = Math.abs(Math.sin(t * 13)) * u * 0.22;
  const cy = VH * 0.66 - bob;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.92;
  // 身体
  ctx.fillStyle = '#e8c48a';
  ctx.beginPath(); ctx.ellipse(cx, cy, u * 1.15, u * 0.68, 0, 0, Math.PI * 2); ctx.fill();
  // 头
  ctx.beginPath(); ctx.arc(cx - u * 1.25, cy - u * 0.42, u * 0.58, 0, Math.PI * 2); ctx.fill();
  // 耳朵
  ctx.fillStyle = '#c9a066';
  ctx.beginPath();
  ctx.moveTo(cx - u * 1.42, cy - u * 0.88);
  ctx.lineTo(cx - u * 1.62, cy - u * 1.42);
  ctx.lineTo(cx - u * 1.18, cy - u * 1.00);
  ctx.closePath(); ctx.fill();
  // 眼睛 & 鼻子
  ctx.fillStyle = '#3a2a12';
  ctx.beginPath(); ctx.arc(cx - u * 1.44, cy - u * 0.46, u * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - u * 1.72, cy - u * 0.34, u * 0.12, 0, Math.PI * 2); ctx.fill();
  // 腿
  ctx.fillStyle = '#d9b076';
  for (let i = 0; i < 3; i++){
    const lx = cx - u * 0.5 + i * u * 0.62;
    const lo = Math.sin(t * 13 + i * 2.1) * u * 0.28;
    ctx.fillRect(lx, cy + u * 0.5, u * 0.22, u * 0.55 + lo);
  }
  // 尾巴
  ctx.strokeStyle = '#e8c48a';
  ctx.lineWidth = Math.max(2, u * 0.22);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + u * 1.10, cy - u * 0.20);
  ctx.quadraticCurveTo(cx + u * 1.62, cy - u * 0.66 + Math.sin(t * 11) * u * 0.18,
                       cx + u * 1.50, cy - u * 1.10);
  ctx.stroke();
  ctx.lineCap = 'butt';
  // 扬尘
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 8; i++){
    const p = ((t * 1.4 + i * 0.15) % 1);
    ctx.globalAlpha = (1 - p) * 0.35;
    ctx.fillStyle = '#c9b896';
    ctx.beginPath();
    ctx.arc(cx + u * (0.9 + p * 1.4), cy + u * (0.55 - p * 0.25), VW * 0.004 + p * VW * 0.004, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
}

/* 兜底：通用金色粒子上升 */
function evSparkle(k, t){
  for (let i = 0; i < 30; i++){
    const p = ((t * 0.62 + i * 0.083) % 1);
    const x = VW * ((i * 0.137) % 1);
    const y = VH * 0.92 - p * VH * 0.75;
    ctx.globalAlpha = (1 - p) * 0.75;
    ctx.fillStyle = i % 3 === 0 ? '#ffd15c' : '#fff6d8';
    ctx.beginPath();
    ctx.arc(x + Math.sin(i * 3.7) * VW * 0.03, y, VW * 0.005, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 终点站台提示 */
function drawGoalBeacon(rel, theme){
  const p = project(S.goal[0] + 0.5, S.goal[1] + 0.5, rel);
  if (!p || p.z > VIEW_DEPTH) return;
  const h = 1.1 * p.s;          // 车站高 1.1 世界格
  const w = h * 0.55;
  const gy = p.y;
  const a = Math.max(0, Math.min(1, 1 - p.z / VIEW_DEPTH));
  // 光柱
  const g = ctx.createLinearGradient(p.x, gy, p.x, gy - h*2.6);
  g.addColorStop(0, `rgba(255,215,110,${0.55*a})`);
  g.addColorStop(1, 'rgba(255,215,110,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(p.x - w*0.7, gy);
  ctx.lineTo(p.x - w*0.22, gy - h*2.6);
  ctx.lineTo(p.x + w*0.22, gy - h*2.6);
  ctx.lineTo(p.x + w*0.7, gy);
  ctx.closePath(); ctx.fill();
  // 金色车站
  ctx.globalAlpha = 0.35 + 0.65 * a;
  ctx.fillStyle = '#ffd97a';
  ctx.fillRect(p.x - w*0.5, gy - h*0.75, w, h*0.75);
  ctx.fillStyle = '#8a6a1a';
  ctx.beginPath();
  ctx.moveTo(p.x - w*0.62, gy - h*0.75);
  ctx.lineTo(p.x, gy - h*1.05);
  ctx.lineTo(p.x + w*0.62, gy - h*0.75);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ==================================================================
   6. 主循环
   ================================================================== */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  S.totalTime += dt;

  if (S.maze) { update(dt); render(dt); }
  requestAnimationFrame(loop);
}

function update(dt){
  const cam = S.cam;
  const an = S.anim;

  if (an.phase === 'move' || an.phase === 'shunt'){
    an.t += dt;
    const f = Math.min(1, an.t / an.dur);
    const e = f < .5 ? 2*f*f : 1 - Math.pow(-2*f+2, 2)/2;

    if (an.from && an.to){
      cam.px = an.from[0] + (an.to[0] - an.from[0]) * e;
      cam.py = an.from[1] + (an.to[1] - an.from[1]) * e;
    }

    if (an.phase === 'move'){
      // 转向插值：前 35% 完成转向，剩下走直线
      let da = (an.turnTo ?? cam.ang) - (an.turnFrom ?? cam.ang);
      while (da >  Math.PI) da -= Math.PI*2;
      while (da < -Math.PI) da += Math.PI*2;
      const tf = Math.min(1, f / 0.35);
      cam.ang = (an.turnFrom ?? cam.ang) + da * (tf < .5 ? 2*tf*tf : 1-Math.pow(-2*tf+2,2)/2);
      cam.roll = Math.sin(f * Math.PI) * 0.035;
    } else {
      // 倒车：车身抖动 + 轻微侧倾
      cam.shake = Math.sin(an.t * 46) * (1 - f) * 4.5;
      cam.roll = Math.sin(an.t * 30) * (1 - f) * 0.018;
    }
    if (f >= 1){
      an.phase = 'idle';
      cam.roll = 0; cam.shake = 0;
      an.from = null; an.to = null;
      const cb = an.cb; an.cb = null;
      if (cb) cb();
    }
  }

  // 主题按位置平滑过渡
  const distFromStart = Math.abs(S.pos[0] - S.maze.start[0]) + Math.abs(S.pos[1] - S.maze.start[1]);
  const maxD = Math.max(4, S.maze.cw + S.maze.ch);
  const zoneF = Math.min(S.zoneCount - 0.001, (distFromStart / maxD) * S.zoneCount);
  const z0 = Math.floor(zoneF), z1 = Math.min(S.zoneCount, z0 + 1);
  S.currentZoneF = zoneF;

  const tA = themeAt(z0, S.zoneCount), tB = themeAt(z1, S.zoneCount);
  const base = lerpTheme(tA, tB, zoneF - z0);
  // 缓慢的日夜呼吸
  S.cam.curTheme = base;

  // 更新区域名
  const zName = THEMES[Math.floor(zoneF + 0.5) % THEMES.length].name;
  S.zoneName = THEMES[z1 % THEMES.length].name;

  // 撞击粒子
  updateFx(dt);

  // 事件演出计时
  if (S.eventFx){
    S.eventFx.t += dt;
    if (S.eventFx.t > S.eventFx.dur + 0.4) S.eventFx = null;
  }

  // 撞碎瞬间的抖动
  if (an.hitCrate && an.t < 0.5){
    cam.shake = Math.max(cam.shake, Math.sin(an.t * 90) * (1 - an.t / 0.5) * 7);
  }
}

function render(dt){
  const theme = S.cam.curTheme;
  const rel = { ang:S.cam.ang, px:S.cam.px, py:S.cam.py };

  ctx.save();
  if (S.cam.shake){
    ctx.translate((Math.random()-0.5)*S.cam.shake, (Math.random()-0.5)*S.cam.shake);
  }
  // 弯道侧倾
  ctx.translate(VW/2, VH/2);
  ctx.rotate(S.cam.roll || 0);
  ctx.translate(-VW/2, -VH/2);

  drawGroundStrip(rel, theme);
  drawScenery(rel, theme);
  drawGoalBeacon(rel, theme);
  drawChests(rel, theme);
  drawTrack(rel, theme);
  drawBarriers(rel, theme);
  drawEventFx(rel);
  drawFx(rel);
  drawFog(theme);
  drawCab(theme, S.totalTime);
  drawVignette();

  ctx.restore();

  // 距离表
  const dv = document.getElementById('uiArea');
  const nm = THEMES[Math.floor(S.currentZoneF || 0) % THEMES.length].name;
  if (dv.textContent !== nm) dv.textContent = '🏞 ' + nm;

  // 前进中提示变淡，不挡车头；岔路口恢复
  const panel = document.getElementById('panel');
  panel.style.opacity = (S.anim.phase === 'move') ? '0.25' : '1';
}

/* ============ 彩蛋收集卡片 ============ */
let eggCardTimer = null;
function showEggCard(egg, sourceLabel){
  const R = RARITY[egg.rarity];
  const inner = document.getElementById('eggInner');
  inner.style.setProperty('--rc', R.col);
  inner.style.setProperty('--rg', R.glow);
  inner.innerHTML = `
    <div class="egg-rar">${R.name}</div>
    <div class="egg-art">${egg.art}</div>
    <div class="egg-name">${egg.name}</div>
    <div class="egg-desc">${egg.desc}</div>
    <div class="egg-src">获得方式 · ${escapeHtml(sourceLabel)}　|　图鉴 ${S.collected.size}/${S.totalEggs}</div>
    <button class="egg-ok" id="eggOk">收 下</button>
  `;
  const card = document.getElementById('eggCard');
  card.classList.add('show');
  S.cardOpen = true;
  bindTap(document.getElementById('eggOk'), closeEggCard);
  // 8 秒没点也自动收起，不卡流程
  clearTimeout(eggCardTimer);
  eggCardTimer = setTimeout(closeEggCard, 8000);
}
function closeEggCard(){
  clearTimeout(eggCardTimer);
  const card = document.getElementById('eggCard');
  if (!card.classList.contains('show')) return;
  card.classList.remove('show');
  S.cardOpen = false;
  // 集齐了就直接进结算，不继续走
  if (allCollected()) { finishGame(); return; }
  if (S.running) setTimeout(() => resumeFlow(), 260);
}

/* 图鉴分组：优先用"实际获得方式"，没拿到的才按设计来源归组 */
const SRC_GROUP = {
  '撞碎路障': 'crate',
  '荒野宝箱': 'box',
  '发现宝箱': 'box',
  '隐藏事件': 'event',
  '来自图鉴': null
};
function eggGroup(e){
  const real = S.collectedSrc && S.collectedSrc[e.id];
  if (real && SRC_GROUP[real]) return SRC_GROUP[real];
  return e.from;
}

/* ============ 图鉴面板 ============ */
function openGallery(fromFinish){
  const body = document.getElementById('galBody');
  document.getElementById('galCnt').textContent = S.collected.size + ' / ' + S.totalEggs;
  const groups = [
    ['crate', '🚧 撞碎路障掉落'],
    ['box',   '📦 荒野宝箱'],
    ['event', '✨ 岔路隐藏事件']
  ];
  let html = '';
  for (const [from, title] of groups){
    const list = EGGS.filter(e => eggGroup(e) === from);
    const gotN = list.filter(e => S.collected.has(e.id)).length;
    html += `<div class="gal-group"><div class="gal-gt">${title}　${gotN}/${list.length}</div><div class="gal-grid">`;
    for (const e of list){
      const got = S.collected.has(e.id);
      const R = RARITY[e.rarity];
      html += `<div class="gal-item ${got?'got':'locked'}" data-egg="${e.id}"
                    style="--rc:${R.col};--rg:${R.glow}">
        ${got ? e.art : (e.art.replace('<svg','<svg aria-hidden="true"'))}
        <div class="q">?</div>
        <div class="nm">${got ? e.name : '？？？'}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  body.innerHTML = html;
  const g = document.getElementById('gallery');
  g.classList.add('show');
  // 点已解锁的可以再看一遍故事
  body.querySelectorAll('.gal-item.got').forEach(el => {
    bindTap(el, () => {
      const e = eggById(el.dataset.egg);
      if (e) showEggCard(e, '来自图鉴');
    });
  });
}
function closeGallery(){
  document.getElementById('gallery').classList.remove('show');
}

/* ============ 触屏支持 ============ */
// 1) 双击 / 双指缩放：直接拦截
document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
let _lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();   // 300ms 内的第二次点击视为双击缩放
  _lastTap = now;
}, { passive:false });

// 2) 触摸设备：把 tap 转成"立即响应"，绕过 300ms click 延迟
function bindTap(el, fn){
  let touched = false;
  el.addEventListener('touchstart', e => {
    touched = true;
    el.dataset.pressed = '1';
  }, { passive:true });
  el.addEventListener('touchend', e => {
    if (!touched) return;
    touched = false;
    e.preventDefault();          // 阻止后续合成 click，避免触发两次
    el.removeAttribute('data-pressed');
    fn();
  }, { passive:false });
  el.addEventListener('touchcancel', () => { touched = false; el.removeAttribute('data-pressed'); });
  el.addEventListener('click', e => {
    // 非触摸环境（桌面鼠标）走这里
    if (window.matchMedia('(hover: none)').matches) return;
    fn();
  });
}

/* 键盘 */
document.addEventListener('keydown', e => {
  if (!S.pending) {
    if (e.key === 'r' || e.key === 'R') { resetCard(); startGame(S.level); }
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
    const i = S.choices.findIndex(c => c.key === 'W');
    if (i >= 0) chooseDir(i);
    e.preventDefault();
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
    const i = S.choices.findIndex(c => c.key === 'E');
    if (i >= 0) chooseDir(i);
    e.preventDefault();
  } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    const i = S.choices.findIndex(c => c.key === 'N');
    if (i >= 0) chooseDir(i);
    e.preventDefault();
  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){
    const i = S.choices.findIndex(c => c.key === 'S');
    if (i >= 0) chooseDir(i);
    e.preventDefault();
  } else if (/^[1-9]$/.test(e.key)){
    chooseDir(parseInt(e.key,10) - 1);
  }
});

bindTap(document.getElementById('btnRestart'), () => { resetCard(); startGame(S.level); });
bindTap(document.getElementById('uiEggChip'), () => openGallery(false));
bindTap(document.getElementById('galClose'), closeGallery);

function bindStartCard(){
  const row = document.getElementById('lvRow');

      selectedLevel = k;
      [...row.children].forEach(c => c.classList.remove('on'));
      el.classList.add('on');
    });

}
