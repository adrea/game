  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  /* ============ HUD 顶部 ============ */
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; pointer-events:none;
    color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.7);
    font-size:15px;
  }
  .chip {
    background:rgba(10,16,32,.55);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius:999px; padding:6px 14px;
    display:flex; align-items:center; gap:7px;
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .chip b { font-size:17px; font-weight:700; color:#ffd97a; }
  #spacer { flex:1; }
  .btn-ico {
    pointer-events:auto; cursor:pointer;
    width:38px; height:38px; border-radius:12px;
    background:rgba(10,16,32,.55);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color:#fff; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s, background .15s;
  }
  .btn-ico:active { transform:scale(.92); background:rgba(255,255,255,.2); }

  /* ============ 驾驶指令面板 ============ */
  #panel {
    position:absolute; left:0; right:0; bottom:0;
    padding:0 16px 22px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    transition: opacity .25s;
  }
  #hint {
    color:#fff; font-size:15px; letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
    background:rgba(10,16,32,.5);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding:7px 18px; border-radius:999px;
    text-align:center;
  }
  #choices { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .dir {
    cursor:pointer; position:relative; overflow:hidden;
    min-width:104px; padding:14px 20px 12px;
    border-radius:18px;
    background:linear-gradient(175deg, rgba(70,110,210,.85), rgba(30,50,120,.9));
    border:1.5px solid rgba(160,200,255,.5);
    box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    color:#fff; font-size:16px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s;
  }
  .dir .arw { font-size:26px; line-height:1; }
  .dir .sub { font-size:11px; font-weight:400; opacity:.75; letter-spacing:.5px; }
  .dir .sub.new { color:#b8ffdf; opacity:1; font-weight:600; }
  .dir .sub.seen { color:#c8d4f0; opacity:.62; }
  .dir .sub.crate { color:#ffd08a; opacity:1; font-weight:600; }
  /* 有可撞开路障的按钮：暖色描边脉冲 */
  .dir.has-crate {
    border-color: rgba(255,190,110,.85);
    box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 0 rgba(255,180,90,.5);
    animation: crateGlow 1.4s ease-in-out infinite;
  }
  @keyframes crateGlow {
    0%,100% { box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 0 rgba(255,180,90,.5); }
    50%     { box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 9px rgba(255,180,90,0); }
  }
  /* 有隐藏事件的方向：紫色微光 + 一颗闪烁的小点（只提示"有东西"，不剧透） */
  .dir.has-egg {
    border-color: rgba(200,150,255,.8);
    animation: eggGlow 1.6s ease-in-out infinite;
  }
  @keyframes eggGlow {
    0%,100% { box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 0 rgba(190,140,255,.5); }
    50%     { box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 9px rgba(190,140,255,0); }
  }
  .dir .glow {
    position:absolute; top:7px; right:9px; width:7px; height:7px; border-radius:50%;
    background:#e0c4ff; box-shadow:0 0 8px 2px rgba(200,150,255,.9);
    animation: eggDot 1.2s ease-in-out infinite;
  }
  @keyframes eggDot { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.25); } }
  .dir:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(60,110,230,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  .dir:active { transform:scale(.95); }
  .dir.left  { background:linear-gradient(175deg, rgba(90,190,150,.85), rgba(20,90,80,.9)); border-color:rgba(150,255,220,.5); }
  .dir.right { background:linear-gradient(175deg, rgba(230,160,90,.85), rgba(150,70,20,.9)); border-color:rgba(255,215,150,.5); }
  .dir.straight { background:linear-gradient(175deg, rgba(110,150,235,.85), rgba(35,60,145,.9)); }
  .dir.act { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 0 rgba(255,220,120,.55); }
    50%     { box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 12px rgba(255,220,120,0); }
  }

  /* ============ 居中提示（撞死路 / 通关） ============ */
  #toast {
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.85);
    padding:16px 32px; border-radius:18px;
    background:rgba(15,22,45,.88);
    border:1.5px solid rgba(255,255,255,.22);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color:#fff; font-size:20px; font-weight:700; letter-spacing:1px;
    text-align:center; opacity:0; pointer-events:none;
    transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 14px 40px rgba(0,0,0,.6);
    max-width:82vw;
  }
  #toast .sub { display:block; font-size:13px; font-weight:400; opacity:.8; margin-top:6px; letter-spacing:0; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.warn { border-color:rgba(255,120,110,.6); background:rgba(60,18,20,.9); }
  #toast.good { border-color:rgba(255,215,110,.7); background:rgba(58,44,10,.92); }

  /* ============ 结束/开始 遮罩 ============ */
  #overlay {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(30,50,110,.86), rgba(6,9,20,.96));

  #overlay.hide { display:none; }
  .card {
    width:min(460px, 92vw);
    background:rgba(18,26,50,.9);
    border:1.5px solid rgba(140,180,255,.28);
    border-radius:26px; padding:30px 28px;

    text-align:center; color:#e8eeff;
  }
  .card h1 { font-size:27px; letter-spacing:2px; margin-bottom:6px;
    background:linear-gradient(180deg,#fff,#9fc4ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card .tag { font-size:13px; color:#8fa6d8; letter-spacing:3px; margin-bottom:20px; }
  .card p { font-size:14.5px; line-height:1.9; color:#b9c8e8; text-align:left; }
  .card p b { color:#ffd97a; }
  .kbd { display:inline-block; padding:1px 8px; margin:0 2px; border-radius:6px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); font-size:12.5px; color:#fff; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 22px; }
  .stat { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    border-radius:14px; padding:12px 8px; }
  .stat .v { font-size:23px; font-weight:700; color:#ffd97a; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:11.5px; color:#8fa6d8; margin-top:3px; letter-spacing:1px; }
  .start-btn {
    cursor:pointer; width:100%; margin-top:6px;
    padding:15px; border-radius:16px; border:none;
    background:linear-gradient(180deg,#5b86e5,#3a5bd0);
    box-shadow:0 8px 26px rgba(70,110,230,.5), inset 0 1px 0 rgba(255,255,255,.3);
    color:#fff; font-size:17px; font-weight:700; letter-spacing:3px;
    transition: transform .16s, box-shadow .16s;
  }
  .start-btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(70,110,230,.65); }
  .start-btn:active { transform:scale(.97); }
  .lv-row { display:flex; gap:8px; margin-bottom:20px; }
  .lv {
    flex:1; cursor:pointer; padding:11px 6px; border-radius:14px;
    background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.12);
    color:#b9c8e8; font-size:13px; transition:.16s;
  }
  .lv .n { display:block; font-size:15px; font-weight:700; color:#fff; margin-bottom:2px; }
  .lv:hover { background:rgba(255,255,255,.12); }
  .lv.on { background:linear-gradient(180deg,rgba(91,134,229,.9),rgba(58,91,208,.9));
    border-color:rgba(160,200,255,.7); color:#fff; box-shadow:0 6px 18px rgba(70,110,230,.45); }
  /* ============ 移动端 / 触屏适配 ============ */
  /* 安全区（刘海屏、Home 指示条）*/
  #hud    { padding-top: calc(12px + env(safe-area-inset-top)); }
  #panel  { padding-bottom: calc(22px + env(safe-area-inset-bottom)); }

  @media (hover: none) and (pointer: coarse) {
    /* 触屏设备：去掉 hover 位移（会残留高亮），加大点击热区 */
    .dir { min-width:112px; padding:16px 22px 14px; }
    .dir:hover { transform:none; box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
    .dir:active { transform:scale(.93); background:linear-gradient(175deg, rgba(120,160,255,.95), rgba(50,80,180,.95)); }
    .dir.left:active  { background:linear-gradient(175deg, rgba(120,220,180,.95), rgba(30,120,100,.95)); }
    .dir.right:active { background:linear-gradient(175deg, rgba(250,190,120,.95), rgba(180,90,30,.95)); }
    .btn-ico { width:46px; height:46px; }
    #hint { font-size:16px; }
  }

  /* 横屏矮屏：压缩上下留白，避免按钮挡住视线 */
  @media (orientation: landscape) and (max-height: 520px) {
    #panel { padding-bottom: calc(10px + env(safe-area-inset-bottom)); gap:8px; }
    #hud { padding-top: calc(7px + env(safe-area-inset-top)); }
    .dir { min-width:96px; padding:9px 18px 8px; border-radius:14px; }
    .dir .arw { font-size:20px; }
    .dir .sub { display:none; }
    #hint { font-size:13px; padding:5px 14px; }
    .card { padding:20px 22px; }
    .card h1 { font-size:21px; }
    .card .stat-grid { margin:10px 0 12px; }
    .start-btn { padding:12px; }
  }

  /* 很窄的竖屏 */
  @media (orientation: portrait) and (max-width: 400px) {
    .dir { min-width:78px; padding:13px 12px 11px; }
    .dir .arw { font-size:20px; }
    .dir span:not(.arw):not(.sub) { font-size:12.5px; }
    #hud { gap:6px; padding-left:10px; padding-right:10px; }
    .chip { padding:5px 10px; font-size:12.5px; }
    .chip b { font-size:14px; }
  }

  /* 极矮屏（手机横屏非常扁）时隐藏次要信息 */
  @media (max-height: 380px) {
    #hud .chip { display:none; }
    #hud #uiArea { display:flex; }
  }

  /* 旋转提示（仅在平板竖屏且检测到触屏时显示，纯横屏游戏体验更好） */
  #rotate { display:none; }

  /* ============ 彩蛋进度条（HUD 内） ============ */
  .chip.egg-chip { cursor:pointer; pointer-events:auto; }
  .chip.egg-chip b { color:#ffd15c; }
  .egg-bar {
    width:44px; height:5px; border-radius:99px;
    background:rgba(255,255,255,.18); overflow:hidden; margin-left:2px;
  }

  /* ============ 彩蛋收集卡片 ============ */
  #eggCard {

    background:rgba(4,7,16,.72);

    transform: scale(.82) translateY(14px); opacity:0;
    transition: transform .42s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  }
  #eggCard.show .egg-inner { transform:scale(1) translateY(0); opacity:1; }
  .egg-rar {
    display:inline-block; font-size:11.5px; letter-spacing:3px; font-weight:700;
    padding:3px 12px; border-radius:99px; margin-bottom:13px;
    color:var(--rc); border:1px solid var(--rc);
    background:color-mix(in srgb, var(--rc) 14%, transparent);

  .egg-art {
    width:118px; height:118px; margin:0 auto 15px;
    border-radius:20px; padding:9px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    filter: drop-shadow(0 0 16px var(--rg));
    animation: eggPop .55s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes eggPop { 0%{transform:scale(.4) rotate(-14deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
  .egg-art svg { width:100%; height:100%; display:block; }
  .egg-name { font-size:20px; font-weight:700; color:#fff; letter-spacing:1px; margin-bottom:7px; }
  .egg-desc { font-size:13.5px; line-height:1.85; color:#a8b8d8; text-align:left;
    padding:0 4px; margin-bottom:16px; }
  .egg-src { font-size:11.5px; color:#7f92b8; letter-spacing:1px; margin-bottom:14px; }
  .egg-ok {

    background:linear-gradient(180deg, var(--rc), color-mix(in srgb, var(--rc) 62%, #1a2540));
    color:#0b1020; font-size:15.5px; font-weight:800; letter-spacing:2px;
    transition: transform .15s;
  }
  .egg-ok:active { transform:scale(.96); }

  /* ============ 图鉴面板 ============ */
  #gallery {

  .gal-close {

  .gal-body { flex:1; overflow-y:auto; padding:0 16px 10px; -webkit-overflow-scrolling:touch; }

  .gal-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(88px, 1fr)); gap:10px; }
  .gal-item {
    position:relative; aspect-ratio:1;
    border-radius:15px; padding:8px;
    background:rgba(255,255,255,.05);
    border:1.5px solid rgba(255,255,255,.09);

    transition: transform .18s, border-color .18s;
  }
  .gal-item.got { border-color:var(--rc); background:rgba(255,255,255,.075);

  .gal-item:active { transform:scale(.94); }
  .gal-item svg { width:100%; height:100%; display:block; }
  .gal-item .nm { position:absolute; bottom:4px; left:0; right:0; text-align:center;
    font-size:9.5px; color:#c8d4f0; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px; }
  .gal-item.locked { opacity:.42; }
  .gal-item.locked svg { filter:brightness(0) invert(.42); }
  .gal-item.locked .nm { color:#5d6f92; }
  .gal-item .q { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:26px; color:rgba(255,255,255,.3); font-weight:700; }

  @media (max-width:420px) {
    .gal-grid { grid-template-columns:repeat(auto-fill, minmax(74px, 1fr)); gap:8px; }
    .gal-head h2 { font-size:16.5px; }
  }

/* ==================================================================
   1. 迷宫生成（带环的完美迷宫 + 环路）
   ================================================================== */
const DIRS = ['N','E','S','W'];
const DX = { N:0, E:1, S:0, W:-1 };   // 向东为 +x
const DY = { N:-1, E:0, S:1, W:0 };   // 向南为 +y（网格坐标，y 向下）
const OPP = { N:'S', S:'N', E:'W', W:'E' };

function genMaze(cw, ch) {
  // cw x ch 个格子，外加一圈墙壁 → 实际网格 (ch+2) x (cw+2)
  const W = cw + 2, H = ch + 2;
  const wall = [];
  for (let y = 0; y < H; y++) { wall.push(new Uint8Array(W).fill(1)); }

  // 迭代式 DFS 打通奇数格
  const stack = [];
  const sx = 1, sy = 1;
  wall[sy][sx] = 0;
  stack.push([sx, sy]);
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const nb = [];
    for (const d of DIRS) {
      const nx = x + DX[d] * 2, ny = y + DY[d] * 2;
      if (nx > 0 && nx < W - 1 && ny > 0 && ny < H - 1 && wall[ny][nx] === 1) nb.push([d, nx, ny]);
    }
    if (!nb.length) { stack.pop(); continue; }
    const [d, nx, ny] = nb[(Math.random() * nb.length) | 0];
    wall[y + DY[d]][x + DX[d]] = 0;  // 打通中间的墙
    wall[ny][nx] = 0;
    stack.push([nx, ny]);
  }

  // 制造环路：随机再打通一些墙，让路网更复杂（死路依然存在但不是树状）
  const extra = Math.floor(cw * ch * 0.10);
  for (let i = 0; i < extra; i++) {
    const x = 1 + ((Math.random() * (cw - 1)) | 0);
    const y = 1 + ((Math.random() * (ch - 1)) | 0);
    if (wall[y][x] !== 1) continue;
    const horiz = wall[y][x - 1] === 0 && wall[y][x + 1] === 0 && wall[y-1][x] === 1 && wall[y+1][x] === 1;
    const vert  = wall[y - 1][x] === 0 && wall[y + 1][x] === 0 && wall[y][x-1] === 1 && wall[y][x+1] === 1;
    if (horiz || vert) wall[y][x] = 0;
  }

  const open = (x, y) => x >= 0 && y >= 0 && x < W && y < H && wall[y][x] === 0;
  const exitsOf = (x, y) => DIRS.filter(d => open(x + DX[d], y + DY[d]));
  const deadEnds = [];
  for (let y = 1; y < H - 1; y++)
    for (let x = 1; x < W - 1; x++)
      if (wall[y][x] === 0 && exitsOf(x, y).length === 1) deadEnds.push([x, y]);

  const maze = { W, H, wall, open, exitsOf, deadEnds, cw, ch, start: [1, 1] };

  // ---- 生成路障（放在格与格之间的连接上）----
  // 需要掉落的 crate 彩蛋数量 = crate 类彩蛋总数（保证每个都能从路障里撞出来）
  const crateEggNeed = EGGS.filter(e => e.from === 'crate').length;
  maze.barriers = genBarriers(maze, crateEggNeed);

  // ---- 算出"护栏挡不住"的可达格（后续所有彩蛋承载点都必须在这里面）----
  const reach = reachableCells(maze);
  maze.reachSet = reach;

  // ---- 给可撞碎路障分配掉落彩蛋（只给两端至少一端可达的 crate）----
  assignCrateDrops(maze, reach);

  // ---- 放置宝箱（只放在可达格上，保证玩家一定能拿到）----
  maze.chests = genChests(maze, OVERFLOW_EGGS, reach);
  maze.overflowEggs = OVERFLOW_EGGS.slice();

  return maze;
}

/* 计算"只考虑 guard 阻挡"时从起点可达的所有格子。 */
function reachableCells(maze){
  const { W, open, start } = maze;
  const guardSet = new Set();
  for (const b of maze.barriers.values())
    if (b.type === 'guard') guardSet.add(edgeKey(b.ax, b.ay, b.bx, b.by));

  const seen = new Uint8Array(W * maze.H);
  const q = [[start[0], start[1]]];
  seen[start[1] * W + start[0]] = 1;
  const out = new Set([start[0] + ',' + start[1]]);
  let head = 0;
  while (head < q.length){
    const [x, y] = q[head++];
    for (const d of DIRS){
      const nx = x + DX[d], ny = y + DY[d];
      if (!open(nx, ny)) continue;
      if (seen[ny * W + nx]) continue;
      if (guardSet.has(edgeKey(x, y, nx, ny))) continue;
      seen[ny * W + nx] = 1;
      out.add(nx + ',' + ny);
      q.push([nx, ny]);
    }
  }
  return out;
}

/* ==================================================================
   1c. 宝箱 (chests)
   ------------------------------------------------------------------
   宝箱摆在"死路尽头 / 岔路口"等值得探索的位置，图鉴里的 box 类彩蛋
   全部由宝箱承载 —— 保证每个 box 彩蛋都有一口箱子等着玩家。
   同时把 crate 类彩蛋随机分配给可撞碎路障，撞开即掉落。
   ================================================================== */
function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function genChests(maze, overflow, reach){
  const { cw, ch, open, start, exitsOf, deadEnds } = maze;
  const chests = [];
  // box 类彩蛋 + 从 crate 溢出的彩蛋，全部由宝箱承载
  const boxEggs = shuffleArr(EGGS.filter(e => e.from === 'box').map(e => e.id));
  const extraEggs = shuffleArr((overflow || []).slice());

  const isReach = (x, y) => !reach || reach.has(x + ',' + y);

  // 候选位置优先级：死路尽头（最有探索感） > 普通格子
  // 只保留"可达 + 不是起点、不是起点相邻"的格子
  const cand = [];
  for (const [x, y] of deadEnds){
    if (x === start[0] && y === start[1]) continue;
    if (!isReach(x, y)) continue;
    if (exitsOf(x, y).length === 1) cand.push([x, y, 2]);   // 死路尽头优先
  }
  for (let y = 1; y <= ch; y++)
    for (let x = 1; x <= cw; x++){
      if (!open(x, y)) continue;
      if (x === start[0] && y === start[1]) continue;
      if (!isReach(x, y)) continue;
      if (cand.some(c => c[0] === x && c[1] === y)) continue;
      cand.push([x, y, 1]);
    }

  // 按优先级分桶后内部打乱，保证优先填满死路尽头
  const high = shuffleArr(cand.filter(c => c[2] === 2));
  const low  = shuffleArr(cand.filter(c => c[2] === 1));
  const ordered = high.concat(low);

  // 需要的彩蛋清单：box 优先，其次是 overflow
  const wanted = boxEggs.concat(extraEggs);
  const usedCells = new Set();

  // ---- 第一轮：每个彩蛋都尝试占一个独立格子（尽量避开起点相邻）----
  //     两趟：第一趟要求离起点 > 1，第二趟放宽到 > 0
  const unplaced = [];
  for (const eggId of wanted){
    let placed = false;
    for (const [x, y] of ordered){
      const ck = x + ',' + y;
      if (usedCells.has(ck)) continue;
      if (Math.abs(x - start[0]) + Math.abs(y - start[1]) <= 1) continue;
      chests.push({ x, y, eggId, opened:false });
      usedCells.add(ck);
      placed = true;
      break;
    }
    if (!placed) unplaced.push(eggId);
  }
  // 放宽：允许紧挨起点
  const still = [];
  for (const eggId of unplaced){
    let placed = false;
    for (const [x, y] of ordered){
      const ck = x + ',' + y;
      if (usedCells.has(ck)) continue;
      if (x === start[0] && y === start[1]) continue;
      chests.push({ x, y, eggId, opened:false });
      usedCells.add(ck);
      placed = true;
      break;
    }
    if (!placed) still.push(eggId);
  }

  // ---- 最后兜底：格子真的不够（理论上不会），允许与已有格共处一室 ----
  //     两个彩蛋放同一格：开箱时优先给还没收集的那个
  for (let i = 0; i < still.length && chests.length; i++){
    const host = chests[i % chests.length];
    if (!host.extra) host.extra = [];
    host.extra.push(still[i]);
  }

  return chests;
}

/* 装不下的彩蛋（由 genMaze 消费后转交给宝箱/事件池） */
let OVERFLOW_EGGS = [];

/* 给可撞碎路障分配"掉落彩蛋"——保证 crate 类彩蛋全部可获取。
   若 crate 数量不足以承载全部 crate 彩蛋，多余的会转交到"宝箱/事件"池，
   确保 22 个彩蛋在任何关卡尺寸下都能集齐。 */
function assignCrateDrops(maze, reach){
  OVERFLOW_EGGS = [];                        // 需要转交出去的彩蛋 id
  if (!maze.barriers) return;

  const crateEggs = shuffleArr(EGGS.filter(e => e.from === 'crate').map(e => e.id));

  // 只考虑"至少一端可达"的 crate —— 玩家撞得到才有意义
  const all = [...maze.barriers.values()].filter(b => b.type === 'crate');
  const usable = reach
    ? all.filter(b => reach.has(b.ax + ',' + b.ay) || reach.has(b.bx + ',' + b.by))
    : all;
  const pool = usable.length ? usable : all;   // 极端情况兜底
  const crates = shuffleArr(pool);

  if (crates.length === 0){
    OVERFLOW_EGGS = crateEggs.slice();
    maze.crateEggPool = [];
    return;
  }

  const cap = Math.min(crates.length, crateEggs.length);
  for (let i = 0; i < cap; i++){
    crates[i].drop = crateEggs[i];
    crates[i].dropNew = true;
  }
  // crate 比彩蛋多：多余的路障掉落重复彩蛋（撞到提示"重复获得"，不影响通关）
  for (let i = cap; i < crates.length; i++){
    crates[i].drop = crateEggs[i % crateEggs.length];
  }
  // 未被选中承载的 crate（不可达的那批）也随便给个掉落，避免空箱
  for (const b of all){
    if (!b.drop) b.drop = crateEggs[(Math.random() * crateEggs.length) | 0];
  }

  if (crateEggs.length > cap) OVERFLOW_EGGS = crateEggs.slice(cap);
  maze.crateEggPool = crateEggs;
}

/* ==================================================================
   1b. 路障 (barriers)
   ------------------------------------------------------------------
   路障占据的是"两格之间的连接"（edge），用 key 唯一标识：
     edgeKey(x, y, dx, dy) → 规范化后的 'ax,ay|bx,by'（字典序）
   两种类型：
     'guard'  施工护栏 —— 永久阻挡，撞上去被弹回
     'crate'  水马/锥桶 —— 可撞碎，撞一次就清掉，能继续前进
   生成时用 BFS 校验：起点到终点至少存在一条不经过 guard 的路径，
   若被封死则逐个移除造成问题的护栏，保证必定可通关。
   ================================================================== */
function edgeKey(ax, ay, bx, by){
  if (ax > bx || (ax === bx && ay > by)) { const t = ax; ax = bx; bx = t; const u = ay; ay = by; by = u; }
  return ax + ',' + ay + '|' + bx + ',' + by;
}

function genBarriers(maze, crateWanted){
  const { cw, ch, open, start } = maze;
  const barriers = new Map();      // key -> {type, ax, ay, bx, by}

  // 收集所有内部连接（相邻两个通路格之间）
  const edges = [];
  for (let y = 1; y <= ch; y++){
    for (let x = 1; x <= cw; x++){
      if (!open(x, y)) continue;
      if (open(x + 1, y)) edges.push([x, y, x + 1, y]);
      if (open(x, y + 1)) edges.push([x, y, x, y + 1]);
    }
  }
  if (!edges.length) return barriers;

  // 洗牌后按比例铺路障
  for (let i = edges.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = edges[i]; edges[i] = edges[j]; edges[j] = t;
  }

  const total = edges.length;
  const guardTarget = Math.max(2, Math.round(total * 0.18));   // 护栏 目标 ~18%（可解性过滤后实际留 ~10%）

  // ---- 可撞碎路障数量必须 >= 需要掉落的彩蛋数 ----
  // 这些路障不会影响可解性（撞一下就没了），所以可以放心多加。
  const crateMin = crateWanted || 2;
  const crateRatio = Math.max(2, Math.round(total * 0.12));
  const crateTarget = Math.max(crateMin, crateRatio);
  if (crateTarget > total){
    // 极端小地图：边都不够，直接全铺 crate
  }

  // 起点周围一格内不放路障，避免开局就被堵
  const nearStart = (ax, ay, bx, by) =>
    (Math.abs(ax - start[0]) + Math.abs(ay - start[1]) <= 1) ||
    (Math.abs(bx - start[0]) + Math.abs(by - start[1]) <= 1);

  let guards = 0, crates = 0;

  // ---- 第一轮：优先铺满可撞碎路障（保证彩蛋都有归属）----
  for (const [ax, ay, bx, by] of edges){
    if (crates >= crateTarget) break;
    if (nearStart(ax, ay, bx, by)) continue;

    // 同一格子上的路障计数（crate 之间允许相邻两张，方便形成"连续撞开"的爽感）
    let cnt = 0;
    for (const b of barriers.values())
      if ((b.ax===ax&&b.ay===ay)||(b.bx===ax&&b.by===ay)||(b.ax===bx&&b.ay===by)||(b.bx===bx&&b.by===by)) cnt++;
    if (cnt >= 2) continue;

    barriers.set(edgeKey(ax, ay, bx, by), { type:'crate', ax, ay, bx, by });
    crates++;
  }

  // ---- 第二轮：铺护栏（这些会被可解性校验过滤，不影响通关）----
  for (const [ax, ay, bx, by] of edges){
    if (guards >= guardTarget) break;
    if (nearStart(ax, ay, bx, by)) continue;
    const k = edgeKey(ax, ay, bx, by);
    if (barriers.has(k)) continue;

    let cnt = 0;
    for (const b of barriers.values())
      if ((b.ax===ax&&b.ay===ay)||(b.bx===ax&&b.by===ay)||(b.ax===bx&&b.ay===by)||(b.bx===bx&&b.by===by)) cnt++;
    if (cnt >= 2) continue;

    barriers.set(k, { type:'guard', ax, ay, bx, by });
    guards++;
  }

  // ---- 可解性校验：保证不经过 guard 也能从起点走到终点 ----
  // 注意：crate 不算阻挡（撞一下就没了），所以只用 guard 做校验。
  const goal = farPointFrom(maze, start[0], start[1]);
  ensureSolvable(maze, barriers, goal);
  maze.goal = goal;

  // ---- 兜底：若 guard 过滤后 crate 数量被误伤（不会发生，但保险）----
  // 校验：crate 数必须 >= crateMin，否则补铺
  let cratesNow = [...barriers.values()].filter(b => b.type === 'crate').length;
  if (cratesNow < crateMin){
    for (const [ax, ay, bx, by] of edges){
      if (cratesNow >= crateMin) break;
      const k = edgeKey(ax, ay, bx, by);
      if (barriers.has(k)) continue;
      if (nearStart(ax, ay, bx, by)) continue;
      barriers.set(k, { type:'crate', ax, ay, bx, by });
      cratesNow++;
    }
  }

  return barriers;
}

/* 保证可解性：在"最少破坏"的前提下让起点→终点始终连通。
   思路：从空集开始，逐条尝试加回护栏——只有加回后仍连通的才保留。
   这样能最大化保留护栏数量，同时 100% 保证可通关。 */
function ensureSolvable(maze, barriers, goal){
  const { W, open, start } = maze;

  const canReach = (guardKeys) => {
    const blocked = new Set(guardKeys);
    const seen = new Uint8Array(W * maze.H);
    const q = [[start[0], start[1]]];
    seen[start[1] * W + start[0]] = 1;
    let head = 0;
    while (head < q.length){
      const [x, y] = q[head++];
      if (x === goal[0] && y === goal[1]) return true;
      for (const d of DIRS){
        const nx = x + DX[d], ny = y + DY[d];
        if (!open(nx, ny)) continue;
        if (blocked.has(edgeKey(x, y, nx, ny))) continue;
        if (seen[ny * W + nx]) continue;
        seen[ny * W + nx] = 1;
        q.push([nx, ny]);
      }
    }
    return false;
  };

  // 当前所有护栏
  const allGuards = [...barriers.entries()].filter(([, b]) => b.type === 'guard').map(([k]) => k);
  if (!allGuards.length) return;

  // 全部放开 → 必定连通（迷宫本身连通）。然后逐条加回。
  // 打乱加回顺序，让保留的护栏分布更均匀。
  const order = allGuards.slice();
  for (let i = order.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }

  const kept = new Set();
  for (const k of order){
    const trial = [...kept, k];
    if (canReach(trial)) kept.add(k);      // 加回后仍连通 → 保留
    // 否则这条护栏会切断通路 → 丢弃
  }

  // 同步到 barriers：删掉未保留的护栏
  for (const k of allGuards){
    if (!kept.has(k)) barriers.delete(k);
  }
}

/* 判断从 a 格到 b 格之间是否有路障 */
function barrierAt(maze, ax, ay, bx, by){
  if (!maze.barriers) return null;
  return maze.barriers.get(edgeKey(ax, ay, bx, by)) || null;
}

/* 从起点 BFS 取最远点作为终点（保证路径足够长） */
function farPointFrom(maze, sx, sy) {
  const { W, H, wall } = maze;
  const dist = new Int32Array(W * H).fill(-1);
  const q = [[sx, sy]];
  dist[sy * W + sx] = 0;
  let best = [sx, sy], head = 0;
  while (head < q.length) {
    const [x, y] = q[head++];
    const d0 = dist[y * W + x];
    if (d0 > dist[best[1] * W + best[0]]) best = [x, y];
    for (const d of DIRS) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (wall[ny][nx] !== 0) continue;
      if (dist[ny * W + nx] !== -1) continue;
      dist[ny * W + nx] = d0 + 1;
      q.push([nx, ny]);
    }
  }
  return best;
}

/* 相邻分区之间做颜色插值，避免突兀跳变 */
function lerpHex(a, b, t) {
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const c = pa.map((v,i) => Math.round(v + (pb[i]-v)*t));
  return '#' + c.map(v => v.toString(16).padStart(2,'0')).join('');
}
function lerpTheme(tA, tB, t) {
  if (t <= 0) return tA;
  if (t >= 1) return tB;
  return {
    name: t < .5 ? tA.name : tB.name,
    sky: [
      [lerpHex(tA.sky[0][0], tB.sky[0][0], t), lerpHex(tA.sky[0][1], tB.sky[0][1], t)],
      [lerpHex(tA.sky[1][0], tB.sky[1][0], t), lerpHex(tA.sky[1][1], tB.sky[1][1], t)]
    ],
    ground: lerpHex(tA.ground, tB.ground, t),
    trees: [
      [lerpHex(tA.trees[0][0], tB.trees[0][0], t), lerpHex(tA.trees[0][1], tB.trees[0][1], t)],
      [lerpHex(tA.trees[1][0], tB.trees[1][0], t), lerpHex(tA.trees[1][1], tB.trees[1][1], t)]
    ],
    treeType: tB.treeType,
    fog: lerpHex(tA.fog, tB.fog, t),
    accent: lerpHex(tA.accent, tB.accent, t)
  };
}

/* ==================================================================
   3. 游戏状态

const LEVELS = {

const S = {

};

const CARDINAL = [
  { key:'N', label:'向前', arrow:'↑', css:'straight', dv:[0,-1] },
  { key:'E', label:'向右', arrow:'→', css:'right',    dv:[1,0]  },
  { key:'S', label:'向后', arrow:'↓', css:'straight', dv:[0,1]  },
  { key:'W', label:'向左', arrow:'←', css:'left',     dv:[-1,0] }
];

function idx(x,y){ return y*S.maze.W + x; }
function cellHas(x,y){ return S.maze.open(x,y); }
function isDeadEnd(x,y){ return S.deadEndSet.has(x+','+y); }

/* ==================================================================
   3b. 彩蛋收集
   ================================================================== */
function eggById(id){ return EGGS.find(e => e.id === id); }

/* 从某个途径里挑一个"还没收集过"的彩蛋（按稀有度加权） */
function pickEgg(from, allowDup){
  const pool = EGGS.filter(e => e.from === from && (allowDup || !S.collected.has(e.id)));
  if (!pool.length) return null;
  // 稀有度加权
  const total = pool.reduce((s, e) => s + RARITY[e.rarity].weight, 0);
  let r = Math.random() * total;
  for (const e of pool){
    r -= RARITY[e.rarity].weight;
    if (r <= 0) return e;
  }
  return pool[pool.length - 1];
}

/* HTML 转义：本作所有拼接内容均为内置常量，此函数作为纵深防御兜底 */
function escapeHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* 收集一个彩蛋：入图鉴 + 弹卡片 + 播特效 */
function collectEgg(egg, sourceLabel){
  if (!egg) return;
  const isNew = !S.collected.has(egg.id);
  S.collected.add(egg.id);
  S.collectedSrc[egg.id] = sourceLabel;      // 记录实际获得方式（图鉴分组用）
  S.lastCollect = { egg, isNew, label:sourceLabel };

  // 收集粒子（在火车位置爆一圈）
  spawnEggBurst(S.cam.px, S.cam.py, RARITY[egg.rarity].col);

  refreshHUD();
  if (isNew){
    showEggCard(egg, sourceLabel);
  } else {
    showToast(`${RARITY[egg.rarity].name} · ${egg.name}`, '（重复获得）', 'good');
  }

  // 集齐判定
  if (S.collected.size >= S.totalEggs){
    setTimeout(() => finishGame(), 1200);
  }
}

/* 判断彩蛋是否已全部收集 */
function allCollected(){ return S.collected && S.collected.size >= S.totalEggs; }

/* 生成一圈金粉粒子 */
function spawnEggBurst(wx, wy, col){
  for (let i = 0; i < 26; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 0.5 + Math.random() * 1.3;
    S.fx.push({
      wx, wy, t:0, dur:0.7 + Math.random()*0.5,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      vz: 1.1 + Math.random()*1.8,
      kind:'bit', col: Math.random() < 0.45 ? col : '#fff6d8',
      size: 0.026 + Math.random()*0.05
    });
  }
  S.fx.push({ wx, wy, t:0, dur:0.85, kind:'ring' });
}

/* 获取某个格子可走的方向：墙体挡死 + 护栏挡死，可撞碎障碍则保留（会撞开） */
function exits(x,y){
  const out = [];
  for (let k=0;k<4;k++){
    const c = CARDINAL[k];
    const nx = x+c.dv[0], ny = y+c.dv[1];
    if (!cellHas(nx, ny)) continue;                 // 墙
    const b = barrierAt(S.maze, x, y, nx, ny);
    if (b && b.type === 'guard') continue;          // 护栏：永久挡死
    out.push(c);
  }
  return out;
}

/* 该方向上的路障（供渲染/选择时用） */
function barrierTo(x, y, dv){
  return barrierAt(S.maze, x, y, x+dv[0], y+dv[1]);
}

/* ==================================================================
   4. 开始 / 重置
   ================================================================== */
function startGame(levelName){
  S.level = levelName;
  const cfg = LEVELS[levelName];
  S.maze = genMaze(cfg.cw, cfg.ch);
  S.speed = cfg.speed;
  S.pos = [S.maze.start[0], S.maze.start[1]];
  S.heading = 1;
  S.trial = 0; S.junctions = 0; S.wrong = 0; S.totalTime = 0;
  S.visits = new Int32Array(S.maze.W * S.maze.H);
  S.visits[idx(S.pos[0], S.pos[1])] = 1;

  S.deadEndSet = new Set(S.maze.deadEnds.map(([x,y]) => x+','+y));
  const far = farPointFrom(S.maze, S.pos[0], S.pos[1]);
  S.goal = far;

  S.zoneCount = 6;
  S.cam = { px:S.pos[0]+0.5, py:S.pos[1]+0.5, ang:dirAngle(1), roll:0, shake:0,
            curTheme:themeAt(0,6) };
  S.anim = { phase:'idle', t:0, dur:0, from:null, to:null, cb:null };
  S.currentZoneF = 0;
  S.running = true;
  S.pending = false;
  S.route = [[S.pos[0], S.pos[1]]];   // 走过的路径栈
  S.deadDir = new Set();              // 已被证伪（通向死路）的格子坐标
  S.cratesBroken = 0;
  S.fx = [];

  // ---- 寻宝初始化 ----
  S.collected = new Set();
  S.chestsOpened = 0;
  S.eventsSeen = 0;
  S.pendingEgg = null;
  S.cardOpen = false;
  S.eventFx = null;
  S.collectedAt = {};                 // eggId -> 第几个收集
  S.collectedSrc = {};                // eggId -> 实际获得方式
  S.landEggs = new Map();             // 'x,y' -> eggId（走到即触发）
  S.finished = false;                 // 结算防重入标记

  document.getElementById('overlay').classList.add('hide');
  document.getElementById('panel').style.opacity = 1;
  hideToast();
  refreshHUD();
  buildHintEggs();

  // 起步：先直行到第一个岔路口
  setTimeout(() => { afterMove(); }, 350);
}

/* 把 event 类彩蛋分配到"某条具体的岔路方向"上，
   玩家选那个方向时触发对应演出——保证事件彩蛋全部可触发。
   分配完成后会做一次"可达性复核"：挂在不可达岔路上的彩蛋一律降级为
   "走到该格即触发"，确保 22 个彩蛋在任何地图上都拿得到。 */
function buildHintEggs(){
  const evEggs = shuffleArr(EGGS.filter(e => e.from === 'event').map(e => e.id));
  const maze = S.maze;
  const reach = maze.reachSet || reachableCells(maze);

  // 收集所有"可达岔路口 + 可达方向"作为触发点
  const spots = [];
  for (let y = 1; y <= maze.ch; y++)
    for (let x = 1; x <= maze.cw; x++){
      if (!maze.open(x, y)) continue;
      if (!reach.has(x + ',' + y)) continue;              // 岔路口本身要可达
      const ex = exits(x, y);
      if (ex.length < 2) continue;
      for (const c of ex){
        const nx = x + c.dv[0], ny = y + c.dv[1];
        if (!reach.has(nx + ',' + ny)) continue;          // 走过去的落点也要可达
        spots.push([x, y, c.dv[0], c.dv[1]]);
      }
    }
  shuffleArr(spots);

  const map = new Map();
  const leftover = [];
  evEggs.forEach((id, i) => {
    if (i < spots.length){
      const [x, y, dx, dy] = spots[i];
      map.set(x + ',' + y + '|' + dx + ',' + dy, id);
    } else {
      leftover.push(id);
    }
  });

  // ---- 降级：所有装不下的彩蛋改挂到"可达格"，走进去就触发 ----
  S.landEggs = new Map();
  if (leftover.length){
    const cells = [];
    for (let y = 1; y <= maze.ch; y++)
      for (let x = 1; x <= maze.cw; x++){
        if (!maze.open(x, y)) continue;
        if (!reach.has(x + ',' + y)) continue;
        if (x === maze.start[0] && y === maze.start[1]) continue;
        // 优先放在"当前没挂事件方向"的格子，避免同一格挤太多
        cells.push([x, y]);
      }
    shuffleArr(cells);
    leftover.forEach((id, i) => {
      if (i < cells.length) S.landEggs.set(cells[i][0] + ',' + cells[i][1], id);
    });
  }

  S.hintEggs = map;
  S.eventEggsTotal = evEggs.length;
  S.eventEggsPlaced = Math.min(evEggs.length, spots.length);
}

/* 某个岔路方向是否挂着隐藏事件 */
function eventAt(x, y, dv){
  if (!S.hintEggs) return null;
  const id = S.hintEggs.get(x + ',' + y + '|' + dv[0] + ',' + dv[1]);
  return id ? eggById(id) : null;
}

function dirAngle(heading){
  // heading: 0北 1东 2南 3西  →  屏幕角度
  return [ -Math.PI/2, 0, Math.PI/2, Math.PI ][heading];
}

/* 屏幕移动向量 → heading 索引 */
function headingOf(dx, dy){
  if (dx === 1) return 1;
  if (dx === -1) return 3;
  if (dy === 1) return 2;
  return 0;
}

/* 拾取当前格子的宝箱；返回 true 表示"正在开箱/弹卡片"，流程暂停 */
function tryOpenChest(x, y){
  if (!S.maze.chests) return false;
  const ch = S.maze.chests.find(c => !c.opened && c.x === x && c.y === y);
  if (!ch) return false;
  ch.opened = true;
  S.chestsOpened++;

  // 同一格里可能塞了多张卡（极小地图兜底）：优先给还没收集过的
  const pool = [ch.eggId].concat(ch.extra || []);
  let pick = pool.find(id => !S.collected.has(id)) || pool[0];
  // 剩下的留在原地，下次还能再开
  const rest = pool.filter(id => id !== pick);
  if (rest.length){
    S.maze.chests.push({ x, y, eggId:rest[0], extra:rest.slice(1), opened:false });
  }

  const egg = eggById(pick);
  // 开箱粒子
  spawnEggBurst(x + 0.5, y + 0.5, '#ffd15c');
  collectEgg(egg, '发现宝箱');
  return true;   // 收集流程会在卡片关闭后回调 resumeFlow()
}

/* 卡片/事件结束后，从中断处继续前进 */
function resumeFlow(){
  const [x, y] = S.pos;
  const ex = exits(x, y);
  if (ex.length === 0) { arriveDeadEnd(); return; }
  if (ex.length === 1) {
    const prev = S.route.length >= 2 ? S.route[S.route.length - 2] : null;
    const c = ex[0];
    if (prev && x + c.dv[0] === prev[0] && y + c.dv[1] === prev[1]) { arriveDeadEnd(); return; }
    S.pending = false;
    doMove(c.dv[0], c.dv[1]);
    return;
  }
  const fresh = ex.filter(c => !S.deadDir.has((x + c.dv[0]) + ',' + (y + c.dv[1])));
  if (fresh.length === 0) { arriveDeadEnd(); return; }
  if (fresh.length === 1) { S.pending = false; doMove(fresh[0].dv[0], fresh[0].dv[1]); return; }
  S.junctions++;
  askDirection(fresh);
}

/* 抵达当前格子后的判定 */
function afterMove(){
  const [x, y] = S.pos;

  // —— 先看看这格有没有宝箱 ——
  if (tryOpenChest(x, y)) return;   // 开箱会弹卡片，结束后再继续

  // —— 关卡太小导致事件彩蛋没地方挂时，走进去就触发 ——
  if (S.landEggs && S.landEggs.size){
    const id = S.landEggs.get(x + ',' + y);
    if (id){
      S.landEggs.delete(x + ',' + y);
      const egg = eggById(id);
      if (egg && !S.collected.has(egg.id)){ triggerEvent(egg); return; }
    }
  }

  const ex = exits(x, y);

  // —— 无路可走：死路 ——
  if (ex.length === 0) { arriveDeadEnd(); return; }

  // —— 单通路：自动直行（若唯一出口是原路，说明这条支路是口袋 → 判死路） ——
  if (ex.length === 1) {
    const prev = S.route.length >= 2 ? S.route[S.route.length - 2] : null;
    const c = ex[0];
    const nx = x + c.dv[0], ny = y + c.dv[1];
    if (prev && nx === prev[0] && ny === prev[1]) { arriveDeadEnd(); return; }
    S.pending = false;
    doMove(c.dv[0], c.dv[1]);
    return;
  }

  // —— 岔路口（>=2 条路）：优先排除已证伪的死方向 ——
  const fresh = ex.filter(c => !S.deadDir.has(S.pos[0]+c.dv[0] + ',' + (S.pos[1]+c.dv[1])));
  if (fresh.length === 1) {
    // 只剩一条没试过的路 → 自动走，不打扰玩家
    S.pending = false;
    doMove(fresh[0].dv[0], fresh[0].dv[1]);
    return;
  }
  if (fresh.length === 0) {
    // 所有方向都试过了 → 说明整条支路都不通，继续倒车
    arriveDeadEnd();
    return;
  }

  S.junctions++;
  askDirection(fresh);
}

/* 死路处理：记录被证伪的方向 + 播报 + 沿原路倒回最近可重选的岔路口 */
function arriveDeadEnd(){
  S.wrong++;
  // 把"通向死路的那次选择"标记为已证伪，回退后不会再选
  if (S.route.length >= 2) {
    const dead = S.route[S.route.length - 1];
    S.deadDir.add(dead[0] + ',' + dead[1]);
  }
  refreshHUD();
  showToast('🚧 前面是死路！', '正在原路倒车…', 'warn');
  document.getElementById('choices').innerHTML = '';
  document.getElementById('hint').textContent = '倒车中…';
  S.pending = false;
  S.anim = { phase:'shunt', t:0, dur:0.9, cb:()=>{ rewindToJunction(); } };
}

/* 倒回：沿 route 栈逐步回退，直到找到一个还有"未证伪方向"的岔路 */
function rewindToJunction(){
  S.route.pop();
  backtrackStep();
}

function backtrackStep(){
  if (S.route.length <= 1) {
    // 回到起点（死路标记永久保留，不丢记忆）
    S.pos = [S.maze.start[0], S.maze.start[1]];
    S.route = [[S.pos[0], S.pos[1]]];
    showToast('回到起点', '重新选择方向', 'warn');
    setTimeout(afterMove, 700);
    return;
  }
  const cur = S.route[S.route.length - 1];
  const target = [cur[0], cur[1]];
  const dx = target[0] - S.pos[0], dy = target[1] - S.pos[1];

  S.anim = {
    phase:'shunt', t:0, dur:0.5,
    from:[S.pos[0]+0.5, S.pos[1]+0.5],
    to:[target[0]+0.5, target[1]+0.5],
    cb:() => {
      S.pos = target;
      const ex = exits(target[0], target[1]);
      const fresh = ex.filter(c => !S.deadDir.has((target[0]+c.dv[0]) + ',' + (target[1]+c.dv[1])));
      if (ex.length >= 2 && fresh.length >= 2) {
        // 还有 2 条以上可选 → 停下来让玩家重选
        S.junctions++;
        askDirection(fresh);
        return;
      }
      if (ex.length >= 2 && fresh.length === 1) {
        // 只有一条没试过的 → 自动走
        doMove(fresh[0].dv[0], fresh[0].dv[1]);
        return;
      }
      if (ex.length >= 2 && fresh.length === 0) {
        // 该岔路全部试完，继续退
        S.route.pop();
        backtrackStep();
        return;
      }
      // 单通路格：继续退
      S.route.pop();
      if (S.pos[0] === S.maze.start[0] && S.pos[1] === S.maze.start[1]) {
        setTimeout(() => askDirection(exits(S.pos[0], S.pos[1])), 400);
        return;
      }
      backtrackStep();
    }
  };
  S.heading = headingOf(dx === 0 ? 0 : Math.sign(dx), dy === 0 ? 0 : Math.sign(dy));
  S.cam.ang = dirAngle(S.heading);
}

/* 弹出方向选择 */
function askDirection(exitsList){
  S.pending = true;
  S.choices = exitsList;
  const panel = document.getElementById('choices');
  panel.innerHTML = '';
  exitsList.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'dir ' + c.css;
    // 目标格走过几次？给玩家记忆提示
    const tx = S.pos[0] + c.dv[0], ty = S.pos[1] + c.dv[1];
    const v = S.visits[idx(tx, ty)] || 0;
    // 这条路上有可撞碎的路障？
    const bar = barrierTo(S.pos[0], S.pos[1], c.dv);
    let sub;
    if (bar && bar.type === 'crate'){
      el.classList.add('has-crate');
      sub = '<span class="sub crate">⚠ 有路障 · 可撞开</span>';
    } else if (v === 0){
      sub = '<span class="sub new">✨ 新路</span>';
    } else {
      sub = `<span class="sub seen">走过 ${v} 次 · 按 ${i+1}</span>`;
    }
    el.innerHTML = `<span class="arw">${c.arrow}</span><span>${escapeHtml(c.label)}</span>${sub}`;
    // 这条方向挂着一个未触发的隐藏事件 → 给个微光提示（不剧透内容）
    if (eventAt(S.pos[0], S.pos[1], c.dv)){
      el.classList.add('has-egg');
      el.innerHTML += '<span class="glow"></span>';
    }
    bindTap(el, () => chooseDir(i));
    panel.appendChild(el);
  });
  document.getElementById('hint').textContent = '前方岔路口 —— 往哪走？';
  document.getElementById('panel').style.opacity = 1;
}

function chooseDir(i){
  if (!S.pending || !S.choices[i]) return;
  const c = S.choices[i];
  S.pending = false;
  document.getElementById('hint').textContent = '行驶中…';
  document.getElementById('choices').innerHTML = '';
  doMove(c.dv[0], c.dv[1]);
}

/* 真正执行一次移动（含转向动画 + 撞碎可撞障碍 + 拾取宝箱） */
function doMove(ddx, ddy){
  const nx = S.pos[0] + ddx, ny = S.pos[1] + ddy;
  if (!S.maze.open(nx, ny)) return;

  // 撞上可撞碎的路障 → 记录下来，到达后清掉
  const bar = barrierTo(S.pos[0], S.pos[1], [ddx, ddy]);
  let hitCrate = null, crateEgg = null;
  if (bar && bar.type === 'crate'){
    hitCrate = edgeKey(bar.ax, bar.ay, bar.bx, bar.by);
    crateEgg = bar.drop ? eggById(bar.drop) : null;
  }

  // 这个岔路方向是否挂着隐藏事件
  const evEgg = eventAt(S.pos[0], S.pos[1], [ddx, ddy]);

  const targetHeading = headingOf(ddx, ddy);

  S.anim = {
    phase:'move', t:0, dur:(1 / S.speed) * (hitCrate ? 1.35 : 1),
    from:[S.pos[0] + 0.5, S.pos[1] + 0.5],
    to:[nx + 0.5, ny + 0.5],
    turnFrom:S.cam.ang, turnTo:dirAngle(targetHeading),
    hitCrate,
    shakeT:0,
    cb:() => {
      if (hitCrate){
        S.maze.barriers.delete(hitCrate);
        S.cratesBroken++;
        refreshHUD();
        // 撞击粒子
        spawnCrashFx(nx + 0.5, ny + 0.5);
        // 掉落彩蛋
        if (crateEgg) collectEgg(crateEgg, '撞碎路障');
      }
      // 隐藏事件演出
      if (evEgg && !S.collected.has(evEgg.id)){
        S.hintEggs.delete(S.pos[0] + ',' + S.pos[1] + '|' + ddx + ',' + ddy);
        triggerEvent(evEgg);
        return;   // 事件演出结束后再继续
      }
      afterMove();
    }
  };
  S.heading = targetHeading;
  S.pos = [nx, ny];
  S.route.push([nx, ny]);
  S.trial++;
  S.visits[idx(nx, ny)] = (S.visits[idx(nx, ny)] || 0) + 1;
  refreshHUD();
}

/* 岔路隐藏事件：播一段特效演出，然后收集彩蛋 */
function triggerEvent(egg){
  S.eventsSeen++;
  S.eventFx = { kind: egg.id, t:0, dur:2.0 };
  showToast('✨ 好像有什么东西……', '', 'good');
  setTimeout(() => {
    collectEgg(egg, '隐藏事件');
    S.eventFx = null;
    setTimeout(() => { if (!S.cardOpen) afterMove(); }, 300);

}

      </p>
      <div class="stat-grid">
        <div class="stat"><div class="v">${S.totalEggs}</div><div class="k">彩蛋总数</div></div>
        <div class="stat"><div class="v">${S.chestsOpened}</div><div class="k">开启宝箱</div></div>
        <div class="stat"><div class="v">${S.eventsSeen}</div><div class="k">触发事件</div></div>
        <div class="stat"><div class="v">${S.cratesBroken}</div><div class="k">撞碎路障</div></div>
      </div>
      <p style="text-align:center;color:#8fa6d8;font-size:12.5px;margin-bottom:18px;letter-spacing:.5px">

function resetCard(){
  document.getElementById('card').innerHTML = START_CARD_HTML;
