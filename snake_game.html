<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌈 彩虹小蛇大冒险 🌈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #FFD86B 0%, #FF9E6D 35%, #A18CD1 100%);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 4px 6px;
    gap: 6px;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    flex: 0 0 auto;
    font-size: clamp(18px, 5.2vw, 26px);
    color: #fff;
    text-shadow: 2px 2px 0 #FF6FA5, 4px 4px 0 rgba(0,0,0,.15);
    margin-bottom: 0;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .topbar {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    margin-bottom: 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    background: #fff;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: clamp(13px, 4vw, 17px);
    font-weight: bold;
    color: #FF6FA5;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
    white-space: nowrap;
  }
  /* 回乐园 */
  .topbar .home {
    border: none;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #FFF3FB;
    color: #7A5C9E;
  }
  .topbar .home:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }
  /* 声音 / 温柔模式开关 */
  .topbar .toggle { padding: 5px 10px; }
  .topbar .toggle.off { background: #EDE8F7; color: #B4A6CC; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .chip.empty { opacity: .55; }
  /* 窄屏只留图标，避免状态栏换行挤压棋盘 */
  @media (max-width: 520px) {
    .topbar .home-label { display: none; }
  }

  #gameWrap {
    --board: 360px;                /* 由 JS 写入实际棋盘边长，面板内文字按此缩放 */
    position: relative;
    border-radius: 24px;
    padding: 8px;
    background: rgba(255,255,255,.35);
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    flex: 0 0 auto;
  }
  canvas {
    border-radius: 18px;
    display: block;
    touch-action: none;            /* 手势自行处理，禁止页面滚动/缩放 */
    -webkit-touch-callout: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: rgba(255, 240, 245, .92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: clamp(30px, calc(var(--board) * 0.11), 76px); margin-bottom: clamp(6px, calc(var(--board) * 0.02), 18px); }
  .overlay .msg { font-size: clamp(14px, calc(var(--board) * 0.043), 28px); color: #7A5C9E; margin-bottom: 6px; line-height: 1.5; }
  .btn {
    margin-top: clamp(10px, calc(var(--board) * 0.03), 26px);
    font-size: clamp(17px, calc(var(--board) * 0.052), 32px);
    font-weight: bold;
    color: #fff;
    background: linear-gradient(180deg, #FF8AC2, #FF5FA0);
    border: none;
    border-radius: 1.4em;
    padding: 0.52em 1.5em;
    cursor: pointer;
    box-shadow: 0 0.22em 0 #D14C86;
    font-family: inherit;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #D14C86; }
  .controls {
    flex: 0 0 auto;
    margin-top: 0;
    display: grid;
    grid-template-columns: repeat(3, 76px);
    grid-template-rows: repeat(2, 76px);
    gap: 10px;
    justify-content: center;
  }
  .pad {
    font-size: 34px;
    background: #fff;
    border: none;
    border-radius: 20px;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
    cursor: pointer;
    color: #7A5C9E;
    touch-action: none;            /* 按下即响应，不等待 click */
    -webkit-user-select: none;
    user-select: none;
  }
  .pad:active, .pad.pressed { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.15); background: #FFF3FB; }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  #starRow {
    flex: 0 0 auto;
    font-size: clamp(15px, 4vw, 20px);
    margin-top: 0;
    letter-spacing: 2px;
    line-height: 1.35;
    text-align: center;
  }
  .star { color: #FFC93C; }
  .star.off { color: #D8CBBB; }

  /* 窄屏：把画布四周的留白压到最小，棋盘尽量占满宽度 */
  @media (max-width: 520px) {
    #gameWrap { padding: 5px; border-radius: 18px; }
    canvas { border-radius: 14px; }
    .overlay { border-radius: 18px; }
  }

  /* 矮屏 / 横屏：压缩标签与按键，保证画布与按钮都留在视口内 */
  @media (max-height: 640px) {
    h1 { font-size: 17px; }
    .chip { font-size: 15px; padding: 4px 12px; }
    #starRow { font-size: 14px; letter-spacing: 1px; }
    .controls {
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 8px;
    }
    .pad { font-size: 27px; border-radius: 16px; }
  }

  /* 横屏且高度不足：方向键移到画布右侧，纵向空间全留给棋盘 */
  @media (orientation: landscape) and (max-height: 520px) {
    body {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto 1fr;
      justify-content: center;
      align-content: center;
      column-gap: 14px;
      row-gap: 4px;
      padding: 4px 10px;
    }
    h1 { grid-column: 1 / -1; grid-row: 1; justify-self: center; font-size: 16px; }
    .topbar { grid-column: 1 / -1; grid-row: 2; justify-self: center; gap: 8px; }
    #gameWrap { grid-column: 1; grid-row: 3; align-self: center; padding: 6px; }
    #starRow { display: none; }          /* 横屏空间紧张，得分与目标已在上方标签中 */
    .controls {
      grid-column: 2; grid-row: 3; align-self: center;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
    }
    .pad { font-size: 26px; border-radius: 16px; }
  }

  /* 宽屏横屏：棋盘在左、方向键在右，把整块纵向空间都给棋盘 */
  @media (min-width: 860px) and (orientation: landscape) {
    body {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto auto auto;
      justify-content: center;
      align-content: center;
      column-gap: 20px;
      row-gap: 8px;
      padding: 8px 14px;
    }
    h1 { grid-column: 1 / -1; grid-row: 1; justify-self: center; font-size: 26px; }
    .topbar { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
    #gameWrap { grid-column: 1; grid-row: 3; align-self: center; padding: 8px; }
    .controls {
      grid-column: 2; grid-row: 3; align-self: center;
      grid-template-columns: repeat(3, clamp(58px, 10vh, 88px));
      grid-template-rows: repeat(2, clamp(58px, 10vh, 88px));
      gap: clamp(8px, 1.6vh, 14px);
    }
    .pad { font-size: clamp(26px, 4vh, 36px); }
    .chip { font-size: 19px; padding: 6px 16px; }
    #starRow { grid-column: 1 / -1; grid-row: 4; justify-self: center; font-size: 22px; }
  }
</style>
</head>
<body>
  <h1>🌈 彩虹小蛇大冒险 🌈</h1>
  <div class="topbar">
    <button class="chip home" id="homeBtn" type="button" title="回到游戏乐园" aria-label="回到游戏乐园">🏠<span class="home-label"> 回乐园</span></button>
    <div class="chip">🍬 得分 <span id="score">0</span></div>
    <div class="chip">🚩 第 <span id="level">1</span> 关</div>
    <div class="chip">🎯 目标 <span id="goal">5</span></div>
    <div class="chip" id="shieldChip">🛡️ 护盾 <span id="shieldN">1</span></div>
    <button class="chip home toggle" id="modeBtn" type="button" title="温柔模式开关" aria-label="温柔模式开关">🛡️<span class="home-label" id="modeLabel"> 温柔模式</span></button>
    <button class="chip home toggle" id="soundBtn" type="button" title="声音开关" aria-label="声音开关">🔊</button>
  </div>
  <div id="gameWrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovEmoji">🐍</div>
      <div class="msg" id="ovTitle">彩虹小蛇大冒险</div>
      <div class="msg" id="ovText">帮小蛇吃到糖果吧！<br>在画面上滑动手指，或按下面的方向键～<br>🛡️ 每关自带 1 次护盾，撞墙也不怕～</div>
      <button class="btn" id="startBtn">开始玩啦 🎉</button>
    </div>
  </div>
  <div id="starRow"></div>
  <div class="controls">
    <button class="pad up" data-dir="up">⬆️</button>
    <button class="pad left" data-dir="left">⬅️</button>
    <button class="pad down" data-dir="down">⬇️</button>
    <button class="pad right" data-dir="right">➡️</button>
  </div>

<script>
(function () {
  const CELL = 30;
  const COLS = 16;
  const ROWS = 16;
  const BASE = COLS * CELL;          // 逻辑坐标系边长（所有绘制都按 480 计算，再整体缩放）
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = BASE;
  canvas.height = BASE;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const goalEl = document.getElementById('goal');
  const starRow = document.getElementById('starRow');
  const overlay = document.getElementById('overlay');
  const ovEmoji = document.getElementById('ovEmoji');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const h1El = document.querySelector('h1');
  const topbarEl = document.querySelector('.topbar');
  const controlsEl = document.querySelector('.controls');
  const gameWrap = document.getElementById('gameWrap');
  const soundBtn = document.getElementById('soundBtn');
  const modeBtn = document.getElementById('modeBtn');
  const modeLabel = document.getElementById('modeLabel');
  const shieldChip = document.getElementById('shieldChip');
  const shieldN = document.getElementById('shieldN');

  /* ============ 偏好设置（声音 / 温柔模式） ============ */
  const PREF_KEY = 'rainbow_snake_prefs_v1';
  const prefs = { muted: false, gentle: true };        // 温柔模式默认开启，更适合小朋友
  try {
    const saved = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    if (typeof saved.muted === 'boolean') prefs.muted = saved.muted;
    if (typeof saved.gentle === 'boolean') prefs.gentle = saved.gentle;
  } catch (e) { /* 隐私模式或 file:// 限制，忽略即可 */ }
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
  }

  /* ============ 音效（Web Audio 合成，无外部音频文件） ============ */
  let actx = null;
  function ensureAudio() {
    if (prefs.muted) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) { try { actx = new AC(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();   // iOS/Safari 需在用户手势里恢复
    return actx;
  }
  function tone(freq, dur, type, vol, delay, freqEnd) {
    const a = ensureAudio();
    if (!a) return;
    const t0 = a.currentTime + (delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = type || 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880.00];
  function sfx(kind) {
    if (prefs.muted) return;
    if (kind === 'eat') {
      // 每吃一颗就往上爬一个音阶，连吃越多越兴奋
      const step = Math.max(0, eaten - 1);
      const f = PENTA[step % PENTA.length] * (step >= PENTA.length ? 2 : 1);
      tone(f, 0.11, 'triangle', 0.15);
      tone(f * 1.5, 0.15, 'sine', 0.09, 0.05);
    } else if (kind === 'level') {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.26, 'triangle', 0.17, i * 0.11));
      tone(1046.5, 0.5, 'sine', 0.10, 0.5);
    } else if (kind === 'win') {
      [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, 0.3, 'triangle', 0.17, i * 0.12));
      tone(1046.5, 0.75, 'sine', 0.11, 0.6);
      tone(1318.5, 0.75, 'sine', 0.09, 0.6);
    } else if (kind === 'shield') {
      tone(196, 0.22, 'sine', 0.13, 0, 150);          // 柔和的一“咚”，不吓人
      tone(880, 0.12, 'sine', 0.10, 0.05);
      tone(1318.5, 0.18, 'sine', 0.08, 0.12);         // 护盾亮起的闪光
    } else if (kind === 'over') {
      [392, 329.63, 261.63].forEach((f, i) => tone(f, 0.3, 'sine', 0.13, i * 0.16, f * 0.92));
    } else if (kind === 'start') {
      tone(523.25, 0.11, 'triangle', 0.14);
      tone(783.99, 0.16, 'triangle', 0.12, 0.09);
    } else if (kind === 'ui') {
      tone(660, 0.07, 'sine', 0.09);
    }
  }

  // 关卡配置：吃满 goal 颗糖过关。越后面速度越快、障碍越多
  const LEVELS = [
    { goal: 5, speed: 640, walls: 0,  bg: ['#FFF7D6', '#FFEDB8'], name: '草地迷宫' },
    { goal: 6, speed: 560, walls: 4,  bg: ['#E0F7FF', '#C4ECFF'], name: '大海遨游' },
    { goal: 7, speed: 500, walls: 7,  bg: ['#FDE7FF', '#F6D2FF'], name: '糖果森林' },
    { goal: 8, speed: 440, walls: 10, bg: ['#FFF0E0', '#FFE0C2'], name: '云朵天空' },
    { goal: 10, speed: 380, walls: 14, bg: ['#E7FFE9', '#D2F7D8'], name: '星空探险' }
  ];

  let level = 0;
  let score = 0;
  let eaten = 0;
  let snake, dir, nextDir, food, walls, timer, running = false, dead = false;
  let queue = [];   // 待执行方向队列（最多 2 个），让连续拐弯不丢指令

  /* ============ 温柔模式：每关 1 次护盾 + 撞墙前停顿等待拐弯 ============ */
  const GRACE_MS = 2600;                            // 护盾触发后的思考时间
  let shield = 0;
  const grace = { active: false, endAt: 0, timer: 0, raf: 0 };

  function resetLevel() {
    const cfg = LEVELS[level];
    eaten = 0;
    goalEl.textContent = cfg.goal;
    levelEl.textContent = level + 1;
    snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    queue = [];
    shield = prefs.gentle ? 1 : 0;      // 每关自带 1 次护盾
    updateShield();
    // 生成障碍（避开出生行）
    walls = [];
    let tries = 0;
    while (walls.length < cfg.walls && tries < 500) {
      tries++;
      const w = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      if (w.y === 10 || (w.x >= 5 && w.x <= 9 && w.y >= 9 && w.y <= 11)) continue;
      if (walls.some(o => o.x === w.x && o.y === w.y)) continue;
      walls.push(w);
    }
    placeFood();
    updateScore();
  }

  function placeFood() {
    let f;
    do {
      f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (
      snake.some(s => s.x === f.x && s.y === f.y) ||
      walls.some(w => w.x === f.x && w.y === f.y)
    );
    food = f;
  }

  function updateScore() {
    scoreEl.textContent = score;
    const need = LEVELS[level].goal;
    let s = '';
    for (let i = 0; i < need; i++) {
      s += '<span class="star' + (i < eaten ? '' : ' off') + '">⭐</span>';
    }
    starRow.innerHTML = '收集糖果：' + s;
    requestAnimationFrame(fitCanvas);   // 星星行高度可能变化，重算画布尺寸
  }

  function updateShield() {
    shieldN.textContent = Math.max(0, shield);
    shieldChip.style.display = prefs.gentle ? '' : 'none';
    shieldChip.classList.toggle('empty', shield <= 0);
  }

  // 与 CSS 中的断点保持一致：宽屏横屏（棋盘左、按键右）、矮横屏（同布局但更紧凑）
  const mqWide = window.matchMedia('(min-width: 860px) and (orientation: landscape)');
  const mqCompact = window.matchMedia('(orientation: landscape) and (max-height: 520px)');

  function cssNum(el, prop) {
    return parseFloat(getComputedStyle(el)[prop]) || 0;
  }

  // 棋盘边长 = 视口实测可用空间的最小边；再按 devicePixelRatio 提高内部渲染分辨率，
  // 因此放大后依然是清晰的（不会像位图拉伸那样发虚）。
  function fitCanvas() {
    const padX = cssNum(document.body, 'paddingLeft') + cssNum(document.body, 'paddingRight');
    const padY = cssNum(document.body, 'paddingTop') + cssNum(document.body, 'paddingBottom');
    const gapY = parseFloat(getComputedStyle(document.body).rowGap) || 0;
    const gapX = parseFloat(getComputedStyle(document.body).columnGap) || 0;
    const wrapPadX = cssNum(gameWrap, 'paddingLeft') + cssNum(gameWrap, 'paddingRight');
    const wrapPadY = cssNum(gameWrap, 'paddingTop') + cssNum(gameWrap, 'paddingBottom');

    let availW, availH;
    if (mqWide.matches || mqCompact.matches) {
      // 两列布局：棋盘左侧，方向键右侧，纵向只被标题/标签/星星行占用
      const gapCount = starRow.offsetHeight > 0 ? 3 : 2;   // 紧凑横屏隐藏了星星行
      const headH = h1El.offsetHeight + topbarEl.offsetHeight + starRow.offsetHeight;
      availH = window.innerHeight - padY - headH - gapY * gapCount - wrapPadY;
      availW = window.innerWidth - padX - gapX - controlsEl.offsetWidth - wrapPadX;
    } else {
      // 单列布局：纵向还要扣掉底部方向键
      const others = h1El.offsetHeight + topbarEl.offsetHeight + starRow.offsetHeight + controlsEl.offsetHeight;
      availH = window.innerHeight - padY - others - gapY * 4 - wrapPadY;
      availW = window.innerWidth - padX - wrapPadX;
    }

    const size = Math.max(160, Math.floor(Math.min(availW, availH)));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const buf = Math.round(size * dpr);

    if (canvas.style.width !== size + 'px') {
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      gameWrap.style.setProperty('--board', size + 'px');   // 面板内文字随棋盘缩放
    }
    if (canvas.width !== buf) {
      canvas.width = buf;             // 改尺寸会重置画布状态，下面重新设置变换
      canvas.height = buf;
    }
    const k = buf / BASE;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    draw();
  }

  function draw() {
    if (!snake || !food || !walls) return;
    const [bg1, bg2] = LEVELS[level].bg;
    // 背景（绘制坐标统一用 BASE 逻辑空间，实际像素由 ctx 变换缩放）
    const g = ctx.createLinearGradient(0, 0, BASE, BASE);
    g.addColorStop(0, bg1);
    g.addColorStop(1, bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, BASE, BASE);

    // 淡淡的格子
    ctx.strokeStyle = 'rgba(0,0,0,0.04)';
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, BASE); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(BASE, i*CELL); ctx.stroke();
    }

    // 障碍：小石头
    walls.forEach(w => {
      roundRect(w.x*CELL+3, w.y*CELL+3, CELL-6, CELL-6, 8);
      ctx.fillStyle = '#B7A7D9';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath();
      ctx.arc(w.x*CELL+CELL/2-5, w.y*CELL+CELL/2-5, 4, 0, Math.PI*2);
      ctx.fill();
    });

    // 糖果
    const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL*0.34, 0, Math.PI*2);
    ctx.fillStyle = '#FF5FA0';
    ctx.fill();
    ctx.fillStyle = '#FFC93C';
    ctx.beginPath();
    ctx.arc(fx-5, fy-5, 4, 0, Math.PI*2);
    ctx.fill();
    // 糖果棒
    ctx.strokeStyle = '#7A5C9E';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx+8, fy-8);
    ctx.lineTo(fx+14, fy-14);
    ctx.stroke();

    // 小蛇：彩虹身体
    snake.forEach((s, i) => {
      const hue = (i * 24 + 100) % 360;
      ctx.fillStyle = 'hsl(' + hue + ', 85%, 60%)';
      roundRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, 9);
      ctx.fill();
    });
    // 眼睛
    const head = snake[0];
    const ex = head.x*CELL + CELL/2, ey = head.y*CELL + CELL/2;
    const off = 6;
    const dx = dir.x, dy = dir.y;
    // 两只眼睛垂直于前进方向分布
    const eyes = dx !== 0
      ? [[ex + dx*4, ey - off], [ex + dx*4, ey + off]]
      : [[ex - off, ey + dy*4], [ex + off, ey + dy*4]];
    eyes.forEach(([x, y]) => {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(x + dx*1.5, y + dy*1.5, 2.8, 0, Math.PI*2); ctx.fill();
    });

    if (grace.active) drawGrace();     // 护盾暂停中的光圈与提示条
  }

  // 护盾触发时：蛇头亮起光圈 + 顶部提示条 + 倒计时，等小朋友拐弯
  function drawGrace() {
    const head = snake[0];
    const cx = head.x*CELL + CELL/2, cy = head.y*CELL + CELL/2;
    const t = performance.now();
    const pulse = (Math.sin(t / 160) + 1) / 2;

    ctx.save();
    ctx.strokeStyle = 'rgba(255,201,60,' + (0.5 + pulse * 0.5) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.52 + pulse * 4, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * 0.52 + pulse * 4, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // 提示条放在蛇头的另一侧，避免正好遮住小蛇
    const bw = BASE - 32, bh = 56, bx = 16;
    const by = head.y < ROWS / 2 ? BASE - bh - 14 : 14;
    roundRect(bx, by, bw, bh, 16);
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.fill();
    ctx.strokeStyle = '#FFC93C';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#7A5C9E';
    ctx.font = 'bold 21px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('🛡️ 护盾挡住啦！快拐个弯～', BASE/2, by + 23);

    const ratio = Math.max(0, Math.min(1, (grace.endAt - t) / GRACE_MS));
    const pw = bw - 32;
    roundRect(bx + 16, by + 41, pw, 7, 4);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.fill();
    if (ratio > 0.01) {
      roundRect(bx + 16, by + 41, Math.max(4, pw * ratio), 7, 4);
      ctx.fillStyle = '#FF8AC2';
      ctx.fill();
    }
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 目标格是否撞到（墙、障碍、自己）。ignoreTail：温柔模式下允许走进正在移开的尾格
  function isBlocked(x, y, ignoreTail) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
    if (walls.some(w => w.x === x && w.y === y)) return true;
    const n = ignoreTail ? snake.length - 1 : snake.length;
    for (let i = 0; i < n; i++) if (snake[i].x === x && snake[i].y === y) return true;
    return false;
  }

  // 从某个格子出发能连通多少空地（最多数 40 格），用来挑最安全的方向
  function freeArea(sx, sy) {
    const seen = new Set([sx + ',' + sy]);
    const q = [[sx, sy]];
    let count = 0;
    const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (q.length && count < 40) {
      const cur = q.shift();
      count++;
      for (let i = 0; i < 4; i++) {
        const nx = cur[0] + DIRS4[i][0], ny = cur[1] + DIRS4[i][1];
        const key = nx + ',' + ny;
        if (seen.has(key)) continue;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        if (walls.some(w => w.x === nx && w.y === ny)) continue;
        if (snake.some((s, k) => k < snake.length - 1 && s.x === nx && s.y === ny)) continue;
        seen.add(key);
        q.push([nx, ny]);
      }
    }
    return count;
  }

  // 停顿结束时自动帮小蛇挑一条最宽敞的活路（左转 / 右转 / 掉头 / 直行里最安全的）
  function pickSafeDir() {
    const head = snake[0];
    const cands = [
      {x: dir.y, y: -dir.x},
      {x: -dir.y, y: dir.x},
      {x: -dir.x, y: -dir.y},
      {x: dir.x, y: dir.y}
    ];
    let best = null, bestScore = -1;
    cands.forEach(c => {
      if (isBlocked(head.x + c.x, head.y + c.y, true)) return;
      const s = freeArea(head.x + c.x, head.y + c.y);
      if (s > bestScore) { bestScore = s; best = c; }
    });
    return best;
  }

  function startGrace() {
    queue = [];                       // 丢掉会撞的那个方向，等新指令
    grace.active = true;
    grace.endAt = performance.now() + GRACE_MS;
    clearInterval(timer);
    timer = null;
    clearTimeout(grace.timer);
    grace.timer = setTimeout(endGrace, GRACE_MS);
    cancelAnimationFrame(grace.raf);
    grace.raf = requestAnimationFrame(animateGrace);
    sfx('shield');
  }

  function animateGrace() {
    if (!grace.active) return;
    draw();
    grace.raf = requestAnimationFrame(animateGrace);
  }

  function stopGrace() {
    grace.active = false;
    clearTimeout(grace.timer);
    grace.timer = 0;
    cancelAnimationFrame(grace.raf);
    grace.raf = 0;
  }

  function resumeAfterGrace() {
    stopGrace();
    draw();
    if (running) startLoop();
  }

  function endGrace() {
    if (!grace.active) return;
    if (!running) { stopGrace(); draw(); return; }
    const safe = pickSafeDir();
    if (!safe) {                      // 真的被围死了，才结束这一局
      stopGrace();
      running = false;
      dead = true;
      gameOver();
      return;
    }
    dir = safe;
    nextDir = safe;
    queue = [];
    resumeAfterGrace();
  }

  function step() {
    if (!running || grace.active) return;
    if (queue.length) { dir = queue.shift(); nextDir = dir; }
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const willEat = head.x === food.x && head.y === food.y;

    // 撞墙、撞障碍、撞自己：温柔模式先用护盾挡一下，再温柔结束
    if (isBlocked(head.x, head.y, prefs.gentle && !willEat)) {
      if (prefs.gentle && shield > 0) {
        shield--;
        updateShield();
        startGrace();
        return;
      }
      running = false;
      dead = true;
      gameOver();
      return;
    }

    snake.unshift(head);
    if (willEat) {
      eaten++;
      score++;
      updateScore();
      sfx('eat');
      confettiPop(food.x*CELL+CELL/2, food.y*CELL+CELL/2);
      if (eaten >= LEVELS[level].goal) {
        running = false;
        setTimeout(levelClear, 300);
        return;
      }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function startLoop() {
    clearInterval(timer);
    timer = setInterval(step, LEVELS[level].speed);
  }

  const DIRS = {
    up: {x: 0, y: -1}, down: {x: 0, y: 1},
    left: {x: -1, y: 0}, right: {x: 1, y: 0}
  };

  // 以"队列最后一个待执行方向"为基准判断掉头，避免 180° 自杀；
  // 队列最多存 2 个方向，快速连拐两个弯时指令不会被吞掉。
  function setDir(d) {
    const nd = DIRS[d];
    if (!nd) return;
    // 护盾停顿中：选到安全方向就立刻继续，选到还会撞的方向则忽略
    if (grace.active) {
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      if (isBlocked(snake[0].x + nd.x, snake[0].y + nd.y, true)) return;
      dir = nd;
      nextDir = nd;
      queue = [];
      resumeAfterGrace();
      return;
    }
    const base = queue.length ? queue[queue.length - 1] : dir;
    if (nd.x === base.x && nd.y === base.y) return;          // 同方向，忽略
    if (nd.x === -base.x && nd.y === -base.y) return;        // 反向，忽略
    if (queue.length >= 2) return;                            // 队列已满
    nextDir = nd;
    queue.push(nd);
  }

  document.querySelectorAll('.pad').forEach(btn => {
    const press = e => {
      e.preventDefault();                 // 阻止 click 延迟、长按菜单、双击缩放
      ensureAudio();                      // 在用户手势里解锁音频
      setDir(btn.dataset.dir);
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 90);
    };
    if (window.PointerEvent) {
      btn.addEventListener('pointerdown', press);      // 按下即生效，不等抬手
    } else {
      btn.addEventListener('touchstart', press, {passive: false});
      btn.addEventListener('mousedown', press);
    }
    btn.addEventListener('click', e => e.preventDefault());
  });
  document.addEventListener('keydown', e => {
    const keys = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right'
    };
    if (keys[e.key]) { e.preventDefault(); ensureAudio(); setDir(keys[e.key]); }
  });

  // 触屏手势：在 touchmove 阶段即时转向，每滑过 20px 判定一次，
  // 因此"按住不放慢慢划"也能连续拐弯，不必等手指抬起。
  const SWIPE_MIN = 20;
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive: true});

  canvas.addEventListener('touchmove', e => {
    if (!touchStart) return;
    e.preventDefault();                       // 手势归游戏处理，页面不滚动
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < SWIPE_MIN && ay < SWIPE_MIN) return;   // 小抖动不判定，防误触
    if (ax > ay) setDir(dx > 0 ? 'right' : 'left');
    else         setDir(dy > 0 ? 'down' : 'up');
    touchStart = {x: t.clientX, y: t.clientY};     // 重置起点，一次划动可连转多次
  }, {passive: false});

  canvas.addEventListener('touchend', () => { touchStart = null; }, {passive: true});
  canvas.addEventListener('touchcancel', () => { touchStart = null; }, {passive: true});

  /* ============ 顶部开关：🔊 音效 / 🛡️ 温柔模式 ============ */
  function syncToggles() {
    soundBtn.textContent = prefs.muted ? '🔇' : '🔊';
    soundBtn.classList.toggle('off', prefs.muted);
    soundBtn.title = prefs.muted ? '打开音效' : '关闭音效';
    modeBtn.classList.toggle('off', !prefs.gentle);
    modeLabel.textContent = prefs.gentle ? ' 温柔模式' : ' 严格模式';
    modeBtn.title = prefs.gentle
      ? '温柔模式：每关 1 次护盾，撞墙会先停下等你拐弯（点击关闭）'
      : '严格模式：撞到就结束（点击开启温柔模式）';
  }

  function bindTap(el, fn) {
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });
    } else {
      el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); fn(); });
    }
  }

  bindTap(soundBtn, () => {
    prefs.muted = !prefs.muted;
    savePrefs();
    syncToggles();
    if (!prefs.muted) { ensureAudio(); sfx('ui'); }
  });

  bindTap(modeBtn, () => {
    ensureAudio();
    prefs.gentle = !prefs.gentle;
    savePrefs();
    if (prefs.gentle) {
      shield = Math.max(shield, 1);        // 中途打开也立刻送 1 个护盾
    } else {
      if (grace.active) endGrace();        // 先安全落地，再切到严格模式
      shield = 0;
    }
    updateShield();
    syncToggles();
    sfx('ui');
  });

  syncToggles();

  function showOverlay(emoji, title, text, btnText, handler) {
    ovEmoji.textContent = emoji;
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    startBtn.textContent = btnText;
    overlay.classList.remove('hidden');
    startBtn.onclick = handler;
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function levelClear() {
    if (level >= LEVELS.length - 1) {
      sfx('win');
      showOverlay('🏆', '全部通关啦！', '小蛇太棒啦，吃了 ' + score + ' 颗糖果！<br>你是最厉害的小玩家～', '再玩一次 🎉', () => {
        level = 0; score = 0; dead = false;
        startGame();
      });
    } else {
      sfx('level');
      showOverlay('🎉', '过关啦！', '下一关是「' + LEVELS[level+1].name + '」，糖果会跑得更快哦！'
        + (prefs.gentle ? '<br>🛡️ 新关卡又有 1 个护盾啦～' : ''), '继续冒险 ➡️', () => {
        level++;
        startGame();
      });
    }
  }

  function gameOver() {
    sfx('over');
    const tip = prefs.gentle
      ? '这关的护盾用完啦，别灰心～'
      : '想轻松一点？点顶部的 🛡️ 打开温柔模式吧～';
    showOverlay('💛', '哎呀，撞到啦！', tip + '<br>已经吃到了 ' + eaten + ' 颗糖果～', '重新开始 🔁', () => {
      dead = false;
      startGame();
    });
  }

  function startGame() {
    stopGrace();
    ensureAudio();                     // 由点击触发，顺便解锁音频
    hideOverlay();
    resetLevel();
    draw();
    running = true;
    startLoop();
    sfx('start');
  }

  startBtn.onclick = () => startGame();

  // 开心小彩带
  let pops = [];
  function confettiPop(x, y) {
    for (let i = 0; i < 14; i++) {
      pops.push({
        x, y,
        vx: (Math.random() - .5) * 6,
        vy: -Math.random() * 6 - 2,
        life: 1,
        color: 'hsl(' + Math.floor(Math.random() * 360) + ',90%,60%)',
        size: 3 + Math.random() * 3
      });
    }
    requestAnimationFrame(popTick);
  }
  function popTick() {
    draw();
    pops = pops.filter(p => p.life > 0);
    pops.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.03;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
    if (pops.length) requestAnimationFrame(popTick);
  }

  // 初始画面：先铺好关卡数据，再按视口实测尺寸铺满棋盘
  resetLevel();
  fitCanvas();                       // 内部会调用 draw()

  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
  [mqWide, mqCompact].forEach(mq => {
    if (mq.addEventListener) mq.addEventListener('change', fitCanvas);
  });
  // 字体加载完成后行高会变，补算一次
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCanvas);
  window.addEventListener('load', fitCanvas);
})();
</script>
<script>
/* 回乐园：统一返回游戏乐园首页 */
(function(){
  var btn = document.getElementById('homeBtn');
  if(!btn) return;
  function goHome(e){ e.preventDefault(); e.stopPropagation(); location.href = 'index.html'; }
  btn.addEventListener('pointerdown', goHome, true);
  btn.addEventListener('click', goHome, true);
})();
</script>
</body>
