<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小小神庙大冒险 - Mini Temple Adventure</title>
    <style>
        /* 本地字体栈：无外链依赖，圆体优先以保持儿童向视觉 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #120d0a;
            font-family: -apple-system, 'YouYuan', 'Yuanti SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
            color: #fff8e7;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2a1d15 0%, #0f0a07 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* UI 覆盖层通用样式 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            z-index: 10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 顶部 HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            transition: opacity 0.3s ease;
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(28, 19, 13, 0.78);
            border: 2px solid #8c6239;
            border-radius: 14px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 220, 150, 0.2);
            backdrop-filter: blur(4px);
        }

        .hearts-container {
            display: flex;
            gap: 3px;
            font-size: 1.1rem;
        }

        .heart {
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
        }

        .heart.lost {
            opacity: 0.25;
            transform: scale(0.8);
            filter: grayscale(1);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #d4b483;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffdf85;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        /* 道具状态条 */
        #powerup-bars {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .powerup-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 14, 10, 0.82);
            border: 1.5px solid #a67c52;
            border-radius: 10px;
            padding: 4px 10px;
            width: 170px;
            animation: slideInLeft 0.25s ease-out;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .powerup-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .powerup-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.08s linear;
        }

        /* 控制按钮组 */
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(180deg, #5c3d24 0%, #3b2514 100%);
            border: 2px solid #c9965b;
            color: #ffdf85;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #24150a, 0 6px 12px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .icon-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #24150a, 0 3px 6px rgba(0,0,0,0.5);
        }

        /* 区域横幅提示 */
        #zone-banner {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: linear-gradient(90deg, transparent 0%, rgba(36, 22, 12, 0.92) 20%, rgba(36, 22, 12, 0.92) 80%, transparent 100%);
            border-top: 2px solid #e6b85c;
            border-bottom: 2px solid #e6b85c;
            padding: 12px 48px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 15;
        }

        #zone-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #zone-subtitle {
            font-size: 0.85rem;
            color: #d4a359;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        #zone-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffea9f;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
            margin-top: 2px;
        }

        /* 模态弹窗（开始 / 暂停 / 结算） */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(12, 8, 5, 0.72);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .stone-card {
            background: linear-gradient(180deg, #3a2718 0%, #24170e 100%);
            border: 4px solid #b8864b;
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 16px 40px rgba(0, 0, 0, 0.85),
                inset 0 2px 0 rgba(255, 224, 150, 0.3),
                inset 0 0 25px rgba(0, 0, 0, 0.6);
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1.15;
            background: linear-gradient(180deg, #fff3b8 0%, #f5b942 55%, #c77d1e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.8));
            margin-bottom: 6px;
        }

        .game-subtitle {
            font-size: 0.9rem;
            color: #c9a679;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .high-score-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.45);
            border: 1.5px solid #8c6239;
            border-radius: 999px;
            padding: 6px 18px;
            margin-bottom: 20px;
            color: #ffd56b;
            font-weight: 700;
        }

        .controls-guide {
            background: rgba(18, 11, 7, 0.65);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid rgba(184, 134, 75, 0.35);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 0.85rem;
        }

        .guide-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e6d2b5;
        }

        .key-cap {
            background: #4f3520;
            border: 1px solid #a67c52;
            border-bottom-width: 3px;
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffdf85;
            white-space: nowrap;
        }

        .primary-btn {
            width: 100%;
            padding: 14px 24px;
            font-size: 1.25rem;
            font-weight: 900;
            font-family: inherit;
            color: #2b1604;
            background: linear-gradient(180deg, #ffe066 0%, #f5a623 100%);
            border: 2px solid #fff2b2;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #9e5b08, 0 10px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
        }

        .primary-btn:hover {
            filter: brightness(1.06);
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #9e5b08, 0 5px 10px rgba(0, 0, 0, 0.6);
        }

        .secondary-btn {
            width: 100%;
            margin-top: 12px;
            padding: 11px 20px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: #f5deb3;
            background: linear-gradient(180deg, #593b22 0%, #3b2615 100%);
            border: 2px solid #8c6239;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1f130a;
            transition: transform 0.1s;
        }

        .secondary-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1f130a;
        }

        /* 结算数据网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 18px 0 22px;
        }

        .stat-box {
            background: rgba(15, 10, 6, 0.65);
            border: 1.5px solid rgba(184, 134, 75, 0.4);
            border-radius: 14px;
            padding: 12px;
        }

        .stat-box .val {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffdf85;
            margin-top: 2px;
        }

        .new-record-badge {
            display: inline-block;
            background: linear-gradient(90deg, #ff5e3a, #ff9500);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        /* 移动端底部快捷触控提示 */
        #mobile-touch-hints {
            display: none;
            justify-content: space-between;
            width: 100%;
            opacity: 0.55;
            font-size: 0.8rem;
            color: #e6cfa8;
            padding: 0 8px;
        }

        @media (max-width: 768px) {
            .game-title { font-size: 1.8rem; }
            .stone-card { padding: 22px 20px; }
            .badge { padding: 5px 10px; }
            .stat-value { font-size: 1rem; }
            #mobile-touch-hints { display: flex; }
        }

        /* ============================================================
           横屏触控虚拟按键（左右两个大按钮都是跳跃）
           ============================================================ */
        #landscape-controls {
            position: absolute;
            bottom: 18px;
            left: 22px;
            right: 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 14;
            transition: opacity 0.25s ease;
        }

        #landscape-controls.hidden {
            display: none !important;
        }

        .touch-pad-btn {
            pointer-events: auto;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(110, 74, 42, 0.72), rgba(46, 28, 15, 0.82));
            border: 3px solid rgba(212, 163, 89, 0.75);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55), inset 0 2px 4px rgba(255, 224, 150, 0.35);
            color: #ffdf85;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            backdrop-filter: blur(3px);
            transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
            touch-action: none;
        }

        .touch-pad-btn .pad-icon {
            font-size: 1.55rem;
            line-height: 1;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.7));
        }

        .touch-pad-btn .pad-label {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #f5deb3;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
        }

        .touch-pad-btn.active,
        .touch-pad-btn:active {
            transform: scale(0.91) translateY(3px);
            background: radial-gradient(circle at 50% 50%, rgba(230, 168, 62, 0.85), rgba(128, 76, 24, 0.9));
            border-color: #fff2b2;
        }

        /* 在宽屏矮高度横屏手机上优化卡片与 HUD 间距 */
        @media (orientation: landscape) and (max-height: 500px) {
            .ui-layer { padding: 10px 16px; }
            .badge { padding: 4px 10px; border-radius: 10px; }
            .stat-label { font-size: 0.65rem; }
            .stat-value { font-size: 0.95rem; }
            .hearts-container { font-size: 0.95rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 1.05rem; }
            .stone-card { padding: 16px 24px; max-width: 480px; }
            .game-title { font-size: 1.65rem; }
            .game-subtitle { margin-bottom: 10px; font-size: 0.8rem; }
            .high-score-pill { margin-bottom: 12px; padding: 4px 14px; font-size: 0.85rem; }
            .controls-guide { padding: 10px; margin-bottom: 14px; gap: 6px; font-size: 0.78rem; }
            .primary-btn { padding: 10px 20px; font-size: 1.1rem; }
            .stats-grid { margin: 10px 0 14px; gap: 8px; }
            .stat-box { padding: 8px; }
            .stat-box .val { font-size: 1.15rem; }
            #mobile-touch-hints { display: none !important; }
        }

        /* ============================================================
           移动端竖屏旋转引导遮罩
           ============================================================ */
        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(14, 9, 6, 0.88);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        #rotate-overlay.visible {
            display: flex;
        }

        .rotate-card {
            background: linear-gradient(180deg, #3a2718 0%, #24170e 100%);
            border: 3px solid #b8864b;
            border-radius: 22px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85);
            animation: popIn 0.3s ease-out;
        }

        .phone-rotate-anim {
            font-size: 3.2rem;
            display: inline-block;
            margin-bottom: 12px;
            animation: tiltPhone 1.8s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
        }

        @keyframes tiltPhone {
            0%, 20% { transform: rotate(0deg); }
            55%, 80% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 游戏中 HUD -->
    <div id="hud-layer" class="ui-layer">
        <div id="hud">
            <div class="hud-left">
                <div class="hud-row">
                    <!-- 生命值 -->
                    <div class="badge">
                        <div class="hearts-container" id="hearts-display">
                            <span class="heart">❤️</span>
                            <span class="heart">❤️</span>
                            <span class="heart">❤️</span>
                            <span class="heart">❤️</span>
                            <span class="heart">❤️</span>
                        </div>
                    </div>
                    <!-- 得分 -->
                    <div class="badge">
                        <div>
                            <div class="stat-label">得分</div>
                            <div class="stat-value" id="score-display">0</div>
                        </div>
                    </div>
                    <!-- 距离 -->
                    <div class="badge">
                        <div>
                            <div class="stat-label">距离</div>
                            <div class="stat-value"><span id="distance-display">0</span>m</div>
                        </div>
                    </div>
                    <!-- 金币 -->
                    <div class="badge">
                        <span style="font-size: 1.15rem;">🪙</span>
                        <div class="stat-value" id="coins-display">0</div>
                    </div>
                </div>
                <!-- 激活道具状态条 -->
                <div id="powerup-bars"></div>
            </div>

            <div class="hud-right">
                <div class="hud-row">
                    <button id="fullscreen-btn" class="icon-btn interactive" title="全屏 / 横屏切换" aria-label="全屏切换">⛶</button>
                    <button id="mute-btn" class="icon-btn interactive" title="音效开关" aria-label="音效开关">🔊</button>
                    <button id="pause-btn" class="icon-btn interactive" title="暂停游戏" aria-label="暂停游戏">⏸️</button>
                </div>
            </div>
        </div>

        <!-- 区域切换横幅 -->
        <div id="zone-banner">
            <div id="zone-subtitle">STAGE 1</div>
            <div id="zone-title">神庙外围</div>
        </div>

        <!-- 低龄模式：左右两个大按钮都是「跳」，按哪个都一样 -->
        <div id="landscape-controls" class="hidden">
            <button id="btn-touch-slide" class="touch-pad-btn" aria-label="跳">
                <span class="pad-icon">🦘</span>
                <span class="pad-label">跳！JUMP</span>
            </button>
            <button id="btn-touch-jump" class="touch-pad-btn" aria-label="跳">
                <span class="pad-icon">⬆️</span>
                <span class="pad-label">跳！JUMP</span>
            </button>
        </div>

        <!-- 移动端操作提示 -->
        <div id="mobile-touch-hints">
            <span>点一下，跳！</span>
            <span>点哪里都可以跳</span>
        </div>
    </div>

    <!-- 竖屏旋转引导提示遮罩（移动端竖屏时出现，可随时点击跳过） -->
    <div id="rotate-overlay">
        <div class="rotate-card">
            <div class="phone-rotate-anim">📱</div>
            <h3 class="game-title" style="font-size: 1.45rem; margin-bottom: 8px;">横过来更好玩</h3>
            <p style="font-size: 0.9rem; color: #e6d2b5; line-height: 1.5; margin-bottom: 20px;">
                把平板横过来，左右两个大圆按钮，按哪个都会跳！
            </p>
            <button id="dismiss-rotate-btn" class="secondary-btn" style="margin-top: 0;">继续游玩</button>
        </div>
    </div>

    <!-- 开始界面 -->
    <div id="start-modal" class="modal-overlay interactive">
        <div class="stone-card">
            <div style="font-size: 3rem; margin-bottom: 4px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));">🏛️🧭</div>
            <h1 class="game-title">小小神庙大冒险</h1>
            <div class="game-subtitle">MINI TEMPLE ADVENTURE</div>

            <div class="high-score-pill">
                <span>🏆 历史最高分：</span>
                <span id="start-high-score">0</span>
            </div>

            <div class="controls-guide">
                <div class="guide-item">
                    <span class="key-cap">👉 点一下</span>
                    <span>小探险家就跳起来啦</span>
                </div>
                <div class="guide-item">
                    <span class="key-cap">🪙 捡金币</span>
                    <span>攒多多的分数</span>
                </div>
            </div>

            <button id="start-btn" class="primary-btn">开始探险</button>
        </div>
    </div>

    <!-- 暂停界面 -->
    <div id="pause-modal" class="modal-overlay interactive hidden">
        <div class="stone-card">
            <h2 class="game-title" style="font-size: 1.9rem;">探险暂停</h2>
            <p class="game-subtitle">稍作休整，准备继续前行</p>
            <button id="resume-btn" class="primary-btn">继续冒险</button>
            <button id="restart-from-pause-btn" class="secondary-btn">重新开始</button>
        </div>
    </div>

    <!-- 结算界面 -->
    <div id="gameover-modal" class="modal-overlay interactive hidden">
        <div class="stone-card">
            <div id="new-record-tag" class="new-record-badge hidden">🎉 刷新历史最高分！</div>
            <h2 class="game-title" style="font-size: 2rem;">玩得真棒！</h2>
            <div class="game-subtitle" id="gameover-reason">再玩一次吧！</div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">本局得分</div>
                    <div class="val" id="final-score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">奔跑距离</div>
                    <div class="val"><span id="final-distance">0</span>m</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">收集金币</div>
                    <div class="val">🪙 <span id="final-coins">0</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">历史最高</div>
                    <div class="val" id="final-high-score">0</div>
                </div>
            </div>

            <button id="retry-btn" class="primary-btn">再来一局</button>
        </div>
    </div>
</div>

<script>
/**
 * ============================================================================
 * 《小小神庙大冒险》 (Mini Temple Adventure)
 * 单文件 HTML5 Canvas 2D + Web Audio API 完整游戏引擎
 * ============================================================================
 */

// ============================================================================
// 1. Web Audio API 复古冒险音效与背景旋律合成器
// ============================================================================
class SoundSystem {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.isPlayingBgm = false;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
            this.stopBgm();
        } else if (game && game.state === 'PLAYING') {
            this.startBgm();
        }
        return this.muted;
    }

    // 通用音调播放辅助
    playTone(freq, endFreq, duration, type = 'triangle', vol = 0.15, delay = 0) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq && endFreq !== freq) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
    }

    playJump() {
        this.playTone(240, 560, 0.16, 'sine', 0.18);
        this.playTone(320, 680, 0.14, 'triangle', 0.10, 0.02);
    }

    playDoubleJump() {
        this.playTone(420, 880, 0.18, 'triangle', 0.18);
        this.playTone(620, 1080, 0.15, 'sine', 0.12, 0.04);
    }

    playCoin() {
        this.playTone(987.77, 987.77, 0.07, 'sine', 0.14, 0);       // B5
        this.playTone(1318.51, 1318.51, 0.16, 'sine', 0.14, 0.065); // E6
    }

    playGem() {
        const notes = [659.25, 830.61, 987.77, 1318.51]; // E5, G#5, B5, E6
        notes.forEach((n, i) => {
            this.playTone(n, n * 1.02, 0.14, 'triangle', 0.14, i * 0.045);
        });
    }

    playPowerup() {
        const notes = [440, 554.37, 659.25, 880, 1108.73];
        notes.forEach((n, i) => {
            this.playTone(n, n, 0.15, 'sine', 0.16, i * 0.05);
        });
    }

    playHit() {
        this.playTone(180, 55, 0.32, 'sawtooth', 0.22);
        this.playTone(120, 40, 0.35, 'square', 0.15, 0.03);
    }

    playZoneUp() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, i) => {
            this.playTone(n, n, 0.22, 'triangle', 0.15, i * 0.08);
        });
    }

    // 轻快神秘的古代神庙节奏旋律（D 小调 / 阿拉伯五声音阶风味）
    startBgm() {
        if (this.muted || this.isPlayingBgm) return;
        this.init();
        this.isPlayingBgm = true;
        this.bgmStep = 0;

        // 旋律音符频率表 (D4, F4, G4, A4, Bb4, D5, E5, F5)
        const melody = [
            293.66, 0, 349.23, 440.00,
            466.16, 440.00, 349.23, 392.00,
            293.66, 0, 440.00, 587.33,
            523.25, 466.16, 440.00, 392.00
        ];
        const bass = [
            146.83, 0, 146.83, 220.00,
            174.61, 0, 174.61, 220.00,
            146.83, 0, 146.83, 220.00,
            196.00, 0, 220.00, 146.83
        ];

        const tick = () => {
            if (!this.isPlayingBgm || this.muted) return;
            const idx = this.bgmStep % melody.length;
            const mNote = melody[idx];
            const bNote = bass[idx];

            if (mNote > 0) {
                this.playTone(mNote, mNote * 0.99, 0.16, 'triangle', 0.055);
            }
            if (bNote > 0) {
                this.playTone(bNote, bNote, 0.18, 'sine', 0.065);
            }
            // 轻柔部落鼓点
            if (idx % 2 === 0) {
                this.playTone(idx % 4 === 0 ? 110 : 165, 45, 0.07, 'sine', 0.05);
            }

            this.bgmStep++;
            this.bgmTimer = setTimeout(tick, 195);
        };
        tick();
    }

    stopBgm() {
        this.isPlayingBgm = false;
        if (this.bgmTimer) {
            clearTimeout(this.bgmTimer);
            this.bgmTimer = null;
        }
    }
}

class Particle {
    constructor(x, y, vx, vy, size, color, life, gravity = 0.15, shape = 'circle') {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.size = size;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.gravity = gravity;
        this.shape = shape;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.15;
    }

    update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.vy += this.gravity * dt * 60;
        this.rotation += this.rotSpeed * dt * 60;
        this.life -= dt;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;

        if (this.shape === 'leaf') {
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.shape === 'spark') {
            ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

class FloatingText {
    constructor(x, y, text, color = '#ffdf85') {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 0.9;
        this.maxLife = 0.9;
    }

    update(dt) {
        this.y -= 45 * dt;
        this.life -= dt;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 18px "YouYuan", "Yuanti SC", "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(20, 12, 6, 0.85)';
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

// ============================================================================
// 4. Q 版探险家主角类（动画、物理、跳跃、无敌闪烁）
// ============================================================================
class Explorer {
    constructor(x, groundY) {
        this.x = x;
        this.baseWidth = 42;
        this.baseHeight = 56;

        this.width = this.baseWidth;
        this.height = this.baseHeight;
        this.y = groundY - this.height;
        this.vy = 0;

        // 物理参数（低龄模式：跳得更飘、判定更宽松）
        this.gravity = EASY.gravity;
        this.jumpForce = EASY.jumpForce;
        this.doubleJumpForce = -680;

        // 状态标记（保留二段跳作为「补跳」容错，不再要求孩子主动使用）
        this.isGrounded = true;
        this.jumpCount = 0;
        this.maxJumps = 2;

        // 手感增强：土狼时间 & 跳跃缓冲（低龄模式放宽）
        this.coyoteTimer = 0;
        this.coyoteDuration = EASY.coyote;
        this.jumpBufferTimer = 0;
        this.jumpBufferDuration = EASY.jumpBuffer;

        // 动画与视觉
        this.runCycle = 0;
        this.flipAngle = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.invincibleTimer = 0;
        this.trail = [];
    }

    reset(x, groundY) {
        this.x = x;
        this.width = this.baseWidth;
        this.height = this.baseHeight;
        this.y = groundY - this.height;
        this.vy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
        this.coyoteTimer = 0;
        this.jumpBufferTimer = 0;
        this.flipAngle = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.invincibleTimer = 0;
        this.trail = [];
    }

    bufferJump() {
        this.jumpBufferTimer = this.jumpBufferDuration;
    }

    executeJump(spawnParticlesFn) {
        // 第一段跳（地面或土狼时间内）
        if (this.isGrounded || this.coyoteTimer > 0) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
            this.coyoteTimer = 0;
            this.jumpCount = 1;
            this.flipAngle = 0;
            this.squashX = 0.78;
            this.squashY = 1.26;
            sound.playJump();
            spawnParticlesFn(this.x + this.width / 2, this.y + this.height, 8, '#e6cfa8');
            return true;
        }

        // 二段跳（空中翻滚）
        if (this.jumpCount < this.maxJumps) {
            this.vy = this.doubleJumpForce;
            this.jumpCount = 2;
            this.flipAngle = 0.01; // 触发前空翻
            this.squashX = 0.82;
            this.squashY = 1.22;
            sound.playDoubleJump();
            spawnParticlesFn(this.x + this.width / 2, this.y + this.height, 12, '#ffe066');
            return true;
        }
        return false;
    }

    update(dt, platforms, groundY, speedMultiplier, spawnParticlesFn) {
        // 恢复挤压拉伸形变
        this.squashX += (1 - this.squashX) * Math.min(1, dt * 14);
        this.squashY += (1 - this.squashY) * Math.min(1, dt * 14);

        // 无敌闪烁倒计时
        if (this.invincibleTimer > 0) {
            this.invincibleTimer -= dt;
        }

        // 土狼时间与跳跃缓冲更新
        if (this.isGrounded) {
            this.coyoteTimer = this.coyoteDuration;
        } else {
            this.coyoteTimer -= dt;
        }

        if (this.jumpBufferTimer > 0) {
            this.jumpBufferTimer -= dt;
            if (this.executeJump(spawnParticlesFn)) {
                this.jumpBufferTimer = 0;
            }
        }

        // 垂直速度与重力
        const prevBottom = this.y + this.height;
        this.vy += this.gravity * dt;
        this.y += this.vy * dt;
        const currBottom = this.y + this.height;

        // 平台与地面碰撞检测（仅下落时检测单向平台）
        let landed = false;
        if (this.vy >= 0) {
            for (const p of platforms) {
                const withinX = (this.x + this.width * 0.78 > p.x) && (this.x + this.width * 0.22 < p.x + p.width);
                if (withinX && prevBottom <= p.y + 12 && currBottom >= p.y) {
                    this.y = p.y - this.height;
                    this.vy = 0;
                    landed = true;
                    break;
                }
            }
        }

        if (landed) {
            if (!this.isGrounded) {
                // 刚落地瞬间的缓冲形变与尘土
                this.squashX = 1.24;
                this.squashY = 0.78;
                this.flipAngle = 0;
                spawnParticlesFn(this.x + this.width / 2, this.y + this.height, 6, '#d4b483');
            }
            this.isGrounded = true;
            this.jumpCount = 0;
        } else {
            this.isGrounded = false;
        }

        // 跑步动画帧与二段跳空翻角度
        if (this.isGrounded) {
            this.runCycle += dt * 15 * speedMultiplier;
            if (Math.random() < 0.22) {
                spawnParticlesFn(this.x + 10, this.y + this.height, 1, '#bfa57d');
            }
        }

        if (!this.isGrounded && this.jumpCount === 2 && this.flipAngle > 0) {
            this.flipAngle += dt * 14;
            if (this.flipAngle >= Math.PI * 2) {
                this.flipAngle = 0;
            }
        }

        // 记录冲刺残影
        if (speedMultiplier > 1.35) {
            this.trail.push({ x: this.x, y: this.y, w: this.width, h: this.height, alpha: 0.45 });
        }
        for (let i = this.trail.length - 1; i >= 0; i--) {
            this.trail[i].alpha -= dt * 2.5;
            this.trail[i].x -= 180 * dt;
            if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
        }
    }

    getHitbox() {
        // 略微宽容的碰撞箱，提升动作游戏体验
        return {
            x: this.x + 8,
            y: this.y + 6,
            width: this.width - 16,
            height: this.height - 8
        };
    }

    draw(ctx, activePowerups) {
        // 无敌帧闪烁
        if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer * 18) % 2 === 0) {
            return;
        }

        // 绘制加速残影
        for (const t of this.trail) {
            ctx.save();
            ctx.globalAlpha = t.alpha * 0.4;
            ctx.fillStyle = '#ffe066';
            ctx.beginPath();
            ctx.roundRect(t.x, t.y, t.w, t.h, 12);
            ctx.fill();
            ctx.restore();
        }

        ctx.save();
        const centerX = this.x + this.width / 2;
        const bottomY = this.y + this.height;
        ctx.translate(centerX, bottomY);

        // 二段跳翻滚旋转中心调整
        if (this.flipAngle > 0) {
            ctx.translate(0, -this.height / 2);
            ctx.rotate(this.flipAngle);
            ctx.translate(0, this.height / 2);
        }

        ctx.scale(this.squashX, this.squashY);

        const swing = this.isGrounded ? Math.sin(this.runCycle) : 0.4;

        // 1. 棕色探险小背包
        ctx.fillStyle = '#7a441e';
        ctx.strokeStyle = '#2e1607';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-22, -42, 14, 22, 5);
        ctx.fill();
        ctx.stroke();

        // 背包搭扣
        ctx.fillStyle = '#f5b942';
        ctx.fillRect(-19, -34, 6, 4);

        // 2. 后腿与靴子
        ctx.save();
        ctx.translate(-3, -16);
        ctx.rotate(-swing * 0.65);
        ctx.fillStyle = '#3d2c20';
        ctx.beginPath();
        ctx.roundRect(-5, 0, 10, 15, 4);
        ctx.fill();
        ctx.restore();

        // 3. 探险家躯干（卡其色探险服 + 红色小围巾）
        ctx.fillStyle = '#d9b37c';
        ctx.strokeStyle = '#3b2410';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-12, -38, 24, 24, 8);
        ctx.fill();
        ctx.stroke();

        // 腰带
        ctx.fillStyle = '#4a2810';
        ctx.fillRect(-12, -21, 24, 4);
        ctx.fillStyle = '#ffd54f';
        ctx.fillRect(-2, -22, 6, 6);

        // 飘动的红围巾
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.roundRect(-13, -39, 26, 7, 3);
        ctx.fill();
        // 围巾尾巴
        const scarfWave = Math.sin(this.runCycle * 1.3) * 4;
        ctx.beginPath();
        ctx.moveTo(-12, -36);
        ctx.quadraticCurveTo(-24, -38 + scarfWave, -30, -30 + scarfWave);
        ctx.lineTo(-26, -25 + scarfWave);
        ctx.quadraticCurveTo(-18, -31, -11, -33);
        ctx.fill();

        // 4. 前腿与靴子
        ctx.save();
        ctx.translate(4, -16);
        ctx.rotate(swing * 0.65);
        ctx.fillStyle = '#5c3d28';
        ctx.beginPath();
        ctx.roundRect(-5, 0, 10, 15, 4);
        ctx.fill();
        ctx.restore();

        // 5. Q 版大头与五官
        ctx.fillStyle = '#ffdfc4';
        ctx.strokeStyle = '#3b2410';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(2, -48, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 腮红
        ctx.fillStyle = 'rgba(255, 118, 117, 0.55)';
        ctx.beginPath();
        ctx.arc(6, -45, 3, 0, Math.PI * 2);
        ctx.fill();

        // 明亮大眼睛
        ctx.fillStyle = '#24150a';
        ctx.beginPath();
        ctx.arc(9, -49, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(10, -50, 1, 0, Math.PI * 2);
        ctx.fill();

        // 6. 经典探险帽（宽帽檐 + 帽顶）
        ctx.fillStyle = '#a86b32';
        ctx.strokeStyle = '#2e1607';
        ctx.lineWidth = 2;
        // 帽檐
        ctx.beginPath();
        ctx.ellipse(2, -57, 20, 5, -0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // 帽顶
        ctx.beginPath();
        ctx.arc(2, -58, 11, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
        // 帽带
        ctx.fillStyle = '#e63946';
        ctx.fillRect(-8, -60, 20, 3);

        // 7. 手臂挥动
        ctx.save();
        ctx.translate(0, -33);
        ctx.rotate(-swing * 0.55);
        ctx.fillStyle = '#ffdfc4';
        ctx.strokeStyle = '#3b2410';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(-4, 0, 8, 13, 4);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 8. 护盾特效光罩
        if (activePowerups.shield > 0) {
            ctx.strokeStyle = '#4dd0e1';
            ctx.fillStyle = 'rgba(77, 208, 225, 0.18)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -this.height / 2, this.height * 0.68, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        // 9. 磁铁特效光环
        if (activePowerups.magnet > 0) {
            const pulse = (Date.now() % 600) / 600;
            ctx.strokeStyle = `rgba(255, 82, 82, ${1 - pulse})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -this.height / 2, 30 + pulse * 35, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();
    }
}
