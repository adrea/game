class TempleAdventureGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        // 横屏宽屏逻辑分辨率：高度固定 450px，宽度随屏幕宽高比动态延伸（800px ~ 1200px+）
        this.logicalHeight = 450;
        this.logicalWidth = 850;
        this.groundY = 365;

        this.state = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
        this.score = 0;
        this.coins = 0;
        this.distance = 0;
        this.lives = EASY.lives;
        this.maxLives = EASY.lives;
        this.highScore = parseInt(localStorage.getItem('mini_temple_high_score') || '0', 10);

        this.baseSpeed = EASY.speed;
        this.currentSpeed = EASY.speed;
        this.zoneIndex = 0;
        this.shakeTimer = 0;
        this.shakeIntensity = 0;
        this.rotateDismissed = false;

        // 道具剩余时间（秒）
        this.powerups = {
            boost: 0,
            shield: 0,
            magnet: 0
        };

        // 场景实体数组
        this.platforms = [];
        this.obstacles = [];
        this.collectibles = [];
        this.particles = [];
        this.floatingTexts = [];
        this.bgPillars = [];
        this.torches = [];

        this.player = new Explorer(150, this.groundY);

        this.lastTime = 0;
        this.initResize();
        this.bindEvents();
        this.updateHighScoreUI();
        this.initBackgroundDecor();

        // 启动主循环
        requestAnimationFrame((t) => this.loop(t));
    }

    initResize() {
        const resize = () => {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = this.canvas.parentElement.getBoundingClientRect();
            this.canvas.width = rect.width * dpr;
            this.canvas.height = rect.height * dpr;

            const aspect = rect.width / Math.max(1, rect.height);
            this.logicalHeight = 450;
            // 横屏模式下视野更开阔，同时保证竖屏降级游玩时也有足够前方反应距离
            this.logicalWidth = Math.max(640, this.logicalHeight * aspect);
            const oldGroundY = this.groundY;
            this.groundY = 365;

            // 玩家水平位置响应式调整（偏左侧，留出充足前方跑酷视野）
            this.player.x = Math.min(165, Math.max(85, this.logicalWidth * 0.17));
            if (this.player.isGrounded && oldGroundY !== this.groundY) {
                this.player.y = this.groundY - this.player.height;
            }

            this.checkOrientationPrompt();
        };
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => {
            setTimeout(resize, 120);
        });
        resize();
    }

    // 检测移动设备竖屏并智能提示旋转横屏
    checkOrientationPrompt() {
        const overlay = document.getElementById('rotate-overlay');
        if (!overlay) return;

        const isMobileLike = ('ontouchstart' in window || navigator.maxTouchPoints > 0) &&
            Math.min(window.innerWidth, window.innerHeight) <= 900;
        const isPortrait = window.innerHeight > window.innerWidth;

        if (isMobileLike && isPortrait && !this.rotateDismissed) {
            overlay.classList.add('visible');
        } else {
            overlay.classList.remove('visible');
            if (!isPortrait) {
                // 一旦用户主动横屏，重置忽略标记，下次竖屏可再次贴心提示
                this.rotateDismissed = false;
            }
        }
    }

    // 请求全屏并尝试锁定为横屏方向（兼容不支持的浏览器静默降级）
    async requestLandscapeFullscreen() {
        try {
            const docEl = document.documentElement;
            if (!document.fullscreenElement && docEl.requestFullscreen) {
                await docEl.requestFullscreen().catch(() => {});
            } else if (!document.webkitFullscreenElement && docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }
        } catch (_) {}

        try {
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape').catch(() => {});
            }
        } catch (_) {}
    }

    bindEvents() {
        // 按钮交互
        document.getElementById('start-btn').addEventListener('click', () => {
            this.requestLandscapeFullscreen();
            this.startGame();
        });
        document.getElementById('retry-btn').addEventListener('click', () => {
            this.requestLandscapeFullscreen();
            this.startGame();
        });
        document.getElementById('resume-btn').addEventListener('click', () => this.togglePause());
        document.getElementById('restart-from-pause-btn').addEventListener('click', () => this.startGame());
        document.getElementById('pause-btn').addEventListener('click', () => this.togglePause());

        // 竖屏提示遮罩「继续游玩」按钮
        document.getElementById('dismiss-rotate-btn').addEventListener('click', () => {
            this.rotateDismissed = true;
            document.getElementById('rotate-overlay').classList.remove('visible');
        });

        // 全屏 / 横屏切换按钮
        document.getElementById('fullscreen-btn').addEventListener('click', async () => {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                try {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                } catch (_) {}
            } else {
                this.requestLandscapeFullscreen();
            }
        });

        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', () => {
            sound.init();
            const isMuted = sound.toggleMute();
            muteBtn.textContent = isMuted ? '🔇' : '🔊';
        });

        // ============================================================
        // 低龄模式：左右两个大按钮都只做一件事 —— 跳
        // 孩子按哪个都一样，都是跳
        // ============================================================
        const jumpButtons = [
            document.getElementById('btn-touch-slide'),
            document.getElementById('btn-touch-jump')
        ];

        const pressJump = (btn) => (e) => {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (this.state !== 'PLAYING') return;
            btn.classList.add('active');
            this.player.bufferJump();
        };

        const releaseJump = (btn) => (e) => {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            btn.classList.remove('active');
        };

        for (const btn of jumpButtons) {
            const down = pressJump(btn);
            const up = releaseJump(btn);
            btn.addEventListener('touchstart', down, { passive: false });
            btn.addEventListener('touchend', up, { passive: false });
            btn.addEventListener('touchcancel', up, { passive: false });
            btn.addEventListener('mousedown', down);
            btn.addEventListener('mouseup', up);
            btn.addEventListener('mouseleave', up);
        }

        // 键盘控制
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const code = e.code;
            if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') {
                e.preventDefault();
                if (this.state === 'PLAYING') {
                    this.player.bufferJump();
                } else if (this.state === 'MENU' || this.state === 'GAMEOVER') {
                    this.startGame();
                }
            } else if (code === 'ArrowDown' || code === 'KeyS') {
                e.preventDefault();
                // 低龄模式：下键同样触发跳跃
                if (this.state === 'PLAYING') {
                    this.player.bufferJump();
                }
            } else if (code === 'Escape' || code === 'KeyP') {
                if (this.state === 'PLAYING' || this.state === 'PAUSED') {
                    this.togglePause();
                }
            }
        });

        // 低龄模式：点一下、上滑、下滑都当作「跳」，怎么划都能过
        let touchStartY = 0;
        let touchHandled = false;

        this.canvas.addEventListener('touchstart', (e) => {
            if (this.state !== 'PLAYING') return;
            e.preventDefault();
            touchStartY = e.touches[0].clientY;
            touchHandled = false;
        }, { passive: false });

        this.canvas.addEventListener('touchmove', (e) => {
            if (this.state !== 'PLAYING' || touchHandled) return;
            e.preventDefault();
            const dy = e.touches[0].clientY - touchStartY;
            if (Math.abs(dy) > 28) {
                this.player.bufferJump();
                touchHandled = true;
            }
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => {
            if (this.state !== 'PLAYING') return;
            e.preventDefault();
            if (!touchHandled) {
                this.player.bufferJump();
            }
        }, { passive: false });

        // 鼠标左键点击画布跳跃
        this.canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0 && this.state === 'PLAYING') {
                this.player.bufferJump();
            }
        });
    }

    initBackgroundDecor() {
        this.bgPillars = [];
        this.torches = [];
        for (let i = 0; i < 8; i++) {
            const x = i * 260;
            this.bgPillars.push({
                x,
                width: 56 + (i % 3) * 14,
                hasVines: i % 2 === 0
            });
            if (i % 2 === 1) {
                this.torches.push({
                    x: x + 28,
                    y: 195 + (i % 2) * 24,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
    }

    startGame() {
        sound.init();
        this.state = 'PLAYING';
        this.score = 0;
        this.coins = 0;
        this.distance = 0;
        this.lives = this.maxLives;
        this.baseSpeed = EASY.speed;
        this.currentSpeed = EASY.speed;
        this.zoneIndex = 0;
        this.shakeTimer = 0;

        this.powerups = { boost: 0, shield: 0, magnet: 0 };
        this.platforms = [];
        this.obstacles = [];
        this.collectibles = [];
        this.particles = [];
        this.floatingTexts = [];

        this.player.reset(Math.min(165, Math.max(85, this.logicalWidth * 0.17)), this.groundY);

        // 生成初始安全地面
        this.platforms.push({
            x: -100,
            y: this.groundY,
            width: this.logicalWidth + 600,
            height: this.logicalHeight - this.groundY,
            type: 'ground'
        });

        // 预设前方路段
        this.generateWorldAhead();

        // UI 切换
        document.getElementById('start-modal').classList.add('hidden');
        document.getElementById('pause-modal').classList.add('hidden');
        document.getElementById('gameover-modal').classList.add('hidden');
        document.getElementById('landscape-controls').classList.remove('hidden');

        this.updateHUD();
        this.showZoneBanner(ZONES[0]);
        sound.startBgm();
    }

    togglePause() {
        if (this.state === 'PLAYING') {
            this.state = 'PAUSED';
            sound.stopBgm();
            document.getElementById('pause-modal').classList.remove('hidden');
            document.getElementById('landscape-controls').classList.add('hidden');
        } else if (this.state === 'PAUSED') {
            this.state = 'PLAYING';
            this.lastTime = performance.now();
            sound.startBgm();
            document.getElementById('pause-modal').classList.add('hidden');
            document.getElementById('landscape-controls').classList.remove('hidden');
        }
    }

    // 低龄模式：结算统一用鼓励语，不展示「被击中 / 跌落」等挫败措辞
    gameOver() {
        this.state = 'GAMEOVER';
        sound.stopBgm();
        document.getElementById('landscape-controls').classList.add('hidden');

        const finalScore = Math.floor(this.score);
        const isNewRecord = finalScore > this.highScore;
        if (isNewRecord) {
            this.highScore = finalScore;
            localStorage.setItem('mini_temple_high_score', String(this.highScore));
        }

        document.getElementById('gameover-reason').textContent = '再玩一次吧！';
        document.getElementById('final-score').textContent = finalScore;
        document.getElementById('final-distance').textContent = Math.floor(this.distance);
        document.getElementById('final-coins').textContent = this.coins;
        document.getElementById('final-high-score').textContent = this.highScore;

        const tag = document.getElementById('new-record-tag');
        if (isNewRecord && finalScore > 0) {
            tag.classList.remove('hidden');
        } else {
            tag.classList.add('hidden');
        }

        this.updateHighScoreUI();
        document.getElementById('gameover-modal').classList.remove('hidden');
    }

    updateHighScoreUI() {
        document.getElementById('start-high-score').textContent = this.highScore;
    }

    showZoneBanner(zone) {
        const banner = document.getElementById('zone-banner');
        document.getElementById('zone-subtitle').textContent = zone.subtitle;
        document.getElementById('zone-title').textContent = zone.name;
        banner.classList.add('show');
        clearTimeout(this.bannerTimeout);
        this.bannerTimeout = setTimeout(() => {
            banner.classList.remove('show');
        }, 2600);
    }

    spawnParticles(x, y, count, color, shape = 'circle') {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 4;
            this.particles.push(new Particle(
                x, y,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed - 1.5,
                3 + Math.random() * 3.5,
                color,
                0.35 + Math.random() * 0.3,
                0.14,
                shape
            ));
        }
    }

    addFloatingText(x, y, text, color) {
        this.floatingTexts.push(new FloatingText(x, y, text, color));
    }

    // ========================================================================
    // 程序化关卡生成（连续地面、地刺、金币与宝物）
    // ========================================================================
    generateWorldAhead() {
        let rightmostX = 0;
        for (const p of this.platforms) {
            if (p.x + p.width > rightmostX) {
                rightmostX = p.x + p.width;
            }
        }

        while (rightmostX < this.logicalWidth + 900) {
            // 低龄模式：地面始终连续，不生成断崖深渊

            // 生成实心神庙地面段
            const segWidth = 340 + Math.random() * 360;
            const segStartX = rightmostX;
            this.platforms.push({
                x: segStartX,
                y: this.groundY,
                width: segWidth,
                height: this.logicalHeight - this.groundY,
                type: 'ground'
            });

            // 概率生成高处悬浮石台
            if (segWidth > 380 && Math.random() < 0.58) {
                const platW = 130 + Math.random() * 80;
                const platX = segStartX + 90 + Math.random() * (segWidth - platW - 140);
                const platY = this.groundY - (115 + Math.random() * 35);
                this.platforms.push({
                    x: platX,
                    y: platY,
                    width: platW,
                    height: 24,
                    type: 'floating'
                });

                // 悬浮台上放置宝石或道具
                if (Math.random() < 0.28) {
                    const pTypes = ['boost', 'shield', 'magnet'];
                    const chosen = pTypes[Math.floor(Math.random() * pTypes.length)];
                    this.collectibles.push({
                        x: platX + platW / 2,
                        y: platY - 26,
                        radius: 16,
                        type: chosen,
                        phase: 0
                    });
                } else {
                    const gemType = Math.random() < 0.5 ? 'ruby' : 'sapphire';
                    this.collectibles.push({
                        x: platX + platW / 2,
                        y: platY - 24,
                        radius: 15,
                        type: gemType,
                        phase: 0
                    });
                }
            }

            // 低龄模式：只放「地刺」一种障碍，且更矮、出现率更低；其余路段全是金币
            if (this.distance > 25 && segWidth > 320 && Math.random() < EASY.obstacleRate) {
                const obsX = segStartX + segWidth * (0.45 + Math.random() * 0.25);
                const spikeCount = 2;
                this.obstacles.push({
                    type: 'spikes',
                    x: obsX,
                    y: this.groundY - EASY.spikeHeight,
                    width: spikeCount * 22,
                    height: EASY.spikeHeight
                });
                // 地刺上方金币：引导孩子「跳一下」
                this.collectibles.push({
                    x: obsX + (spikeCount * 22) / 2,
                    y: this.groundY - 95,
                    radius: 13,
                    type: 'coin',
                    phase: 0
                });
            } else {
                // 地面一排金币
                const coinCount = 3 + Math.floor(Math.random() * 3);
                for (let c = 0; c < coinCount; c++) {
                    this.collectibles.push({
                        x: segStartX + 90 + c * 38,
                        y: this.groundY - 26,
                        radius: 13,
                        type: 'coin',
                        phase: c * 0.4
                    });
                }
            }

            rightmostX += segWidth;
        }
    }

    // ========================================================================
    // 主更新逻辑
    // ========================================================================
    update(dt) {
        if (this.state !== 'PLAYING') return;

        // 道具时间递减
        for (const key of ['boost', 'shield', 'magnet']) {
            if (this.powerups[key] > 0) {
                this.powerups[key] = Math.max(0, this.powerups[key] - dt);
            }
        }

        // 低龄模式：固定慢速，不随距离加速；冲刺道具只保留「免疫碰撞」，不再提速
        this.baseSpeed = EASY.speed;
        this.currentSpeed = EASY.speed;
        const speedMultiplier = 1.0; // 主角动画速度倍率保持恒定

        // 距离与得分累加
        const dx = this.currentSpeed * dt;
        this.distance += dx / 42;
        this.score += (dx / 15) * (this.powerups.boost > 0 ? 2 : 1);

        // 检查区域晋级
        let newZoneIdx = 0;
        for (let i = ZONES.length - 1; i >= 0; i--) {
            if (this.distance >= ZONES[i].minDist) {
                newZoneIdx = i;
                break;
            }
        }
        if (newZoneIdx !== this.zoneIndex) {
            this.zoneIndex = newZoneIdx;
            this.showZoneBanner(ZONES[this.zoneIndex]);
            sound.playZoneUp();
        }

        // 屏幕震动衰减
        if (this.shakeTimer > 0) {
            this.shakeTimer -= dt;
        }

        // 飘落神庙树叶/金色微尘粒子
        if (Math.random() < 0.25) {
            const zone = ZONES[this.zoneIndex];
            this.particles.push(new Particle(
                this.logicalWidth + 20,
                40 + Math.random() * (this.groundY - 80),
                -60 - Math.random() * 80,
                15 + Math.random() * 25,
                4 + Math.random() * 3,
                zone.leafColor,
                5,
                0.01,
                'leaf'
            ));
        }

        // 背景石柱与火把视差移动
        for (const p of this.bgPillars) {
            p.x -= dx * 0.35;
            if (p.x + p.width < -100) {
                p.x += 8 * 260;
            }
        }
        for (const t of this.torches) {
            t.x -= dx * 0.35;
            t.phase += dt * 10;
            if (t.x < -100) {
                t.x += 8 * 260;
            }
        }

        // 平台移动与清理
        for (let i = this.platforms.length - 1; i >= 0; i--) {
            this.platforms[i].x -= dx;
            if (this.platforms[i].x + this.platforms[i].width < -200) {
                this.platforms.splice(i, 1);
            }
        }

        // 更新主角物理
        this.player.update(
            dt,
            this.platforms,
            this.groundY,
            speedMultiplier,
            (x, y, count, color, shape) => this.spawnParticles(x, y, count, color, shape)
        );

        // 安全网：万一异常穿地，用绳索把孩子捞回地面
        if (this.player.y > this.logicalHeight + 40) {
            this.handleFallInPit();
        }

        // 更新并检测收集物
        const pBox = this.player.getHitbox();
        const pCenterX = pBox.x + pBox.width / 2;
        const pCenterY = pBox.y + pBox.height / 2;

        for (let i = this.collectibles.length - 1; i >= 0; i--) {
            const c = this.collectibles[i];
            c.x -= dx;
            c.phase += dt * 5;

            // 磁铁吸附效果
            if (this.powerups.magnet > 0 && (c.type === 'coin' || c.type === 'ruby' || c.type === 'sapphire')) {
                const dist = Math.hypot(pCenterX - c.x, pCenterY - c.y);
                if (dist < 260) {
                    c.x += (pCenterX - c.x) * dt * 9;
                    c.y += (pCenterY - c.y) * dt * 9;
                }
            }

            // 收集碰撞检测
            const hitDist = Math.hypot(pCenterX - c.x, pCenterY - c.y);
            if (hitDist < c.radius + 26) {
                this.collectItem(c);
                this.collectibles.splice(i, 1);
                continue;
            }

            if (c.x < -80) {
                this.collectibles.splice(i, 1);
            }
        }

        // 更新并检测机关障碍物（低龄模式只有「地刺」一种）
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const obs = this.obstacles[i];
            obs.x -= dx;
            if (this.checkRectOverlap(pBox, obs)) {
                this.damagePlayer(obs.x + obs.width / 2, obs.y);
            }
            if (obs.x + obs.width < -100) this.obstacles.splice(i, 1);
        }

        // 更新粒子与浮动文字
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            this.floatingTexts[i].update(dt);
            if (this.floatingTexts[i].life <= 0) this.floatingTexts.splice(i, 1);
        }

        this.generateWorldAhead();
        this.updateHUD();
    }

    collectItem(item) {
        if (item.type === 'coin') {
            this.coins += 1;
            this.score += 15;
            sound.playCoin();
            this.spawnParticles(item.x, item.y, 7, '#ffd54f', 'spark');
            this.addFloatingText(item.x, item.y - 10, '+15', '#ffe066');
        } else if (item.type === 'ruby') {
            this.coins += 5;
            this.score += 100;
            sound.playGem();
            this.spawnParticles(item.x, item.y, 14, '#ff5252', 'spark');
            this.addFloatingText(item.x, item.y - 12, '红宝石 +100', '#ff7675');
        } else if (item.type === 'sapphire') {
            this.coins += 5;
            this.score += 120;
            sound.playGem();
            this.spawnParticles(item.x, item.y, 14, '#40c4ff', 'spark');
            this.addFloatingText(item.x, item.y - 12, '蓝宝石 +120', '#74b9ff');
        } else if (item.type === 'boost') {
            this.powerups.boost = 5.0;
            this.score += 50;
            sound.playPowerup();
            this.spawnParticles(item.x, item.y, 16, '#ffab40', 'spark');
            this.addFloatingText(item.x, item.y - 14, '⚡ 疾风冲刺！', '#ffbe76');
        } else if (item.type === 'shield') {
            this.powerups.shield = 8.0;
            this.score += 50;
            sound.playPowerup();
            this.spawnParticles(item.x, item.y, 16, '#4dd0e1', 'spark');
            this.addFloatingText(item.x, item.y - 14, '🛡️ 圣殿护盾！', '#81ecec');
        } else if (item.type === 'magnet') {
            this.powerups.magnet = 8.0;
            this.score += 50;
            sound.playPowerup();
            this.spawnParticles(item.x, item.y, 16, '#ff6b81', 'spark');
            this.addFloatingText(item.x, item.y - 14, '🧲 宝藏磁铁！', '#ff7979');
        }
    }

    smashObstacle(x, y) {
        sound.playHit();
        this.score += 40;
        this.shakeTimer = 0.15;
        this.shakeIntensity = 6;
        this.spawnParticles(x, y, 16, '#b89f7d');
        this.addFloatingText(x, y - 15, '击碎 +40', '#ffeaa7');
    }

    damagePlayer(hitX, hitY) {
        if (this.player.invincibleTimer > 0) return;

        // 疾风冲刺状态免疫碰撞
        if (this.powerups.boost > 0) {
            this.smashObstacle(hitX, hitY);
            return;
        }

        // 护盾抵消一次伤害
        if (this.powerups.shield > 0) {
            this.powerups.shield = 0;
            this.player.invincibleTimer = 1.2;
            sound.playHit();
            this.shakeTimer = 0.2;
            this.shakeIntensity = 7;
            this.spawnParticles(hitX, hitY, 18, '#4dd0e1');
            this.addFloatingText(this.player.x + 20, this.player.y - 15, '护盾抵挡！', '#81ecec');
            return;
        }

        this.lives -= 1;
        this.player.invincibleTimer = EASY.invincible;
        this.shakeTimer = 0.28;
        this.shakeIntensity = 10;
        sound.playHit();
        this.spawnParticles(hitX, hitY, 18, '#ff5252');
        this.addFloatingText(this.player.x + 20, this.player.y - 15, '-1 ❤️', '#ff7675');
        this.updateHUD();

        if (this.lives <= 0) {
            this.gameOver();
        }
    }

    handleFallInPit() {
        // 低龄模式：掉落不扣命，只用绳索把孩子捞回安全地面
        this.shakeTimer = 0.3;
        this.shakeIntensity = 12;
        sound.playHit();

        // 营救回安全地面并赋予短暂无敌
        this.player.y = 95;
        this.player.vy = 0;
        this.player.jumpCount = 0;
        this.player.invincibleTimer = 2.0;
        this.addFloatingText(this.player.x + 20, 80, '绳索营救！', '#ffdf85');

        // 确保脚下有地面可落
        this.platforms.push({
            x: this.player.x - 60,
            y: this.groundY,
            width: 320,
            height: this.logicalHeight - this.groundY,
            type: 'ground'
        });
    }

    checkRectOverlap(a, b) {
        return (
            a.x < b.x + b.width &&
            a.x + a.width > b.x &&
            a.y < b.y + b.height &&
            a.y + a.height > b.y
        );
    }

    updateHUD() {
        document.getElementById('score-display').textContent = Math.floor(this.score);
        document.getElementById('distance-display').textContent = Math.floor(this.distance);
        document.getElementById('coins-display').textContent = this.coins;

        const heartEls = document.querySelectorAll('#hearts-display .heart');
        heartEls.forEach((el, idx) => {
            if (idx < this.lives) {
                el.classList.remove('lost');
            } else {
                el.classList.add('lost');
            }
        });

        // 道具状态条渲染
        const barsContainer = document.getElementById('powerup-bars');
        barsContainer.innerHTML = '';

        const items = [
            { key: 'boost', max: 5.0, icon: '⚡', color: '#ffab40' },
            { key: 'shield', max: 8.0, icon: '🛡️', color: '#4dd0e1' },
            { key: 'magnet', max: 8.0, icon: '🧲', color: '#ff6b81' }
        ];

        for (const it of items) {
            const val = this.powerups[it.key];
            if (val > 0) {
                const pct = Math.min(100, (val / it.max) * 100);
                const div = document.createElement('div');
                div.className = 'powerup-item';
                div.innerHTML = `
                    <span>${it.icon}</span>
                    <div class="powerup-bar-bg">
                        <div class="powerup-bar-fill" style="width:${pct}%; background:${it.color};"></div>
                    </div>
                `;
                barsContainer.appendChild(div);
            }
        }
    }

    // ========================================================================
    // Canvas 2D 多层次艺术渲染
    // ========================================================================
    draw() {
        const ctx = this.ctx;
        const scale = this.canvas.height / this.logicalHeight;

        ctx.save();
        ctx.scale(scale, scale);

        // 屏幕震动偏移
        if (this.shakeTimer > 0) {
            const sx = (Math.random() - 0.5) * this.shakeIntensity * 2;
            const sy = (Math.random() - 0.5) * this.shakeIntensity * 2;
            ctx.translate(sx, sy);
        }

        const zone = ZONES[this.zoneIndex];

        // 1. 天空渐变背景
        const skyGrad = ctx.createLinearGradient(0, 0, 0, this.groundY);
        skyGrad.addColorStop(0, zone.skyTop);
        skyGrad.addColorStop(1, zone.skyBottom);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, this.logicalWidth, this.logicalHeight);

        // 神秘月亮 / 太阳光轮
        ctx.save();
        const sunX = this.logicalWidth * 0.78;
        const sunY = 92;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 95);
        sunGlow.addColorStop(0, 'rgba(255, 236, 179, 0.55)');
        sunGlow.addColorStop(0.5, 'rgba(255, 193, 7, 0.15)');
        sunGlow.addColorStop(1, 'rgba(255, 193, 7, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 95, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 245, 210, 0.85)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 2. 远景山脉与古金字塔剪影
        this.drawMountainsAndPyramids(ctx, zone);

        // 3. 中景神庙石柱与藤蔓
        this.drawPillarsAndTorches(ctx, zone);

        // 4. 平台与神庙地面
        this.drawPlatforms(ctx, zone);

        // 5. 收集物（金币、红/蓝宝石、加速/护盾/磁铁）
        this.drawCollectibles(ctx);

        // 6. 机关障碍物（地刺）
        this.drawObstacles(ctx);

        // 7. Q 版探险家主角
        this.player.draw(ctx, this.powerups);

        // 8. 粒子与浮动得分文字
        for (const p of this.particles) p.draw(ctx);
        for (const ft of this.floatingTexts) ft.draw(ctx);

        // 9. 疾风冲刺屏幕边缘速度线
        if (this.powerups.boost > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 230, 128, 0.28)';
            ctx.lineWidth = 3;
            for (let i = 0; i < 8; i++) {
                const ly = ((i * 79 + Date.now() * 0.2) % this.logicalHeight);
                const lx = this.logicalWidth - ((Date.now() * 1.4 + i * 210) % (this.logicalWidth + 200));
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx + 110, ly);
                ctx.stroke();
            }
            ctx.restore();
        }

        ctx.restore();
    }

    drawMountainsAndPyramids(ctx, zone) {
        const scrollFar = (this.distance * 4) % 900;
        ctx.fillStyle = zone.mountainFar;
        for (let i = -1; i < 3; i++) {
            const baseX = i * 900 - scrollFar;
            // 远景阶梯金字塔轮廓
            ctx.beginPath();
            ctx.moveTo(baseX + 80, this.groundY);
            ctx.lineTo(baseX + 230, 155);
            ctx.lineTo(baseX + 280, 155);
            ctx.lineTo(baseX + 430, this.groundY);
            ctx.closePath();
            ctx.fill();

            // 远山
            ctx.beginPath();
            ctx.moveTo(baseX + 380, this.groundY);
            ctx.lineTo(baseX + 620, 185);
            ctx.lineTo(baseX + 880, this.groundY);
            ctx.closePath();
            ctx.fill();
        }

        const scrollNear = (this.distance * 9) % 750;
        ctx.fillStyle = zone.mountainNear;
        for (let i = -1; i < 3; i++) {
            const baseX = i * 750 - scrollNear;
            ctx.beginPath();
            ctx.moveTo(baseX, this.groundY);
            ctx.lineTo(baseX + 180, 230);
            ctx.lineTo(baseX + 390, this.groundY);
            ctx.lineTo(baseX + 560, 215);
            ctx.lineTo(baseX + 750, this.groundY);
            ctx.closePath();
            ctx.fill();
        }
    }

    drawPillarsAndTorches(ctx, zone) {
        for (const p of this.bgPillars) {
            if (p.x > this.logicalWidth + 100) continue;

            // 石柱主体
            ctx.fillStyle = zone.pillarColor;
            ctx.fillRect(p.x, 55, p.width, this.groundY - 55);

            // 石柱右侧阴影
            ctx.fillStyle = zone.pillarShadow;
            ctx.fillRect(p.x + p.width * 0.65, 55, p.width * 0.35, this.groundY - 55);

            // 石柱装饰横纹与柱头
            ctx.fillRect(p.x - 8, 55, p.width + 16, 18);
            ctx.fillRect(p.x - 8, this.groundY - 22, p.width + 16, 22);

            // 缠绕藤蔓
            if (p.hasVines) {
                ctx.strokeStyle = '#3d6b35';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(p.x + 6, 73);
                ctx.quadraticCurveTo(p.x + p.width - 4, 140, p.x + 8, 210);
                ctx.quadraticCurveTo(p.x + p.width - 6, 275, p.x + 12, 335);
                ctx.stroke();
            }
        }

        // 闪烁壁挂火把与暖光光晕
        for (const t of this.torches) {
            if (t.x > this.logicalWidth + 100) continue;
            const flicker = 0.85 + Math.sin(t.phase) * 0.15;

            // 火光径向光晕
            const glow = ctx.createRadialGradient(t.x, t.y - 12, 4, t.x, t.y - 12, 75 * flicker);
            glow.addColorStop(0, 'rgba(255, 190, 60, 0.45)');
            glow.addColorStop(1, 'rgba(255, 140, 20, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(t.x, t.y - 12, 75 * flicker, 0, Math.PI * 2);
            ctx.fill();

            // 火把木柄
            ctx.fillStyle = '#3d2210';
            ctx.fillRect(t.x - 4, t.y - 8, 8, 24);

            // 火焰外焰与内焰
            ctx.fillStyle = zone.torchColor;
            ctx.beginPath();
            ctx.ellipse(t.x, t.y - 16, 8 * flicker, 14 * flicker, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff9c4';
            ctx.beginPath();
            ctx.ellipse(t.x, t.y - 14, 4 * flicker, 8 * flicker, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawPlatforms(ctx, zone) {
        for (const p of this.platforms) {
            if (p.type === 'ground') {
                // 泥土/石砖主体
                ctx.fillStyle = zone.groundMain;
                ctx.fillRect(p.x, p.y, p.width, p.height);

                // 石砖纹理线条
                ctx.fillStyle = zone.groundDark;
                for (let bx = p.x + 20; bx < p.x + p.width - 20; bx += 64) {
                    ctx.fillRect(bx, p.y + 28, 44, 18);
                    ctx.fillRect(bx + 16, p.y + 58, 44, 18);
                }

                // 顶部苔藓/石板草皮层
                ctx.fillStyle = zone.groundTop;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.width, 16, [6, 6, 0, 0]);
                ctx.fill();

                // 边缘高光线
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(p.x + 2, p.y + 2, p.width - 4, 3);
            } else if (p.type === 'floating') {
                // 悬浮古老石台
                ctx.fillStyle = zone.pillarShadow;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.width, p.height, 8);
                ctx.fill();

                ctx.fillStyle = zone.pillarColor;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.width, p.height - 6, 8);
                ctx.fill();

                // 石台顶部苔藓装饰
                ctx.fillStyle = zone.groundTop;
                ctx.beginPath();
                ctx.roundRect(p.x + 4, p.y, p.width - 8, 6, 4);
                ctx.fill();
            }
        }
    }

    drawCollectibles(ctx) {
        for (const c of this.collectibles) {
            const bobY = c.y + Math.sin(c.phase) * 4;
            ctx.save();
            ctx.translate(c.x, bobY);

            if (c.type === 'coin') {
                const stretchX = 0.75 + Math.abs(Math.cos(c.phase * 0.8)) * 0.25;
                ctx.scale(stretchX, 1);
                ctx.fillStyle = '#ffd54f';
                ctx.strokeStyle = '#b26a00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 金币内圈刻印
                ctx.strokeStyle = '#fff59d';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, c.radius * 0.62, 0, Math.PI * 2);
                ctx.stroke();
            } else if (c.type === 'ruby' || c.type === 'sapphire') {
                const isRuby = c.type === 'ruby';
                ctx.fillStyle = isRuby ? '#ff5252' : '#40c4ff';
                ctx.strokeStyle = isRuby ? '#8e0000' : '#0069c0';
                ctx.lineWidth = 2;

                // 六边形钻石切割轮廓
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(13, -5);
                ctx.lineTo(10, 12);
                ctx.lineTo(0, 16);
                ctx.lineTo(-10, 12);
                ctx.lineTo(-13, -5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 宝石高光切面
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.beginPath();
                ctx.moveTo(0, -12);
                ctx.lineTo(7, -4);
                ctx.lineTo(0, 4);
                ctx.lineTo(-7, -4);
                ctx.closePath();
                ctx.fill();
            } else {
                // 特殊道具光球（加速 / 护盾 / 磁铁）
                const colors = {
                    boost: { bg: '#ff9100', border: '#fff3e0', icon: '⚡' },
                    shield: { bg: '#00bcd4', border: '#e0f7fa', icon: '🛡️' },
                    magnet: { bg: '#ff4081', border: '#fce4ec', icon: '🧲' }
                };
                const cfg = colors[c.type];
                ctx.fillStyle = cfg.bg;
                ctx.strokeStyle = cfg.border;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 17, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cfg.icon, 0, 1);
            }

            ctx.restore();
        }
    }

    drawObstacles(ctx) {
        for (const obs of this.obstacles) {
            if (obs.type === 'spikes') {
                const count = Math.floor(obs.width / 22);
                for (let i = 0; i < count; i++) {
                    const sx = obs.x + i * 22;
                    ctx.fillStyle = '#cfd8dc';
                    ctx.strokeStyle = '#37474f';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(sx, obs.y + obs.height);
                    ctx.lineTo(sx + 11, obs.y);
                    ctx.lineTo(sx + 22, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }
    }

    loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = Math.min(0.05, (timestamp - this.lastTime) / 1000);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
    }
}

// 页面加载完成后启动游戏实例
let game = null;
window.addEventListener('DOMContentLoaded', () => {
    game = new TempleAdventureGame();
});
</script>
