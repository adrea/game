<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小火车变变变</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Comic Sans MS", sans-serif;
    background: radial-gradient(circle at 50% 0%, #fff9e8 0%, #ffe9c9 55%, #ffd9a8 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 14px; color: #4a2a18;
  }
  #app {
    width: 100%; max-width: 1000px;
    background: #fffdf6;
    border: 6px solid #ffc93c;
    border-radius: 30px;
    box-shadow: 0 14px 0 #e8a11f, 0 22px 40px rgba(160,90,20,.28);
    overflow: hidden;
  }
  /* ---------- 顶部信息栏 ---------- */
  #hud {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(180deg, #fff6d8, #ffe9b5);
    border-bottom: 4px solid #ffc93c;
  }
  .chip {
    background: #fff; border: 3px solid #ffb02e; border-radius: 999px;
    padding: 5px 16px; font-size: clamp(16px, 2.6vw, 23px); font-weight: 900;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    box-shadow: 0 3px 0 #f0a627;
  }
  #scoreNum { color: #e8402c; font-size: 1.25em; min-width: 1.2em; text-align: center; }
  #scoreNum.pop { animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
  @keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.6) rotate(-8deg)} 100%{transform:scale(1)} }
  #formChip { background: #fff0f0; border-color: #ef6a5a; }
  #formChip.bump { animation: bump .5s cubic-bezier(.3,1.7,.5,1); }
  @keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(4deg)} 100%{transform:scale(1)} }
  .spacer { flex: 1 1 auto; }
  .bar-wrap { flex: 1 1 150px; min-width: 120px; max-width: 260px; }
  .bar-label { font-size: clamp(11px,1.7vw,14px); font-weight: 800; opacity: .75; margin-bottom: 3px; }
  .bar { height: 14px; background: #fff; border: 3px solid #ffb02e; border-radius: 99px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg,#ffd84d,#ff8a3d,#ef4444); transition: width .12s linear; }
  .icon-btn {
    width: 46px; height: 46px; flex: 0 0 46px; border-radius: 50%;
    border: 3px solid #ffb02e; background: #fff; font-size: 21px;
    cursor: pointer; box-shadow: 0 3px 0 #f0a627; line-height: 1;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: none; }
  /* ---------- 画面 ---------- */
  #stage { position: relative; width: 100%; aspect-ratio: 5 / 3; background: #bfe6fb; overflow: hidden; }
  #game { position: absolute; inset: 0; display: block; width: 100%; height: 100%;
          touch-action: manipulation; cursor: pointer; }
  #toast {
    position: absolute; right: 2.5%; top: 7%;
    background: #fff; border: 5px solid #ffc93c; border-radius: 999px;
    padding: 8px 26px; font-size: clamp(19px, 4.4vw, 36px); font-weight: 900;
    color: #e8402c; white-space: nowrap; pointer-events: none; opacity: 0;
    box-shadow: 0 6px 0 #e8a11f, 0 10px 24px rgba(0,0,0,.18);
  }
  #toast.show { animation: toastIn 1.8s ease forwards; }
  @keyframes toastIn {
    0% { opacity: 0; transform: scale(.4) rotate(-12deg); }
    18% { opacity: 1; transform: scale(1.12) rotate(3deg); }
    30% { transform: scale(1) rotate(0); }
    75% { opacity: 1; transform: translateY(-6px) scale(1); }
    100% { opacity: 0; transform: translateY(-32px) scale(.9); }
  }
  /* ---------- 封面 ---------- */
  #cover {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(255,248,225,.93);
    display: flex; align-items: center; justify-content: center; padding: 3%;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #cover.hide { opacity: 0; visibility: hidden; }
  .cover-card {
    display: flex; align-items: center; gap: clamp(10px,2.4vw,26px);
    background: #fff; border: 5px solid #ffc93c; border-radius: 26px;
    padding: clamp(10px,2vw,20px); max-width: 94%; max-height: 96%;
    box-shadow: 0 8px 0 #e8a11f, 0 14px 30px rgba(160,90,20,.22);
  }
  .cover-card img { width: clamp(150px, 40%, 380px); border-radius: 18px; border: 4px solid #ffe08a; flex: 0 0 auto; }
  .cover-text { min-width: 0; }
  h1 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 46px); color: #e8402c; letter-spacing: 2px;
       text-shadow: 2px 3px 0 #ffd84d; }
  .sub { font-size: clamp(12px,2.1vw,18px); font-weight: 700; color: #b07a2a; margin: 0 0 12px; }
  ul { margin: 0 0 14px; padding-left: 1.25em; font-size: clamp(12px,2.1vw,18px); line-height: 1.65; font-weight: 700; }
  li { margin-bottom: 3px; }
  /* ---------- 底部 ---------- */
  #bottom {
    display: flex; align-items: center; justify-content: center; gap: clamp(10px,2vw,22px);
    padding: 12px 16px 16px; flex-wrap: wrap;
  }
  #btnTransform {
    position: relative;
    width: clamp(88px, 14vw, 118px); height: clamp(88px, 14vw, 118px);
    border-radius: 50%; border: 7px solid #fff; cursor: pointer;
    background: radial-gradient(circle at 35% 28%, #ff7a5c, #ef3b30 60%, #c4171f);
    color: #fff8d6; font-size: clamp(32px, 6vw, 52px); font-weight: 900;
    box-shadow: 0 7px 0 #a81018, 0 12px 22px rgba(180,30,20,.35), 0 0 0 4px #ffc93c;
    line-height: 1; text-shadow: 2px 3px 0 rgba(0,0,0,.18);
  }
  #btnTransform::after {
    content: ''; position: absolute; inset: -12px; border-radius: 50%;
    border: 4px solid #ffc93c; pointer-events: none;
    animation: ring 1.8s ease-in-out infinite;
  }
  #btnTransform:active { transform: translateY(6px) scale(.95); box-shadow: 0 1px 0 #a81018, 0 0 0 4px #ffc93c; }
  @keyframes ring { 0%,100%{ transform: scale(.94); opacity: .85 } 50%{ transform: scale(1.1); opacity: .2 } }
  .ico { width: 1.05em; height: 1.05em; fill: #ffb400; flex: 0 0 auto; }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: #ef4444;
         border: 2px solid #fff; box-shadow: 0 0 0 2px #ef4444; flex: 0 0 auto; }
  .icon-btn svg { width: 24px; height: 24px; display: block; margin: auto; }
  .start-btn {
    background: linear-gradient(180deg,#ffd84d,#ff9f1c); border: 4px solid #fff;
    border-radius: 999px; padding: 10px 34px; font-size: clamp(20px,3.6vw,30px);
    font-weight: 900; color: #8a3d00; cursor: pointer;
    box-shadow: 0 6px 0 #d97b00; text-shadow: 1px 1px 0 #fff2b0;
  }
  .start-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #d97b00; }
  .tip { font-size: clamp(12px,2vw,17px); font-weight: 800; color: #a8702c; line-height: 1.5; }
  .tip b { color: #e8402c; }
  @media (max-width: 680px) {
    #hud { gap: 6px; padding: 8px; }
    .chip { padding: 4px 10px; font-size: 17px; gap: 5px; }
    .icon-btn { width: 40px; height: 40px; flex-basis: 40px; font-size: 18px; }
    .bar-wrap { order: 3; flex: 1 1 100%; max-width: none; }
    #cover { position: fixed; inset: 0; z-index: 30; padding: 14px;
             background: rgba(255,248,225,.97); }
    .cover-card { flex-direction: column; width: 100%; max-width: 420px;
                  max-height: 100%; overflow-y: auto; text-align: center; }
    .cover-card img { width: min(100%, 300px); }
    .cover-text { width: 100%; }
    h1 { font-size: 30px; }
    .sub { font-size: 15px; }
    ul { font-size: 15px; text-align: left; display: inline-block; }
    .start-btn { font-size: 24px; padding: 9px 30px; }
    #bottom { padding: 10px 12px 14px; }
  }
</style>
</head>

        <div class="cover-text">
          <h1>小火车变变变！</h1>
          <p class="sub">一只会跑、会变形的红色笑脸小火车</p>
          <ul>
            <li>一开始是<b>乖乖火车</b>（没有尖牙），跑一会儿会<b>变成尖牙怪物火车</b></li>
            <li>前面有<b>小猫、兔子、小狗</b>在跑，小火车一变形就吓得它们跳起来</li>
            <li>点大大的「<b>变！</b>」按钮（或按空格），就变成<b>机器人、火箭、小巴士</b></li>
            <li>吃到黄色星星得 1 分，每 <b>5 颗</b>星星还会自动变一次身</li>
          </ul>
          <button class="start-btn" id="btnStart">出发！</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <button id="btnTransform">变！</button>
    <div class="tip">最靠前：1 小猫 · 2 兔子 · 3 小狗<br>点画面 / 按空格 也能变身<br>没有输赢，一直玩一直变</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const W = 1000, H = 600;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  /* ============ 绘图小工具 ============ */
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
  function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
  function rr(x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
  function deco(list) {
    for (const d of list) { ctx.fillStyle = d[3]; circle(d[0], d[1], d[2]); ctx.fill(); }
  }
  function line(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function pane(x, y, w, h) {
    ctx.fillStyle = '#ffc42e'; rr(x - 6, y - 6, w + 12, h + 12, 13); ctx.fill();
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#dff2fc'); g.addColorStop(.55, '#a9d8ee'); g.addColorStop(1, '#79b6d8');
    ctx.fillStyle = g; rr(x, y, w, h, 9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(x + 7, y + h - 7); ctx.lineTo(x + w * .52, y + 6);
    ctx.lineTo(x + w * .72, y + 6); ctx.lineTo(x + 20, y + h - 7);
    ctx.closePath(); ctx.fill();
  }

  /* ============ 小火车部件（全部画在自己的原点附近） ============ */
  let wheelSpin = 0;

  function drawWheel() {
    ctx.save(); ctx.rotate(wheelSpin);
    ctx.fillStyle = '#2c2c34'; circle(0, 0, 42); ctx.fill();
    ctx.fillStyle = '#191920'; circle(0, 0, 33); ctx.fill();
    const g = ctx.createRadialGradient(-9, -11, 3, 0, 0, 26);
    g.addColorStop(0, '#f6f9fc'); g.addColorStop(.55, '#c2cfdb'); g.addColorStop(1, '#8494a4');
    ctx.fillStyle = g; circle(0, 0, 25); ctx.fill();
    ctx.strokeStyle = '#93a3b2'; ctx.lineWidth = 2; circle(0, 0, 17); ctx.stroke();
    ctx.fillStyle = '#8797a7';
    for (let i = 0; i < 5; i++) {
      const a = i * TAU / 5;
      circle(Math.cos(a) * 20, Math.sin(a) * 20, 3); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc(0, 0, 25, -2.55, -1.55); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawFace(t) {
    const m = monsterMix;                 /* 0 = 乖乖火车，1 = 尖牙怪物火车 */
    const my = 40 + 2 * m;

    /* 怪物小角：随变身渐显 */
    if (m > .02) {
      ctx.save(); ctx.globalAlpha = m;
      ctx.fillStyle = '#8b5cf6'; ctx.strokeStyle = '#5b2fb0'; ctx.lineWidth = 3.5;
      [[-58, -70, -1], [58, -70, 1]].forEach(function (c) {
        ctx.beginPath();
        ctx.moveTo(c[0], c[1]);
        ctx.quadraticCurveTo(c[0] + c[2] * 6, c[1] - 36, c[0] + c[2] * 29, c[1] - 43);
        ctx.quadraticCurveTo(c[0] + c[2] * 12, c[1] - 14, c[0] + c[2] * 19, c[1] + 6);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      });
      ctx.restore();
    }

    /* 黄色脸圈 + 红色圆脸 */
    ctx.fillStyle = '#ffc42e'; circle(0, 0, 95); ctx.fill();
    ctx.fillStyle = '#ffe08a'; circle(0, 0, 91); ctx.fill();
    const g = ctx.createRadialGradient(-32, -38, 8, 0, 0, 96);
    g.addColorStop(0, '#f6604f'); g.addColorStop(.7, '#e3342c'); g.addColorStop(1, '#bd1420');
    ctx.fillStyle = g; circle(0, 0, 87); ctx.fill();
    deco([[-64, -50, 9, '#fff'], [-20, -72, 7, '#ffd84d'], [40, -64, 10, '#ff9ec4'],
          [68, -32, 8, '#ffb02e'], [-72, 2, 7, '#fff'], [72, 16, 6, '#fff'],
          [-48, -32, 6, '#ffb02e'], [58, 48, 7, '#fff']]);

    /* 眉毛：柔和弯眉 -> 内侧下压的凶眉 */
    ctx.strokeStyle = '#3b2417'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-54, -48 - 10 * m);
    ctx.quadraticCurveTo(-38, -60 - 6 * m, -22, -58 + 12 * m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(54, -48 - 10 * m);
    ctx.quadraticCurveTo(38, -60 - 6 * m, 22, -58 + 12 * m); ctx.stroke();

    /* 大眼睛 */
    function eye(x, y) {
      ctx.fillStyle = '#fff'; ellipse(x, y, 25, 29); ctx.fill();
      ctx.strokeStyle = '#e7b34a'; ctx.lineWidth = 3; ellipse(x, y, 25, 29); ctx.stroke();
      ctx.fillStyle = '#5a3420'; circle(x + 4, y + 4, 15); ctx.fill();
      ctx.fillStyle = '#241208'; circle(x + 4, y + 4, 9); ctx.fill();
      ctx.fillStyle = '#fff'; circle(x - 5, y - 7, 6.5); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.8)'; circle(x + 11, y + 12, 3); ctx.fill();
    }
    eye(-33, -17); eye(33, -17);
    ctx.fillStyle = 'rgba(255,120,150,.65)'; ellipse(-64, 26, 14, 9); ctx.fill();
    ellipse(64, 26, 14, 9); ctx.fill();

    /* 黄色口鼻：怪物模式逐渐张大 */
    const rx = 62 + 13 * m, ry = 30 + 15 * m;
    ctx.fillStyle = '#ffce3b'; ellipse(0, my, rx, ry); ctx.fill();
    ctx.strokeStyle = '#f2a621'; ctx.lineWidth = 4; ellipse(0, my, rx, ry); ctx.stroke();

    /* 乖乖模式：抿嘴微笑 + 小酒窝 */
    if (m < .98) {
      ctx.save(); ctx.globalAlpha = 1 - m;
      ctx.strokeStyle = '#8e1b22'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-38, my - 4);
      ctx.quadraticCurveTo(0, my + 26, 38, my - 4); ctx.stroke();
      ctx.fillStyle = '#ff9db0';
      circle(-45, my - 3, 4.5); ctx.fill(); circle(45, my - 3, 4.5); ctx.fill();
      ctx.restore();
    }

    /* 怪物模式：张开的血盆小口 + 尖牙 + 舌头 */
    if (m > .02) {
      ctx.save(); ctx.globalAlpha = m;
      ctx.fillStyle = '#8e1b22'; ellipse(0, my + 4 * m, 6 + 55 * m, 33 * m); ctx.fill();
      ctx.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) {
        const x = i * 23;
        ctx.beginPath();
        ctx.moveTo(x - 10, my - 21 * m); ctx.lineTo(x + 10, my - 21 * m);
        ctx.lineTo(x, my + 16 * m); ctx.closePath(); ctx.fill();
      }
      for (let i = -1; i <= 1; i++) {
        const x = i * 26 + 13;
        ctx.beginPath();
        ctx.moveTo(x - 9, my + 31 * m); ctx.lineTo(x + 9, my + 31 * m);
        ctx.lineTo(x, my + 13 * m); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#ff8198'; ellipse(0, my + 26 * m, 21 * m, 10 * m); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ellipse(-40, 18, 12, 5); ctx.fill();
  }

  function drawBody() {
    ctx.fillStyle = '#ffc42e'; rr(-88, -92, 176, 46, 20); ctx.fill();
    ctx.fillStyle = '#ffdd70'; rr(-80, -87, 160, 15, 8); ctx.fill();
    const g = ctx.createLinearGradient(0, -65, 0, 80);
    g.addColorStop(0, '#f05246'); g.addColorStop(1, '#c51821');
    ctx.fillStyle = g; rr(-88, -62, 176, 140, 22); ctx.fill();
    ctx.fillStyle = '#ffc42e'; rr(-88, 54, 176, 20, 9); ctx.fill();
    pane(-26, -40, 56, 66);
    deco([[-60, -32, 9, '#fff'], [54, -44, 8, '#ffd84d'], [58, 8, 10, '#ff9ec4'],
          [-64, 22, 7, '#ffb02e'], [10, 34, 8, '#fff'], [50, 36, 6, '#fff']]);
  }

  function drawCab() {
    ctx.fillStyle = '#ffc42e'; rr(-82, -84, 164, 42, 19); ctx.fill();
    ctx.fillStyle = '#ffdd70'; rr(-74, -79, 148, 13, 7); ctx.fill();
    const g = ctx.createLinearGradient(0, -58, 0, 72);
    g.addColorStop(0, '#ef4b40'); g.addColorStop(1, '#c51821');
    ctx.fillStyle = g; rr(-82, -58, 164, 130, 18); ctx.fill();
    ctx.fillStyle = '#ffc42e'; rr(-82, 46, 164, 26, 10); ctx.fill();
    pane(-62, -36, 48, 58); pane(14, -36, 48, 58);
    deco([[-4, -46, 7, '#fff'], [-6, 58, 9, '#ffb02e'], [30, 58, 7, '#ff9ec4'],
          [-70, 58, 6, '#fff'], [66, 58, 8, '#ffd84d']]);
  }

  function drawChimney() {
    ctx.fillStyle = '#d92027'; rr(-22, -26, 44, 60, 9); ctx.fill();
    deco([[0, -6, 5, '#ffd84d'], [-11, 16, 4, '#fff'], [11, 26, 4, '#ffd84d']]);
    ctx.fillStyle = '#ffc42e'; rr(-31, -42, 62, 23, 10); ctx.fill();
    ctx.fillStyle = '#ffdd70'; rr(-26, -38, 52, 7, 4); ctx.fill();
  }

  function drawArm() {
    ctx.fillStyle = '#ef4b42'; rr(0, -10, 86, 20, 10); ctx.fill();
    ctx.fillStyle = '#ffc42e'; circle(3, 0, 14); ctx.fill();
    ctx.fillStyle = '#ffd84d'; circle(84, 0, 12); ctx.fill();
  }

  function drawWing() {
    ctx.fillStyle = '#ffc42e';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(62, 12); ctx.lineTo(22, 70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e23b30';
    ctx.beginPath(); ctx.moveTo(11, 14); ctx.lineTo(47, 20); ctx.lineTo(24, 52); ctx.closePath(); ctx.fill();
  }

  function drawFlame(t) {
    const p = 1 + Math.sin(t * 20) * .13;
    ctx.save(); ctx.scale(1, p);
    ctx.fillStyle = '#ff7b1c';
    ctx.beginPath(); ctx.moveTo(-26, -8);
    ctx.quadraticCurveTo(-34, 32, 0, 82);
    ctx.quadraticCurveTo(34, 32, 26, -8);
    ctx.quadraticCurveTo(0, 10, -26, -8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffc42e';
    ctx.beginPath(); ctx.moveTo(-15, -6);
    ctx.quadraticCurveTo(-20, 28, 0, 58);
    ctx.quadraticCurveTo(20, 28, 15, -6);
    ctx.quadraticCurveTo(0, 4, -15, -6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.moveTo(-7, -4);
    ctx.quadraticCurveTo(-9, 20, 0, 36);
    ctx.quadraticCurveTo(9, 20, 7, -4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function starPath(size) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? size * .46 : size;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  /* ============ 火车前面跑着的三只小动物 ============ */
  const GROUND_Y = 486;
  const ANIMALS = [
    { id: 'cat',    rank: 1, baseX: 900, phase: 0.0, delay: 0 },
    { id: 'rabbit', rank: 2, baseX: 800, phase: 2.1, delay: .12 },
    { id: 'dog',    rank: 3, baseX: 705, phase: 4.0, delay: .24 }
  ].map(function (a) {
    return { id: a.id, rank: a.rank, baseX: a.baseX, phase: a.phase, delay: a.delay,
             jumpY: 0, vy: 0, scare: 0, scareDelay: 0, pending: 0, dash: 0 };
  });

  function petLegs(col, run, spread) {
    ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = 'round';
    const sw = run * 8;
    line(-spread, -20, -spread - sw * .6, -2);
    line(spread, -20, spread + sw * .6, -2);
    line(-spread * .55, -16, -spread * .55 + sw, -1);
    line(spread * .55, -16, spread * .55 - sw, -1);
  }
  function petEyes(a, lx, rx, y) {
    if (a.scare > .08) {
      ctx.fillStyle = '#fff'; circle(lx, y, 8); ctx.fill(); circle(rx, y, 8); ctx.fill();
      ctx.strokeStyle = '#8a4b12'; ctx.lineWidth = 1.5; circle(lx, y, 8); ctx.stroke(); circle(rx, y, 8); ctx.stroke();
      ctx.fillStyle = '#2b1a10'; circle(lx + 1, y + 2, 3.2); ctx.fill(); circle(rx + 1, y + 2, 3.2); ctx.fill();
    } else {
      ctx.fillStyle = '#2b1a10'; circle(lx, y, 4.2); ctx.fill(); circle(rx, y, 4.2); ctx.fill();
      ctx.fillStyle = '#fff'; circle(lx - 1.3, y - 1.5, 1.5); ctx.fill(); circle(rx - 1.3, y - 1.5, 1.5); ctx.fill();
    }
  }
  function petNoseMouth(x, y, col) {
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    line(x, y, x, y + 3); line(x, y + 3, x - 4, y + 5); line(x, y + 3, x + 4, y + 5);
  }

  function drawCat(a, t, run) {
    const fur = '#ffb347', dark = '#e0831a';
    /* 尾巴 */
    ctx.strokeStyle = fur; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-18, -27);
    ctx.quadraticCurveTo(-38, -34 + run * 6, -35, -58 + run * 6); ctx.stroke();
    ctx.strokeStyle = dark; ctx.lineWidth = 3.5;
    line(-33, -46, -29, -49); line(-36, -54, -32, -56);
    petLegs(fur, run, 15);
    ctx.fillStyle = fur; ellipse(0, -30, 21, 24); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 4;
    line(-16, -42, -10, -37); line(-18, -33, -12, -29);
    /* 头 */
    ctx.fillStyle = fur; circle(5, -60, 19); ctx.fill();
    const eh = a.scare * 6;
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.moveTo(-9, -72); ctx.lineTo(-14, -91 - eh); ctx.lineTo(1, -78); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(11, -78); ctx.lineTo(21, -91 - eh); ctx.lineTo(22, -70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff9ec4';
    ctx.beginPath(); ctx.moveTo(-8, -76); ctx.lineTo(-12, -87 - eh); ctx.lineTo(-2, -78); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, -77); ctx.lineTo(19, -87 - eh); ctx.lineTo(19, -73); ctx.closePath(); ctx.fill();
    petEyes(a, -2, 12, -62);
    ctx.fillStyle = '#ff7d92';
    ctx.beginPath(); ctx.moveTo(3, -54); ctx.lineTo(9, -54); ctx.lineTo(6, -50); ctx.closePath(); ctx.fill();
    petNoseMouth(6, -50, '#8a4b12');
    ctx.strokeStyle = '#8a4b12'; ctx.lineWidth = 1.3;
    line(-1, -54, -14, -57); line(-1, -51, -14, -50);
    line(13, -54, 25, -57); line(13, -51, 25, -50);
  }

  function drawRabbitEar(x, y, tilt, scare) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    const h = 34 + scare * 9;
    ctx.fillStyle = '#fffaf3'; rr(-6, -h, 12, h, 6); ctx.fill();
    ctx.fillStyle = '#ff9ec4'; rr(-3, -h + 5, 6, h - 12, 3); ctx.fill();
    ctx.restore();
  }
  function drawRabbit(a, t, run) {
    const fur = '#fffaf3', shade = '#e9dcd2';
    ctx.fillStyle = '#fff'; circle(-20, -26, 9); ctx.fill();
    petLegs(fur, run, 14);
    ctx.fillStyle = fur; ellipse(0, -28, 19, 23); ctx.fill();
    ctx.fillStyle = shade; ellipse(-7, -22, 8, 10); ctx.fill();
    ctx.fillStyle = fur; circle(4, -57, 17); ctx.fill();
    const tilt = -.34 + run * .1 + a.scare * .46;
    drawRabbitEar(-6, -70, tilt, a.scare);
    drawRabbitEar(11, -72, tilt + .12, a.scare);
    petEyes(a, -1, 9, -59);
    ctx.fillStyle = '#ff9ec4'; circle(4, -50, 3.2); ctx.fill();
    petNoseMouth(4, -47, '#b98a80');
  }

  function drawDog(a, t, run) {
    const fur = '#e8b877', dark = '#a9713a';
    ctx.strokeStyle = fur; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-18, -28);
    ctx.quadraticCurveTo(-34, -38, -36, -54 + run * 8); ctx.stroke();
    petLegs(fur, run, 16);
    ctx.fillStyle = fur; ellipse(0, -30, 23, 23); ctx.fill();
    ctx.fillStyle = '#c9955a'; ellipse(-8, -24, 9, 11); ctx.fill();
    ctx.fillStyle = fur; circle(6, -58, 19); ctx.fill();
    ctx.fillStyle = dark; ellipse(-9, -62, 8, 15); ctx.fill(); ellipse(21, -62, 8, 15); ctx.fill();
    petEyes(a, 0, 13, -60);
    ctx.fillStyle = '#fff2dc'; ellipse(8, -50, 9, 7); ctx.fill();
    ctx.fillStyle = '#38281c'; circle(9, -52, 3.4); ctx.fill();
    petNoseMouth(9, -49, '#38281c');

    ctx.beginPath(); ctx.moveTo(-6, -44); ctx.quadraticCurveTo(6, -39, 18, -44); ctx.stroke();
    ctx.fillStyle = '#ffd84d'; circle(6, -39, 4.5); ctx.fill();
  }

  function drawRank(n) {
    ctx.save(); ctx.translate(-31, -10);
    ctx.fillStyle = '#ffd84d'; circle(0, 0, 12); ctx.fill();
    ctx.strokeStyle = '#e8961c'; ctx.lineWidth = 2.5; circle(0, 0, 12); ctx.stroke();
    ctx.fillStyle = '#a34b00'; ctx.font = '900 15px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(n), 0, 1);
    ctx.restore();
  }
  function drawBang(k) {
    ctx.save(); ctx.translate(20, -102);
    const sc = .7 + .5 * Math.min(1, k * 1.5);
    ctx.scale(sc, sc);
    ctx.fillStyle = '#fff'; circle(0, 0, 16); ctx.fill();
    ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = 3; circle(0, 0, 16); ctx.stroke();
    ctx.fillStyle = '#e8402c'; ctx.font = '900 24px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, 1);
    ctx.restore();
  }
  function drawAnimals(t) {
    for (const a of ANIMALS) {
      const run = Math.sin(t * 13 + a.phase);
      const bob = a.jumpY > .5 ? 0 : Math.abs(Math.sin(t * 13 + a.phase)) * 3;
      ctx.save();
      ctx.fillStyle = 'rgba(30,60,20,.16)';
      ellipse(a.baseX + a.dash, GROUND_Y + 3, Math.max(10, 23 - a.jumpY * .12), 6); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(a.baseX + a.dash, GROUND_Y - a.jumpY - bob);
      ctx.rotate(-a.scare * .1);
      const puff = 1 + a.scare * .08;
      ctx.scale(puff, puff);
      if (a.id === 'cat') drawCat(a, t, run);
      else if (a.id === 'rabbit') drawRabbit(a, t, run);
      else drawDog(a, t, run);
      drawRank(a.rank);
      if (a.scare > .05) drawBang(a.scare);
      ctx.restore();
    }
  }

  /* ============ 形态表：同一批部件重新排队 ============ */
  function P(x, y, o) {
    o = o || {};
    const s = o.s === undefined ? 1 : o.s;
    return {
      x: x, y: y,
      rot: (o.r || 0) * Math.PI / 180,
      sx: s, sy: o.s2 === undefined ? s : o.s2,
      a: o.a === undefined ? 1 : o.a
    };

  const HIDDEN = P(0, 0, { a: 0 });

        cab: P(268, -18, { s: .9, s2: .7 }), chimney: P(72, -92, { s: .42 }),
        w1: P(-58, 95, { s: .85 }), w2: P(78, 95, { s: .85 }),
        w3: P(212, 95, { s: .85 }), w4: P(302, 95, { s: .85 }),
        armL: HIDDEN, armR: HIDDEN, wingL: HIDDEN, wingR: HIDDEN, flame: HIDDEN
      }
    }
  };
  const ORDER = ['train', 'robot', 'rocket', 'bus'];

  const PARTS = [
    { id: 'w3', draw: drawWheel }, { id: 'w4', draw: drawWheel },
    { id: 'wingL', draw: drawWing }, { id: 'wingR', draw: drawWing },
    { id: 'flame', draw: drawFlame },
    { id: 'cab', draw: drawCab }, { id: 'body', draw: drawBody },
    { id: 'armL', draw: drawArm }, { id: 'armR', draw: drawArm },
    { id: 'w1', draw: drawWheel }, { id: 'w2', draw: drawWheel },
    { id: 'chimney', draw: drawChimney }, { id: 'face', draw: drawFace }
  ].map(function (p) { return { id: p.id, draw: p.draw, st: P(0, 0, { a: 0 }), tg: P(0, 0, { a: 0 }) }; });

  /* ============ 音效 ============ */
  let audioCtx = null, muted = false;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, delay, to) {
    if (muted || !audioCtx) return;
    const now = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, now);
    if (to) o.frequency.exponentialRampToValueAtTime(to, now + dur);
    g.gain.setValueAtTime(.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + .015);
    g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + dur + .05);
  }
  function sfxTransform() {
    tone(523, .11, 'triangle', .1, 0); tone(659, .11, 'triangle', .1, .09);
    tone(784, .11, 'triangle', .1, .18); tone(1046, .22, 'sine', .09, .28);
  }
  function sfxStar() { tone(880, .13, 'sine', .11, 0, 1480); }
  function sfxClick() { tone(520, .06, 'square', .045, 0); }
  function sfxScare() {
    tone(760, .09, 'sine', .06, 0, 1180);
    tone(980, .10, 'triangle', .045, .1, 1420);
  }
  function scareAnimals(power) {
    for (const a of ANIMALS) { a.pending = power; a.scareDelay = a.delay; }
    sfxScare();
  }

  const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#e8402c"/>' +
    '<path d="M16 9c1.4 1.4 1.4 4.6 0 6M18.6 6.4c3 3 3 8.2 0 11.2" fill="none" stroke="#e8402c" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#9aa0a6"/>' +
    '<path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/></svg>';

  /* ============ 状态 ============ */
  let running = false, t = 0, last = 0;
  let score = 0, formIndex = 0, curForm = 'train';
  let starTimer = 1.2, smokeTimer = 0;
  let moodTimer = 0, monsterTarget = 0, monsterMix = 0, moodCount = 0, lastLabel = '';
  const MOOD_TIME = 12, BASE_SPEED = 190;
  let bgOffset = 0, curLift = 0, targetLift = 0, speedMul = 1, targetSpeedMul = 1;
  let curZoom = 1, targetZoom = 1, curDx = 0, targetDx = 0;
  let shake = 0, stretch = 0, flash = 0;
  const stars = [], parts = [], puffs = [];
  const trainX = 300, trainY = 352;

  const elScore = document.getElementById('scoreNum');
  const elForm = document.getElementById('formChip');
  const elFormName = document.getElementById('formName');
  const elFormDot = document.getElementById('formDot');
  const elBar = document.getElementById('barFill');
  const elBarLabel = document.getElementById('barLabel');
  const elToast = document.getElementById('toast');
  const elCover = document.getElementById('cover');

  const clouds = [];
  for (let i = 0; i < 7; i++) clouds.push({ x: i * 190 + Math.random() * 90, y: 40 + Math.random() * 130, s: .55 + Math.random() * .75, v: .22 + Math.random() * .18 });
  const trees = [];
  for (let i = 0; i < 9; i++) trees.push({ x: i * 145 + Math.random() * 70, s: .7 + Math.random() * .6, v: .55, kind: i % 3 });

  function toast(text) {
    elToast.textContent = text;
    elToast.classList.remove('show');
    void elToast.offsetWidth;
    elToast.classList.add('show');
  }
  function updateScore(pop) {
    elScore.textContent = score;
    if (pop) { elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop'); }
  }

  function applyForm(key, instant) {
    const f = FORMS[key];
    targetLift = f.lift; targetSpeedMul = f.speed;
    targetZoom = f.zoom === undefined ? 1 : f.zoom;
    targetDx = f.dx === undefined ? 0 : f.dx;
    for (const p of PARTS) {
      const s = f.parts[p.id] || HIDDEN;
      p.tg = { x: s.x, y: s.y, rot: s.rot, sx: s.sx, sy: s.sy, a: s.a };
      if (instant) p.st = { x: s.x, y: s.y, rot: s.rot, sx: s.sx, sy: s.sy, a: s.a };
    }
    if (instant) { curLift = targetLift; speedMul = targetSpeedMul; curZoom = targetZoom; curDx = targetDx; }
    curForm = key;
    elFormName.textContent = f.name;
    elFormDot.style.background = f.color;
    elFormDot.style.boxShadow = '0 0 0 2px ' + f.color;
    elToast.style.color = f.color;
    elForm.classList.remove('bump'); void elForm.offsetWidth; elForm.classList.add('bump');
  }

  function burst(x, y, colors, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = power * (.35 + Math.random());
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: .55 + Math.random() * .55, max: 1.1,
        r: 3 + Math.random() * 5,
        color: colors[(Math.random() * colors.length) | 0],
        spin: (Math.random() - .5) * 12, rot: Math.random() * TAU, star: Math.random() < .6
      });
    }
  }

  function sfxMood(toMonster) {
    if (toMonster) {
      tone(300, .34, 'sawtooth', .055, 0, 140);
      tone(200, .30, 'triangle', .06, .08, 110);
      tone(150, .28, 'sine', .05, .20, 90);
    } else {
      tone(523, .12, 'sine', .09, 0);
      tone(659, .12, 'sine', .09, .1);
      tone(880, .20, 'sine', .08, .2);
    }
  }

  function toggleMood() {
    const toMonster = monsterTarget === 0;
    monsterTarget = toMonster ? 1 : 0;
    moodTimer = 0; moodCount++;
    /* 第一次变怪物时回到小火车身体，保证看到的是「怪物火车」 */
    if (toMonster && moodCount === 1) { formIndex = 0; applyForm('train', false); }
    shake = 1; flash = 1; stretch = .14;
    burst(trainX + curDx + 120 * curZoom, trainY + curLift - 10,
          toMonster ? ['#8b5cf6', '#ff8a3d', '#ef4444', '#ffd84d', '#fff']
                    : ['#ffd84d', '#8ad8ff', '#fff', '#8ce38c'], 34, 360);
    scareAnimals(toMonster ? 1.35 : 1.05);
    elToast.style.color = toMonster ? '#7b3fe4' : '#1fa46a';
    if (toMonster) {
      toast(moodCount === 1 ? '嗷呜！变成怪物火车啦！' : '嗷呜～怪物模式又来啦！');
    } else {
      toast('又变回乖乖火车啦！');
    }
    sfxMood(toMonster);
  }

  function transform() {
    formIndex = (formIndex + 1) % ORDER.length;
    const key = ORDER[formIndex];
    applyForm(key, false);
    shake = 1; flash = 1; stretch = .16;
    burst(trainX + curDx + 120 * curZoom, trainY + curLift - 10, ['#ffd84d', '#fff', '#ff9ec4', '#ff8a3d', '#8ad8ff'], 30, 340);
    scareAnimals(1);
    toast('变成 ' + FORMS[key].name + ' 啦！');
    sfxTransform();
  }

  function reset() {
    score = 0; updateScore(false);
    stars.length = 0; parts.length = 0; puffs.length = 0;
    for (const a of ANIMALS) {
      a.jumpY = 0; a.vy = 0; a.scare = 0; a.pending = 0; a.dash = 0;
    }
    formIndex = 0; starTimer = 1.2;
    moodTimer = 0; monsterTarget = 0; monsterMix = 0; moodCount = 0;
    applyForm('train', true);
    toast('重新出发！');
  }

  /* ============ 背景 ============ */
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#68bff2'); g.addColorStop(.55, '#abe0fa'); g.addColorStop(1, '#e6f6df');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const sg = ctx.createRadialGradient(872, 88, 8, 872, 88, 105);
    sg.addColorStop(0, 'rgba(255,250,190,.95)'); sg.addColorStop(1, 'rgba(255,250,190,0)');
    ctx.fillStyle = sg; circle(872, 88, 105); ctx.fill();
    ctx.fillStyle = '#fff3a8'; circle(872, 88, 40); ctx.fill();
  }
  function drawCloud(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(150,190,215,.25)';
    ellipse(4, 16, 74, 22); ctx.fill();
    ctx.fillStyle = '#fff';
    [[-56, 4, 26], [-24, -12, 34], [12, -18, 40], [48, -2, 28], [66, 12, 20], [0, 14, 44]].forEach(function (c) {
      circle(c[0], c[1], c[2]); ctx.fill();
    });
    ctx.restore();
  }
  function drawHills(off) {
    ctx.fillStyle = '#a8dfa6';
    for (let k = -1; k < 3; k++) {
      const base = k * 640 - (off * .12) % 640;
      ctx.beginPath(); ctx.moveTo(base - 40, 452);
      ctx.quadraticCurveTo(base + 100, 300, base + 250, 452);
      ctx.quadraticCurveTo(base + 400, 330, base + 640, 452);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#8dd39a';
    for (let k = -1; k < 4; k++) {
      const base = k * 420 - (off * .2) % 420;
      ctx.beginPath(); ctx.moveTo(base - 30, 452);
      ctx.quadraticCurveTo(base + 100, 372, base + 230, 452);
      ctx.closePath(); ctx.fill();
    }
  }
  function drawTree(x, s, kind) {
    ctx.save(); ctx.translate(x, 452); ctx.scale(s, s);
    ctx.fillStyle = '#9a6a3c'; rr(-9, -56, 18, 60, 6); ctx.fill();
    const green = kind === 0 ? '#57b95c' : (kind === 1 ? '#46a86a' : '#6cc65c');
    ctx.fillStyle = green;
    circle(-22, -72, 27); ctx.fill(); circle(20, -76, 30); ctx.fill();
    circle(0, -104, 34); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    circle(-8, -114, 13); ctx.fill();
    ctx.restore();
  }
  function drawGround() {
    const g = ctx.createLinearGradient(0, 440, 0, H);
    g.addColorStop(0, '#8ed36a'); g.addColorStop(1, '#57ad4c');
    ctx.fillStyle = g; ctx.fillRect(0, 440, W, H - 440);
    ctx.fillStyle = '#a9e07c';
    for (let k = -1; k < 4; k++) {
      const base = k * 360 - (bgOffset * .45) % 360;
      ellipse(base + 130, 452, 130, 16); ctx.fill();
    }
    /* 轨道 */
    ctx.fillStyle = '#8f7350'; ctx.fillRect(0, 486, W, 26);
    ctx.fillStyle = '#6f6a6c'; ctx.fillRect(0, 480, W, 7); ctx.fillRect(0, 505, W, 7);
    const step = 78, o = (bgOffset * 1) % step;
    ctx.fillStyle = '#7a5230';
    for (let i = -1; i < 16; i++) { rr(-o + i * step, 478, 16, 34, 4); ctx.fill(); }
    ctx.fillStyle = '#b9a58a';
    for (let i = 0; i < 90; i++) {
      const x = (i * 37 + 13 - bgOffset * 1.1) % W;
      circle(x < 0 ? x + W : x, 520 + (i % 5) * 8, 2 + (i % 3)); ctx.fill();
    }
    /* 前景草 */
    ctx.fillStyle = '#3f9b45';
    for (let i = -1; i < 40; i++) {
      const x = (i * 42 - bgOffset * 1.55) % (W + 60);
      const xx = x < -30 ? x + W + 60 : x;
      const h = 12 + (i % 4) * 5;
      ctx.beginPath(); ctx.moveTo(xx, H); ctx.quadraticCurveTo(xx + 4, H - h, xx + 12, H - h - 4);
      ctx.quadraticCurveTo(xx + 7, H - h + 4, xx + 6, H); ctx.closePath(); ctx.fill();
    }
  }

  /* ============ 火车 ============ */
  function drawTrain(time) {
    const bob = Math.sin(time * 11) * 2.4;
    const sq = 1 + stretch + Math.sin(time * 11) * .012;
    ctx.save();
    ctx.translate(trainX + curDx, trainY + curLift + bob);
    ctx.scale(curZoom * sq, curZoom / sq);
    for (const p of PARTS) {
      if (p.st.a < .02) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.st.a));
      ctx.translate(p.st.x, p.st.y);
      ctx.rotate(p.st.rot);
      ctx.scale(p.st.sx, p.st.sy);
      p.draw(time);
      ctx.restore();
    }
    ctx.restore();
  }

  /* ============ 更新与绘制 ============ */
  function update(dt) {
    t += dt;
    speedMul += (targetSpeedMul - speedMul) * Math.min(1, dt * 2.5);
    const speed = BASE_SPEED * speedMul;
    bgOffset += speed * dt;
    wheelSpin += speed * dt / 42;
    curLift += (targetLift - curLift) * Math.min(1, dt * 6);
    curZoom += (targetZoom - curZoom) * Math.min(1, dt * 6);
    curDx += (targetDx - curDx) * Math.min(1, dt * 6);
    shake = Math.max(0, shake - dt * 3.2);
    flash = Math.max(0, flash - dt * 2.6);
    stretch += (0 - stretch) * Math.min(1, dt * 7);

    const k = Math.min(1, dt * 7);
    for (const p of PARTS) {
      p.st.x += (p.tg.x - p.st.x) * k;
      p.st.y += (p.tg.y - p.st.y) * k;
      p.st.rot += (p.tg.rot - p.st.rot) * k;
      p.st.sx += (p.tg.sx - p.st.sx) * k;
      p.st.sy += (p.tg.sy - p.st.sy) * k;
      p.st.a += (p.tg.a - p.st.a) * k;
    }

    /* 烟雾 */
    smokeTimer -= dt;
    if (smokeTimer <= 0 && curForm !== 'rocket') {
      smokeTimer = .13;
      const cp = PARTS.find(function (p) { return p.id === 'chimney'; });
      puffs.push({
        x: trainX + curDx + cp.st.x * curZoom, y: trainY + curLift + (cp.st.y - 40) * curZoom,
        vx: -speed * .38, vy: -34 - Math.random() * 20,
        r: 9 + Math.random() * 5, life: 1.5, max: 1.5
      });
    } else if (smokeTimer <= 0) {
      smokeTimer = .06;
      const cp = PARTS.find(function (p) { return p.id === 'flame'; });
      puffs.push({
        x: trainX + curDx + cp.st.x * curZoom + (Math.random() - .5) * 22,
        y: trainY + curLift + (cp.st.y + 60) * curZoom,
        vx: -speed * .5, vy: 30 + Math.random() * 40,
        r: 5 + Math.random() * 5, life: .7, max: .7, spark: true
      });
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const q = puffs[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.r += dt * (q.spark ? -4 : 15);
      q.life -= dt;
      if (q.life <= 0 || q.r <= 0) puffs.splice(i, 1);
    }

    /* 粒子 */
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 320 * dt;
      q.rot += q.spin * dt; q.life -= dt;
      if (q.life <= 0) parts.splice(i, 1);
    }

    /* 小动物：一直跑，被吓到就弹跳、往前窜一下、瞪大眼 */
    for (const a of ANIMALS) {
      if (a.pending > 0) {
        a.scareDelay -= dt;
        if (a.scareDelay <= 0) {
          const pw = a.pending;
          a.vy = (380 + Math.random() * 70) * pw;
          a.scare = 1;
          a.dash += 28 * pw;
          burst(a.baseX + a.dash, GROUND_Y - 66, ['#8ad8ff', '#fff', '#ffd84d'], 5, 110);
          a.pending = 0;
        }
      }
      if (a.jumpY > 0 || a.vy > 0) {
        a.vy -= 1100 * dt;
        a.jumpY += a.vy * dt;
        if (a.jumpY <= 0) { a.jumpY = 0; a.vy = a.vy < -90 ? -a.vy * .32 : 0; }
      }
      a.scare = Math.max(0, a.scare - dt * 1.15);
      a.dash += (0 - a.dash) * Math.min(1, dt * 1.5);
    }

    if (!running) return;

    /* 乖乖火车 <-> 尖牙怪物火车：定时切换，脸部渐变过渡 */
    moodTimer += dt;
    monsterMix += (monsterTarget - monsterMix) * Math.min(1, dt * 3);
    elBar.style.width = Math.min(100, moodTimer / MOOD_TIME * 100) + '%';
    const left = Math.max(0, Math.ceil(MOOD_TIME - moodTimer));
    const label = (monsterTarget ? '怪物火车' : '乖乖火车') + ' · ' + left + ' 秒后' +
                  (monsterTarget ? '变回乖乖' : '变怪物');
    if (label !== lastLabel) { elBarLabel.textContent = label; lastLabel = label; }
    if (moodTimer >= MOOD_TIME) toggleMood();

    /* 星星 */
    starTimer -= dt;
    if (starTimer <= 0) {
      starTimer = 1.25 + Math.random() * .8;
      stars.push({ x: 1060, y: 235 + Math.random() * 155, r: 17 + Math.random() * 6,
                   rot: Math.random() * TAU, vx: -(speed * 1.04), got: false });
    }
    const hx = trainX + curDx + 120 * curZoom, hy = trainY + curLift + 5 * curZoom;
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.x += s.vx * dt; s.rot += dt * 2.2;
      const dx = (s.x - hx) / 215, dy = (s.y - hy) / 140;
      if (dx * dx + dy * dy < 1) {
        score += 1; updateScore(true); sfxStar();
        burst(s.x, s.y, ['#ffd84d', '#fff', '#ffb02e'], 12, 210);
        stars.splice(i, 1);
        if (score % 5 === 0) transform();
      } else if (s.x < -60) stars.splice(i, 1);
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 10 * shake, (Math.random() - .5) * 8 * shake);
    drawSky();
    for (const c of clouds) {
      const x = ((c.x - bgOffset * c.v) % (W + 320) + W + 320) % (W + 320) - 160;
      drawCloud(x, c.y, c.s);
    }
    drawHills(bgOffset);
    for (const tr of trees) {
      const x = ((tr.x - bgOffset * tr.v) % (W + 260) + W + 260) % (W + 260) - 130;
      drawTree(x, tr.s, tr.kind);
    }
    drawGround();

    /* 烟雾 */
    for (const q of puffs) {
      ctx.globalAlpha = Math.max(0, q.life / q.max) * (q.spark ? .9 : .5);
      ctx.fillStyle = q.spark ? '#ffb02e' : '#ffffff';
      circle(q.x, q.y, q.r); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* 星星 */
    for (const s of stars) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.fillStyle = '#ffcf2e'; starPath(s.r + 3); ctx.fill();
      ctx.fillStyle = '#fff2a8'; starPath(s.r); ctx.fill();
      ctx.strokeStyle = '#f39a12'; ctx.lineWidth = 2; starPath(s.r); ctx.stroke();
      ctx.fillStyle = '#fff'; circle(-3, -4, 3); ctx.fill();
      ctx.restore();
    }

    drawTrain(t);
    drawAnimals(t);

    /* 变形闪光粒子 */
    for (const q of parts) {
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, q.life / q.max * 1.6));
      ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.color;
      if (q.star) { starPath(q.r * 1.5); } else { circle(0, 0, q.r); }
      ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;

    /* 变形白闪 */
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,220,' + (flash * .3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function frame(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000; last = ts;
    if (dt > .05) dt = .05;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  /* ============ 交互 ============ */
  function start() {
    initAudio();
    running = true;
    elCover.classList.add('hide');
    moodTimer = 0;
    toast('乖乖火车出发！');
    sfxTransform();
  }
  function doTransform() {
    initAudio();
    if (!running) { start(); return; }
    sfxClick();
    transform();
  }
  document.getElementById('btnStart').addEventListener('click', start);
  document.getElementById('btnTransform').addEventListener('click', doTransform);
  canvas.addEventListener('pointerdown', doTransform);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); doTransform(); }
  });
  const elMute = document.getElementById('btnMute');
  elMute.innerHTML = ICON_ON;
  elMute.addEventListener('click', function () {
    muted = !muted;
    this.innerHTML = muted ? ICON_OFF : ICON_ON;
    if (!muted) { initAudio(); sfxClick(); }
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    initAudio(); sfxClick(); reset();
  });

  applyForm('train', true);
  updateScore(false);
  requestAnimationFrame(frame);
