<script>
(function () {
  'use strict';

  // ============ 音效 ============
  var AC = null;
  function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
  function tone(freq, dur, type, vol) {
    var ac = audio(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function sWhistle() { tone(880, .15, 'square', .05); setTimeout(function () { tone(1200, .2, 'square', .05); }, 110); }
  function sWin() { tone(523, .13, 'triangle', .12); setTimeout(function () { tone(659, .13, 'triangle', .12); }, 120); setTimeout(function () { tone(784, .3, 'triangle', .14); }, 240); }
  function sCrash() { tone(200, .28, 'sawtooth', .16); setTimeout(function () { tone(130, .45, 'sawtooth', .16); }, 150); }

  // ============ 关卡数据（共 6 关，每关火车数量随机 1-7，最多 7 列） ============
  var TOTAL_LEVELS = 6;
  var LEVELS = [];
  for (var _li = 1; _li <= TOTAL_LEVELS; _li++) LEVELS.push({ name: '第 ' + _li + ' 关', trains: null });

  // 火车颜色方案（7 色，数量多时仍能区分）
  var TRAIN_COLORS = [
    { id: 'red',    label: '红火车', color: '#E53935', dark: '#B71C1C' },
    { id: 'blue',   label: '蓝火车', color: '#1E88E5', dark: '#0D47A1' },
    { id: 'green',  label: '绿火车', color: '#43A047', dark: '#1B5E20' },
    { id: 'orange', label: '橙火车', color: '#FB8C00', dark: '#E65100' },
    { id: 'purple', label: '紫火车', color: '#8E24AA', dark: '#4A148C' },
    { id: 'teal',   label: '青火车', color: '#00897B', dark: '#004D40' },
    { id: 'pink',   label: '粉火车', color: '#EC407A', dark: '#880E4F' }
  ];

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  // 随机生成 n 辆火车的关卡（相对坐标）：起点在左侧竖排、终点在右侧循环错位配对，
  // 保证 n 辆火车恰好产生 n-1 个交叉点，难度随数量自然递增
  function buildLevel(n) {
    var starts = [], ends = [];
    // 竖排区间随数量扩展：数量多时占满整高，避免挤在中间
    var pad = n > 4 ? 0.05 : 0.12;   // 顶部/底部留白
    var top = pad, bot = 1 - pad;
    for (var i = 0; i < n; i++) {
      var sy = n === 1 ? 0.5 : (top + (bot - top) * i / (n - 1));
      starts.push({ x: 0.13, y: sy });
      ends.push({ x: 0.87, y: sy });
    }
    if (n >= 2) {
      // 循环移位 1：起点 i → 终点 (i+1)%n，确保轨道交叉
      ends = ends.slice(1).concat(ends.slice(0, 1));
    } else {
      ends = shuffle(ends);
    }
    var trains = [];
    for (var k = 0; k < n; k++) {
      var c = TRAIN_COLORS[k];
      trains.push({ id: c.id, label: c.label, color: c.color, dark: c.dark, start: starts[k], end: ends[k] });
    }
    return trains;
  }

  // ============ 画布 ============
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var dpr = Math.max(1, window.devicePixelRatio || 1);
  var W = 0, H = 0;
  var COLLIDE_R = 0;      // 碰撞判定半径（px）
  var END_R = 0;
  // 画布宽高比约束（宽/高），避免极端横长或竖长
  var RATIO_MAX = 1.5, RATIO_MIN = 0.8, CANVAS_MAX_W = 980;

  // 元素尺寸基准（随火车数量缩小，避免 7 辆时互相重叠）
  function unit() {
    return Math.min(W, H);
  }
  // 起点/行驶火车尺寸：随数量递减，保证竖排不重叠
  function trainSize() {
    var u = unit();
    var n = trains.length || 1;
    var byCount = Math.min(0.125, 0.92 / n * 0.72);  // 按行高限制
    return u * byCount;
  }
  // 终点房子尺寸
  function endSize() {
    return unit() * 0.085;
  }

  function resize() {
    var wrap = canvas.parentElement;
    var oldW = W, oldH = H, oldPts = [], oldS = [];
    for (var i = 0; i < trains.length; i++) { oldPts.push(trains[i].pts); oldS.push(trains[i].s); }

    // 可用区域 = 弹性布局剩余空间，画布在比例约束内尽可能大地铺满
    var availW = wrap.clientWidth || 480;
    var availH = wrap.clientHeight;
    if (!availH || availH < 160) availH = Math.round(availW * 0.72);
    var w = Math.min(availW, availH * RATIO_MAX, CANVAS_MAX_W);
    var h = Math.min(availH, w / RATIO_MIN);
    W = Math.round(w); H = Math.round(h);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 碰撞/终点半径也随数量微调，7 辆时略收紧以免相邻轨道误判
    COLLIDE_R = Math.max(16, Math.min(W, H) * 0.05);
    END_R = Math.max(14, Math.min(W, H) * 0.05);
    if (LEVELS[level - 1].trains) placeLevelObjects();

    // 尺寸变化时（旋转屏幕/地址栏收放），已画轨道按比例缩放保留，不丢进度
    if (oldW > 0 && oldH > 0 && (W !== oldW || H !== oldH)) {
      var kx = W / oldW, ky = H / oldH, ks = (kx + ky) / 2;
      for (var j = 0; j < trains.length && j < oldPts.length; j++) {
        if (oldPts[j] && oldPts[j].length) {
          trains[j].pts = oldPts[j].map(function (p) { return { x: p.x * kx, y: p.y * ky }; });
          trains[j].s = oldS[j] * ks;
        }
      }
    }
  }
  function L(rel, axis) { return rel * (axis === 'x' ? W : H); }

  // ============ 火车状态 ============
  var level = 1;
  var trains = [];        // 当前关火车数组
  var active = 0;         // 当前画线火车索引
  var drawing = false;
  var running = false;
  var crashed = false;
  var t0 = 0;
  var crossings = [];     // 交叉点
  var explosions = [];    // 爆炸粒子
  var stars = {};

  // 进入/切换关卡：随机生成火车数量（1-7）与布局，再映射到画布
  function loadLevel() {
    var lv = LEVELS[level - 1];
    lv.trains = buildLevel(randInt(1, 7));
    placeLevelObjects();
    elLevel.textContent = lv.name + ' · ' + lv.trains.length + ' 辆火车';
    toast('🚂 本关共 ' + lv.trains.length + ' 列火车，都画好轨道再出发');
  }

  function placeLevelObjects() {
    var lv = LEVELS[level - 1];
    trains = lv.trains.map(function (t) {
      return {
        id: t.id, label: t.label, color: t.color, dark: t.dark,
        start: { x: L(t.start.x, 'x'), y: L(t.start.y, 'y') },
        end: { x: L(t.end.x, 'x'), y: L(t.end.y, 'y') },
        // 初始位置即起点，避免未出发时被画到 (0,0)
        pts: [], s: 0, x: L(t.start.x, 'x'), y: L(t.start.y, 'y'), angle: 0, done: false, isCrashed: false
      };
    });
  }

  // ============ DOM ============
  var elLevel = document.getElementById('levelName');
  var elTimer = document.getElementById('timer');
  var elDrawColor = document.getElementById('drawingColor');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var btnClear = document.getElementById('btnClear');
  var btnGo = document.getElementById('btnGo');
  var btnNext = document.getElementById('btnNext');
  var btnReset = document.getElementById('btnReset');

  function toast(msg, dur) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, dur || 2000);
  }

  // ============ 工具函数 ============
  function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
  function lineLength(arr) {
    var t = 0;
    for (var i = 1; i < arr.length; i++) t += dist(arr[i - 1], arr[i]);
    return t;
  }
  function simplify(arr, tol) {
    if (arr.length < 3) return arr;
    function perpDist(p, a, b) {
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len === 0) return Math.hypot(p.x - a.x, p.y - a.y);
      var t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (len * len)));
      return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    }
    function rdp(segment) {
      var dmax = 0, idx = 0;
      for (var i = 1; i < segment.length - 1; i++) {
        var d = perpDist(segment[i], segment[0], segment[segment.length - 1]);
        if (d > dmax) { dmax = d; idx = i; }
      }
      if (dmax > tol && segment.length > 2) {
        var l = rdp(segment.slice(0, idx + 1));
        var r = rdp(segment.slice(idx));
        return l.slice(0, l.length - 1).concat(r);
      }
      return [segment[0], segment[segment.length - 1]];
    }
    return rdp(arr);
  }
  // 线段求交（不含端点）
  function segIntersect(a1, a2, b1, b2) {
    var d1x = a2.x - a1.x, d1y = a2.y - a1.y;
    var d2x = b2.x - b1.x, d2y = b2.y - b1.y;
    var denom = d1x * d2y - d1y * d2x;
    if (Math.abs(denom) < 1e-9) return null;
    var t = ((b1.x - a1.x) * d2y - (b1.y - a1.y) * d2x) / denom;
    var u = ((b1.x - a1.x) * d1y - (b1.y - a1.y) * d1x) / denom;
    // 允许轻微超出端点（交点落在采样端点上时由相邻线段对捕获，配合 computeCrossings 距离去重）
    if (t >= -0.02 && t <= 1.02 && u >= -0.02 && u <= 1.02) {
      return { x: a1.x + t * d1x, y: a1.y + t * d1y };
    }
    return null;
  }
  function angleOf(arr, idx) {
    var a = arr[Math.max(0, idx - 1)], b = arr[Math.min(arr.length - 1, idx + 1)];
    return Math.atan2(b.y - a.y, b.x - a.x);
  }
  function pointAt(arr, s) {
    if (s <= 0) return { x: arr[0].x, y: arr[0].y, i: 0 };
    var acc = 0;
    for (var i = 1; i < arr.length; i++) {
      var d = dist(arr[i - 1], arr[i]);
      if (acc + d >= s) {
        var t = d === 0 ? 0 : (s - acc) / d;
        return { x: arr[i - 1].x + (arr[i].x - arr[i - 1].x) * t, y: arr[i - 1].y + (arr[i].y - arr[i - 1].y) * t, i: i };
      }
      acc += d;
    }
    var last = arr[arr.length - 1];
    return { x: last.x, y: last.y, i: arr.length - 1 };
  }

  // ============ 画线交互 ============
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (running || crashed || (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse')) return;
    e.preventDefault();
    var p = getPos(e);
    // 自动识别归属：从哪列火车的起点按下，就画哪列
    var best = -1, bestD = Infinity;
    for (var i = 0; i < trains.length; i++) {
      var d = dist(p, trains[i].start);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (bestD > COLLIDE_R * 2.6) {
      toast('👆 请按住🚂火车位置开始画轨道');
      return;
    }
    active = best;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    drawing = true;
    var t = trains[active];
    t.pts = [];
    t.pts.push(p);
    elDrawColor.textContent = '✏️ 正在画：' + t.label;
    elDrawColor.style.color = t.color;
    elDrawColor.style.fontWeight = 'bold';
    audio();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    e.preventDefault();
    var t = trains[active];
    var p = getPos(e);
    var last = t.pts[t.pts.length - 1];
    if (dist(last, p) < 3) return;
    t.pts.push({ x: p.x, y: p.y });
  });

  function endDraw() {
    if (!drawing) return;
    drawing = false;
    var t = trains[active];
    // 有效性以「原始采样点数」判定（≥2 点即画过），再做简化——
    // 若先简化后判点数，直线/流畅轨道会被压成 2 点而误判为空（旧 bug：轨道消失）
    if (t.pts.length < 2) { t.pts = []; return; }
    t.pts = simplify(t.pts, 2.2);
    // 简化后至少保留首尾 2 点，即视为有效轨道
    if (t.pts.length >= 2) {
      // 连接判定半径与按下识别保持一致，避免起点/终点校验过严误报
      var R = COLLIDE_R * 2.6;
      var okS = dist(t.pts[0], t.start) < R;
      var okE = dist(t.pts[t.pts.length - 1], t.end) < R;
      if (!okS) toast('🚂 ' + t.label + '的轨道要从火车位置开始画哦');
      else if (!okE) toast('🏠 ' + t.label + '的轨道要画到' + t.label + '家门口哦');
      else toast('✅ ' + t.label + '轨道画好啦！');
    } else {
      t.pts = [];
    }
  }
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointercancel', endDraw);

  // ============ 按钮 ============
  function resetDrawingInfo() {
    elDrawColor.textContent = '从🚂火车位置开始画';
    elDrawColor.style.color = '';
    elDrawColor.style.fontWeight = '';
  }

  btnClear.addEventListener('click', function () {
    if (running || crashed) return;
    for (var i = 0; i < trains.length; i++) trains[i].pts = [];
    resetDrawingInfo();
    toast('🧹 已清除全部轨道');
  });

  btnReset.addEventListener('click', function () {
    document.getElementById('crashModal').classList.add('hidden');
    resetAll();
  });

  btnGo.addEventListener('click', startAll);

  // 换一关：随机进入下一关（数量与布局重新随机）
  btnNext.addEventListener('click', function () {
    if (running || crashed) { toast('⏳ 先等这局结束再换关'); return; }
    level = level % TOTAL_LEVELS + 1;
    loadLevel();
    resetAll();
  });

  // ============ 交叉点计算 ============
  function computeCrossings() {
    crossings = [];
    for (var i = 0; i < trains.length; i++) {
      for (var j = i + 1; j < trains.length; j++) {
        var A = trains[i].pts, B = trains[j].pts;
        if (A.length < 2 || B.length < 2) continue;
        for (var a = 1; a < A.length; a++) {
          for (var b = 1; b < B.length; b++) {
            var p = segIntersect(A[a - 1], A[a], B[b - 1], B[b]);
            if (!p) continue;
            var dup = false;
            for (var k = 0; k < crossings.length; k++) {
              if (dist(crossings[k].p, p) < 10) { dup = true; break; }
            }
            if (!dup) crossings.push({ p: p, a: i, b: j });
          }
        }
      }
    }
  }

  // ============ 出发 ============
  function checkTrain(t) {
    if (t.pts.length < 2) return false;
    var R = COLLIDE_R * 2.6;
    return dist(t.pts[0], t.start) < R && dist(t.pts[t.pts.length - 1], t.end) < R;
  }

  function startAll() {
    if (running || crashed) return;
    var allOk = true;
    for (var i = 0; i < trains.length; i++) {
      if (!checkTrain(trains[i])) { toast('✏️ ' + trains[i].label + '的轨道还没画好哦'); allOk = false; break; }
    }
    if (!allOk) return;
    running = true;
    computeCrossings();
    if (crossings.length === 0) toast('轨道没有交叉，一路顺风～');
    for (var j = 0; j < trains.length; j++) {
      var t = trains[j];
      t.s = 0; t.done = false; t.isCrashed = false;
      t.x = t.pts[0].x; t.y = t.pts[0].y;
      t.angle = angleOf(t.pts, 0);
    }
    t0 = Date.now();
    sWhistle();
    updateBtns();
  }

  // ============ 行驶与判定 ============
  function updateTrains(dt) {
    var speed = Math.max(H * 0.5, 140);
    for (var i = 0; i < trains.length; i++) {
      var t = trains[i];
      if (t.done || t.isCrashed) continue;
      t.s += speed * dt;
      var total = lineLength(t.pts);
      var p = pointAt(t.pts, t.s);
      t.x = p.x; t.y = p.y;
      t.angle = angleOf(t.pts, p.i);
      // 到达终点
      if (dist(t, t.end) < END_R && t.s >= total * 0.94) t.done = true;
      else if (t.s >= total) { t.done = true; } // 兜底
    }
    // 碰撞检测：两车同时接近同一交叉点
    for (var c = 0; c < crossings.length; c++) {
      var cr = crossings[c];
      var A = trains[cr.a], B = trains[cr.b];
      if (A.done || B.done || A.isCrashed || B.isCrashed) continue;
      var dA = dist(A, cr.p), dB = dist(B, cr.p);
      if (dA < COLLIDE_R && dB < COLLIDE_R) {
        doCrash(cr);
        return;
      }
    }
    // 全部到达 → 胜利
    var allDone = true;
    for (var k = 0; k < trains.length; k++) if (!trains[k].done) { allDone = false; break; }
    if (allDone) win();
  }

  function doCrash(cr) {
    crashed = true;
    running = false;
    var p = cr.p;
    // 翻车：仅碰撞的两列标记为撞车，其余火车原地停车
    for (var i = 0; i < trains.length; i++) {
      trains[i].isCrashed = (i === cr.a || i === cr.b);
    }
    // 爆炸粒子
    for (var n = 0; n < 18; n++) {
      var ang = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
      explosions.push({
        x: p.x, y: p.y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 40,
        life: 1, r: 3 + Math.random() * 4,
        color: Math.random() < 0.5 ? '#FF6F00' : '#FF5722'
      });
    }
    sCrash();
    updateBtns();
    setTimeout(function () { document.getElementById('crashModal').classList.remove('hidden'); }, 650);
  }

  function win() {
    running = false;
    var sec = Math.round((Date.now() - t0) / 1000);
    var n = trains.length;
    // 星级按火车数量缩放：3星 = 10+8n 秒，2星 = 20+16n 秒
    var s = sec <= 10 + 8 * n ? 3 : (sec <= 20 + 16 * n ? 2 : 1);
    if (!stars[level] || s > stars[level]) stars[level] = s;
    sWin();
    document.getElementById('winModalTitle').textContent = n + ' 列火车都到家啦！';
    document.getElementById('winStars').innerHTML = '⭐'.repeat(s) + '☆'.repeat(3 - s);
    document.getElementById('winStats').textContent = '用时 ' + sec + ' 秒 · 获得 ' + s + ' 颗星';
    var nxt = document.getElementById('btnWinNext');
    nxt.style.display = 'inline-block';
    nxt.textContent = level < TOTAL_LEVELS ? '下一关 ➡️' : '再来一轮 🔄';
    document.getElementById('winModal').classList.remove('hidden');
  }

  // ============ 绘制 ============
  var frameCount = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
    lastT = ts;
    frameCount++;
    if (running) updateTrains(dt);
    updateExplosions(dt);
    draw();
    requestAnimationFrame(frame);
  }
  var lastT = 0;

  function updateExplosions(dt) {
    for (var i = explosions.length - 1; i >= 0; i--) {
      var e = explosions[i];
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.vy += 300 * dt;
      e.life -= dt * 1.8;
      if (e.life <= 0) explosions.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBg();
    // 轨道
    for (var i = 0; i < trains.length; i++) if (trains[i].pts.length > 1) drawTrack(trains[i]);
    drawCrossings();
    for (var j = 0; j < trains.length; j++) {
      drawStation(trains[j], drawing && j === active);
    }
    // 行驶中/已撞车/已到家的火车单独绘制；
    // 静止待发的火车由 drawStation 画在起点
    for (var k = 0; k < trains.length; k++) {
      if (running || crashed || trains[k].done) drawTrain(trains[k]);
    }
    drawExplosions();
    drawHUD();
  }

  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#B3E5FC');
    g.addColorStop(0.45, '#C8E6C9');
    g.addColorStop(1, '#9CCC65');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    drawCloud(W * 0.2, H * 0.13, H * 0.06);
    drawCloud(W * 0.75, H * 0.2, H * 0.05);
  }
  function drawCloud(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.arc(x + r * 1.1, y + r * 0.2, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x - r * 1.1, y + r * 0.2, r * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrack(t) {
    // 轨道线宽也随数量微调（7 辆时略细，便于看清交叉）
    var lw = Math.max(4, Math.min(W, H) * 0.032);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = t.dark;
    ctx.lineWidth = lw;
    ctx.beginPath(); strokePts(t.pts); ctx.stroke();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = Math.max(2.5, lw * 0.6);
    ctx.beginPath(); strokePts(t.pts); ctx.stroke();
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = Math.max(1.5, lw * 0.2);
    ctx.beginPath(); strokePts(t.pts); ctx.stroke();
    ctx.setLineDash([]);
  }
  function strokePts(arr) {
    ctx.moveTo(arr[0].x, arr[0].y);
    for (var i = 1; i < arr.length; i++) ctx.lineTo(arr[i].x, arr[i].y);
  }

  function drawCrossings() {
    for (var i = 0; i < crossings.length; i++) {
      var c = crossings[i];
      var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 260);
      // 警示菱形
      ctx.save();
      ctx.translate(c.p.x, c.p.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = 'rgba(255,152,0,' + (0.45 + pulse * 0.4) + ')';
      ctx.strokeStyle = 'rgba(230,81,0,0.95)';
      ctx.lineWidth = 2.5;
      var s = COLLIDE_R * 0.9;
      ctx.beginPath();
      ctx.rect(-s, -s, s * 2, s * 2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
      // 警示符号
      ctx.fillStyle = 'rgba(230,81,0,0.95)';
      ctx.font = 'bold ' + Math.round(COLLIDE_R * 0.9) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⚠️', c.p.x, c.p.y);
    }
  }

  // ---- 彩色卡通小火车（Canvas 自绘，车身颜色与轨道/终点圆环一致）----
  function roundRectPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // 朝右的小火车，中心在原点，ts 为整车尺寸参考
  function drawTrainSprite(t, ts) {
    var lw = Math.max(1.5, ts * 0.05);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // 驾驶室（车尾，深色）
    ctx.fillStyle = t.dark;
    roundRectPath(-ts * 0.5, -ts * 0.36, ts * 0.3, ts * 0.56, ts * 0.08);
    ctx.fill();
    // 车窗
    ctx.fillStyle = '#FFF59D';
    roundRectPath(-ts * 0.44, -ts * 0.3, ts * 0.18, ts * 0.2, ts * 0.05);
    ctx.fill();
    // 锅炉车身（主色）
    ctx.fillStyle = t.color; ctx.strokeStyle = t.dark; ctx.lineWidth = lw;
    roundRectPath(-ts * 0.34, -ts * 0.2, ts * 0.82, ts * 0.4, ts * 0.1);
    ctx.fill(); ctx.stroke();
    // 锅炉箍
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = lw * 0.8;
    ctx.beginPath(); ctx.moveTo(ts * 0.08, -ts * 0.16); ctx.lineTo(ts * 0.08, ts * 0.16); ctx.stroke();
    // 烟囱
    ctx.fillStyle = t.dark;
    roundRectPath(ts * 0.18, -ts * 0.4, ts * 0.14, ts * 0.24, ts * 0.05);
    ctx.fill();
    // 车头灯
    ctx.fillStyle = '#FFF176'; ctx.strokeStyle = t.dark; ctx.lineWidth = lw * 0.7;
    ctx.beginPath(); ctx.arc(ts * 0.46, -ts * 0.01, ts * 0.07, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 车轮 + 轮毂
    var wy = ts * 0.26, wr = ts * 0.1, wheels = [-ts * 0.3, ts * 0.02, ts * 0.32];
    ctx.fillStyle = '#3E2723';
    for (var i = 0; i < wheels.length; i++) {
      ctx.beginPath(); ctx.arc(wheels[i], wy, wr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#D7CCC8';
    for (var j = 0; j < wheels.length; j++) {
      ctx.beginPath(); ctx.arc(wheels[j], wy, wr * 0.38, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawStation(t, isActive) {
    // 终点小屋 + 同色圆环
    var es = endSize();
    ctx.save();
    ctx.translate(t.end.x, t.end.y);
    ctx.font = es + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🏠', 0, 0);
    ctx.strokeStyle = t.color; ctx.lineWidth = Math.max(2.5, es * 0.12);
    ctx.beginPath(); ctx.arc(0, 0, es * 0.82, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    // 起点：彩色小火车 + 同色脉冲圈（未画线也能看出这列车连哪个终点）
    if (!running && !crashed) {
      var ts = trainSize();
      ctx.save();
      ctx.translate(t.start.x, t.start.y);
      drawTrainSprite(t, ts);
      // 烟囱冒烟（待发小动画）
      for (var si = 0; si < 3; si++) {
        var ph = ((Date.now() / 1000) + si / 3) % 1;
        ctx.fillStyle = 'rgba(110,110,110,' + (0.45 * (1 - ph)).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(ts * 0.25 + Math.sin((ph + si) * 6.28) * ts * 0.05, -ts * 0.45 - ph * ts * 0.55, ts * (0.05 + ph * 0.08), 0, Math.PI * 2);
        ctx.fill();
      }
      // 同色脉冲圈：颜色 = 火车车身色 = 轨道色；正在画线时加粗高亮
      var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
      ctx.strokeStyle = t.color;
      ctx.lineWidth = isActive ? 4.5 : 3;
      ctx.globalAlpha = isActive ? (0.7 + pulse * 0.3) : (0.5 + pulse * 0.35);
      ctx.beginPath(); ctx.arc(0, 0, ts * (0.88 + pulse * 0.1), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawTrain(t) {
    // 已完成：显示 ✅
    if (t.done) {
      ctx.save();
      ctx.translate(t.end.x, t.end.y);
      ctx.font = Math.min(W, H) * 0.09 + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✅', 0, 0);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(t.x, t.y);
    if (t.isCrashed) {
      // 翻车：翻转压扁 + 旋转
      ctx.rotate(Math.PI * 0.5);
      ctx.scale(1, 0.35);
      ctx.globalAlpha = 0.9;
      ctx.rotate(-Math.PI * 0.5);
    } else {
      ctx.rotate(t.angle);
    }
    // 行驶中的火车：彩色车身沿轨道方向行驶
    drawTrainSprite(t, trainSize() * 0.95);
    ctx.restore();
    // 撞车时加烟
    if (t.isCrashed) {
      ctx.fillStyle = 'rgba(60,60,60,0.5)';
      for (var i = 0; i < 5; i++) {
        var ox = (Math.sin(frameCount * 0.1 + i * 1.7) * 8);
        var oy = -8 - i * 6;
        var or = 4 + i * 2.2 + Math.sin(frameCount * 0.15 + i) * 1.5;
        ctx.beginPath(); ctx.arc(t.x + ox, t.y + oy, or, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawExplosions() {
    for (var i = 0; i < explosions.length; i++) {
      var e = explosions[i];
      ctx.fillStyle = e.color;
      ctx.globalAlpha = Math.max(0, e.life);
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    if (running) elTimer.textContent = '⏱ ' + Math.floor((Date.now() - t0) / 1000) + 's';
  }

  // ============ 状态控制 ============
  function updateBtns() {
    var locked = running || crashed;
    btnGo.disabled = locked;
    btnClear.disabled = locked;
    btnNext.disabled = locked;
  }

  function resetAll() {
    running = false; crashed = false; drawing = false;
    explosions = []; crossings = [];
    for (var i = 0; i < trains.length; i++) {
      trains[i].pts = []; trains[i].done = false; trains[i].isCrashed = false;
    }
    elTimer.textContent = '⏱ 0s';
    resetDrawingInfo();
    updateBtns();
  }

  // 弹窗按钮
  document.getElementById('btnWinReplay').addEventListener('click', function () {
    document.getElementById('winModal').classList.add('hidden');
    resetAll();
  });
  document.getElementById('btnWinNext').addEventListener('click', function () {
    document.getElementById('winModal').classList.add('hidden');
    level = level % TOTAL_LEVELS + 1;   // 通关第 6 关后循环回第 1 关
    loadLevel();
    resetAll();
  });
  document.getElementById('btnCrashOk').addEventListener('click', function () {
    document.getElementById('crashModal').classList.add('hidden');
    resetAll();
  });

  // 计时显示
  setInterval(function () {
    if (running) elTimer.textContent = '⏱ ' + Math.floor((Date.now() - t0) / 1000) + 's';
  }, 500);

  // 阻止触摸滚动
  document.addEventListener('touchmove', function (e) {
    if (e.target === canvas) e.preventDefault();
  }, { passive: false });

  // ============ 启动 ============
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();
  loadLevel();
  resetDrawingInfo();
  updateBtns();
  requestAnimationFrame(frame);
})();
</script>
