<script data-page-node-id="oCA0wVB8UmK3TdQc9g4waW" data-pnid-children="eDhBLIWb37W3VmkeGLT9ju">
"use strict";
/* ================= 基础常量与状态 ================= */
const CELL = 64, MW = 48, MH = 36;
const WORLD_W = MW*CELL, WORLD_H = MH*CELL;
const CAR_SPACING = 60;
const SAVE_KEY = "trainGameV3";

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const layer = document.createElement("canvas");
layer.width = WORLD_W; layer.height = WORLD_H;
const lctx = layer.getContext("2d");

let dpr = 1, vw = 0, vh = 0;
function resize(){
  dpr = window.devicePixelRatio || 1;
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = vw*dpr; cv.height = vh*dpr;
  cv.style.width = vw+"px"; cv.style.height = vh+"px";
}
window.addEventListener("resize", resize); resize();

let mode = "build";
let tool = "track";
let muted = false;
const cells = new Map();
let comp = ["steam","greenCoach","greenCoach"];
const cam  = { x:WORLD_W/2, y:WORLD_H/2, s:1 };
const camT = { x:WORLD_W/2, y:WORLD_H/2, s:1 };

const train = {
  active:false, cx:0, cy:0, inDir:"E", outDir:"E", prog:0,
  x:0, y:0, ang:0, v:0, speedMax:150,
  lastSt:"", pendingStop:false, dwell:0,
  bubble:"", bubbleT:0, smokeT:0, lastClickArc:0
};
let hist = [];
let headArc = 0;
let puffs = [];

const DIRV = { N:{x:0,y:-1}, E:{x:1,y:0}, S:{x:0,y:1}, W:{x:-1,y:0} };
const DIRS = ["N","E","S","W"];
const OPP  = { N:"S", S:"N", E:"W", W:"E" };
const key  = (x,y)=>x+","+y;
const center = (x,y)=>({ x:(x+.5)*CELL, y:(y+.5)*CELL });

/* ================= 音效（WebAudio 合成） ================= */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==="suspended") AC.resume();
  return AC;
}
function tone(f, dur, type, vol, slideTo){
  if(muted) return;
  const a = ac(); if(!a) return;
  try{
    const o = a.createOscillator(), g = a.createGain();
    o.type = type||"sine"; o.frequency.value = f;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
    g.gain.value = vol||.15;
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
const sClick  = ()=>tone(660,.06,"square",.06);
const sPlace  = ()=>tone(500,.09,"sine",.14,760);
const sErase  = ()=>tone(600,.09,"sine",.12,300);
const sChime  = ()=>{ tone(880,.18,"sine",.16); setTimeout(()=>tone(1175,.3,"sine",.16),160); };
const sWhistle= ()=>{ tone(587,.9,"triangle",.16); tone(740,.9,"triangle",.12);
                      setTimeout(()=>tone(587,.55,"triangle",.1),180); };
const sKachi  = ()=>tone(170,.03,"square",.045);

/* ================= 网格操作 ================= */
function recomputeDirs(x,y){
  const c = cells.get(key(x,y)); if(!c) return;
  const d = [];
  for(const dir of DIRS){
    const v = DIRV[dir];
    if(cells.get(key(x+v.x, y+v.y))) d.push(dir);
  }
  c.dirs = d.length ? d : ["E","W"];
}
function recomputeAround(x,y){
  recomputeDirs(x,y);
  for(const dir of DIRS){ const v=DIRV[dir]; if(cells.get(key(x+v.x,y+v.y))) recomputeDirs(x+v.x,y+v.y); }
}
function putCell(x,y,type){
  if(x<0||y<0||x>=MW||y>=MH) return false;
  const k = key(x,y);
  const old = cells.get(k);
  if(old && old.t===type) return false;
  cells.set(k, { t:type, dirs:[] });
  recomputeAround(x,y);
  redrawCellArea(x,y);
  return true;
}
function delCell(x,y){
  const k = key(x,y);
  if(!cells.has(k)) return false;
  cells.delete(k);
  recomputeAround(x,y);
  redrawCellArea(x,y);
  return true;
}

/* ================= 地图层绘制 ================= */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const trees = (()=>{
  const rng = mulberry32(20240601), arr=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(rng()<0.022) arr.push({x, y, dx:10+rng()*44, dy:14+rng()*38, s:.8+rng()*.5});
  }
  return arr;
})();

function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r);
  g.closePath(); g.fill();
}
function grassBase(g,x,y){
  g.fillStyle = ((x+y)&1) ? "#c8e6a5" : "#c0e09a";
  g.fillRect(x*CELL, y*CELL, CELL, CELL);
}
function drawTree(g,t){
  const cx = t.x*CELL+t.dx, cy = t.y*CELL+t.dy, s = t.s;
  g.fillStyle="#8d6e63"; g.fillRect(cx-3*s, cy-2*s, 6*s, 12*s);
  g.fillStyle="#66bb6a"; g.beginPath(); g.arc(cx, cy-8*s, 12*s, 0, 7); g.fill();
  g.fillStyle="#81c784"; g.beginPath(); g.arc(cx-5*s, cy-3*s, 8*s, 0, 7); g.fill();
}
function arcBetween(g,cx,cy,R,d1,d2){
  const cor = { x:cx+(d1.x+d2.x)*R, y:cy+(d1.y+d2.y)*R };
  const a1 = Math.atan2(-d2.y,-d2.x), a2 = Math.atan2(-d1.y,-d1.x);
  let diff = a2-a1;
  while(diff> Math.PI) diff -= 2*Math.PI;
  while(diff<-Math.PI) diff += 2*Math.PI;
  g.arc(cor.x, cor.y, R, a1, a1+diff, diff<0);
}
function trackPath(g,x,y,dirs){
  const c = center(x,y), R = CELL/2;
  g.beginPath();
  if(dirs.length===2){
    const [a,b] = dirs;
    if(OPP[a]===b){
      g.moveTo(c.x+DIRV[a].x*R, c.y+DIRV[a].y*R);
      g.lineTo(c.x+DIRV[b].x*R, c.y+DIRV[b].y*R);
    }else{
      arcBetween(g,c.x,c.y,R,DIRV[a],DIRV[b]);
    }
  }else{
    for(const d of dirs){
      const v = DIRV[d];
      g.moveTo(c.x, c.y);
      g.lineTo(c.x+v.x*R, c.y+v.y*R);
    }
    if(dirs.length===0){ g.moveTo(c.x-R,c.y); g.lineTo(c.x+R,c.y); }
  }
}
function drawTrackCell(g,x,y,dirs){
  const c = center(x,y);
  if(dirs.length===2 && OPP[dirs[0]]===dirs[1]){
    const h = dirs.includes("E");
    g.strokeStyle="#8d6e63"; g.lineWidth=6; g.lineCap="round";
    for(let i=-2;i<=2;i++){
      const t = i*12;
      g.beginPath();
      if(h){ g.moveTo(c.x+t, c.y-19); g.lineTo(c.x+t, c.y+19); }
      else { g.moveTo(c.x-19, c.y+t); g.lineTo(c.x+19, c.y+t); }
      g.stroke();
    }
  }else if(dirs.length>=3){
    g.fillStyle="#ffb300"; g.beginPath(); g.arc(c.x,c.y,5,0,7); g.fill();
  }
  const pass=(w,col)=>{ g.lineWidth=w; g.strokeStyle=col; g.lineCap="round";
    g.beginPath(); trackPath(g,x,y,dirs); g.stroke(); };
  pass(13,"#455a64"); pass(8,"#90a4ae"); pass(3,"#eceff1");
}
function drawStationDeco(g,x,y){
  const px = x*CELL, py = y*CELL;
  g.globalAlpha = .55;
  g.fillStyle="#ffe0b2"; rr(g,px+4,py+4,CELL-8,CELL-8,10);
  g.globalAlpha = 1;
  g.fillStyle="#fff8e1"; rr(g,px+12,py+10,26,16,3);
  g.fillStyle="#ef5350";
  g.beginPath(); g.moveTo(px+9,py+11); g.lineTo(px+25,py+1); g.lineTo(px+41,py+11); g.closePath(); g.fill();
  g.fillStyle="#90caf9"; g.fillRect(px+17,py+14,6,6); g.fillRect(px+27,py+14,6,6);
  g.fillStyle="#ffcc80"; g.beginPath(); g.arc(px+47,py+34,3.4,0,7); g.fill();
  g.fillStyle="#42a5f5"; rr(g,px+44,py+37,7,9,3);
}
function drawOneCell(g,x,y){
  grassBase(g,x,y);
  const t = trees.find(t=>t.x===x&&t.y===y);
  if(t && !cells.has(key(x,y))) drawTree(g,t);
  const c = cells.get(key(x,y));
  if(!c) return;
  drawTrackCell(g,x,y,c.dirs);
  if(c.t==="station") drawStationDeco(g,x,y);
}
function redrawCellArea(x,y){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
    drawOneCell(lctx,nx,ny);
  }
}
function redrawAllLayer(){
  lctx.clearRect(0,0,WORLD_W,WORLD_H);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++) drawOneCell(lctx,x,y);
}

/* ================= 车辆绘制 ================= */
function wheels(g,xs,r,col){
  for(const wx of xs){

/* ================= 火车运动 ================= */
const LOCO_SET = new Set(["steam","green","dtrain","hst"]);
function calcSpeedPx(){
  const heads = comp.filter(k=>LOCO_SET.has(k)).length || 1;
  const wag   = comp.length - heads;
  const P = [1,1,1.8,2.45][heads] || 2.45;
  return 150 * P / (1 + 0.09*wag);
}
const calcKmh = ()=>Math.round(calcSpeedPx()*0.85);

function chooseOut(dirs, inDir){
  const cand = dirs.filter(d=>d!==OPP[inDir]);
  if(cand.includes(inDir)) return inDir;
  if(!cand.length) return OPP[inDir];
  return cand[Math.floor(Math.random()*cand.length)];
}
function bezPos(x,y,inDir,outDir,t){
  const c = center(x,y);
  const vi = DIRV[inDir], vo = DIRV[outDir];
  const p0x = c.x - vi.x*CELL/2, p0y = c.y - vi.y*CELL/2;
  const p2x = c.x + vo.x*CELL/2, p2y = c.y + vo.y*CELL/2;
  const u = 1-t;
  const dx = 2*u*(c.x-p0x) + 2*t*(p2x-c.x);
  const dy = 2*u*(c.y-p0y) + 2*t*(p2y-c.y);
  return { x: u*u*p0x + 2*u*t*c.x + t*t*p2x,
           y: u*u*p0y + 2*u*t*c.y + t*t*p2y,
           ang: Math.atan2(dy,dx) };
}
function pushHist(x,y){
  const last = hist[hist.length-1];
  if(last){
    const d = Math.hypot(x-last.x, y-last.y);
    if(d < 2.5) return;
    headArc += d;
    if(headArc - train.lastClickArc > 85 && train.v > 45){
      train.lastClickArc = headArc; sKachi();
    }
  }
  hist.push({x,y,arc:headArc});
  const need = comp.length*CAR_SPACING + 280;
  while(hist.length>2 && headArc - hist[0].arc > need) hist.shift();
}
function samplePos(target){
  for(let i=hist.length-1;i>0;i--){
    const a = hist[i], b = hist[i-1];
    if(b.arc <= target && target <= a.arc){
      const t = (target-b.arc)/Math.max(1e-6, a.arc-b.arc);
      return { x:b.x+(a.x-b.x)*t, y:b.y+(a.y-b.y)*t, ang:Math.atan2(a.y-b.y,a.x-b.x) };
    }
  }
  const o = hist[0], n = hist[1]||hist[0];
  return { x:o.x, y:o.y, ang:Math.atan2(n.y-o.y,n.x-o.x)||0 };
}
function angLerp(a,b,t){
  let d = (b-a)%(Math.PI*2);
  if(d> Math.PI) d -= 2*Math.PI;
  if(d<-Math.PI) d += 2*Math.PI;
  return a + d*t;
}
function placeTrain(){
  let startKey = null;
  for(const [k,c] of cells){ if(c.t==="station"){ startKey=k; break; } }
  if(!startKey) startKey = cells.keys().next().value;
  const parts = startKey.split(",");
  const sx = +parts[0], sy = +parts[1];
  const c = cells.get(startKey);
  train.cx=sx; train.cy=sy;
  train.inDir = c.dirs[0] || "E";
  train.outDir = chooseOut(c.dirs, train.inDir);
  train.prog=0; train.v=0; train.dwell=0; train.pendingStop=false; train.lastSt="";
  train.speedMax = calcSpeedPx();
  const p = bezPos(sx,sy,train.inDir,train.outDir,0);
  train.x=p.x; train.y=p.y; train.ang=p.ang;
  hist=[]; headArc=0; train.lastClickArc=0;
  pushHist(p.x,p.y);
  train.active = true;
  train.bubble="出发咯！"; train.bubbleT=2.2;
}
function bubble(text){ train.bubble=text; train.bubbleT=2.0; }

function updateTrain(dt){
  if(!train.active) return;
  let target = train.speedMax;
  const cur = cells.get(key(train.cx,train.cy));
  if(train.dwell>0){ target=0; train.dwell-=dt; }
  else if(train.pendingStop && train.prog>0.5){ train.dwell=1.3; train.pendingStop=false; }
  else if(cur && cur.t==="station" && train.prog>0.3 && train.prog<0.92){ target=Math.min(target,34); }
  train.v += (target-train.v)*Math.min(1, dt*1.7);
  train.prog += train.v*dt/CELL;
  while(train.prog>=1){
    train.prog -= 1;
    const nv = DIRV[train.outDir];
    train.cx += nv.x; train.cy += nv.y;
    train.inDir = train.outDir;
    const c = cells.get(key(train.cx,train.cy));
    if(!c){ train.prog=0; train.v=0; break; }
    train.outDir = chooseOut(c.dirs, train.inDir);
    if(c.t==="station" && train.lastSt!==key(train.cx,train.cy)){
      train.lastSt = key(train.cx,train.cy);
      train.pendingStop = true; bubble("到站啦！"); sChime();
    }
  }
  const p = bezPos(train.cx,train.cy,train.inDir,train.outDir,train.prog);
  train.x=p.x; train.y=p.y;
  train.ang = angLerp(train.ang, p.ang, Math.min(1,dt*10));
  pushHist(p.x,p.y);
  if(comp[0]==="steam" && train.v>25){
    train.smokeT += dt;
    if(train.smokeT>0.13){
      train.smokeT=0;
      const ca=Math.cos(train.ang), sa=Math.sin(train.ang);
      puffs.push({ x:train.x+ca*18-sa*(-9), y:train.y+sa*18+ca*(-9),
                   vx:(Math.random()-.5)*8, vy:-26-Math.random()*10,
                   r:3.5+Math.random()*2, age:0 });
    }
  }
  if(train.bubbleT>0) train.bubbleT-=dt;
}
function updatePuffs(dt){
  for(const p of puffs){ p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=8*dt; p.r+=7*dt; }
  puffs = puffs.filter(p=>p.age<1.7);
}

/* ================= 主渲染 ================= */
function rrStroke(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r);
  g.closePath(); g.fill(); g.stroke();
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#9fce7e"; ctx.fillRect(0,0,vw,vh);
  const s = cam.s;
  ctx.setTransform(dpr*s,0,0,dpr*s, dpr*(vw/2-cam.x*s), dpr*(vh/2-cam.y*s));
  ctx.drawImage(layer,0,0);
  for(const p of puffs){
    ctx.globalAlpha = Math.max(0, 1-p.age/1.7)*.75;
    ctx.fillStyle="#eceff1";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  if(train.active){
    for(let i=comp.length-1;i>=0;i--){
      const p = i===0 ? {x:train.x,y:train.y,ang:train.ang} : samplePos(headArc - i*CAR_SPACING);
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.ang);
      drawVehicle(ctx,comp[i]);
      ctx.restore();
    }
    if(train.bubbleT>0){
      ctx.font="bold 17px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      const w = ctx.measureText(train.bubble).width+26;
      const bx=train.x, by=train.y-44;
      ctx.fillStyle="rgba(255,255,255,.95)";
      ctx.strokeStyle="#ffb300"; ctx.lineWidth=3;
      rrStroke(ctx,bx-w/2,by-16,w,32,12);
      ctx.beginPath(); ctx.moveTo(bx-7,by+15); ctx.lineTo(bx+7,by+15); ctx.lineTo(bx,by+24); ctx.closePath();
      ctx.fillStyle="rgba(255,255,255,.95)"; ctx.fill();
      ctx.strokeStyle="#ffb300"; ctx.stroke();
      ctx.fillStyle="#4e342e"; ctx.fillText(train.bubble,bx,by+1);
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
}

/* ================= 速度表盘 ================= */
const dialCv = document.getElementById("dial");
const dialCtx = dialCv.getContext("2d");
let dialCur = 0, dialTarget = 0;
function drawDial(kmh){
  const g = dialCtx, cx=100, cy=95, R=84;
  g.clearRect(0,0,200,124);
  const a = v => (-200 + 220*Math.min(v,350)/350) * Math.PI/180;
  const band=(v1,v2,col)=>{ g.strokeStyle=col; g.lineWidth=15; g.lineCap="butt";
    g.beginPath(); g.arc(cx,cy,R,a(v1),a(v2)); g.stroke(); };
  band(0,140,"#a5d6a7"); band(140,250,"#ffe082"); band(250,350,"#ef9a9a");
  g.fillStyle="#6d4c41"; g.font="bold 13px sans-serif"; g.textAlign="center";
  g.fillText("0",  cx+R*Math.cos(a(0)),   cy+R*Math.sin(a(0))+4);
  g.fillText("175",cx+R*Math.cos(a(175)), cy+R*Math.sin(a(175))+4);
  g.fillText("350",cx+R*Math.cos(a(350)), cy+R*Math.sin(a(350))+4);
  const na = a(kmh);
  g.strokeStyle="#e65100"; g.lineWidth=5; g.lineCap="round";
  g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+72*Math.cos(na), cy+72*Math.sin(na)); g.stroke();
  g.fillStyle="#37474f"; g.beginPath(); g.arc(cx,cy,8,0,7); g.fill();
}

/* ================= 主循环 ================= */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;
  // 相机平滑
  if(mode==="run" && train.active){ camT.x=train.x; camT.y=train.y; }
  const cl = Math.min(1, dt*6);
  cam.x += (camT.x-cam.x)*cl; cam.y += (camT.y-cam.y)*cl; cam.s += (camT.s-cam.s)*cl;
  updateTrain(dt);
  updatePuffs(dt);
  // 表盘动画
  if(!asmEl.classList.contains("hidden")){
    dialCur += (dialTarget-dialCur)*Math.min(1,dt*8);
    drawDial(dialCur);
    kmhEl.textContent = Math.round(dialCur);
  }
  render();
  requestAnimationFrame(loop);
}

/* ================= 输入：铺轨道 / 拖动 ================= */
let painting = false, lastPaintKey = "";
let dragging = false, dragPX = 0, dragPY = 0;
function screenToWorld(px,py){
  return { x:(px-vw/2)/cam.s + cam.x, y:(py-vh/2)/cam.s + cam.y };
}
function applyTool(px,py){
  const w = screenToWorld(px,py);
  const gx = Math.floor(w.x/CELL), gy = Math.floor(w.y/CELL);
  const k = key(gx,gy);
  if(k===lastPaintKey) return;
  lastPaintKey = k;
  let changed = false;
  if(tool==="track")  changed = putCell(gx,gy,"track");
  if(tool==="station")changed = putCell(gx,gy,"station");
  if(tool==="erase")  changed = delCell(gx,gy);
  if(changed){
    if(tool==="erase") sErase(); else sPlace();
    // 放置点靠近屏幕边缘 → 视角自动朝那边移动（轨道可以一直往外拼）
    if(px<80)        camT.x -= 110;
    else if(px>vw-80)camT.x += 110;
    if(py<80)        camT.y -= 110;
    else if(py>vh-80)camT.y += 110;
    clampCam();
    saveSoon();
  }
}
function clampCam(){
  camT.x = Math.max(0, Math.min(WORLD_W, camT.x));
  camT.y = Math.max(0, Math.min(WORLD_H, camT.y));
}
cv.addEventListener("pointerdown", e=>{
  ac();
  if(mode!=="build") return;
  cv.setPointerCapture(e.pointerId);
  if(tool==="hand"){
    dragging = true; dragPX=e.clientX; dragPY=e.clientY;
  }else{
    painting = true; lastPaintKey="";
    applyTool(e.clientX, e.clientY);
  }
});
cv.addEventListener("pointermove", e=>{
  if(mode!=="build") return;
  if(dragging){
    camT.x -= (e.clientX-dragPX)/cam.s;
    camT.y -= (e.clientY-dragPY)/cam.s;
    dragPX=e.clientX; dragPY=e.clientY;
    clampCam();
  }else if(painting){
    applyTool(e.clientX, e.clientY);
  }
});
const stopPaint = ()=>{ painting=false; dragging=false; };
cv.addEventListener("pointerup", stopPaint);
cv.addEventListener("pointercancel", stopPaint);

function fitView(){
  if(!cells.size){ camT.x=WORLD_W/2; camT.y=WORLD_H/2; camT.s=1; return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const k of cells.keys()){
    const [x,y]=k.split(",").map(Number);
    x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y);
  }
  const w=(x1-x0+2)*CELL, h=(y1-y0+2)*CELL;
  camT.s = Math.max(0.32, Math.min(1.25, Math.min((vw-90)/w,(vh-190)/h)));
  camT.x = (x0+x1+1)*CELL/2; camT.y = (y0+y1+1)*CELL/2;
}

  hstCoach:"高铁车厢", greenCoach:"绿皮车厢", freight:"货车车厢", tank:"油罐车厢"
};

function drawIcon(canvas, kind, scale){
  // 面板隐藏时 clientWidth 为 0，等显示后自动重画
  if(canvas.clientWidth < 2){ requestAnimationFrame(()=>drawIcon(canvas,kind,scale)); return; }
  const g = canvas.getContext("2d");
  const dprI = window.devicePixelRatio||1;
  canvas.width = canvas.clientWidth*dprI; canvas.height = canvas.clientHeight*dprI;
  g.setTransform(dprI,0,0,dprI,0,0);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  g.clearRect(0,0,w,h);
  g.translate(w/2, h/2); g.scale(scale, scale);
  drawVehicle(g, kind);
}
function buildParts(){
  const mk = (row, kinds, isLoco)=>{
    row.innerHTML = "";
    for(const kind of kinds){
      const d = document.createElement("div");
      d.className = "part";
      const c = document.createElement("canvas");
      const s = document.createElement("span");
      s.textContent = KIND_NAME[kind];
      d.appendChild(c); d.appendChild(s);
      row.appendChild(d);
      requestAnimationFrame(()=>drawIcon(c, kind, isLoco?0.72:0.78));
      d.addEventListener("click", ()=>addPart(kind, isLoco));
    }
  };
  mk($("locoRow"), LOCOS, true);
  mk($("wagonRow"), WAGONS, false);
}
function addPart(kind, isLoco){
  const heads = comp.filter(k=>LOCO_SET.has(k)).length;
  const wags  = comp.length - heads;
  if(isLoco && heads>=3){ toast("车头最多 3 个哦！🚂"); sErase(); return; }
  if(!isLoco && wags>=8){ toast("车厢最多 8 节哦！📦"); sErase(); return; }
  comp.push(kind);
  sPlace(); renderComp();
}
function renderComp(){
  const row = $("compRow");
  row.innerHTML = "";
  if(!comp.length){
    row.innerHTML = '<div class="empty">先选一个车头哦 🚂</div>';
  }
  comp.forEach((kind,i)=>{
    const d = document.createElement("div");
    d.className = "card" + (LOCO_SET.has(kind)?" loco":"");
    d.title = KIND_NAME[kind] + "（点击移除）";
    const c = document.createElement("canvas");
    d.appendChild(c); row.appendChild(d);
    requestAnimationFrame(()=>drawIcon(c, kind, LOCO_SET.has(kind)?0.72:0.8));
    d.addEventListener("click", ()=>{ comp.splice(i,1); sErase(); renderComp(); });
  });
  dialTarget = calcKmh();
  const heads = comp.filter(k=>LOCO_SET.has(k)).length;
  $("tip").textContent = !heads ? "💡 先选一个车头，火车才有动力！"
    : heads>=3 ? "💡 3 个车头超级有劲！但车厢太重也跑不快哦"
    : "💡 车头越多越有劲（不是翻倍哦）；车厢越多越跑不快！";
}
function openAssembly(){
  asmEl.classList.remove("hidden");   // 先显示面板，再画图标（否则取不到宽度）
  renderComp();
  dialCur = 0; dialTarget = calcKmh();
}
$("btnBack").addEventListener("click", ()=>{
  sClick(); asmEl.classList.add("hidden"); setMode("build");
});
$("btnGo").addEventListener("click", ()=>{
  if(!comp.some(k=>LOCO_SET.has(k))){ toast("先选一个车头哦！🚂"); return; }
  if(cells.size<2){ toast("轨道太短啦，先去拼轨道！🛤️"); return; }
  saveSoon();
  asmEl.classList.add("hidden");
  placeTrain();
  sWhistle();
  toast("火车开动啦！点 📢 可以鸣笛 📢");
});

/* ================= 存档 ================= */
let saveTimer = 0;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      const arr = [];
      for(const [k,c] of cells){ const [x,y]=k.split(","); arr.push([+x,+y,c.t]); }
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        cells:arr, comp, cam:{x:camT.x,y:camT.y,s:camT.s}, muted
      }));
    }catch(e){}
  }, 500);
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.cells)) return false;
    cells.clear();
    for(const [x,y,t] of d.cells) cells.set(key(x,y), {t:t||"track", dirs:[]});
    for(const k of cells.keys()){ const [x,y]=k.split(",").map(Number); recomputeDirs(x,y); }
    for(const k of cells.keys()){ const [x,y]=k.split(",").map(Number); recomputeDirs(x,y); }
    if(Array.isArray(d.comp) && d.comp.length) comp = d.comp;
    if(d.cam){ camT.x=d.cam.x||WORLD_W/2; camT.y=d.cam.y||WORLD_H/2; camT.s=d.cam.s||1; }
    if(d.muted){ muted=true; $("btnSound").textContent="🔇"; }
    return true;
  }catch(e){ return false; }
}

/* ================= 初始化 ================= */
function seedDefault(){
  // 预置一个小环线 + 一个车站，一进来就能开火车
  const ring = [];
  for(let x=22;x<=26;x++){ ring.push([x,17]); ring.push([x,19]); }
  for(let y=17;y<=19;y++){ ring.push([22,y]); ring.push([26,y]); }
  for(const [x,y] of ring) cells.set(key(x,y), { t:(x===24&&y===17)?"station":"track", dirs:[] });
  for(const [x,y] of ring) recomputeDirs(x,y);
}
(function init(){
  if(!loadSave()) seedDefault();
  redrawAllLayer();
  Object.assign(cam, {x:camT.x, y:camT.y, s:camT.s});
  buildParts();
  renderComp();
  drawDial(0);
  setMode("build");
  requestAnimationFrame(loop);
})();
</script>
