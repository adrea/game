<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd6ff">
<title>行李分拣站</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:linear-gradient(180deg,#a9e4ff 0%,#d6f4ff 45%,#d9f7c4 100%);
    overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;color:#4e342e;
  }
  #sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;animation:drift linear infinite;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .c1{width:110px;height:36px;top:9%;animation-duration:70s;}
  .c1::before{width:48px;height:48px;top:-22px;left:16px;}
  .c1::after{width:36px;height:36px;top:-14px;left:56px;}
  .c2{width:80px;height:28px;top:22%;animation-duration:95s;animation-delay:-35s;}
  .c2::before{width:36px;height:36px;top:-16px;left:12px;}
  .c2::after{width:26px;height:26px;top:-12px;left:42px;}
  @keyframes drift{from{left:-160px}to{left:110vw}}

  #app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 12px 12px;}

  header{display:flex;align-items:center;gap:12px;width:100%;max-width:1000px;flex:none;}
  .home{width:54px;height:54px;flex:none;border:none;border-radius:18px;background:#fff;
    font-size:28px;box-shadow:0 5px 0 rgba(0,0,0,.13);cursor:pointer;}
  .home:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
  .title{font-size:clamp(22px,4.2vw,34px);font-weight:900;color:#fff;
    text-shadow:0 3px 0 #f48fb1,0 6px 12px rgba(0,0,0,.16);white-space:nowrap;}
  .tools{display:flex;gap:8px;margin-left:auto;align-items:center;}
  .tool{height:54px;min-width:54px;padding:0 14px;border:none;border-radius:18px;background:#fff;
    font-size:24px;font-weight:800;color:#5d4037;box-shadow:0 5px 0 rgba(0,0,0,.13);cursor:pointer;}
  .tool:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.13);}
  .tool.small{font-size:15px;padding:0 12px;}

  .hint{flex:none;margin:8px 0 4px;padding:7px 20px;border-radius:999px;background:rgba(255,255,255,.92);
    font-size:clamp(15px,2.6vw,21px);font-weight:800;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.08);}
  .hint b{color:#e65100;}

  #stage{flex:1;min-height:0;width:100%;max-width:1000px;position:relative;
    display:flex;flex-direction:column;gap:8px;}

  /* 传送带上的行李 */
  #belt{position:relative;flex:none;height:clamp(104px,17vh,150px);border-radius:26px;
    background:linear-gradient(180deg,#f5deb3 0%,#e3c083 100%);
    border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.12);overflow:hidden;}
  #belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
    background:repeating-linear-gradient(90deg,#b98a4b 0 18px,#d7ab6a 18px 36px);opacity:.65;}
  #bags{position:absolute;inset:8px 12px 20px;display:flex;align-items:center;
    justify-content:space-evenly;gap:8px;z-index:2;}

  .bag{width:clamp(62px,11vw,92px);height:clamp(72px,12vw,100px);flex:none;position:relative;
    display:flex;align-items:center;justify-content:center;cursor:grab;
    filter:drop-shadow(0 6px 4px rgba(0,0,0,.22));transition:transform .18s,opacity .18s;}
  .bag:active{cursor:grabbing;}
  .bag.selected{transform:translateY(-12px) scale(1.09);}
  .bag.gone{opacity:0;transform:scale(.3) rotate(20deg);pointer-events:none;}
  .bag svg{width:100%;height:100%;pointer-events:none;}
  .bag.selected svg{filter:drop-shadow(0 0 8px #fff);}
  @keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .bag{animation:wobble 2.2s ease-in-out infinite;}
  .bag.selected{animation:none;}

  /* 车厢 */
  #trains{position:relative;flex:1;min-height:0;display:flex;gap:clamp(8px,2vw,20px);
    align-items:stretch;justify-content:center;}
  .car{position:relative;flex:1;min-width:0;max-width:250px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:10px 6px 12px;border-radius:26px;border:5px dashed rgba(255,255,255,.85);
    background:rgba(255,255,255,.32);transition:transform .15s,background .2s,box-shadow .2s;cursor:pointer;}
  .car.hover{transform:translateY(-6px) scale(1.03);background:rgba(255,255,255,.72);
    box-shadow:0 0 0 6px rgba(255,255,255,.5);}
  .car.wrong{animation:shake .38s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .label{position:absolute;top:8px;left:50%;transform:translateX(-50%);
    padding:5px 16px;border-radius:999px;background:#fff;white-space:nowrap;
    font-size:clamp(15px,2.4vw,22px);font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .slot{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
  .slot svg{width:min(74%,96px);height:auto;opacity:.92;}
  .wagon{width:100%;height:clamp(76px,13vh,116px);position:relative;}
  .wagon svg{width:100%;height:100%;}
  .count{position:absolute;right:8px;bottom:6px;min-width:34px;height:34px;padding:0 7px;
    border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:900;box-shadow:0 3px 8px rgba(0,0,0,.12);}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .car.happy .wagon{animation:hop .5s ease 2;}

  /* 底部 */
  #progress{flex:none;width:100%;max-width:1000px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;padding:8px 4px 0;}
  .stars{font-size:clamp(24px,4.5vw,36px);letter-spacing:.1em;line-height:1;}
  .stars .on{filter:none;animation:pop .45s ease-out;}
  .stars .off{filter:grayscale(1);opacity:.4;}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .round{font-size:clamp(15px,2.4vw,20px);font-weight:800;color:#5d4037;
    background:rgba(255,255,255,.85);padding:6px 16px;border-radius:999px;}

  /* 覆盖层 */
  #overlay{position:fixed;inset:0;background:rgba(46,80,110,.45);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:20;}
  #overlay.show{display:flex;}
  .panel{background:#fff8e1;border-radius:36px;padding:6vh 7vw;max-width:560px;width:100%;
    text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.14),0 24px 50px rgba(0,0,0,.24);
    animation:pop .45s ease-out;}
  .panel h2{margin:0 0 12px;font-size:clamp(30px,6vw,48px);color:#e65100;}
  .panel p{margin:0 0 24px;font-size:clamp(17px,3vw,24px);line-height:1.6;}
  .btn{border:none;border-radius:22px;background:#ffb74d;color:#4e342e;
    font-size:clamp(20px,3.6vw,28px);font-weight:900;padding:14px 34px;margin:6px;
    box-shadow:0 7px 0 #e08600;cursor:pointer;}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #e08600;}
  .btn.ghost{background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.13);}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden;}
  .star{position:absolute;font-size:30px;animation:fly 1.1s ease-out forwards;}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(220deg)}}

  #dragGhost{position:fixed;z-index:30;width:88px;height:100px;pointer-events:none;display:none;}
  #dragGhost svg{width:100%;height:100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.3));}

  @media (max-height:560px){
    .hint{margin:4px 0 2px;padding:4px 16px;}
    #belt{height:96px;}
    .wagon{height:66px;}
    .tool,.home{height:46px;}
  }
</style>
</head>
<body>
<div id="sky"><div class="cloud c1"></div><div class="cloud c2"></div></div>

<div id="app">
  <header>
    <button class="home" id="homeBtn" aria-label="回到游戏乐园">🏠</button>
    <div class="title">🧳 行李分拣站</div>
    <div class="tools">
      <button class="tool" id="sayBtn" aria-label="再听一次说明">🔊</button>
      <button class="tool small" id="modeBtn" aria-label="切换玩法">按颜色</button>
    </div>
  </header>

  <div class="hint" id="hint">把行李送进<b>一样颜色</b>的车厢吧！</div>

  <div id="stage">
    <div id="belt"><div id="bags"></div></div>
    <div id="trains"></div>
  </div>

  <div id="progress">
    <div class="stars" id="stars"></div>
    <div class="round" id="round">第 1 趟</div>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h2 id="ovTitle">🎉 装满啦！</h2>
    <p id="ovText">小火车要出发咯～</p>
    <button class="btn" id="nextBtn">再来一趟 →</button>
    <button class="btn ghost" id="homeBtn2">回乐园</button>
  </div>
</div>

<div id="fx"></div>
<div id="dragGhost"></div>

<script>
(function(){
  "use strict";

  /* ---------- 配置 ---------- */
  var COLORS = [
    {id:"red",   name:"红色", hex:"#ef5350", dark:"#b71c1c", emoji:"🔴"},
    {id:"blue",  name:"蓝色", hex:"#42a5f5", dark:"#0d47a1", emoji:"🔵"},
    {id:"yellow",name:"黄色", hex:"#ffca28", dark:"#f57f17", emoji:"🟡"},
    {id:"green", name:"绿色", hex:"#66bb6a", dark:"#1b5e20", emoji:"🟢"}
  ];
  var SHAPES = [
    {id:"suitcase", name:"手提箱", emoji:"🧳"},
    {id:"backpack", name:"小背包", emoji:"🎒"},
    {id:"box",      name:"纸箱",   emoji:"📦"},
    {id:"ball",     name:"皮球",   emoji:"⚽"}
  ];
  var NEUTRAL = {hex:"#b0bec5", dark:"#546e7a"}; // 按形状玩时车厢用中性色，避免颜色误导
  var PRAISE = ["好棒呀","真厉害","放对了","太棒了","棒极了","就是这里","你真能干"];
  var RETRY  = ["再看看哦","不是这节车厢","换个车厢试试","差一点点"];
  var ROUND_END = ["装满啦","全都送上车咯","小火车出发咯"];

  var state = {
    mode: "color",       // color | shape
    round: 0,
    carCount: 2,
    bagCount: 4,
    cars: [],
    bags: [],
    selected: null,
    suppressClick: false,
    suppressTimer: null,
    locked: false,
    sound: true,
    started: false
  };

  var $ = function(id){ return document.getElementById(id); };
  var bagsEl=$("bags"), trainsEl=$("trains"), starsEl=$("stars"), hintEl=$("hint");
  var roundEl=$("round"), overlay=$("overlay"), fx=$("fx"), ghost=$("dragGhost");

  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function pick(a){ return a[rnd(a.length)]; }

  /* ---------- 声音：WebAudio 合成，无外部资源 ---------- */
  var AC = window.AudioContext || window.webkitAudioContext, ac = null;
  function audio(){
    if(!AC) return null;
    if(!ac){ try{ ac = new AC(); }catch(e){ return null; } }
    if(ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
    return ac;
  }
  function tone(freq, dur, delay, type, vol){
    if(!state.sound) return;
    var c = audio(); if(!c) return;
    try{
      var o=c.createOscillator(), g=c.createGain(), t=c.currentTime+(delay||0);
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function sfxGood(){ tone(523,.16,0,"sine"); tone(659,.16,.09,"sine"); tone(784,.24,.18,"sine"); }
  function sfxOops(){ tone(300,.16,0,"triangle",.1); tone(250,.2,.1,"triangle",.08); }
  function sfxWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.28,i*.12,"sine",.12); }); }
  function sfxPop(){ tone(660,.09,0,"sine",.08); }

  /* 语音：优先系统中文语音合成；不支持时保留文字提示 */
  var voice = null, voicesReady = false;
  function initVoices(){
    if(!("speechSynthesis" in window)) return;
    try{
      var list = speechSynthesis.getVoices() || [];
      voice = list.find(function(v){ return /zh[-_]?CN/i.test(v.lang); })
           || list.find(function(v){ return /^zh/i.test(v.lang); }) || null;
      voicesReady = list.length > 0;
    }catch(e){}
    try{ speechSynthesis.onvoiceschanged = initVoices; }catch(e){}
  }
  function say(text, force){
    if(!state.sound) return;
    if(!force && state.started && Math.random() < .35) return; // 别太吵
    hintEl.dataset.say = text;
    if(!("speechSynthesis" in window) || !window.SpeechSynthesisUtterance) return;
    try{
      if(!voicesReady) initVoices();
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN"; u.rate = .86; u.pitch = 1.2; u.volume = 1;
      if(voice) u.voice = voice;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- 图形 ---------- */
  function bagSVG(color, shape){
    var c=color.hex, d=color.dark, s=shape.id;
    var body = "";
    if(s === "suitcase"){
      body = '<rect x="14" y="30" width="72" height="58" rx="10" fill="'+c+'" stroke="'+d+'" stroke-width="4"/>'
           + '<path d="M36 30 v-8 a8 8 0 0 1 8-8 h12 a8 8 0 0 1 8 8 v8" fill="none" stroke="'+d+'" stroke-width="6"/>'
           + '<rect x="46" y="40" width="8" height="38" rx="3" fill="rgba(255,255,255,.45)"/>'
           + '<circle cx="30" cy="88" r="5" fill="'+d+'"/><circle cx="70" cy="88" r="5" fill="'+d+'"/>';
    }else if(s === "backpack"){
      body = '<path d="M25 40 q25-16 50 0 v45 q0 8-8 8 H33 q-8 0-8-8 Z" fill="'+c+'" stroke="'+d+'" stroke-width="4"/>'
           + '<path d="M38 34 q12-14 24 0" fill="none" stroke="'+d+'" stroke-width="5"/>'
           + '<rect x="34" y="56" width="32" height="22" rx="6" fill="rgba(255,255,255,.5)" stroke="'+d+'" stroke-width="3"/>'
           + '<rect x="42" y="30" width="16" height="8" rx="4" fill="'+d+'"/>';
    }else if(s === "box"){
      body = '<rect x="16" y="34" width="68" height="56" rx="5" fill="'+c+'" stroke="'+d+'" stroke-width="4"/>'
           + '<path d="M16 46 h68 M50 34 v56" stroke="'+d+'" stroke-width="4" opacity=".7"/>'
           + '<rect x="42" y="50" width="16" height="14" rx="2" fill="rgba(255,255,255,.6)"/>';
    }else{
      body = '<circle cx="50" cy="58" r="34" fill="'+c+'" stroke="'+d+'" stroke-width="4"/>'
           + '<path d="M50 24 q-18 12 -18 34 q18-10 36 0 q0-22 -18-34Z" fill="rgba(255,255,255,.55)"/>'
           + '<circle cx="50" cy="58" r="9" fill="rgba(255,255,255,.55)"/>';
    }
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>';
  }
  function wagonSVG(color){
    var c=color.hex, d=color.dark;
    return '<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">'
      + '<rect x="14" y="26" width="172" height="66" rx="14" fill="'+c+'" stroke="'+d+'" stroke-width="5"/>'
      + '<rect x="26" y="38" width="44" height="30" rx="6" fill="#e3f2fd" stroke="'+d+'" stroke-width="3"/>'
      + '<rect x="80" y="38" width="44" height="30" rx="6" fill="#e3f2fd" stroke="'+d+'" stroke-width="3"/>'
      + '<rect x="134" y="38" width="40" height="30" rx="6" fill="#e3f2fd" stroke="'+d+'" stroke-width="3"/>'
      + '<rect x="6" y="92" width="188" height="9" rx="4" fill="#546e7a"/>'
      + '<circle cx="46" cy="105" r="13" fill="#37474f" stroke="#263238" stroke-width="3"/>'
      + '<circle cx="154" cy="105" r="13" fill="#37474f" stroke="#263238" stroke-width="3"/>'
      + '<circle cx="46" cy="105" r="5" fill="#b0bec5"/><circle cx="154" cy="105" r="5" fill="#b0bec5"/>'
      + '</svg>';
  }

  /* ---------- 关卡生成 ---------- */
  function newRound(){
    state.round++;
    // 难度只加「车厢数量」和「行李数量」，不加时间、不加速度
    state.carCount = Math.min(4, 2 + Math.floor((state.round-1)/2));
    state.bagCount = Math.min(8, 4 + Math.floor((state.round-1)/2));
    state.selected = null;
    state.suppressClick = false;
    if(state.suppressTimer){ clearTimeout(state.suppressTimer); state.suppressTimer = null; }
    state.locked = false;
    state.cars = [];
    state.bags = [];

    var pool = state.mode === "color" ? COLORS : SHAPES;
    var chosen = shuffle(pool.slice()).slice(0, state.carCount);
    chosen.forEach(function(item){ state.cars.push({item:item, count:0}); });

    // 每节车厢至少 1 件，剩下的随机补
    for(var i=0;i<state.bagCount;i++){
      var car = state.cars[i % state.carCount];
      var shape = pick(SHAPES), color = pick(COLORS);
      // 按形状玩时形状必须匹配；按颜色玩时颜色必须匹配
      if(state.mode === "color") color = car.item; else shape = car.item;
      state.bags.push({id:"b"+state.round+"_"+i, color:color, shape:shape, done:false, car:car});
    }
    shuffle(state.bags);

    roundEl.textContent = "第 " + state.round + " 趟";
    renderStars();
    render();
    say(state.mode === "color" ? "把行李送进一样颜色的车厢" : "把行李送进一样形状的车厢", true);
  }

  function renderStars(){
    var total = state.bagCount, done = state.bags.filter(function(b){return b.done;}).length;
    var filled = total ? Math.min(3, Math.floor(done * 3 / total)) : 0;
    if(done === total) filled = 3;
    var html = "";
    for(var i=0;i<3;i++) html += '<span class="'+(i<filled?"on":"off")+'">⭐</span>';
    starsEl.innerHTML = html;
  }

  function render(){
    // 重绘前清掉可能残留的拖拽视觉状态
    ghost.style.display = "none";
    bagsEl.innerHTML = "";
    state.bags.forEach(function(b){
      var el = document.createElement("div");
      el.className = "bag" + (b.done ? " gone" : "") + (state.selected === b ? " selected" : "");
      el.dataset.id = b.id;
      el.setAttribute("role","button");
      el.setAttribute("aria-label", b.color.name + b.shape.name);
      el.innerHTML = bagSVG(b.color, b.shape);
      bagsEl.appendChild(el);
    });

    trainsEl.innerHTML = "";
    state.cars.forEach(function(car, i){
      var el = document.createElement("div");
      el.className = "car";
      el.dataset.i = i;
      var isColor = state.mode === "color";
      var label = isColor ? (car.item.emoji + " " + car.item.name) : (car.item.emoji + " " + car.item.name);
      // 车厢提示：按颜色玩显示同色行李图标，按形状玩显示中性灰形状轮廓
      var sampleColor = isColor ? car.item : NEUTRAL;
      var sampleShape = isColor ? SHAPES[0] : car.item;
      el.innerHTML = '<div class="label">'+label+'</div>'
        + '<div class="slot">'+bagSVG(sampleColor, sampleShape)+'</div>'
        + '<div class="wagon">'+wagonSVG(isColor ? car.item : NEUTRAL)+'</div>'
        + '<div class="count">'+car.count+'</div>';
      trainsEl.appendChild(el);
    });
  }

  function findBag(id){
    for(var i=0;i<state.bags.length;i++) if(state.bags[i].id === id) return state.bags[i];
    return null;
  }

  /* ---------- 交互 ---------- */
  function syncBags(){
    // 只改样式，不重建节点：保住 pointer capture 与点击状态
    var nodes = bagsEl.querySelectorAll(".bag");
    for(var i=0;i<nodes.length;i++){
      var b = findBag(nodes[i].dataset.id);
      if(!b) continue;
      nodes[i].classList.toggle("selected", state.selected === b);
      nodes[i].classList.toggle("gone", !!b.done);
    }
  }
  function syncCars(){
    var nodes = trainsEl.querySelectorAll(".car");
    for(var i=0;i<nodes.length;i++){
      var badge = nodes[i].querySelector(".count");
      if(badge && state.cars[i]) badge.textContent = state.cars[i].count;
    }
  }
  function select(bag){
    if(state.locked || bag.done) return;
    state.selected = (state.selected === bag) ? null : bag;
    syncBags();
    if(state.selected){
      sfxPop();
      audio(); // 用户手势里解锁声音
      say("这是" + bag.color.name + bag.shape.name + "，送进" +
          (state.mode === "color" ? "一样颜色" : "一样形状") + "的车厢");
    }
  }

  function tryDrop(bag, carIndex){
    if(!bag || bag.done || state.locked) return;
    var car = state.cars[carIndex];
    if(!car) return;
    var ok = (state.mode === "color") ? (bag.color.id === car.item.id) : (bag.shape.id === car.item.id);

    if(ok){
      bag.done = true;
      car.count++;
      state.selected = null;
      sfxGood();
      say(pick(PRAISE));
      burst(carIndex);
      syncBags();
      syncCars();
      renderStars();
      var carEl = trainsEl.children[carIndex];
      if(carEl) carEl.classList.add("happy");
      if(state.bags.every(function(b){return b.done;})){
        state.locked = true;
        setTimeout(winRound, 700);
      }
    }else{
      sfxOops();
      say(pick(RETRY));
      var el = trainsEl.children[carIndex];
      if(el){ el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong"); }
      state.selected = bag; // 保持选中，方便再点一次
      syncBags();
    }
  }

  function burst(carIndex){
    var el = trainsEl.children[carIndex];
    var r = el ? el.getBoundingClientRect() : {left:innerWidth/2,top:innerHeight/2,width:100,height:100};
    for(var i=0;i<7;i++){
      var s=document.createElement("div");
      s.className="star"; s.textContent = pick(["⭐","✨","🌟","💫"]);
      s.style.left=(r.left+r.width*(.2+Math.random()*.6))+"px";
      s.style.top=(r.top+r.height*.35)+"px";
      s.style.setProperty("--dx",(Math.random()*220-110)+"px");
      s.style.setProperty("--dy",(-60-Math.random()*150)+"px");
      s.style.animationDelay=(i*.04)+"s";
      fx.appendChild(s);
      setTimeout(function(node){ return function(){ node.remove(); }; }(s), 1400);
    }
  }

  function winRound(){
    sfxWin();
    say(pick(ROUND_END), true);
    $("ovTitle").textContent = pick(["🎉 装满啦！","🚂 出发咯！","🌟 全部分好啦！"]);
    $("ovText").textContent = "你把 " + state.bagCount + " 件行李都送上车啦！";
    $("nextBtn").textContent = "再来一趟 →";
    overlay.classList.add("show");
  }

  /* 点选玩法：先点行李，再点车厢；也可直接拖 */
  // 拖拽结束后浏览器还会派发一次 click，这里跳过，避免重复操作
  function armSuppress(){
    state.suppressClick = true;
    if(state.suppressTimer) clearTimeout(state.suppressTimer);
    state.suppressTimer = setTimeout(function(){ state.suppressClick = false; state.suppressTimer = null; }, 400);
  }
  function swallowClick(){ state.suppressClick = false; }
  bagsEl.addEventListener("click", function(e){
    if(state.suppressClick){ swallowClick(); return; }
    var el = e.target.closest ? e.target.closest(".bag") : null;
    if(!el) return;
    var bag = findBag(el.dataset.id);
    if(bag) select(bag);
  });

  trainsEl.addEventListener("click", function(e){
    if(state.suppressClick){ swallowClick(); return; }
    var el = e.target.closest ? e.target.closest(".car") : null;
    if(!el || !state.selected) return;
    tryDrop(state.selected, +el.dataset.i);
  });

  /* 指针拖放：鼠标 / 触屏统一处理 */
  var drag = null;
  function point(e){ return {x:e.clientX, y:e.clientY}; }
  function startDrag(e, bagEl){
    if(state.locked) return;
    var bag = findBag(bagEl.dataset.id);
    if(!bag || bag.done) return;
    var p = point(e);
    drag = {bag:bag, el:bagEl, x0:p.x, y0:p.y, moved:false, id:e.pointerId};
    try{ bagEl.setPointerCapture(e.pointerId); }catch(err){}
  }
  bagsEl.addEventListener("pointerdown", function(e){
    var el = e.target.closest ? e.target.closest(".bag") : null;
    if(el){ e.preventDefault(); startDrag(e, el); }
  });
  window.addEventListener("pointermove", function(e){
    if(!drag) return;
    var p=point(e);
    if(Math.abs(p.x-drag.x0)+Math.abs(p.y-drag.y0) > 12){
      if(!drag.moved){
        drag.moved = true;
        state.selected = drag.bag;
        ghost.innerHTML = bagSVG(drag.bag.color, drag.bag.shape);
        ghost.style.display = "block";
        // 不重绘：保住指针捕获。只同步选中样式
        syncBags();
        drag.el.style.opacity = ".35";
      }
      ghost.style.left = (p.x-44)+"px";
      ghost.style.top  = (p.y-50)+"px";
      highlight(carAt(p));
    }
  });
  window.addEventListener("pointerup", function(e){
    if(!drag) return;
    var d=drag; drag=null;
    ghost.style.display="none";
    if(d.el){ d.el.style.opacity=""; d.el.classList.remove("selected"); }
    highlight(-1);
    if(d.moved){
      armSuppress(); // 抑制这次手势附带的 click
      var idx = carAt(point(e));
      if(idx >= 0) tryDrop(d.bag, idx);
      else { state.selected = d.bag; syncBags(); } // 拖到空处：保持选中，可再点车厢
    }
    // 没移动时不在这里处理：交给随后的 click 事件走点选逻辑
  });
  window.addEventListener("pointercancel", function(){
    if(!drag) return;
    if(drag.el){ drag.el.style.opacity=""; drag.el.classList.remove("selected"); }
    drag=null; ghost.style.display="none"; highlight(-1);
  });

  function carAt(p){
    var nodes = trainsEl.querySelectorAll(".car");
    for(var i=0;i<nodes.length;i++){
      var r=nodes[i].getBoundingClientRect();
      if(p.x>=r.left && p.x<=r.right && p.y>=r.top-30 && p.y<=r.bottom+20) return i;
    }
    return -1;
  }
  function highlight(idx){
    var nodes = trainsEl.querySelectorAll(".car");
    for(var i=0;i<nodes.length;i++) nodes[i].classList.toggle("hover", i===idx);
  }

  /* ---------- 按钮 ---------- */
  $("sayBtn").addEventListener("click", function(){
    state.sound = true;
    say(state.mode === "color" ? "把行李送进一样颜色的车厢" : "把行李送进一样形状的车厢", true);
    sfxPop();
  });
  $("modeBtn").addEventListener("click", function(){
    state.mode = state.mode === "color" ? "shape" : "color";
    $("modeBtn").textContent = state.mode === "color" ? "按颜色" : "按形状";
    hintEl.innerHTML = state.mode === "color"
      ? "把行李送进<b>一样颜色</b>的车厢吧！"
      : "把行李送进<b>一样形状</b>的车厢吧！";
    state.round = 0;
    overlay.classList.remove("show");
    newRound();
    sfxPop();
  });
  $("nextBtn").addEventListener("click", function(){
    overlay.classList.remove("show");
    newRound();
  });
  function goHome(){
    try{ if(location.href.indexOf("file:") === 0) location.href = "index.html"; else location.href="index.html"; }
    catch(e){}
  }
  $("homeBtn").addEventListener("click", goHome);
  $("homeBtn2").addEventListener("click", goHome);

  /* 首次触摸/点击时解锁音频与语音；newRound() 已说过规则，这里不重复 */
  function unlock(){
    audio(); initVoices();
    state.started = true;
    document.removeEventListener("pointerdown", unlock);
    document.removeEventListener("keydown", unlock);
  }
  document.addEventListener("pointerdown", unlock);
  document.addEventListener("keydown", unlock);

  initVoices();
  newRound();
})();
</script>
</body>
</html>
